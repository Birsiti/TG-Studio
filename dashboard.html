<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TG-Studio — аутрич</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="kit/core.js"></script>
<link rel="stylesheet" href="kit/base.css">
<link rel="stylesheet" href="studio/brand.css">
<script src="studio/mock.js"></script>
</head>
<body>
<div class="rail"></div>
<div class="app has-tabbar">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" id="mark"></div><div class="brand-text"><span class="brand-name">TG-Studio</span><span class="brand-role">Аутрич и заявки</span></div></div>
    <div class="topbar-actions"><button class="icon-btn" type="button" id="reload" aria-label="Обновить"></button><button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button></div>
  </header>

  <section data-panel="outreach" hidden>
    <div class="page-head"><span class="comment">рассылка по нишам</span><h1 class="page-title">Аутрич</h1></div>
    <div id="oBody"></div>
  </section>

  <section data-panel="leads" hidden>
    <div class="page-head"><span class="comment">из order-bot</span><h1 class="page-title">Заявки</h1><p class="page-sub" id="lSub"></p></div>
    <div class="chips scroll" id="lf"></div>
    <div class="section" id="lList"></div>
  </section>

  <section data-panel="base" hidden>
    <div class="page-head"><span class="comment">кому пишем</span><h1 class="page-title">База</h1><p class="page-sub" id="bSub"></p></div>
    <div class="search"><span id="sIc"></span><input class="input" id="q" type="search" placeholder="Компания или e-mail" autocomplete="off"></div>
    <div class="chips scroll" id="bn" style="margin-top:12px"></div>
    <div class="seg section" id="bs"><button type="button" data-s="all" class="is-on">Все</button><button type="button" data-s="queued">В очереди</button><button type="button" data-s="replied">Ответили</button></div>
    <div class="section" id="bList"></div>
  </section>

  <div class="made-by"><a href="https://t.me/tg_studio_BY_bot" target="_blank" rel="noopener" id="madeBy"></a></div>
</div>
<nav class="tabbar"><div class="tabbar-inner">
  <button type="button" data-tab="outreach"><span data-ic="send"></span>Аутрич</button>
  <button type="button" data-tab="leads"><span data-ic="message"></span>Заявки<span class="dot-badge" id="leadDot" hidden></span></button>
  <button type="button" data-tab="base"><span data-ic="list"></span>База</button>
</div></nav>

<script>
(function(){
  "use strict";
  const {html, icon, $, $$, date: D, haptic} = Kit;
  const api = Kit.createApi({bot:'studio', mock: window.StudioMock});
  $('#mark').innerHTML = icon('send'); $('#reload').innerHTML = icon('refresh'); $('#sIc').outerHTML = String(icon('search'));
  $$('[data-ic]').forEach(el=> el.outerHTML = String(icon(el.dataset.ic)));
  $('#madeBy').innerHTML = html`${icon('send')}TG-Studio · ${new Date().getFullYear()}`;
  const N = n=> Kit.num(n);
  /* ключ владельца: dashboard.html?key=… — без него сервер показывает только демо-заявки */
  let KEY = '';
  try{ const k = new URLSearchParams(location.search).get('key'); if(k){ localStorage.setItem('tgs-studio-key', k); history.replaceState(null, '', location.pathname); } KEY = localStorage.getItem('tgs-studio-key') || ''; }catch(e){}
  const withKey = p=> Object.assign(KEY ? {key:KEY} : {}, p || {});
  const hm = ts=> String(ts).slice(11, 16);
  const when = ts=>{ const d = String(ts).slice(0, 10); return d === D.today() ? 'сегодня ' + hm(ts) : d === D.add(D.today(), -1) ? 'вчера ' + hm(ts) : d.slice(8, 10) + '.' + d.slice(5, 7) + ' ' + hm(ts); };
  const ST = {sent:['отправлено', 'pill-muted'], bounced:['bounce', 'pill-danger'], replied:['ответ', 'pill-ok'], queued:['в очереди', 'pill-info']};
  const stPill = s=> html`<span class="pill ${(ST[s] || ST.sent)[1]}">${(ST[s] || ST.sent)[0]}</span>`;

  /* ============ АУТРИЧ ============ */
  let dash = null;
  async function loadDash(){
    const r = await api('getDashboard', withKey({logLimit:15}));
    if(r.ok){ dash = r; $('#leadDot').hidden = !r.stats.inboundNew; }
    renderDash();
  }
  function renderDash(){
    const box = $('#oBody');
    if(!dash){ box.innerHTML = '<div class="skel" style="height:150px"></div><div class="skel" style="height:180px;margin-top:12px"></div>'; return; }
    const s = dash.stats, pct = Math.min(100, Math.round(s.sentToday / Math.max(1, s.dailyLimit) * 100));
    box.innerHTML = html`
      <div class="hero">
        <div style="display:flex;align-items:center;gap:8px"><span class="eyebrow" style="flex:1">Сегодня</span>
          ${s.paused ? html`<span class="pill pill-danger">на паузе</span>` : html`<span class="pill pill-ok">идёт рассылка</span>`}</div>
        <div class="meter" style="margin-top:8px"><b>${s.sentToday}</b><span>/ ${s.dailyLimit}</span></div>
        <div class="progress${s.paused ? ' is-paused' : ''}"><i style="width:${pct}%"></i></div>
        <p class="hint" style="margin-top:8px">Письма уходят с 9:00 до 18:00, кроме воскресенья. В очереди ${N(s.queued)} компаний.</p>
      </div>
      <div class="stats section">
        <div class="stat"><div class="stat-label">Всего отправлено</div><div class="stat-value num">${N(s.sentTotal)}</div></div>
        <div class="stat is-accent"><div class="stat-label">Ответили</div><div class="stat-value num">${s.replied}</div><div class="stat-delta">${Kit.num(s.replyRatePct, 1)}% от писем</div></div>
        <div class="stat"><div class="stat-label">Bounce rate</div><div class="stat-value num">${Kit.num(s.bounceRatePct, 1)}%</div></div>
        <div class="stat"><div class="stat-label">Компаний в базе</div><div class="stat-value num">${N(s.companiesTotal)}</div></div>
      </div>
      ${s.inboundNew ? html`<button class="row card section" type="button" data-go="leads" style="width:100%"><span class="row-icon">${icon('message')}</span><span class="row-main"><span class="row-title">Новых заявок: ${s.inboundNew}</span><span class="row-sub">из order-bot — ждут звонка</span></span><span class="row-chev">${icon('right')}</span></button>` : ''}
      <div class="card section"><div class="section-head"><span class="section-title">Отправки за 14 дней</span></div>
        ${Kit.chart.bars(s.daily.map((d, i)=>({label:i % 2 && i !== 13 ? '' : String(D.day(d.date)), value:d.count})), {highlightLast:true})}</div>
      <div class="card section"><div class="section-head"><span class="section-title">По нишам</span><span class="hint">отправлено / всего</span></div>
        ${s.byNiche.map(n=>html`<button type="button" class="niche" data-niche="${n.niche}" style="display:block;width:100%;text-align:left"><span class="niche-top"><b>${n.niche}</b><span class="mono">${n.sent}/${n.total}</span></span>
          <span class="progress" style="display:block"><i style="width:${Math.round(n.sent / Math.max(1, n.total) * 100)}%"></i></span>
          <span class="hint" style="display:block;margin-top:4px">ответили ${n.replied}</span></button>`)}</div>
      <div class="card section"><div class="section-head"><span class="section-title">Последние отправки</span></div>
        ${dash.log.length ? dash.log.map(l=>html`<div class="log"><div class="log-main"><b>${l.company}</b><span>${l.email}</span><span>${l.niche} · ${when(l.ts)}</span></div>${stPill(l.status)}</div>`) : html`<div class="empty-mini">Пока пусто</div>`}</div>
      <div class="card section"><div class="section-head"><span class="section-title">Лимит писем в день</span></div>
        <div style="display:flex;align-items:center;gap:12px"><div class="stepper-num"><button type="button" data-lim="-5" aria-label="Меньше">${icon('minus')}</button><output id="lim">${s.dailyLimit}</output><button type="button" data-lim="5" aria-label="Больше">${icon('plus')}</button></div>
          <p class="hint" style="flex:1">Больше 60 в день — риск попасть в спам.</p></div></div>
      <button class="btn ${s.paused ? 'btn-primary' : 'btn-danger-soft'} btn-block section" type="button" id="pause">${icon(s.paused ? 'play' : 'pause')}${s.paused ? 'Возобновить кампанию' : 'Пауза кампании'}</button>`;
  }
  const oBody = $('#oBody');
  Kit.on(oBody, 'click', '#pause', async (e, el)=>{
    const p = !dash.stats.paused;
    if(!await Kit.confirm(p ? 'Поставить рассылку на паузу?' : 'Возобновить рассылку?', p ? 'Пауза' : 'Возобновить', p)) return;
    Kit.busy(el, true);
    const r = await api('updateConfig', {paused:p});
    Kit.busy(el, false);
    if(r.ok){ haptic(p ? 'warning' : 'success'); Kit.toast(p ? 'Рассылка на паузе' : 'Рассылка возобновлена', 'ok'); loadDash(); }
  });
  const saveLimit = Kit.debounce(async v=>{ const r = await api('updateConfig', {dailyLimit:v}); if(r.ok){ dash.stats.dailyLimit = v; Kit.toast('Лимит: ' + v + ' писем в день', 'ok'); renderDash(); } }, 700);
  Kit.on(oBody, 'click', '[data-lim]', (e, el)=>{ const o = $('#lim'); const v = Math.max(5, Math.min(200, +o.textContent + +el.dataset.lim)); o.textContent = v; haptic('select'); saveLimit(v); });
  Kit.on(oBody, 'click', '[data-go]', ()=> tabs.show('leads'));
  Kit.on(oBody, 'click', '[data-niche]', (e, el)=>{ B.niche = el.dataset.niche; tabs.show('base'); });

  /* ============ ЗАЯВКИ ============ */
  const LS = {new:['Новая', 'pill-accent'], contacted:['В работе', 'pill-warn'], won:['Клиент', 'pill-ok'], lost:['Отказ', 'pill-muted']};
  const L = {filter:'all', list:null, counts:{}};
  async function loadLeads(){ const r = await api('getLeads', withKey({status:L.filter})); if(r.ok){ L.list = r.leads; L.counts = r.counts; L.owner = r.owner; } renderLeads(); }
  function renderLeads(){
    const total = Object.values(L.counts).reduce((a, b)=>a + b, 0);
    $('#lSub').textContent = total ? total + ' ' + Kit.plural(total, 'заявка', 'заявки', 'заявок') + ' · новых ' + (L.counts.new || 0) : '';
    $('#leadDot').hidden = !(L.counts.new);
    $('#lf').innerHTML = html`<button type="button" class="chip${L.filter === 'all' ? ' is-on' : ''}" data-f="all">Все</button>${Object.keys(LS).map(k=>html`<button type="button" class="chip${L.filter === k ? ' is-on' : ''}" data-f="${k}">${LS[k][0]} · ${L.counts[k] || 0}</button>`)}`;
    const box = $('#lList');
    if(!L.list){ box.innerHTML = '<div class="skel" style="height:240px"></div>'; return; }
    const demoNote = L.owner === false && api.mode() === 'live' ? html`<p class="hint" style="margin-bottom:12px">${icon('lock', 'ic-inline')}Показаны демо-заявки. Реальные видны по ссылке владельца с ключом.</p>` : '';
    box.innerHTML = demoNote + (L.list.length ? html`<div class="list">${L.list.map(l=>html`<button class="row" type="button" data-l="${l.id}"><span class="avatar">${Kit.initials(l.name)}</span>
      <span class="row-main"><span class="row-title">${l.name}${l.business ? ' · ' + l.business : ''}</span><span class="row-sub">${when(l.createdAt)} · ${l.task}</span></span>
      <span class="row-end"><span class="pill ${LS[l.status][1]}">${LS[l.status][0]}</span></span></button>`)}</div>`
      : html`<div class="empty">${icon('message')}<div class="empty-title">Заявок нет</div><div class="empty-sub">Новые заявки из order-bot появятся здесь</div></div>`);
  }
  Kit.on($('#lf'), 'click', '[data-f]', (e, el)=>{ L.filter = el.dataset.f; haptic('select'); L.list = null; renderLeads(); loadLeads(); });
  Kit.on($('#lList'), 'click', '[data-l]', (e, el)=> openLead(L.list.find(x=>x.id === el.dataset.l)));
  function openLead(l){
    let st = l.status;
    const sh = Kit.sheet({title:l.name, sub:when(l.createdAt) + (l.business ? ' · ' + l.business : ''), body:html`
      <div class="card card-flat"><div class="eyebrow">Задача</div><p style="margin-top:6px;white-space:pre-wrap">${l.task}</p></div>
      <div class="section"><div class="kv"><span class="k">Телефон</span><span class="v mono">${Kit.phone.pretty(l.phone)}</span></div><div class="kv"><span class="k">Бюджет</span><span class="v">${l.budget}</span></div>
        <div class="kv"><span class="k">Уведомление</span><span class="v">${l.forwarded ? 'ушло в Telegram' : 'не доставлено'}</span></div></div>
      <div class="btn-row section"><a class="btn btn-soft" href="tel:${l.phone}">${icon('phone')}Позвонить</a>${l.tgId ? html`<a class="btn btn-soft" href="tg://user?id=${l.tgId}">${icon('send')}Telegram</a>` : ''}</div>
      <div class="field section"><span class="field-label">Статус</span><div class="seg seg-grid" id="ls" style="grid-template-columns:repeat(2, minmax(0,1fr))">${Object.keys(LS).map(k=>html`<button type="button" data-st="${k}" class="${k === st ? 'is-on' : ''}">${LS[k][0]}</button>`)}</div></div>
      <label class="field"><span class="field-label">Заметка</span><textarea class="textarea" id="ln" rows="2" maxlength="300" placeholder="Например: перезвонить в пятницу">${l.note}</textarea></label>`,
      actions:html`<button class="btn btn-primary" type="button" data-save>Сохранить</button>`});
    Kit.on(sh.$('#ls'), 'click', '[data-st]', (e, el)=>{ st = el.dataset.st; $$('#ls button', sh.el).forEach(b=>b.classList.toggle('is-on', b === el)); haptic('select'); });
    sh.$('[data-save]').addEventListener('click', async ()=>{
      const r = await api('setLeadStatus', withKey({id:l.id, status:st, note:sh.$('#ln').value.trim()}));
      if(!r.ok){ Kit.toast('Не сохранилось', 'error'); return; }
      haptic('success'); sh.close(); loadLeads();
    });
  }

  /* ============ БАЗА ============ */
  const B = {niche:'', status:'all', q:''};
  async function loadBase(){
    $('#bList').innerHTML = '<div class="skel" style="height:240px"></div>';
    const r = await api('getCompanies', {niche:B.niche, status:B.status, q:B.q});
    renderNiches();
    const list = r.companies || [];
    $('#bSub').textContent = (B.niche || 'Все ниши') + (list.length >= 60 ? ' · первые 60' : ' · ' + list.length);
    $('#bList').innerHTML = list.length ? html`<div class="list">${list.map(c=>html`<div class="row"><span class="row-main"><span class="row-title">${c.company}</span><span class="row-sub mono">${c.email}</span>
      <span class="row-sub">${c.niche}${c.sentAt ? ' · ' + when(c.sentAt) : ''}</span></span><span class="row-end">${stPill(c.status)}</span></div>`)}</div>`
      : html`<div class="empty">${icon('search')}<div class="empty-title">Ничего не нашлось</div></div>`;
  }
  function renderNiches(){
    const ns = dash ? dash.stats.byNiche.map(n=>n.niche) : [];
    $('#bn').innerHTML = html`<button type="button" class="chip${!B.niche ? ' is-on' : ''}" data-n="">Все ниши</button>${ns.map(n=>html`<button type="button" class="chip${B.niche === n ? ' is-on' : ''}" data-n="${n}">${n}</button>`)}`;
  }
  Kit.on($('#bn'), 'click', '[data-n]', (e, el)=>{ B.niche = el.dataset.n; haptic('select'); loadBase(); });
  Kit.on($('#bs'), 'click', '[data-s]', (e, el)=>{ B.status = el.dataset.s; $$('#bs button').forEach(b=>b.classList.toggle('is-on', b === el)); haptic('select'); loadBase(); });
  $('#q').addEventListener('input', Kit.debounce(()=>{ B.q = $('#q').value.trim(); loadBase(); }, 350));

  /* ============ СТАРТ ============ */
  let current = 'outreach';
  const tabs = Kit.tabs({onChange(tab){
    current = tab;
    if(tab === 'outreach'){ renderDash(); loadDash(); }
    if(tab === 'leads'){ renderLeads(); loadLeads(); }
    if(tab === 'base'){ (dash ? Promise.resolve() : loadDash()).then(loadBase); }
  }});
  $('#reload').addEventListener('click', ()=>{ haptic('light'); tabs.show(current); });
  setInterval(()=>{ if(current === 'outreach' && !document.hidden) loadDash(); }, 60000);
})();
</script>
</body>
</html>
