<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>МОСТ — панель кафе</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../kit/core.js"></script>
<link rel="stylesheet" href="../kit/base.css">
<link rel="stylesheet" href="brand.css">
<script src="dishes.js"></script>
<script src="mock.js"></script>
</head>
<body>
<div class="app has-tabbar">
  <header class="topbar">
    <div class="brand"><div class="seal">桥</div><div class="brand-text"><span class="brand-name">МОСТ</span><span class="brand-role" data-t="role"></span></div></div>
    <div class="topbar-actions">
      <button class="icon-btn lang-btn" id="lang" type="button" aria-label="Язык">中</button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button>
    </div>
  </header>
  <section data-panel="orders" hidden>
    <div class="page-head"><h1 class="page-title" data-t="orders"></h1><p class="page-sub" id="oSub"></p></div>
    <div class="accepting"><span style="flex:1;min-width:0"><b style="display:block" data-t="accepting"></b><span class="hint" id="accHint"></span></span><label class="switch"><input type="checkbox" id="acc"><span></span></label></div>
    <div id="lanes"></div>
    <button class="btn btn-ghost btn-block section" type="button" id="sim"></button>
  </section>
  <section data-panel="menu" hidden>
    <div class="page-head"><h1 class="page-title" data-t="menu"></h1><p class="page-sub" id="mSub"></p></div>
    <div class="chips scroll" id="mCats"></div>
    <div id="mList"></div>
    <button class="add-tile section" type="button" id="addDish"></button>
  </section>
  <section data-panel="stats" hidden>
    <div class="page-head"><h1 class="page-title" data-t="stats"></h1></div>
    <div class="seg" id="period"><button type="button" data-p="today" class="is-on" data-t="today"></button><button type="button" data-p="week" data-t="week"></button><button type="button" data-p="month" data-t="month"></button></div>
    <div id="sBody" class="section"></div>
  </section>
  <section data-panel="settings" hidden>
    <div class="page-head"><h1 class="page-title" data-t="settings"></h1></div>
    <div id="setBody"></div>
  </section>
</div>
<nav class="tabbar"><div class="tabbar-inner">
  <button type="button" data-tab="orders"><span data-ic="receipt"></span><span data-t="orders"></span></button>
  <button type="button" data-tab="menu"><span data-ic="bowl"></span><span data-t="menu"></span></button>
  <button type="button" data-tab="stats"><span data-ic="chart"></span><span data-t="stats"></span></button>
  <button type="button" data-tab="settings"><span data-ic="settings"></span><span data-t="settings"></span></button>
</div></nav>
<script>
(function(){
  "use strict";
  const {html, icon, $, $$, haptic} = Kit;
  const money = Dish.money;
  const api = Kit.createApi({bot:'most', mock: window.MostMock});
  const L = {
    ru:{role:'Панель кафе', orders:'Заказы', menu:'Меню', stats:'Статистика', settings:'Настройки', accepting:'Принимаем заказы', accOn:'Гости видят меню и могут заказать', accOff:'Приём на паузе — гости увидят предупреждение',
      lane_new:'Новые', lane_preparing:'Готовим', lane_ready:'Готовы', lane_done:'Выданы сегодня', lane_cancelled:'Отменённые', act_new:'Взять в работу', act_preparing:'Готово', act_ready_p:'Выдан', act_ready_d:'Доставлен',
      pickup:'Самовывоз', delivery:'Доставка', sim:'Тестовый заказ', simOk:'Пришёл заказ № {n}', noOrders:'Активных заказов нет — новые появятся здесь сами', cancel:'Отменить заказ', cancelQ:'Отменить заказ № {n}?', call:'Позвонить',
      today:'Сегодня', week:'7 дней', month:'30 дней', revenue:'Выручка', count:'Заказов', avg:'Средний чек', promo:'С промокодом', split:'Самовывоз / доставка', byDay:'Выручка по дням', byHour:'Заказы по часам', top:'Топ блюд',
      addDish:'Добавить блюдо', all:'Всё', inStock:'В наличии', hit:'Хит', out:'Стоп-лист', newDish:'Новое блюдо', nameRu:'Название', nameCn:'Название по-китайски', descRu:'Описание', descCn:'Описание по-китайски', price:'Цена, BYN', cat:'Категория', icon:'Иконка',
      save:'Сохранить', del:'Удалить', delQ:'Удалить «{n}» из меню?', saved:'Сохранено', phone:'Телефон кафе', address:'Адрес', hours:'Часы работы', from:'с', to:'до', eta:'Время приготовления', min:'мин', zones:'Зоны доставки', upTo:'до {km} км', fee:'Цена', zeta:'Время, мин', promos:'Промокоды', dishes:'{n} позиций · {s} в стоп-листе', items:'позиции'},
    cn:{role:'餐厅后台', orders:'订单', menu:'菜单', stats:'统计', settings:'设置', accepting:'接单中', accOn:'顾客可以查看菜单并下单', accOff:'已暂停接单 — 顾客会看到提示',
      lane_new:'新订单', lane_preparing:'制作中', lane_ready:'已完成', lane_done:'今日已出餐', lane_cancelled:'已取消', act_new:'开始制作', act_preparing:'完成', act_ready_p:'已取餐', act_ready_d:'已送达',
      pickup:'自取', delivery:'外送', sim:'测试订单', simOk:'新订单 № {n}', noOrders:'暂无进行中的订单', cancel:'取消订单', cancelQ:'取消订单 № {n}？', call:'致电',
      today:'今天', week:'7天', month:'30天', revenue:'营业额', count:'订单数', avg:'客单价', promo:'使用优惠码', split:'自取 / 外送', byDay:'每日营业额', byHour:'每小时订单', top:'热销菜品',
      addDish:'添加菜品', all:'全部', inStock:'有货', hit:'热门', out:'售罄', newDish:'新菜品', nameRu:'俄文名称', nameCn:'中文名称', descRu:'俄文描述', descCn:'中文描述', price:'价格, BYN', cat:'分类', icon:'图标',
      save:'保存', del:'删除', delQ:'从菜单删除「{n}」？', saved:'已保存', phone:'餐厅电话', address:'地址', hours:'营业时间', from:'从', to:'至', eta:'出餐时间', min:'分钟', zones:'配送范围', upTo:'{km} 公里内', fee:'配送费', zeta:'时间, 分钟', promos:'优惠码', dishes:'共 {n} 道 · 售罄 {s}', items:'菜品'}
  };
  let lang = 'ru';
  try{ lang = localStorage.getItem('most-admin-lang') === 'cn' ? 'cn' : 'ru'; }catch(e){}
  const t = (k, v)=> String(L[lang][k] || k).replace(/\{(\w+)\}/g, (_, x)=> v && v[x] != null ? v[x] : '');
  const nm = o=> (lang === 'cn' && o.cn) ? o.cn : o.ru;
  const lineName = l=> lang === 'cn' && l.cn ? l.cn : l.n;
  $$('[data-ic]').forEach(el=> el.outerHTML = String(icon(el.dataset.ic)));
  function applyLang(){
    document.documentElement.lang = lang === 'cn' ? 'zh' : 'ru';
    $('#lang').textContent = lang === 'cn' ? 'RU' : '中';
    $$('[data-t]').forEach(el=> el.textContent = t(el.dataset.t));
    $('#sim').innerHTML = html`${icon('zap')}${t('sim')}`;
    $('#addDish').innerHTML = html`${icon('plus')}${t('addDish')}`;
  }
  $('#lang').addEventListener('click', ()=>{ lang = lang === 'ru' ? 'cn' : 'ru'; try{ localStorage.setItem('most-admin-lang', lang); }catch(e){} haptic('select'); applyLang(); renderOrders(); renderMenu(); renderStats(); renderSettings(); });

  /* ============ ЗАКАЗЫ ============ */
  const O = {list:null, accepting:true, known:null};
  const typePill = o=> html`<span class="pill ${o.type === 'delivery' ? 'pill-info' : 'pill-muted'} no-dot">${icon(o.type === 'delivery' ? 'truck' : 'bag', 'ic-inline')}${t(o.type)}</span>`;
  const actLabel = o=> o.status === 'ready' ? t(o.type === 'pickup' ? 'act_ready_p' : 'act_ready_d') : t('act_' + o.status);
  function ticket(o){
    const active = ['new', 'preparing', 'ready'].indexOf(o.status) > -1;
    return html`<div class="ticket st-${o.status}">
      <button type="button" data-od="${o.id}" style="display:block;width:100%;text-align:left">
        <span class="ticket-top"><b>№ ${o.num}</b><span class="hint">${o.time}</span><span style="margin-left:auto">${typePill(o)}</span></span>
        <span class="ticket-items" style="display:block">${o.lines.map(l=>l.qty + ' × ' + lineName(l)).join(', ')}</span>
        ${o.note ? html`<span class="hint" style="display:block;margin-top:4px;color:var(--warn)">${icon('message', 'ic-inline')}${o.note}</span>` : ''}
        <span class="ticket-top" style="margin-top:6px"><span class="money" style="font-weight:600">${money(o.total)}</span>${o.name ? html`<span class="hint">· ${o.name}</span>` : ''}</span>
      </button>
      ${active ? html`<button class="btn btn-${o.status === 'new' ? 'primary' : 'soft'} btn-block btn-sm" type="button" data-adv="${o.id}" style="margin-top:10px">${actLabel(o)}</button>` : ''}
    </div>`;
  }
  function renderOrders(){
    const box = $('#lanes');
    if(!O.list){ box.innerHTML = '<div class="skel" style="height:120px;margin-top:18px"></div><div class="skel" style="height:120px;margin-top:10px"></div>'; return; }
    $('#acc').checked = O.accepting; $('#accHint').textContent = O.accepting ? t('accOn') : t('accOff');
    const by = s=> O.list.filter(o=>o.status === s);
    const act = O.list.filter(o=>['new', 'preparing', 'ready'].indexOf(o.status) > -1).length;
    const rev = O.list.filter(o=>o.status !== 'cancelled').reduce((a, o)=>a + o.total, 0);
    $('#oSub').textContent = (lang === 'cn' ? '进行中 ' + act + ' · 今日营业额 ' : 'В работе: ' + act + ' · сегодня ') + money(rev);
    const lane = (s, open)=>{ const list = by(s); if(!list.length && !open) return ''; return html`<div class="lane"><div class="lane-head">${t('lane_' + s)}<span class="count">${list.length}</span></div>${list.length ? list.map(ticket) : html`<div class="empty-mini">—</div>`}</div>`; };
    const doneList = by('done'), canc = by('cancelled');
    box.innerHTML = html`${act ? '' : html`<div class="empty" style="margin-top:18px">${icon('receipt')}<div class="empty-title">${t('noOrders')}</div></div>`}
      ${lane('new')}${lane('preparing')}${lane('ready')}
      ${doneList.length ? html`<div class="lane"><div class="lane-head">${t('lane_done')}<span class="count">${doneList.length}</span></div><div class="list">${doneList.map(o=>html`<button class="row" type="button" data-od="${o.id}"><span class="row-main"><span class="row-title">№ ${o.num} · ${money(o.total)}</span><span class="row-sub">${o.time} · ${o.lines.map(lineName).join(', ')}</span></span><span class="row-end">${typePill(o)}</span></button>`)}</div></div>` : ''}
      ${canc.length ? html`<div class="lane"><div class="lane-head">${t('lane_cancelled')}<span class="count">${canc.length}</span></div><div class="list">${canc.map(o=>html`<button class="row" type="button" data-od="${o.id}"><span class="row-main"><span class="row-title">№ ${o.num} · ${money(o.total)}</span><span class="row-sub">${o.time} · ${o.lines.map(lineName).join(', ')}</span></span></button>`)}</div></div>` : ''}`;
  }
  async function loadOrders(quiet){
    const r = await api('getOrders');
    if(!r.ok) return;
    const fresh = r.orders.filter(o=>o.status === 'new' && O.known && !O.known.has(o.id));
    O.known = new Set(r.orders.map(o=>o.id));
    O.list = r.orders; O.accepting = r.accepting !== false;
    if(fresh.length && quiet){ haptic('success'); Kit.toast(t('simOk', {n:fresh[0].num}), 'ok'); }
    renderOrders();
  }
  const lanes = $('#lanes');
  Kit.on(lanes, 'click', '[data-adv]', async (e, el)=>{
    Kit.busy(el, true);
    const r = await api('advanceOrder', {id:el.dataset.adv});
    if(!r.ok){ Kit.busy(el, false); Kit.toast(r.message || 'Не получилось', 'error'); return; }
    haptic('success'); loadOrders();
  });
  Kit.on(lanes, 'click', '[data-od]', (e, el)=>{ const o = O.list.find(x=>x.id === el.dataset.od); if(o) openOrder(o); });
  function openOrder(o){
    const active = ['new', 'preparing', 'ready'].indexOf(o.status) > -1;
    const sh = Kit.sheet({title:'№ ' + o.num, sub:o.time + ' · ' + t(o.type) + (o.name ? ' · ' + o.name : ''),
      body:html`<div>${o.lines.map(l=>html`<div class="kv"><span class="k">${l.qty} × ${lineName(l)}</span><span class="v">${money(l.unit * l.qty)}</span></div>`)}
        ${o.discount ? html`<div class="kv"><span class="k">${lang === 'cn' ? '优惠' : 'Скидка'} ${o.promo}</span><span class="v">−${money(o.discount)}</span></div>` : ''}
        ${o.deliveryFee ? html`<div class="kv"><span class="k">${t('delivery')}${o.distanceKm != null ? ' · ' + Kit.num(o.distanceKm, 1) + ' км' : ''}</span><span class="v">${money(o.deliveryFee)}</span></div>` : ''}
        <div class="kv"><span class="k"><b>${lang === 'cn' ? '合计' : 'Итого'}</b></span><span class="v">${money(o.total)}</span></div></div>
        ${o.address ? html`<div class="card card-flat section"><div class="eyebrow">${t('address')}</div><p style="margin-top:4px">${o.address}</p></div>` : ''}
        ${o.note ? html`<div class="card card-flat section"><div class="eyebrow">${lang === 'cn' ? '备注' : 'Комментарий'}</div><p style="margin-top:4px">${o.note}</p></div>` : ''}
        ${o.phone ? html`<a class="btn btn-ghost btn-block section" href="tel:${o.phone}">${icon('phone')}${t('call')} ${Kit.phone.pretty(o.phone)}</a>` : ''}`,
      actions:active ? html`<button class="btn btn-danger-soft" type="button" data-c>${t('cancel')}</button><button class="btn btn-primary" type="button" data-a>${actLabel(o)}</button>` : ''});
    if(!active) return;
    sh.$('[data-a]').addEventListener('click', async ()=>{ const r = await api('advanceOrder', {id:o.id}); if(r.ok){ haptic('success'); sh.close(); loadOrders(); } });
    sh.$('[data-c]').addEventListener('click', async ()=>{
      if(!await Kit.confirm(t('cancelQ', {n:o.num}), t('cancel'), true)) return;
      const r = await api('cancelOrder', {id:o.id}); if(r.ok){ haptic('warning'); sh.close(); loadOrders(); }
    });
  }
  $('#acc').addEventListener('change', async e=>{
    const on = e.target.checked;
    const r = await api('setAccepting', {accepting:on});
    if(r.ok){ O.accepting = r.accepting; haptic(on ? 'success' : 'warning'); renderOrders(); } else e.target.checked = !on;
  });
  $('#sim').addEventListener('click', async ()=>{
    const b = $('#sim'); Kit.busy(b, true);
    const r = await api('simulateOrder');
    Kit.busy(b, false);
    if(r.ok){ haptic('success'); Kit.toast(t('simOk', {n:r.order.num}), 'ok'); loadOrders(); }
  });

  /* ============ МЕНЮ ============ */
  const M = {cats:[], items:null, icons:Dish.ICONS, cat:'all'};
  function renderMenu(){
    const list = $('#mList');
    if(!M.items){ list.innerHTML = '<div class="skel" style="height:320px;margin-top:12px"></div>'; return; }
    $('#mSub').textContent = t('dishes', {n:M.items.length, s:M.items.filter(i=>!i.inStock).length});
    $('#mCats').innerHTML = html`<button type="button" class="chip${M.cat === 'all' ? ' is-on' : ''}" data-mc="all">${t('all')}</button>${M.cats.map(c=>html`<button type="button" class="chip${M.cat === c.id ? ' is-on' : ''}" data-mc="${c.id}">${nm(c)}</button>`)}<button type="button" class="chip${M.cat === 'out' ? ' is-on' : ''}" data-mc="out">${t('out')}</button>`;
    const cats = M.cats.filter(c=>M.cat === 'all' || M.cat === 'out' || M.cat === c.id);
    list.innerHTML = cats.map(c=>{
      const items = M.items.filter(i=>i.cat === c.id && (M.cat !== 'out' || !i.inStock));
      return items.length ? html`<div class="cat-head">${nm(c)}</div><div class="menu-card">${items.map(it=>html`<div class="dish${it.inStock ? '' : ' is-out'}">
        <button type="button" class="dish-main" data-ed="${it.id}" style="display:flex;gap:12px;align-items:center">${Dish.plate(it.icon)}<span style="min-width:0"><span class="dish-name">${Kit.nobr(nm(it.name))}</span>${lang === 'ru' && it.name.cn ? html`<span class="dish-cn">${it.name.cn}</span>` : ''}<span class="dish-price">${money(it.price)}</span></span></button>
        <button type="button" class="icon-btn" data-hit="${it.id}" aria-label="${t('hit')}" style="color:${it.hit ? 'var(--accent)' : 'var(--ink-3)'}">${icon('star')}</button>
        <label class="switch" aria-label="${t('inStock')}"><input type="checkbox" data-st="${it.id}" ${it.inStock ? 'checked' : ''}><span></span></label>
      </div>`)}</div>` : '';
    }).join('') || html`<div class="empty">${icon('bowl')}<div class="empty-title">—</div></div>`;
    $$('.dish.is-out .switch', list).forEach(s=> s.closest('.dish').style.opacity = '1');
  }
  async function loadMenu(){ const r = await api('getMenuAdmin'); if(r.ok){ M.cats = r.categories; M.items = r.items; M.icons = r.icons || Dish.ICONS; } renderMenu(); }
  Kit.on($('#mCats'), 'click', '[data-mc]', (e, el)=>{ M.cat = el.dataset.mc; haptic('select'); renderMenu(); });
  const mList = $('#mList');
  Kit.on(mList, 'change', '[data-st]', async (e, el)=>{ const id = +el.dataset.st, r = await api('toggleStock', {id}); if(r.ok){ const it = M.items.find(i=>i.id === id); it.inStock = !it.inStock; haptic('select'); renderMenu(); } else el.checked = !el.checked; });
  Kit.on(mList, 'click', '[data-hit]', async (e, el)=>{ const id = +el.dataset.hit, r = await api('toggleHit', {id}); if(r.ok){ const it = M.items.find(i=>i.id === id); it.hit = !it.hit; haptic('select'); renderMenu(); } });
  Kit.on(mList, 'click', '[data-ed]', (e, el)=> editDish(M.items.find(i=>i.id === +el.dataset.ed)));
  $('#addDish').addEventListener('click', ()=> editDish(null));
  function editDish(it){
    const d = it ? JSON.parse(JSON.stringify(it)) : {cat:M.cat !== 'all' && M.cat !== 'out' ? M.cat : M.cats[0].id, icon:'bun', price:'', name:{ru:'', cn:''}, desc:{ru:'', cn:''}, hit:false, inStock:true};
    const sh = Kit.sheet({title:it ? nm(it.name) : t('newDish'), body:html`
      <label class="field"><span class="field-label">${t('nameRu')}</span><input class="input" id="nRu" maxlength="60" value="${d.name.ru}"></label>
      <label class="field"><span class="field-label">${t('nameCn')}</span><input class="input" id="nCn" maxlength="40" value="${d.name.cn}"></label>
      <label class="field"><span class="field-label">${t('descRu')}</span><input class="input" id="dRu" maxlength="120" value="${d.desc.ru}"></label>
      <label class="field"><span class="field-label">${t('descCn')}</span><input class="input" id="dCn" maxlength="80" value="${d.desc.cn}"></label>
      <div class="field-row"><label class="field"><span class="field-label">${t('price')}</span><input class="input" id="pr" inputmode="decimal" value="${d.price === '' ? '' : Kit.num(d.price, 2)}"></label>
        <label class="field"><span class="field-label">${t('cat')}</span><select class="select" id="ct">${M.cats.map(c=>html`<option value="${c.id}" ${c.id === d.cat ? 'selected' : ''}>${nm(c)}</option>`)}</select></label></div>
      <div class="field"><span class="field-label">${t('icon')}</span><div class="icon-pick" id="ip">${M.icons.map(n=>html`<button type="button" data-ic="${n}" class="${n === d.icon ? 'is-on' : ''}" aria-label="${n}">${Dish.art(n)}</button>`)}</div></div>
      <label class="check"><input type="checkbox" id="hh" ${d.hit ? 'checked' : ''}><span>${t('hit')}</span></label>
      <label class="check"><input type="checkbox" id="ss" ${d.inStock ? 'checked' : ''}><span>${t('inStock')}</span></label>`,
      actions:html`${it ? html`<button class="btn btn-danger-soft" type="button" data-del>${t('del')}</button>` : ''}<button class="btn btn-primary" type="button" data-save>${t('save')}</button>`});
    Kit.on(sh.$('#ip'), 'click', '[data-ic]', (e, el)=>{ d.icon = el.dataset.ic; $$('button', sh.$('#ip')).forEach(b=>b.classList.toggle('is-on', b === el)); haptic('select'); });
    sh.$('[data-save]').addEventListener('click', async ()=>{
      const price = parseFloat(sh.$('#pr').value.replace(',', '.').replace(/\s/g, ''));
      const dish = {id:it ? it.id : undefined, cat:sh.$('#ct').value, icon:d.icon, price, name:{ru:sh.$('#nRu').value.trim(), cn:sh.$('#nCn').value.trim()}, desc:{ru:sh.$('#dRu').value.trim(), cn:sh.$('#dCn').value.trim()}, hit:sh.$('#hh').checked, inStock:sh.$('#ss').checked};
      if(dish.name.ru.length < 2){ Kit.toast(lang === 'cn' ? '请填写名称' : 'Укажите название', 'error'); return; }
      if(!(price > 0 && price <= 500)){ Kit.toast(lang === 'cn' ? '价格不正确' : 'Проверьте цену', 'error'); return; }
      const b = sh.$('[data-save]'); Kit.busy(b, true);
      const r = await api('saveDish', {dish});
      Kit.busy(b, false);
      if(!r.ok){ Kit.toast(r.message || 'Не сохранилось', 'error'); return; }
      haptic('success'); Kit.toast(t('saved'), 'ok'); sh.close(); loadMenu();
    });
    if(it) sh.$('[data-del]').addEventListener('click', async ()=>{
      if(!await Kit.confirm(t('delQ', {n:nm(it.name)}), t('del'), true)) return;
      const r = await api('deleteDish', {id:it.id}); if(r.ok){ haptic('warning'); sh.close(); loadMenu(); }
    });
  }

  /* ============ СТАТИСТИКА ============ */
  let period = 'today', stats = null;
  Kit.on($('#period'), 'click', '[data-p]', (e, el)=>{ period = el.dataset.p; $$('#period button').forEach(b=>b.classList.toggle('is-on', b === el)); haptic('select'); loadStats(); });
  async function loadStats(){ stats = null; renderStats(); const r = await api('getStats', {period}); if(r.ok) stats = r.stats; renderStats(); }
  function renderStats(){
    const box = $('#sBody');
    if(!stats){ box.innerHTML = '<div class="skel" style="height:180px"></div><div class="skel" style="height:200px;margin-top:12px"></div>'; return; }
    const s = stats;
    box.innerHTML = html`<div class="stats">
        <div class="stat is-accent"><div class="stat-label">${t('revenue')}</div><div class="stat-value" data-fit="min">${money(s.revenue)}</div></div>
        <div class="stat"><div class="stat-label">${t('count')}</div><div class="stat-value">${s.count}</div></div>
        <div class="stat"><div class="stat-label">${t('avg')}</div><div class="stat-value" data-fit="min">${money(s.avg)}</div></div>
        <div class="stat"><div class="stat-label">${t('promo')}</div><div class="stat-value">${s.promoCount}</div></div></div>
      <div class="card section"><div class="section-head"><span class="section-title">${t('split')}</span></div>
        <div class="split"><i style="width:${s.pickupPct}%;background:var(--accent)"></i><i style="width:${s.deliveryPct}%;background:var(--jade)"></i></div>
        <div class="kv" style="border:0;padding-bottom:0"><span class="k"><span class="open-dot" style="background:var(--accent);box-shadow:none"></span>${t('pickup')} ${s.pickupPct}%</span><span class="v"><span class="open-dot" style="box-shadow:none"></span>${t('delivery')} ${s.deliveryPct}%</span></div></div>
      ${period !== 'today' ? html`<div class="card section"><div class="section-head"><span class="section-title">${t('byDay')}</span></div>${Kit.chart.bars(s.chart.map((c, i, a)=>({label:a.length > 10 && i % 5 && i !== a.length - 1 ? '' : lang === 'cn' && c.label.length === 2 && isNaN(+c.label) ? '一二三四五六日'.charAt(['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].indexOf(c.label)) : c.label, value:c.revenue})), {highlightLast:true, short:v=>Kit.num(v)})}</div>` : ''}
      <div class="card section"><div class="section-head"><span class="section-title">${t('byHour')}</span></div>${Kit.chart.bars(s.hours.map(h=>({label:String(h.hour), value:h.count})))}</div>
      <div class="card section"><div class="section-head"><span class="section-title">${t('top')}</span></div>${Kit.chart.rank(s.top.map(x=>({name:nm(x.name), value:x.count, note:money(x.revenue)})), {format:v=>v + ' шт'})}</div>`;
  }

  /* ============ НАСТРОЙКИ ============ */
  let cfg = null, promos = [];
  async function loadSettings(){ const r = await api('getSettings'); if(r.ok){ cfg = r.config; promos = r.promos; } renderSettings(); }
  function renderSettings(){
    const box = $('#setBody');
    if(!cfg){ box.innerHTML = '<div class="skel" style="height:300px"></div>'; return; }
    box.innerHTML = html`<div class="card">
        <div class="field"><span class="field-label">${t('phone')}</span>${Kit.phone.field('sPh', cfg.phone)}</div>
        <label class="field"><span class="field-label">${t('address')}</span><input class="input" id="sAd" maxlength="100" value="${cfg.address}"></label>
        <div class="field"><span class="field-label">${t('hours')}</span><div class="field-row"><input class="input" type="time" id="sFrom" value="${cfg.workHours.from}" aria-label="${t('from')}"><input class="input" type="time" id="sTo" value="${cfg.workHours.to}" aria-label="${t('to')}"></div></div>
        <div class="field" style="margin-bottom:0"><span class="field-label">${t('eta')}</span><div class="stepper-num"><button type="button" data-eta="-1" aria-label="Меньше">${icon('minus')}</button><output id="sEta">${cfg.pickupEtaMin}</output><button type="button" data-eta="1" aria-label="Больше">${icon('plus')}</button></div></div>
      </div>
      <div class="section"><div class="section-head"><span class="section-title">${t('zones')}</span></div>
        <div class="card">${cfg.deliveryZones.map((z, i)=>html`<div class="field"><span class="field-label">${t('upTo', {km:Kit.num(z.maxKm, 1)})}</span><div class="field-row">
          <label class="field" style="margin:0"><span class="hint">${t('fee')}</span><input class="input" inputmode="decimal" data-zf="${i}" value="${Kit.num(z.fee, 2)}"></label>
          <label class="field" style="margin:0"><span class="hint">${t('zeta')}</span><input class="input" inputmode="numeric" data-ze="${i}" value="${z.eta}"></label></div></div>`)}</div></div>
      <div class="section"><div class="section-head"><span class="section-title">${t('promos')}</span></div>
        <div class="list">${promos.map(p=>html`<div class="row"><span class="row-icon">${icon('percent')}</span><span class="row-main"><span class="row-title">${p.code}</span><span class="row-sub">−${p.percent}%</span></span></div>`)}</div></div>
      <button class="btn btn-primary btn-block section" type="button" id="sSave">${t('save')}</button>`;
    Kit.phone.bind($('#sPh'));
  }
  const setBody = $('#setBody');
  Kit.on(setBody, 'click', '[data-eta]', (e, el)=>{ const o = $('#sEta'); o.textContent = Math.max(5, Math.min(90, +o.textContent + +el.dataset.eta)); haptic('select'); });
  Kit.on(setBody, 'click', '#sSave', async (e, el)=>{
    const num = v=> parseFloat(String(v).replace(',', '.').replace(/\s/g, ''));
    const p = {phone:Kit.phone.value($('#sPh')), address:$('#sAd').value.trim(), workHours:{from:$('#sFrom').value, to:$('#sTo').value}, pickupEtaMin:+$('#sEta').textContent,
      deliveryZones:cfg.deliveryZones.map((z, i)=>({maxKm:z.maxKm, fee:num($(`[data-zf="${i}"]`).value), eta:parseInt($(`[data-ze="${i}"]`).value, 10)}))};
    if(!Kit.phone.valid($('#sPh'))){ Kit.toast(lang === 'cn' ? '电话号码不正确' : 'Проверьте телефон', 'error'); return; }
    if(p.address.length < 5){ Kit.toast(lang === 'cn' ? '请填写地址' : 'Укажите адрес', 'error'); return; }
    if(p.deliveryZones.some(z=>!(z.fee >= 0) || !(z.eta >= 5))){ Kit.toast(lang === 'cn' ? '请检查配送范围' : 'Проверьте зоны доставки', 'error'); return; }
    Kit.busy(el, true);
    const r = await api('saveSettings', p);
    Kit.busy(el, false);
    if(!r.ok){ Kit.toast(r.message || 'Не сохранилось', 'error'); return; }
    cfg = r.config; haptic('success'); Kit.toast(t('saved'), 'ok');
  });

  /* ============ СТАРТ ============ */
  applyLang();
  let poll = null;
  Kit.tabs({onChange(tab, first){
    clearInterval(poll);
    if(tab === 'orders'){ first ? (renderOrders(), loadOrders()) : loadOrders(); poll = setInterval(()=>loadOrders(true), 20000); }
    if(tab === 'menu' && first){ renderMenu(); loadMenu(); }
    if(tab === 'stats') loadStats();
    if(tab === 'settings' && first){ renderSettings(); loadSettings(); }
  }});
})();
</script>
</body>
</html>
