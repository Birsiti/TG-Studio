<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>МОСТ — кафе</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../kit/core.js"></script>
<link rel="stylesheet" href="../kit/base.css">
<link rel="stylesheet" href="brand.css">
<script src="dishes.js"></script>
<script src="mock.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><div class="seal">桥</div><div class="brand-text"><span class="brand-name">МОСТ</span><span class="brand-role" id="tagline"></span></div></div>
    <div class="topbar-actions">
      <button class="icon-btn lang-btn" id="lang" type="button" aria-label="Язык">中</button>
      <button class="icon-btn" id="hist" type="button" aria-label="Мои заказы"><span id="histIc"></span><span class="dot-badge" id="histDot" hidden></span></button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button>
    </div>
  </header>
  <main id="view"></main>
</div>
<div class="actionbar" id="bar" hidden><div class="actionbar-inner"><button class="cartbar" type="button" id="cartBtn"><span id="cartLbl"></span><span class="count" id="cartCnt">0</span><span class="sum" id="cartSum"></span></button></div></div>

<script>
(function(){
  "use strict";
  const {html, icon, $, $$, haptic} = Kit;
  const money = Dish.money;
  const api = Kit.createApi({bot:'most', mock: window.MostMock});
  const L = {
    ru:{tag:'там, где встречаются два вкуса', open:'Открыто до', closed:'Сейчас закрыто · откроемся в', eta:'готовим за ~{m} мин', search:'Найти блюдо', hits:'Хиты', cart:'Корзина', yourOrder:'Ваш заказ',
      empty:'Пока пусто — выберите что-нибудь из меню', pickup:'Самовывоз', delivery:'Доставка', when:'Когда забрать', now:'Как можно скорее', in15:'Через 15 мин', in30:'Через 30 мин',
      geoBtn:'Поделиться геопозицией', geoWait:'Определяем местоположение…', geoOk:'До вас {km} км · доставка {fee} · ~{eta} мин', geoFar:'Слишком далеко — укажите адрес или выберите самовывоз', geoErr:'Не удалось определить местоположение',
      address:'Адрес доставки', addressPh:'Улица, дом, подъезд, этаж', phone:'Телефон для курьера', note:'Комментарий', notePh:'Например: без сахара, позвонить у входа',
      promo:'Промокод', apply:'Применить', promoOk:'Скидка {p}% применена', promoBad:'Промокод не найден', items:'Блюда', discount:'Скидка', fee:'Доставка', total:'Итого',
      checkout:'Оформить заказ', add:'Добавить', out:'Нет в наличии', hit:'ХИТ', history:'Мои заказы', noHistory:'Вы ещё ничего не заказывали', repeat:'Повторить заказ',
      thanks:'Заказ принят', readyAt:'Будет готов к {t}', courierAt:'Курьер будет у вас к {t}', where:'Заберите на стойке «Мост», 1 этаж', st_new:'Заказ принят', st_preparing:'Готовим',
      st_ready_p:'Готов — ждём на стойке', st_ready_d:'Курьер выехал', st_done_p:'Выдан', st_done_d:'Доставлен', st_cancelled:'Отменён', more:'Ещё заказ', paused:'Кафе временно не принимает заказы',
      call:'Позвонить в кафе', manualFee:'По адресу — {fee}, точнее посчитаем по геопозиции', nothing:'Ничего не нашлось'},
    cn:{tag:'两种风味相遇的地方', open:'营业至', closed:'暂停营业 · 开门时间', eta:'约{m}分钟出餐', search:'搜索菜品', hits:'热门', cart:'购物车', yourOrder:'我的订单',
      empty:'购物车是空的，去看看菜单吧', pickup:'自取', delivery:'外送', when:'取餐时间', now:'尽快', in15:'15分钟后', in30:'30分钟后',
      geoBtn:'分享定位', geoWait:'正在定位…', geoOk:'距离 {km} 公里 · 配送费 {fee} · 约{eta}分钟', geoFar:'距离过远，请填写地址或选择自取', geoErr:'无法获取定位',
      address:'配送地址', addressPh:'街道、门牌、单元、楼层', phone:'配送联系电话', note:'订单备注', notePh:'例如：不要糖，到店请致电',
      promo:'优惠码', apply:'使用', promoOk:'已优惠 {p}%', promoBad:'优惠码无效', items:'菜品', discount:'优惠', fee:'配送费', total:'合计',
      checkout:'提交订单', add:'加入', out:'售罄', hit:'热门', history:'我的订单', noHistory:'暂无历史订单', repeat:'再次下单',
      thanks:'订单已接受', readyAt:'{t} 前可取餐', courierAt:'骑手约 {t} 送达', where:'请到「Мост」前台取餐，1楼', st_new:'订单已接受', st_preparing:'制作中',
      st_ready_p:'可以取餐', st_ready_d:'骑手已出发', st_done_p:'已取餐', st_done_d:'已送达', st_cancelled:'已取消', more:'再下一单', paused:'餐厅暂停接单',
      call:'致电餐厅', manualFee:'按地址配送 {fee}，分享定位可更准确', nothing:'未找到相关菜品'}
  };
  let lang = 'ru';
  try{ lang = localStorage.getItem('most-lang') === 'cn' ? 'cn' : 'ru'; }catch(e){}
  const t = (k, v)=> String(L[lang][k] || k).replace(/\{(\w+)\}/g, (_, x)=> v && v[x] != null ? v[x] : '');
  const nm = o=> (lang === 'cn' && o.cn) ? o.cn : o.ru;

  $('#histIc').innerHTML = icon('receipt');
  const view = $('#view'), bar = $('#bar');
  const S = {cats:[], items:[], cfg:null, cat:'all', q:'', cart:[], type:'pickup', when:'now', geo:null, geoState:'idle', geoInfo:null, address:'', phone:'', note:'', promo:null, last:null};
  try{ const c = JSON.parse(localStorage.getItem('most-cart') || 'null'); if(c) S.cart = c; const pr = JSON.parse(localStorage.getItem('most-prof') || 'null'); if(pr){ S.phone = pr.phone || ''; S.address = pr.address || ''; } }catch(e){}
  const item = id=> S.items.find(i=>i.id === id);
  function saveCart(){ try{ localStorage.setItem('most-cart', JSON.stringify(S.cart)); }catch(e){} }
  function unit(it, mods){ let u = it.price; (it.modifiers || []).forEach(g=>{ const o = g.options.find(x=>x.id === (mods || {})[g.id]) || g.options[0]; u += o.price; }); return Math.round(u * 100) / 100; }
  const cartCount = ()=> S.cart.reduce((a, l)=>a + l.qty, 0);
  const cartSum = ()=> S.cart.reduce((a, l)=>{ const it = item(l.itemId); return a + (it ? unit(it, l.mods) * l.qty : 0); }, 0);
  const qtyOf = id=> S.cart.filter(l=>l.itemId === id).reduce((a, l)=>a + l.qty, 0);

  function applyLang(){
    document.documentElement.lang = lang === 'cn' ? 'zh' : 'ru';
    $('#lang').textContent = lang === 'cn' ? 'RU' : '中';
    $('#tagline').textContent = t('tag');
  }
  $('#lang').addEventListener('click', ()=>{ lang = lang === 'ru' ? 'cn' : 'ru'; try{ localStorage.setItem('most-lang', lang); }catch(e){} haptic('select'); applyLang(); renderMenu(); updateBar(); });

  /* ============ МЕНЮ ============ */
  function dishRow(it){
    const q = qtyOf(it.id), simple = !(it.modifiers || []).length;
    return html`<div class="dish${it.inStock ? '' : ' is-out'}">
      <button type="button" class="dish-main" data-open="${it.id}" style="display:flex;gap:12px;align-items:center">${Dish.plate(it.icon)}
        <span style="min-width:0"><span class="dish-name">${Kit.nobr(nm(it.name))}${it.hit ? html`<span class="tag-hit">${t('hit')}</span>` : ''}</span>${lang === 'ru' && it.name.cn ? html`<span class="dish-cn">${it.name.cn}</span>` : ''}
        <span class="dish-desc">${nm(it.desc)}</span><span class="dish-price">${it.inStock ? money(it.price) : t('out')}</span></span></button>
      ${!it.inStock ? '' : q && simple ? html`<span class="qty"><button type="button" data-dec="${it.id}" aria-label="Меньше">${icon('minus')}</button><b>${q}</b><button type="button" data-inc="${it.id}" aria-label="Больше">${icon('plus')}</button></span>`
        : html`<button type="button" class="add" data-${simple ? 'inc' : 'open'}="${it.id}" aria-label="${t('add')}">${q ? html`<b>${q}</b>` : icon('plus')}</button>`}
    </div>`;
  }
  function renderMenu(){
    if(!S.cfg){ view.innerHTML = '<div class="skel" style="height:140px;margin-top:8px"></div><div class="skel" style="height:300px;margin-top:16px"></div>'; return; }
    const c = S.cfg, q = S.q.trim().toLowerCase();
    const match = it=> !q || (it.name.ru + ' ' + it.name.cn + ' ' + it.desc.ru).toLowerCase().includes(q);
    const cats = S.cats.filter(cat=> S.cat === 'all' || S.cat === cat.id);
    const hits = S.items.filter(i=>i.hit && i.inStock);
    view.innerHTML = html`<div class="screen">
      <section class="hello" style="margin-top:6px"><h1>${lang === 'cn' ? '桥 · 白俄与中国的味道' : 'Белорусская кухня встречает китайскую'}</h1>
        <div class="hello-meta"><span><span class="open-dot${c.openNow ? '' : ' closed'}"></span>${c.openNow ? t('open') + ' ' + c.workHours.to : t('closed') + ' ' + c.workHours.from}</span><span>${t('eta', {m:c.pickupEtaNow})}</span><span>${c.address}</span></div>
        ${c.accepting === false ? html`<div class="geo bad" style="margin-top:12px">${icon('pause')}${t('paused')}</div>` : ''}</section>
      <div class="arch"></div>
      <div class="search"><span>${icon('search')}</span><input class="input" id="q" type="search" placeholder="${t('search')}" value="${S.q}" autocomplete="off"></div>
      ${!q && hits.length ? html`<div class="section"><div class="eyebrow" style="margin-bottom:8px">${t('hits')}</div><div class="hits">${hits.map(it=>html`<button type="button" class="hit" data-open="${it.id}">${Dish.plate(it.icon)}<b>${Kit.nobr(nm(it.name))}</b><span class="price">${money(it.price)}</span></button>`)}</div></div>` : ''}
      <div class="chips scroll section" id="cats"><button type="button" class="chip${S.cat === 'all' ? ' is-on' : ''}" data-cat="all">${lang === 'cn' ? '全部' : 'Всё меню'}</button>${S.cats.map(cat=>html`<button type="button" class="chip${S.cat === cat.id ? ' is-on' : ''}" data-cat="${cat.id}">${nm(cat)}</button>`)}</div>
      <div id="menu">${cats.map(cat=>{ const list = S.items.filter(i=>i.cat === cat.id && match(i)); return list.length ? html`<div class="cat-head">${nm(cat)}</div><div class="menu-card">${list.map(dishRow)}</div>` : ''; })}
        ${S.items.some(match) ? '' : html`<div class="empty">${icon('search')}<div class="empty-title">${t('nothing')}</div></div>`}</div>
      <p class="hint" style="text-align:center;margin-top:20px"><a href="tel:${c.phone}">${t('call')}</a></p>
    </div>`;
    const qi = $('#q');
    qi.addEventListener('input', Kit.debounce(()=>{ S.q = qi.value; const pos = qi.selectionStart; renderMenu(); const n = $('#q'); n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} }, 250));
    updateBar();
  }
  Kit.on(view, 'click', '[data-cat]', (e, el)=>{ S.cat = el.dataset.cat; haptic('select'); renderMenu(); });
  Kit.on(view, 'click', '[data-open]', (e, el)=>{ const it = item(+el.dataset.open); if(it && it.inStock) openDish(it); });
  Kit.on(view, 'click', '[data-inc]', (e, el)=>{ addLine(+el.dataset.inc, {}, 1); });
  Kit.on(view, 'click', '[data-dec]', (e, el)=>{ addLine(+el.dataset.dec, {}, -1); });
  function addLine(id, mods, d){
    const key = JSON.stringify(mods || {});
    let l = S.cart.find(x=>x.itemId === id && JSON.stringify(x.mods || {}) === key);
    if(!l && d > 0){ l = {itemId:id, mods:mods || {}, qty:0}; S.cart.push(l); }
    if(!l) return;
    l.qty = Math.max(0, Math.min(20, l.qty + d));
    S.cart = S.cart.filter(x=>x.qty > 0);
    haptic(d > 0 ? 'light' : 'select'); saveCart();
    if(!document.body.classList.contains('has-sheet')) renderMenu(); else updateBar();
  }
  function updateBar(){
    const n = cartCount();
    bar.hidden = !n; $('#app').classList.toggle('has-actionbar', !!n);
    $('#cartLbl').textContent = t('cart'); $('#cartCnt').textContent = n; $('#cartSum').textContent = money(cartSum());
  }

  function openDish(it){
    const mods = {}; (it.modifiers || []).forEach(g=> mods[g.id] = g.options[0].id);
    let qty = 1;
    const sh = Kit.sheet({title:nm(it.name), sub:nm(it.desc), body:'', actions:html`<button class="btn btn-primary" type="button" data-add></button>`});
    const draw = ()=>{
      sh.body.innerHTML = html`<div style="display:flex;justify-content:center;margin:4px 0 12px">${Dish.plate(it.icon, '')}</div>
        ${(it.modifiers || []).map(g=>html`<div class="field"><span class="field-label">${nm(g.label)}</span><div class="chips" data-g="${g.id}">${g.options.map(o=>html`<button type="button" class="chip${mods[g.id] === o.id ? ' is-on' : ''}" data-o="${o.id}">${nm(o.label)}${o.price ? ' +' + Kit.num(o.price, 2) : ''}</button>`)}</div></div>`)}
        <div style="display:flex;justify-content:center;margin-top:8px"><div class="stepper-num"><button type="button" data-q="-1" aria-label="Меньше">${icon('minus')}</button><output>${qty}</output><button type="button" data-q="1" aria-label="Больше">${icon('plus')}</button></div></div>`;
      sh.$('[data-add]').textContent = t('add') + ' · ' + money(unit(it, mods) * qty);
    };
    draw();
    sh.body.addEventListener('click', e=>{
      const o = e.target.closest('[data-o]'); if(o){ mods[o.closest('[data-g]').dataset.g] = o.dataset.o; haptic('select'); draw(); return; }
      const q = e.target.closest('[data-q]'); if(q){ qty = Math.max(1, Math.min(20, qty + +q.dataset.q)); haptic('select'); draw(); }
    });
    sh.$('[data-add]').addEventListener('click', ()=>{ addLine(it.id, mods, qty); sh.close(); renderMenu(); Kit.toast(nm(it.name) + ' · ' + money(unit(it, mods) * qty), 'ok'); });
  }

  /* ============ КОРЗИНА ============ */
  $('#cartBtn').addEventListener('click', openCart);
  function openCart(){
    const sh = Kit.sheet({title:t('yourOrder'), body:'', actions:html`<button class="btn btn-primary" type="button" data-go>${t('checkout')}</button>`});
    let quote = null;
    const drawGeo = ()=>{
      const box = sh.$('#geoBox'); if(!box) return;
      if(S.geoState === 'wait') box.innerHTML = html`<div class="geo">${Kit.raw('<span class="spinner" style="width:20px;height:20px;border-width:2px"></span>')}${t('geoWait')}</div>`;
      else if(S.geoState === 'ok' && S.geoInfo) box.innerHTML = html`<div class="geo">${icon('pin')}${t('geoOk', {km:Kit.num(S.geoInfo.distanceKm, 1), fee:money(S.geoInfo.deliveryFee), eta:S.geoInfo.eta})}</div>`;
      else if(S.geoState === 'far') box.innerHTML = html`<div class="geo bad">${icon('alert')}${t('geoFar')}</div>`;
      else box.innerHTML = html`<button class="btn btn-soft btn-block" type="button" id="geoBtn">${icon('pin')}${t('geoBtn')}</button>${S.geoState === 'err' ? html`<p class="hint" style="margin-top:6px;color:var(--danger)">${t('geoErr')}</p>` : ''}`;
      const b = sh.$('#geoBtn'); if(b) b.addEventListener('click', requestGeo);
    };
    const requestGeo = ()=>{
      S.geoState = 'wait'; drawGeo();
      const done = (lat, lng)=>{ S.geo = {lat, lng}; recalc(); };
      const fail = ()=>{ S.geoState = 'err'; S.geo = null; drawGeo(); };
      const lm = Kit.tg && Kit.tg.LocationManager;
      if(Kit.inTelegram && lm && Kit.tg.isVersionAtLeast && Kit.tg.isVersionAtLeast('8.0')){
        try{ lm.init(()=>{ lm.getLocation(loc=>{ loc ? done(loc.latitude, loc.longitude) : fail(); }); }); return; }catch(e){}
      }
      if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>done(p.coords.latitude, p.coords.longitude), fail, {timeout:10000});
      else fail();
    };
    const payload = ()=>({lines:S.cart, type:S.type, pickupTime:S.when, geo:S.type === 'delivery' ? S.geo : null, address:S.type === 'delivery' ? S.address : '',
      phone:S.phone, note:S.note, promo:S.promo ? S.promo.code : '', lang});
    const recalc = async ()=>{
      if(!S.cart.length) return draw();
      const r = await api('quote', payload());
      if(r.ok){ quote = r; if(S.type === 'delivery' && S.geo){ S.geoState = 'ok'; S.geoInfo = r; } }
      else if(r.error === 'out_of_zone'){ S.geoState = 'far'; S.geo = null; quote = null; }
      else quote = null;
      drawTotals(); drawGeo();
    };
    const drawTotals = ()=>{
      const box = sh.$('#totals'); if(!box) return;
      const sub = quote ? quote.subtotal : cartSum();
      box.innerHTML = html`<div class="kv"><span class="k">${t('items')}</span><span class="v">${money(sub)}</span></div>
        ${quote && quote.discount ? html`<div class="kv"><span class="k">${t('discount')} ${S.promo.percent}%</span><span class="v" style="color:var(--ok)">−${money(quote.discount)}</span></div>` : ''}
        ${S.type === 'delivery' ? html`<div class="kv"><span class="k">${t('fee')}</span><span class="v">${quote && (S.geo || S.address.trim().length >= 5) ? money(quote.deliveryFee) : '—'}</span></div>` : ''}
        <div class="kv"><span class="k grand">${t('total')}</span><span class="v grand">${money(quote ? quote.total : sub)}</span></div>`;
      const ok = S.cart.length && (S.type === 'pickup' || ((S.geo || S.address.trim().length >= 5) && /^\+375\d{9}$/.test(S.phone) && S.geoState !== 'far')) && S.cfg.accepting !== false;
      sh.$('[data-go]').disabled = !ok;
    };
    const draw = ()=>{
      if(!S.cart.length){ sh.body.innerHTML = html`<div class="empty">${icon('bowl')}<div class="empty-title">${t('empty')}</div></div>`; sh.$('[data-go]').disabled = true; return; }
      sh.body.innerHTML = html`
        <div>${S.cart.map((l, i)=>{ const it = item(l.itemId); if(!it) return ''; const ml = (it.modifiers || []).map(g=>{ const o = g.options.find(x=>x.id === l.mods[g.id]); return o && (o.price || o !== g.options[0]) ? nm(o.label) : ''; }).filter(Boolean);
          return html`<div class="line">${Dish.plate(it.icon)}<div style="flex:1;min-width:0"><b style="display:block">${nm(it.name)}</b><span class="hint">${ml.join(', ')}${ml.length ? ' · ' : ''}${money(unit(it, l.mods))}</span></div>
            <span class="qty"><button type="button" data-l="${i}" data-d="-1" aria-label="Меньше">${icon('minus')}</button><b>${l.qty}</b><button type="button" data-l="${i}" data-d="1" aria-label="Больше">${icon('plus')}</button></span></div>`; })}</div>
        <div class="seg section" id="type"><button type="button" data-t="pickup" class="${S.type === 'pickup' ? 'is-on' : ''}">${t('pickup')}</button><button type="button" data-t="delivery" class="${S.type === 'delivery' ? 'is-on' : ''}">${t('delivery')}</button></div>
        ${S.type === 'pickup' ? html`<div class="field section"><span class="field-label">${t('when')}</span><div class="chips" id="when">${[['now', t('now')], ['15', t('in15')], ['30', t('in30')]].map(([k, l])=>html`<button type="button" class="chip${S.when === k ? ' is-on' : ''}" data-w="${k}">${l}</button>`)}</div></div>`
          : html`<div class="section" id="geoBox"></div>
            <label class="field section"><span class="field-label">${t('address')}</span><input class="input" id="addr" maxlength="160" placeholder="${t('addressPh')}" value="${S.address}"></label>
            ${!S.geo ? html`<p class="hint" style="margin:-6px 0 12px">${t('manualFee', {fee:money(S.cfg.manualDeliveryFee)})}</p>` : ''}
            <div class="field"><span class="field-label">${t('phone')}</span>${Kit.phone.field('ph', S.phone)}</div>`}
        <label class="field"><span class="field-label">${t('note')}</span><input class="input" id="note" maxlength="200" placeholder="${t('notePh')}" value="${S.note}"></label>
        <div class="field"><span class="field-label">${t('promo')}</span><div class="field-row"><input class="input" id="promo" maxlength="20" placeholder="MOST10" value="${S.promo ? S.promo.code : ''}" style="text-transform:uppercase"><button class="btn btn-ghost" type="button" id="promoBtn" style="flex:none">${t('apply')}</button></div>
          ${S.promo ? html`<p class="hint" style="color:var(--ok);margin-top:6px">${t('promoOk', {p:S.promo.percent})}</p>` : ''}</div>
        <div class="card card-flat totals" id="totals"></div>`;
      drawGeo(); drawTotals();
      const ph = sh.$('#ph'); if(ph){ Kit.phone.bind(ph); ph.addEventListener('input', ()=>{ S.phone = Kit.phone.value(ph); drawTotals(); }); }
      const ad = sh.$('#addr'); if(ad) ad.addEventListener('input', Kit.debounce(()=>{ S.address = ad.value; recalc(); }, 400));
      sh.$('#note').addEventListener('input', e=>{ S.note = e.target.value; });
      sh.$('#promoBtn').addEventListener('click', async ()=>{
        const code = sh.$('#promo').value.trim(); if(!code) return;
        const r = await api('checkPromo', {code});
        if(!r.ok){ S.promo = null; Kit.toast(t('promoBad'), 'error'); } else { S.promo = {code:r.code, percent:r.percent}; haptic('success'); }
        draw(); recalc();
      });
    };
    sh.body.addEventListener('click', e=>{
      const d = e.target.closest('[data-d]'); if(d){ const l = S.cart[+d.dataset.l]; if(l){ l.qty = Math.max(0, Math.min(20, l.qty + +d.dataset.d)); S.cart = S.cart.filter(x=>x.qty > 0); saveCart(); haptic('select'); updateBar(); draw(); recalc(); } return; }
      const ty = e.target.closest('[data-t]'); if(ty){ S.type = ty.dataset.t; haptic('select'); draw(); recalc(); return; }
      const w = e.target.closest('[data-w]'); if(w){ S.when = w.dataset.w; haptic('select'); draw(); }
    });
    sh.$('[data-go]').addEventListener('click', async ()=>{
      const go = sh.$('[data-go]');
      Kit.busy(go, true);
      const r = await api('createOrder', payload());
      Kit.busy(go, false);
      if(!r.ok){ Kit.toast(r.error === 'out_of_stock' ? (r.message || 'Позиция закончилась') : r.error === 'paused' ? t('paused') : r.error === 'out_of_zone' ? t('geoFar') : (r.message || 'Не получилось оформить'), 'error'); if(r.error === 'out_of_stock') load(); return; }
      haptic('success');
      try{ localStorage.setItem('most-prof', JSON.stringify({phone:S.phone, address:S.address})); localStorage.setItem('most-unseen', '1'); }catch(e){}
      S.cart = []; S.promo = null; S.note = ''; saveCart(); updateBar(); sh.close();
      showOrder(r.order, true); renderMenu(); updateDot();
    });
    draw(); recalc();
  }

  /* ============ СТАТУС ЗАКАЗА ============ */
  let pollTimer = null;
  function stepsHtml(o){
    if(o.status === 'cancelled') return html`<ul class="steps-v"><li class="done">${t('st_new')}</li><li class="cur">${t('st_cancelled')}</li></ul>`;
    const st = ['new', 'preparing', 'ready', 'done'], cur = st.indexOf(o.status);
    const lbl = [t('st_new'), t('st_preparing'), o.type === 'pickup' ? t('st_ready_p') : t('st_ready_d'), o.type === 'pickup' ? t('st_done_p') : t('st_done_d')];
    return html`<ul class="steps-v">${lbl.map((l, i)=>html`<li class="${i < cur || (i === cur && i === 3) ? 'done' : i === cur ? 'cur' : ''}">${l}</li>`)}</ul>`;
  }
  function showOrder(o, fresh){
    clearInterval(pollTimer);
    const ready = new Date(o.readyAt).toTimeString().slice(0, 5);
    const sh = Kit.sheet({title:fresh ? t('thanks') : '№ ' + o.num, body:'', actions:html`<button class="btn btn-ghost" type="button" data-again>${t('repeat')}</button><button class="btn btn-primary" type="button" data-x>${fresh ? t('more') : 'OK'}</button>`,
      onClose:()=> clearInterval(pollTimer)});
    const draw = (o)=>{
      sh.body.innerHTML = html`<div style="text-align:center"><div class="eyebrow">${lang === 'cn' ? '订单号' : 'Номер заказа'}</div><div class="order-num">№ ${o.num}</div>
        <p style="font-weight:600;margin-top:4px">${o.type === 'pickup' ? t('readyAt', {t:ready}) : t('courierAt', {t:ready})}</p><p class="hint">${o.type === 'pickup' ? t('where') : o.address}</p></div>
        <div class="card card-flat section">${stepsHtml(o)}</div>
        <div class="section">${o.lines.map(l=>html`<div class="kv"><span class="k">${l.qty} × ${lang === 'cn' && l.cn ? l.cn : l.n}</span><span class="v">${money(l.unit * l.qty)}</span></div>`)}
          ${o.deliveryFee ? html`<div class="kv"><span class="k">${t('fee')}</span><span class="v">${money(o.deliveryFee)}</span></div>` : ''}
          ${o.discount ? html`<div class="kv"><span class="k">${t('discount')}</span><span class="v">−${money(o.discount)}</span></div>` : ''}
          <div class="kv"><span class="k"><b>${t('total')}</b></span><span class="v">${money(o.total)}</span></div></div>`;
    };
    draw(o);
    sh.$('[data-x]').addEventListener('click', sh.close);
    sh.$('[data-again]').addEventListener('click', ()=>{ repeat(o); sh.close(); });
    if(['new', 'preparing', 'ready'].indexOf(o.status) > -1){
      pollTimer = setInterval(async ()=>{ const r = await api('getOrder', {id:o.id}); if(r.ok && r.order.status !== o.status){ o = r.order; draw(o); haptic('light'); } }, 15000);
    }
  }
  function repeat(o){
    o.lines.forEach(l=>{ const it = item(l.itemId); if(it && it.inStock) addLine(l.itemId, l.mods || {}, l.qty); });
    Kit.toast(lang === 'cn' ? '已加入购物车' : 'Добавили в корзину', 'ok'); renderMenu();
  }
  function updateDot(){ let on = false; try{ on = localStorage.getItem('most-unseen') === '1'; }catch(e){} $('#histDot').hidden = !on; }
  $('#hist').addEventListener('click', async ()=>{
    try{ localStorage.removeItem('most-unseen'); }catch(e){} updateDot();
    const sh = Kit.sheet({title:t('history'), body:html`<div class="skel" style="height:72px"></div>`});
    const r = await api('getMyOrders');
    const list = r.orders || [];
    const stl = s=> ({new:'pill-accent', preparing:'pill-warn', ready:'pill-ok', done:'pill-muted', cancelled:'pill-muted'})[s];
    const stt = (o)=> o.status === 'ready' ? (o.type === 'pickup' ? t('st_ready_p') : t('st_ready_d')) : o.status === 'done' ? (o.type === 'pickup' ? t('st_done_p') : t('st_done_d')) : t('st_' + o.status);
    sh.body.innerHTML = list.length ? html`<div class="list">${list.map(o=>html`<button class="row" type="button" data-o="${o.id}"><span class="row-main"><span class="row-title">№ ${o.num} · ${money(o.total)}</span><span class="row-sub">${Kit.date.label(o.createdAt.slice(0, 10))}, ${new Date(o.createdAt).toTimeString().slice(0, 5)} · ${o.lines.map(l=>lang === 'cn' && l.cn ? l.cn : l.n.split(' (')[0]).join(', ')}</span></span><span class="row-end"><span class="pill ${stl(o.status)}">${stt(o)}</span></span></button>`)}</div>`
      : html`<div class="empty">${icon('receipt')}<div class="empty-title">${t('noHistory')}</div></div>`;
    Kit.on(sh.body, 'click', '[data-o]', (e, el)=>{ const o = list.find(x=>x.id === el.dataset.o); sh.close(); setTimeout(()=>showOrder(o, false), 280); });
  });

  async function load(){
    const r = await api('getMenu');
    if(r.ok){ S.cats = r.categories; S.items = r.items; S.cfg = r.config; S.cart = S.cart.filter(l=>{ const it = item(l.itemId); return it && it.inStock; }); }
    renderMenu();
  }
  applyLang(); updateDot(); renderMenu(); load();
})();
</script>
</body>
</html>
