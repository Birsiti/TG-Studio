<body data-role="logist">
<div class="app has-tabbar">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" id="mark"></div><div class="brand-text"><span class="brand-name">Милано</span><span class="brand-role">Логист</span></div></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="Обновить"></button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button>
    </div>
  </header>
  <div id="modeNote"></div>



  <section data-panel="pick" hidden>
    <div class="page-head"><h1 class="page-title">Заявки</h1><p class="page-sub">Заявки магазинов по маршрутам: загрузить из файла, проверить сборку, отдать маршрут в рейс</p></div>

    <div class="section" id="pkNote"></div>
    <div id="pkList"></div>
    <button class="add-tile section" type="button" id="pkAdd"></button>
  </section>

  <section data-panel="trips" hidden>
    <div class="page-head"><h1 class="page-title">Рейсы</h1><p class="page-sub">Сборка → отгрузка → приёмка возврата</p></div>

  </section>



</div>
