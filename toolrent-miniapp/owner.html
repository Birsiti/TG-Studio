<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Прокат-Инструмент — владелец</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../kit/core.js"></script>
<link rel="stylesheet" href="../kit/base.css">
<link rel="stylesheet" href="brand.css">
<script src="tools.js"></script>
<script src="mock.js"></script>
</head>
<body>
<div class="app has-tabbar">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" id="mark"></div>
      <div class="brand-text"><span class="brand-name" data-fit="13">Прокат-Инструмент</span><span class="brand-role">Владелец</span></div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="csvBtn" type="button" aria-label="Выгрузить CSV"></button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button>
    </div>
  </header>

  <section data-panel="overview" hidden>
    <div class="page-head"><h1 class="page-title">Выручка</h1><p class="page-sub" id="ovSub"></p></div>
    <div class="seg" id="period"><button type="button" data-p="today">День</button><button type="button" data-p="week" class="is-on">Неделя</button><button type="button" data-p="month">Месяц</button><button type="button" data-p="d30">30 дней</button></div>
    <div class="section yard" id="hero" style="padding:18px 16px"></div>
    <div class="stats section" id="kpi"></div>
    <div class="card section"><div class="section-head"><h2 class="section-title">По дням</h2></div><div id="chart"></div></div>
    <div class="card section"><div class="section-head"><h2 class="section-title">Топ инструмента</h2></div><div id="topM"></div></div>
    <div class="card section"><div class="section-head"><h2 class="section-title">Постоянные клиенты</h2></div><div id="topC"></div></div>
  </section>

  <section data-panel="util" hidden>
    <div class="page-head"><h1 class="page-title">Загрузка</h1><p class="page-sub">Доля дней в аренде за 30 дней — что докупить, что продать</p></div>
    <div id="util"></div>
    <div class="section"><div class="section-head"><h2 class="section-title">Ремонт</h2></div><div id="repairs"></div></div>
  </section>

  <section data-panel="debts" hidden>
    <div class="page-head"><h1 class="page-title">Долги</h1><p class="page-sub">Инструмент не вернули в срок</p></div>
    <div id="debtTotal"></div>
    <div class="section" id="debts"></div>
  </section>

  <section data-panel="catalog" hidden>
    <div class="page-head"><h1 class="page-title">Каталог</h1><p class="page-sub">Цены, описания и фото, которые видит клиент</p></div>
    <div id="catalog"></div>
    <button class="add-tile section" type="button" id="addModel"></button>
  </section>
</div>

<nav class="tabbar"><div class="tabbar-inner">
  <button type="button" data-tab="overview"><span data-ic="chart"></span>Обзор</button>
  <button type="button" data-tab="util"><span data-ic="gauge"></span>Загрузка</button>
  <button type="button" data-tab="debts"><span data-ic="alert"></span>Долги</button>
  <button type="button" data-tab="catalog"><span data-ic="tag"></span>Каталог</button>
</div></nav>

<script>
(function(){
  "use strict";
  const {html, icon, $, $$, date: D, money, num, haptic} = Kit;
  const api = Kit.createApi({bot:'toolrent', mock: window.ToolrentMock});
  $('#mark').innerHTML = icon('wrench');
  $('#csvBtn').innerHTML = icon('download');
  $('#addModel').innerHTML = html`${icon('plus')}Новый инструмент`;
  $$('[data-ic]').forEach(el=> el.outerHTML = String(icon(el.dataset.ic)));

  /* ============ ОБЗОР ============ */
  let period = 'week';
  function range(){
    const t = D.today();
    return {today:[t, t], week:[D.add(t, -6), t], month:[t.slice(0, 8) + '01', t], d30:[D.add(t, -29), t]}[period];
  }
  async function renderOverview(){
    const [from, to] = range();
    $('#ovSub').textContent = from === to ? D.long(from) : D.long(from) + ' — ' + D.long(to);
    $('#hero').innerHTML = '<div class="skel" style="height:96px;opacity:.2"></div>';
    const r = await api('getOverview', period === 'week' ? {} : {from, to});
    if(!r.ok){ Kit.toast('Не удалось загрузить', 'error'); return; }
    const d = r.data, s = period === 'week' ? d.week : d.custom;
    const delta = period === 'week' && d.prevWeek.revenue ? Math.round((s.revenue - d.prevWeek.revenue) / d.prevWeek.revenue * 100) : null;
    $('#hero').innerHTML = html`<div class="eyebrow" style="color:#FFC20E">Выручка</div>
      <div style="font-family:var(--font-mono);font-weight:600;font-size:38px;line-height:1.1;margin-top:6px;position:relative;z-index:1" data-fit="22">${money(Math.round(s.revenue))}</div>
      <p style="margin-top:6px">${delta == null ? s.count + ' ' + Kit.plural(s.count, 'выдача', 'выдачи', 'выдач') : (delta >= 0 ? '+' : '−') + Math.abs(delta) + '% к прошлой неделе'}</p>`;
    const share = s.revenue ? Math.round(s.delivery / s.revenue * 100) : 0;
    $('#kpi').innerHTML = html`
      <div class="stat"><div class="stat-label">Выдач</div><div class="stat-value">${s.count}</div></div>
      <div class="stat"><div class="stat-label">Средний чек</div><div class="stat-value" data-fit="16">${money(s.avg)}</div></div>
      <div class="stat"><div class="stat-label">Самовывоз</div><div class="stat-value" data-fit="16">${money(Math.round(s.pickup))}</div></div>
      <div class="stat"><div class="stat-label">С доставкой</div><div class="stat-value" data-fit="16">${money(Math.round(s.delivery))}</div><div class="stat-delta hint">${share}% выручки</div></div>`;
    $('#chart').innerHTML = d.week7.length > 1 ? Kit.chart.bars(d.week7.map(x=>({label:x.day, value:x.revenue})), {highlightLast:true}) : html`<div class="empty-mini">За один день график не строится</div>`;
    $('#topM').innerHTML = Kit.chart.rank(d.topModels.map(x=>({name:x.name, value:x.revenue, note:x.bookings + ' ' + Kit.plural(x.bookings, 'выдача', 'выдачи', 'выдач')})), {format:money});
    $('#topC').innerHTML = d.topClients.length ? html`<div class="list" style="box-shadow:none">${d.topClients.map(c=>html`<div class="row"><span class="avatar">${Kit.initials(c.name.replace(/[«»"]/g, ''))}</span><span class="row-main"><span class="row-title">${c.name}</span><span class="row-sub">${c.bookings} ${Kit.plural(c.bookings, 'аренда', 'аренды', 'аренд')}</span></span><span class="mono" style="font-weight:600">${money(c.revenue)}</span></div>`)}</div>` : html`<div class="empty-mini">Пока нет данных</div>`;
  }
  Kit.on($('#period'), 'click', '[data-p]', (e, el)=>{ period = el.dataset.p; haptic('select'); $$('#period button').forEach(b=>b.classList.toggle('is-on', b === el)); renderOverview(); });
  $('#csvBtn').addEventListener('click', async ()=>{
    const [from, to] = range();
    const r = await api('getBookingsForExport', {from, to});
    Kit.csv('prokat-' + from + '_' + to + '.csv', [['№','Инструмент','Клиент','Телефон','С','По','Суток','Получение','Сумма','Статус']]
      .concat((r.bookings || []).map(b=>[b.num, b.model, b.client, b.phone, b.from, b.to, b.days, b.method === 'pickup' ? 'Самовывоз' : 'Доставка', b.total, (Tools.STATUS[b.status] || [b.status])[0]])));
  });

  /* ============ ЗАГРУЗКА ============ */
  async function renderUtil(){
    const r = await api('getUtilization');
    $('#util').innerHTML = html`<div class="list">${(r.list || []).map(u=>html`<div class="row" style="display:block">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline"><b>${Kit.nobr(u.name)}</b><span class="mono" style="font-weight:600;font-size:18px">${u.pct}%</span></div>
      <div class="meter"><i class="${u.pct >= 60 ? 'hi' : u.pct < 20 ? 'lo' : ''}" style="width:${Math.max(2, u.pct)}%"></i></div>
      <div class="hint" style="margin-top:6px">${u.totalQty} шт · ${money(u.revenue)} за 30 дней${u.pct >= 70 ? ' · стоит докупить' : u.pct < 15 ? ' · простаивает' : ''}</div></div>`)}</div>`;
    const rep = r.repairs || [];
    $('#repairs').innerHTML = rep.length ? html`<div class="list">${rep.map(x=>html`<div class="row"><span class="row-icon">${icon('wrench')}</span><span class="row-main"><span class="row-title">${Kit.nobr(x.model)} · ${x.unit}</span><span class="row-sub">${x.note} · с ${D.label(x.date)}${x.closed ? ' по ' + D.label(x.closed) : ''}</span></span><span class="row-end"><span class="pill ${x.status === 'fixed' ? 'pill-ok' : 'pill-warn'}">${x.status === 'fixed' ? 'Исправлен' : 'В ремонте'}</span></span></div>`)}</div>` : html`<div class="empty-mini">Ремонтов не было</div>`;
  }

  /* ============ ДОЛГИ ============ */
  async function renderDebts(){
    const r = await api('getOverdue');
    const list = r.list || [];
    const sum = list.reduce((a, b)=>a + b.debt, 0);
    $('#debtTotal').innerHTML = html`<div class="stats"><div class="stat"><div class="stat-label">Должников</div><div class="stat-value" style="${list.length ? 'color:var(--danger)' : ''}">${list.length}</div></div><div class="stat"><div class="stat-label">Набегает</div><div class="stat-value" data-fit="16">${money(sum)}</div></div></div>`;
    $('#debts').innerHTML = list.length ? html`${list.map(b=>html`<div class="card section" style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;gap:12px"><b>${b.client}</b><span class="pill pill-danger">+${b.daysLate} дн.</span></div>
      <div class="hint" style="margin-top:4px">${Kit.nobr(b.model)}${b.unitNum ? ' · №' + b.unitNum : ''} · должен был вернуть ${D.long(b.to)}</div>
      <div class="kv" style="margin-top:8px"><span class="k">Долг (${b.daysLate} × ${num(b.dailyPrice)})</span><span class="v mono">${money(b.debt)}</span></div>
      ${b.nudgedAt ? html`<p class="hint">Напоминали ${D.label(b.nudgedAt.slice(0, 10)).toLowerCase()}</p>` : ''}
      <div class="btn-row" style="margin-top:12px"><a class="btn btn-ghost" href="tel:${b.phone}">${icon('phone')}Позвонить</a><button class="btn btn-primary" type="button" data-nudge="${b.id}">${icon('bell')}Напомнить</button></div>
    </div>`)}` : html`<div class="empty">${icon('check')}<div class="empty-title">Долгов нет</div>Все вернули вовремя</div>`;
  }
  Kit.on($('#debts'), 'click', '[data-nudge]', async (e, el)=>{
    Kit.busy(el, true);
    const r = await api('nudgeClient', {id:el.dataset.nudge});
    Kit.busy(el, false);
    if(!r.ok){ Kit.toast('Не удалось', 'error'); return; }
    Kit.toast('Напоминание отправлено клиенту', 'ok'); renderDebts();
  });

  /* ============ КАТАЛОГ ============ */
  let CAT = {models:[], categories:[], icons:[]};
  async function renderCatalog(){
    CAT = await api('getCatalog');
    $('#catalog').innerHTML = html`<div class="list">${CAT.models.map(m=>html`<button class="row" type="button" data-m="${m.id}">
      <span style="width:40px;flex:none${m.active ? '' : ';opacity:.4'}">${Tools.art(m.icon)}</span>
      <span class="row-main"><span class="row-title">${Kit.nobr(m.name)}</span><span class="row-sub">${m.catName} · ${m.totalQty} шт · залог ${money(m.deposit)}</span></span>
      <span class="row-end"><span class="mono" style="font-weight:700">${money(m.price)}</span>${m.active ? '' : html`<span class="pill pill-muted">скрыт</span>`}</span></button>`)}</div>`;
  }
  Kit.on($('#catalog'), 'click', '[data-m]', (e, el)=> openModel(CAT.models.find(m=>m.id === el.dataset.m)));
  $('#addModel').addEventListener('click', ()=> openModel(null));
  function openModel(m){
    const isNew = !m;
    m = m || {name:'', cat:(CAT.categories[0] || {}).id, price:'', deposit:'', specs:'', description:'', photoUrl:'', icon:'drill', active:true};
    let cat = m.cat, ic = m.icon;
    const sh = Kit.sheet({title:isNew ? 'Новый инструмент' : 'Карточка', body: html`
      <label class="field"><span class="field-label">Название</span><input class="input" id="mName" maxlength="80" value="${m.name}"></label>
      <div class="field"><span class="field-label">Категория</span><div class="chips" id="mCat">${CAT.categories.map(c=>html`<button type="button" class="chip${c.id === cat ? ' is-on' : ''}" data-v="${c.id}">${c.name}</button>`)}</div></div>
      <div class="field"><span class="field-label">Иконка</span><div class="units" id="mIcon" style="grid-template-columns:repeat(5,minmax(0,1fr))">${CAT.icons.map(i=>html`<button type="button" class="unit${i === ic ? ' is-on' : ''}" data-v="${i}" style="padding:6px;min-height:52px">${Tools.art(i)}</button>`)}</div></div>
      <div class="field-row"><label class="field"><span class="field-label">Цена/сутки</span><input class="input mono" id="mPrice" inputmode="decimal" value="${m.price}"></label><label class="field"><span class="field-label">Залог</span><input class="input mono" id="mDep" inputmode="decimal" value="${m.deposit}"></label></div>
      <label class="field"><span class="field-label">Характеристики</span><input class="input" id="mSpecs" maxlength="120" value="${m.specs}" placeholder="800 Вт · SDS-plus · 2,7 кг"></label>
      <label class="field"><span class="field-label">Описание</span><textarea class="textarea" id="mDesc" rows="4" maxlength="600">${m.description}</textarea></label>
      <label class="field"><span class="field-label">Фото (https-ссылка)</span><input class="input" id="mPhoto" maxlength="300" value="${m.photoUrl}" placeholder="https://…"></label>
      ${isNew ? '' : html`<label class="row" style="padding:0;border:0"><span class="row-main"><span class="row-title">Показывать в каталоге</span></span><span class="switch"><input type="checkbox" id="mAct" ${m.active ? Kit.raw('checked') : ''}><span></span></span></label>`}`,
      actions: html`<button class="btn btn-primary" type="button" data-save>Сохранить</button>`});
    Kit.on(sh.$('#mCat'), 'click', '[data-v]', (e, el)=>{ cat = el.dataset.v; sh.el.querySelectorAll('#mCat .chip').forEach(x=>x.classList.toggle('is-on', x === el)); });
    Kit.on(sh.$('#mIcon'), 'click', '[data-v]', (e, el)=>{ ic = el.dataset.v; sh.el.querySelectorAll('#mIcon .unit').forEach(x=>x.classList.toggle('is-on', x === el)); haptic('select'); });
    sh.$('[data-save]').addEventListener('click', async ()=>{
      const price = Number(String(sh.$('#mPrice').value).replace(',', '.')), deposit = Number(String(sh.$('#mDep').value).replace(',', '.')) || 0;
      const name = sh.$('#mName').value.trim(), photo = sh.$('#mPhoto').value.trim();
      if(name.length < 3 || !(price > 0)){ Kit.toast('Название и цена обязательны', 'error'); return; }
      if(photo && !/^https:\/\//.test(photo)){ Kit.toast('Фото — только https-ссылка', 'error'); return; }
      Kit.busy(sh.$('[data-save]'), true);
      const r = await api('updateModel', {modelId:m.id, name, cat, icon:ic, price, deposit, specs:sh.$('#mSpecs').value.trim(), description:sh.$('#mDesc').value.trim(), photoUrl:photo});
      if(r.ok && !isNew && sh.$('#mAct').checked !== m.active) await api('setModelActive', {modelId:m.id, active:sh.$('#mAct').checked});
      Kit.busy(sh.$('[data-save]'), false);
      if(!r.ok){ Kit.toast(r.message || 'Не удалось сохранить', 'error'); return; }
      sh.close(); Kit.toast(isNew ? 'Инструмент добавлен в каталог' : 'Сохранено', 'ok'); renderCatalog();
    });
  }

  const RENDER = {overview:renderOverview, util:renderUtil, debts:renderDebts, catalog:renderCatalog};
  Kit.tabs({onChange:(t)=>{ $('#csvBtn').hidden = t !== 'overview'; RENDER[t](); }});
})();
</script>
</body>
</html>
