<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Прокат-Инструмент — аренда</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../kit/core.js"></script>
<link rel="stylesheet" href="../kit/base.css">
<link rel="stylesheet" href="brand.css">
<script src="tools.js"></script>
<script src="mock.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" id="mark"></div>
      <div class="brand-text"><span class="brand-name" data-fit="13">Прокат-Инструмент</span><span class="brand-role">Минск · 9:00–19:00</span></div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="myBtn" type="button" aria-label="Мои брони"><span id="myIc"></span><span class="dot-badge" id="myDot" hidden></span></button>
      <a class="icon-btn" id="callBtn" href="tel:+375291234567" aria-label="Позвонить"></a>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button>
    </div>
  </header>
  <main id="view"></main>
</div>
<div class="actionbar" id="bar" hidden>
  <div class="actionbar-inner">
    <div class="total"><div class="total-label" id="barLabel">Итого</div><div class="total-value" id="barValue" data-fit="14">—</div></div>
    <button class="btn btn-primary" id="barBtn" type="button">Далее</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  const {html, icon, $, $$, date: D, money, haptic} = Kit;
  const api = Kit.createApi({bot:'toolrent', mock: window.ToolrentMock});
  $('#mark').innerHTML = icon('wrench');
  $('#myIc').innerHTML = icon('clipboard');
  $('#callBtn').innerHTML = icon('phone');

  const S = {cats:[], models:[], config:null, cat:'all', w:null, prof:{name:Kit.user.firstName ? (Kit.user.firstName + ' ' + Kit.user.lastName).trim() : '', phone:'', idDoc:''}};
  const view = $('#view'), bar = $('#bar'), barBtn = $('#barBtn');
  const app = $('#app');

  /* ============ КАТАЛОГ ============ */
  function freeBadge(m){
    if(m.freeToday <= 0) return html`<span class="tool-free none">нет сегодня</span>`;
    if(m.freeToday === 1) return html`<span class="tool-free last">последний</span>`;
    return html`<span class="tool-free">${m.freeToday} из ${m.totalQty}</span>`;
  }
  function renderCatalog(){
    bar.hidden = true; app.classList.remove('has-actionbar');
    const list = S.models.filter(m=>S.cat === 'all' || m.cat === S.cat);
    view.innerHTML = html`<div class="screen">
      <section class="yard">
        <div class="eyebrow" style="color:#FFC20E">Аренда от 1 суток</div>
        <h1>Инструмент на&nbsp;объект без покупки</h1>
        <p>Бронь за минуту, выдача на складе или доставка по Минску.</p>
        <div class="facts"><span><b>−10%</b> от 3 суток</span><span><b>−20%</b> от 7 суток</span></div>
      </section>
      <div class="chips scroll section" id="cats">
        <button type="button" class="chip${S.cat === 'all' ? ' is-on' : ''}" data-cat="all">Все</button>
        ${S.cats.map(c=>html`<button type="button" class="chip${S.cat === c.id ? ' is-on' : ''}" data-cat="${c.id}">${c.name}</button>`)}
      </div>
      <div class="tools section" id="tools">${S.models.length ? list.map(m=>html`<button type="button" class="tool" data-m="${m.id}">
          <span class="tool-art">${Tools.art(m.icon)}</span>
          <span class="tool-name">${Kit.nobr(m.name)}</span>
          <span class="tool-specs">${m.specs}</span>
          <span class="tool-foot"><span class="tool-price">${Kit.num(m.price)}<small> BYN/сут</small></span>${freeBadge(m)}</span>
        </button>`) : Array.from({length:4}, ()=>html`<div class="skel" style="height:208px"></div>`)}</div>
      <div class="section card" style="display:flex;gap:12px;align-items:center">
        <span class="row-icon">${icon('truck')}</span>
        <div><b>Доставка по Минску</b><div class="hint">от 15 BYN в пределах МКАД, заберём обратно курьером</div></div>
      </div>
    </div>`;
  }
  Kit.on(view, 'click', '[data-cat]', (e, el)=>{ S.cat = el.dataset.cat; haptic('select'); renderCatalog(); });
  Kit.on(view, 'click', '[data-m]', (e, el)=> openDetail(S.models.find(m=>m.id === el.dataset.m)));

  function openDetail(m){
    if(!m) return;
    const sh = Kit.sheet({title:m.name, sub:m.specs, body: html`
      <div class="detail-art">${m.photoUrl ? html`<img src="${m.photoUrl}" alt="" loading="lazy">` : Tools.art(m.icon)}<div class="hazard-strip"></div></div>
      <div class="spec-grid">
        <div class="spec"><div class="k">Сутки</div><div class="v">${money(m.price)}</div></div>
        <div class="spec"><div class="k">Залог</div><div class="v">${money(m.deposit)}</div></div>
        <div class="spec"><div class="k">3+ суток</div><div class="v">${money(Math.round(m.price * 0.9 * 10) / 10)}</div></div>
        <div class="spec"><div class="k">Сегодня</div><div class="v">${m.freeToday} из ${m.totalQty}</div></div>
      </div>
      <p style="margin-top:16px;line-height:1.55">${m.description}</p>
      <p class="hint" style="margin-top:12px">Залог возвращается при сдаче инструмента в исправном состоянии. Оплата аренды — при получении.</p>`,
      actions: html`<button class="btn btn-primary" type="button" data-book>${icon('calendar')}Забронировать</button>`});
    sh.$('[data-book]').addEventListener('click', ()=>{ sh.close(); startWizard(m); });
  }

  /* ============ ВИЗАРД ============ */
  const STEPS = ['Даты','Получение','Контакты','Проверка'];
  function startWizard(m){
    S.w = {model:m, step:1, from:D.today(), to:D.add(D.today(), 1), free:null, method:'pickup', zone:'z1', address:'', slot:'', returnMethod:'self',
      name:S.prof.name, phone:S.prof.phone, idDoc:S.prof.idDoc, quote:null, booking:null};
    Kit.back.push(wizBack);
    renderStep();
  }
  function wizBack(){
    const w = S.w; if(!w) return;
    if(w.step > 1 && w.step < 5){ w.step--; renderStep(); return; }
    exitWizard();
  }
  function exitWizard(){ Kit.back.pop(wizBack); S.w = null; renderCatalog(); window.scrollTo(0, 0); }

  function wizHead(){
    const w = S.w;
    return html`<div class="wiz-head"><button class="icon-btn" type="button" id="wizX" aria-label="Назад">${icon('left')}</button><div class="eyebrow">Шаг ${w.step} из 4 · ${STEPS[w.step - 1]}</div></div>
      <div class="wiz-tool">${Tools.art(w.model.icon)}<div style="min-width:0"><b style="display:block">${w.model.name}</b><span class="hint mono">${money(w.model.price)} / сутки · залог ${money(w.model.deposit)}</span></div></div>
      <div class="leds">${STEPS.map((s, i)=>html`<i class="${i + 1 < w.step ? 'is-done' : i + 1 === w.step ? 'is-cur' : ''}"></i>`)}</div>`;
  }
  function renderStep(){
    const w = S.w;
    window.scrollTo(0, 0);
    if(w.step === 5) return renderTicket();
    bar.hidden = false; app.classList.add('has-actionbar');
    const body = [null, stepDates, stepMethod, stepContacts, stepReview][w.step]();
    view.innerHTML = html`<div class="screen">${wizHead()}<div class="section">${body}</div></div>`;
    $('#wizX').addEventListener('click', wizBack);
    [null, bindDates, bindMethod, bindContacts, bindReview][w.step]();
    updateBar();
  }
  function localQuote(){
    const w = S.w, n = Math.max(1, D.diff(w.from, w.to) + 1), rent = w.model.price * n;
    let pct = 0; (S.config ? S.config.discounts : []).forEach(d=>{ if(n >= d.days) pct = d.pct; });
    let fee = 0;
    if(w.method === 'delivery' && S.config){ const z = S.config.deliveryZones.find(x=>x.id === w.zone) || S.config.deliveryZones[0]; fee = z.fee * (w.returnMethod === 'courier' ? 2 : 1); }
    return {days:n, total:Math.round((rent - rent * pct / 100 + fee) * 100) / 100};
  }
  function updateBar(){
    const w = S.w; if(!w || w.step > 4) return;
    let ok = false;
    if(w.step === 1) ok = w.from && w.to && w.to >= w.from && w.free > 0;
    if(w.step === 2) ok = w.method === 'pickup' || (w.address.trim().length >= 5 && !!w.slot);
    if(w.step === 3) ok = w.name.trim().length >= 3 && Kit.phone.valid($('#fPhone') || {value:''}) && w.idDoc.trim().length >= 4;
    if(w.step === 4) ok = !!w.quote;
    const q = w.quote && w.step === 4 ? w.quote : localQuote();
    $('#barLabel').textContent = q.days + ' ' + Kit.plural(q.days, 'сутки', 'суток', 'суток');
    $('#barValue').textContent = money(q.total);
    barBtn.textContent = w.step === 4 ? 'Оформить бронь' : 'Далее';
    barBtn.disabled = !ok;
  }
  barBtn.addEventListener('click', ()=>{
    const w = S.w; if(!w) return;
    if(w.step < 4){ haptic('light'); w.step++; renderStep(); }
    else submit();
  });

  // шаг 1
  function stepDates(){
    const w = S.w;
    return html`<h1 class="page-title">На какие даты?</h1>
      <div class="chips" id="quick" style="margin-top:14px">${[1, 2, 3, 7].map(n=>html`<button type="button" class="chip${D.diff(w.from, w.to) + 1 === n ? ' is-on' : ''}" data-n="${n}">${n} ${Kit.plural(n, 'сутки', 'суток', 'суток')}</button>`)}</div>
      <div class="field-row section">
        <label class="field"><span class="field-label">Выдача</span><input class="input" type="date" id="dFrom" min="${D.today()}" value="${w.from}"></label>
        <label class="field"><span class="field-label">Возврат</span><input class="input" type="date" id="dTo" min="${w.from}" value="${w.to}"></label>
      </div>
      <div id="avail"></div>
      <p class="hint" style="margin-top:12px">Сутки считаются с даты выдачи по дату возврата включительно. Вернуть можно до 19:00.</p>`;
  }
  function bindDates(){
    const w = S.w;
    $('#dFrom').addEventListener('change', e=>{ w.from = e.target.value; $('#dTo').min = w.from; if(w.to < w.from){ w.to = w.from; $('#dTo').value = w.to; } check(); });
    $('#dTo').addEventListener('change', e=>{ w.to = e.target.value; check(); });
    Kit.on($('#quick'), 'click', '[data-n]', (e, el)=>{ w.to = D.add(w.from, +el.dataset.n - 1); $('#dTo').value = w.to; haptic('select'); check(); });
    check();
  }
  async function check(){
    const w = S.w, box = $('#avail');
    $$('#quick .chip').forEach(c=>c.classList.toggle('is-on', D.diff(w.from, w.to) + 1 === +c.dataset.n));
    w.free = null; updateBar();
    if(!w.from || !w.to || w.to < w.from){ box.innerHTML = html`<div class="avail bad">${icon('alert')}Дата возврата раньше выдачи</div>`; return; }
    box.innerHTML = html`<div class="avail warn">${icon('clock')}Проверяем остаток…</div>`;
    const key = w.from + w.to;
    const r = await api('checkAvailability', {modelId:w.model.id, from:w.from, to:w.to});
    if(!S.w || w.from + w.to !== key) return;
    if(!r.ok){ box.innerHTML = html`<div class="avail bad">${icon('alert')}${r.message || 'Проверьте даты'}</div>`; return; }
    w.free = r.free;
    box.innerHTML = r.free <= 0 ? html`<div class="avail bad">${icon('alert')}На эти даты всё занято</div>`
      : r.free === 1 ? html`<div class="avail warn">${icon('info')}Остался последний экземпляр</div>`
      : html`<div class="avail">${icon('check')}Свободно ${r.free} из ${r.total}</div>`;
    updateBar();
  }

  // шаг 2
  function stepMethod(){
    const w = S.w, c = S.config || {pickupPoints:[{name:'Склад'}], deliveryZones:[], deliverySlots:[]};
    return html`<h1 class="page-title">Как получите?</h1>
      <div class="section">
        <button type="button" class="option${w.method === 'pickup' ? ' is-on' : ''}" data-method="pickup"><span class="row-icon">${icon('home')}</span><span><span class="option-title">Самовывоз — бесплатно</span><span class="option-sub">${c.pickupPoints[0].name} · ${c.pickupPoints[0].hours || ''}</span></span></button>
        <button type="button" class="option${w.method === 'delivery' ? ' is-on' : ''}" data-method="delivery"><span class="row-icon">${icon('truck')}</span><span><span class="option-title">Доставка</span><span class="option-sub">По Минску и области, от ${c.deliveryZones[0] ? c.deliveryZones[0].fee : 15} BYN</span></span></button>
      </div>
      ${w.method === 'delivery' ? html`<div class="section">
        <span class="field-label">Зона</span>
        <div class="seg" id="zone">${c.deliveryZones.map(z=>html`<button type="button" data-z="${z.id}" class="${w.zone === z.id ? 'is-on' : ''}">${z.name.replace('В пределах ', '')} · ${z.fee}</button>`)}</div>
        <label class="field" style="margin-top:14px"><span class="field-label">Адрес</span><textarea class="textarea" id="addr" rows="2" maxlength="160" placeholder="Улица, дом, подъезд, этаж">${w.address}</textarea></label>
        <span class="field-label">Когда привезти</span>
        <div class="chips" id="slot">${c.deliverySlots.map(s=>html`<button type="button" class="chip${w.slot === s.id ? ' is-on' : ''}" data-s="${s.id}">${s.name} · ${s.time}</button>`)}</div>
        <span class="field-label" style="margin-top:16px">Возврат</span>
        <div class="seg" id="ret"><button type="button" data-r="self" class="${w.returnMethod === 'self' ? 'is-on' : ''}">Привезу сам</button><button type="button" data-r="courier" class="${w.returnMethod === 'courier' ? 'is-on' : ''}">Заберёт курьер</button></div>
      </div>` : ''}`;
  }
  Kit.on(view, 'click', '[data-method]', (e, el)=>{ const w = S.w; if(!w || w.step !== 2) return; w.method = el.dataset.method; haptic('select'); renderStep(); });
  function bindMethod(){
    const w = S.w;
    if(w.method !== 'delivery') return;
    Kit.on($('#zone'), 'click', '[data-z]', (e, el)=>{ w.zone = el.dataset.z; $$('#zone button').forEach(b=>b.classList.toggle('is-on', b === el)); haptic('select'); updateBar(); });
    Kit.on($('#slot'), 'click', '[data-s]', (e, el)=>{ w.slot = el.dataset.s; $$('#slot .chip').forEach(b=>b.classList.toggle('is-on', b === el)); haptic('select'); updateBar(); });
    Kit.on($('#ret'), 'click', '[data-r]', (e, el)=>{ w.returnMethod = el.dataset.r; $$('#ret button').forEach(b=>b.classList.toggle('is-on', b === el)); haptic('select'); updateBar(); });
    $('#addr').addEventListener('input', e=>{ w.address = e.target.value; updateBar(); });
  }

  // шаг 3
  function stepContacts(){
    const w = S.w;
    return html`<h1 class="page-title">Данные для договора</h1>
      <label class="field section"><span class="field-label">Имя и фамилия</span><input class="input" id="fName" maxlength="80" autocomplete="name" placeholder="Иван Петров" value="${w.name}"></label>
      <div class="field"><span class="field-label">Телефон</span>${Kit.phone.field('fPhone', w.phone)}</div>
      <label class="field"><span class="field-label">Паспорт: серия и номер</span><input class="input mono" id="fDoc" maxlength="20" autocapitalize="characters" placeholder="MP1234567" value="${w.idDoc}"></label>
      <p class="hint">${icon('shield', 'ic-inline')} Паспорт нужен только для договора аренды, показывайте оригинал при получении.</p>`;
  }
  function bindContacts(){
    const w = S.w, ph = $('#fPhone');
    Kit.phone.bind(ph);
    $('#fName').addEventListener('input', e=>{ w.name = e.target.value; updateBar(); });
    ph.addEventListener('input', ()=>{ w.phone = Kit.phone.value(ph); updateBar(); });
    $('#fDoc').addEventListener('input', e=>{ w.idDoc = e.target.value.toUpperCase(); updateBar(); });
  }

  // шаг 4 — расчёт делает сервер
  function stepReview(){
    return html`<h1 class="page-title">Проверьте бронь</h1><div class="section" id="receipt"><div class="skel" style="height:240px"></div></div>`;
  }
  async function bindReview(){
    const w = S.w;
    w.quote = null; updateBar();
    const r = await api('quote', {modelId:w.model.id, from:w.from, to:w.to, method:w.method, zone:w.zone, returnMethod:w.returnMethod});
    if(!S.w || w.step !== 4) return;
    if(!r.ok){ $('#receipt').innerHTML = html`<div class="avail bad">${icon('alert')}${r.message || 'Не удалось посчитать'}</div>`; return; }
    const q = w.quote = r.quote;
    const slot = S.config && w.slot ? S.config.deliverySlots.find(s=>s.id === w.slot) : null;
    $('#receipt').innerHTML = html`<div class="receipt">
      <div class="kv"><span class="k">Период</span><span class="v">${D.label(w.from)} — ${D.label(w.to)}</span></div>
      <div class="kv"><span class="k">Получение</span><span class="v">${w.method === 'pickup' ? 'Самовывоз' : 'Доставка' + (slot ? ', ' + slot.name.toLowerCase() : '')}</span></div>
      ${w.method === 'delivery' ? html`<div class="kv"><span class="k">Адрес</span><span class="v">${w.address}</span></div>` : ''}
      <div class="kv"><span class="k">Арендатор</span><span class="v">${w.name}</span></div>
      <div class="kv"><span class="k">Аренда ${q.days} × ${Kit.num(w.model.price)}</span><span class="v">${money(q.rent)}</span></div>
      ${q.discount ? html`<div class="kv"><span class="k">Скидка ${q.discountPct}%</span><span class="v" style="color:var(--ok)">−${money(q.discount)}</span></div>` : ''}
      ${q.deliveryFee ? html`<div class="kv"><span class="k">Доставка${w.returnMethod === 'courier' ? ' и возврат' : ''}</span><span class="v">${money(q.deliveryFee)}</span></div>` : ''}
      <div class="receipt-total"><span>Итого</span><b>${money(q.total)}</b></div>
    </div>
    <p class="hint" style="margin-top:12px">Плюс залог ${money(q.deposit)} — вернём при сдаче. Оплата при получении наличными или картой.</p>`;
    updateBar();
  }

  async function submit(){
    const w = S.w;
    Kit.busy(barBtn, true);
    const r = await api('createBooking', {modelId:w.model.id, from:w.from, to:w.to, method:w.method, zone:w.zone, address:w.address, slot:w.slot,
      returnMethod:w.returnMethod, name:w.name.trim(), phone:w.phone, idDoc:w.idDoc.trim()});
    Kit.busy(barBtn, false);
    if(!r.ok){
      if(r.error === 'unavailable'){ Kit.toast('Пока вы оформляли, инструмент забронировали — выберите другие даты', 'error'); w.step = 1; renderStep(); }
      else Kit.toast(r.message || 'Не получилось оформить бронь', 'error');
      return;
    }
    haptic('success');
    S.prof = {name:w.name, phone:w.phone, idDoc:w.idDoc};
    try{ localStorage.setItem('toolrent-prof', JSON.stringify(S.prof)); localStorage.setItem('toolrent-unseen', '1'); }catch(e){}
    updateDot();
    w.booking = r.booking; w.step = 5; renderStep();
    loadModels();
  }

  /* ============ БИЛЕТ ============ */
  function timeline(b){
    const steps = [['Бронь принята', b.createdAt], ['Выдан', b.issuedAt], ['Возвращён', b.returnedAt]];
    if(b.status === 'cancelled') return html`<ul class="timeline"><li class="done">Бронь принята</li><li class="bad">Отменена</li></ul>`;
    const cur = b.status === 'pending' ? 1 : (b.status === 'active' || b.status === 'overdue') ? 2 : 3;
    return html`<ul class="timeline">${steps.map((s, i)=>html`<li class="${i < cur - 1 ? 'done' : i === cur - 1 ? (b.status === 'overdue' ? 'bad' : b.status === 'returned' ? 'done' : 'cur') : ''}">${s[0]}${i === 1 && b.status === 'overdue' ? ' · просрочен на ' + b.daysLate + ' дн.' : ''}<small>${i === 0 ? D.long(b.createdAt.slice(0, 10)) : i === 1 ? (s[1] ? D.long(s[1].slice(0, 10)) : 'план — ' + D.long(b.from)) : (s[1] ? D.long(s[1].slice(0, 10)) : 'до ' + D.long(b.to) + ', 19:00')}</small></li>`)}</ul>`;
  }
  function tagHtml(b){
    return html`<div class="tag"><div class="tag-head"><span>БРОНЬ</span><b>№ ${b.num}</b></div><div class="tag-body">
      <div class="kv"><span class="k">Инструмент</span><span class="v">${Kit.nobr(b.model)}</span></div>
      <div class="kv"><span class="k">Период</span><span class="v">${Tools.period(b)}</span></div>
      <div class="kv"><span class="k">Получение</span><span class="v">${b.method === 'pickup' ? 'Самовывоз' : 'Доставка'}</span></div>
      <div class="kv"><span class="k">К оплате</span><span class="v mono">${money(b.total)}</span></div>
      <div class="kv"><span class="k">Статус</span><span class="v">${Tools.status(b.status)}</span></div>
      ${timeline(b)}
    </div></div>`;
  }
  function renderTicket(){
    const b = S.w.booking;
    bar.hidden = true; app.classList.remove('has-actionbar');
    view.innerHTML = html`<div class="screen">
      <div class="success"><div class="success-icon">${icon('check')}</div><h1 class="success-title">Бронь оформлена</h1>
      <p class="success-sub">${b.method === 'pickup' ? 'Ждём вас на складе ' + D.label(b.from).toLowerCase() + ' с 9:00. Возьмите паспорт.' : 'Курьер позвонит за час до доставки.'}</p></div>
      <div class="section">${tagHtml(b)}</div>
      <div class="section" style="display:flex;flex-direction:column;gap:10px">
        <button class="btn btn-primary btn-block" type="button" id="toCat">${icon('grid')}В каталог</button>
        <button class="btn btn-ghost btn-block" type="button" id="toMy">Мои брони</button>
      </div></div>`;
    $('#toCat').addEventListener('click', exitWizard);
    $('#toMy').addEventListener('click', ()=>{ exitWizard(); openMy(); });
  }

  /* ============ МОИ БРОНИ ============ */
  function updateDot(){ let on = false; try{ on = localStorage.getItem('toolrent-unseen') === '1'; }catch(e){} $('#myDot').hidden = !on; }
  $('#myBtn').addEventListener('click', openMy);
  async function openMy(){
    try{ localStorage.removeItem('toolrent-unseen'); }catch(e){}
    updateDot();
    const sh = Kit.sheet({title:'Мои брони', body:html`<div class="skel" style="height:72px"></div><div class="skel" style="height:72px;margin-top:8px"></div>`});
    const r = await api('getMyBookings');
    const list = r.bookings || [];
    const draw = ()=>{
      sh.body.innerHTML = list.length ? html`<div class="list">${list.map(b=>html`<button class="row" type="button" data-id="${b.id}">
        <span class="row-main"><span class="row-title">${b.model}</span><span class="row-sub">№ ${b.num} · ${Tools.period(b)} · ${money(b.total)}</span></span>
        <span class="row-end">${Tools.status(b.status)}</span></button>`)}</div>`
        : html`<div class="empty">${icon('clipboard')}<div class="empty-title">Броней пока нет</div>Выберите инструмент в каталоге</div>`;
    };
    draw();
    Kit.on(sh.body, 'click', '[data-id]', (e, el)=>{ const b = list.find(x=>x.id === el.dataset.id); if(b) openBooking(b, ()=>{ sh.close(); openMy(); }); });
  }
  function openBooking(b, refresh){
    const canCancel = b.status === 'pending', canExtend = b.status === 'active' || b.status === 'overdue' || b.status === 'pending';
    const sh = Kit.sheet({title:'Бронь № ' + b.num, body:tagHtml(b),
      actions: canCancel || canExtend ? html`${canCancel ? html`<button class="btn btn-danger-soft" type="button" data-x>Отменить</button>` : ''}${canExtend ? html`<button class="btn btn-primary" type="button" data-ext>Продлить</button>` : ''}` : null});
    const x = sh.$('[data-x]');
    if(x) x.addEventListener('click', async ()=>{
      if(!await Kit.confirm('Отменить бронь № ' + b.num + '?', 'Отменить бронь', true)) return;
      const r = await api('cancelBooking', {id:b.id});
      if(!r.ok){ Kit.toast(r.message || 'Не удалось отменить', 'error'); return; }
      Kit.toast('Бронь отменена', 'ok'); sh.close(); refresh(); loadModels();
    });
    const ex = sh.$('[data-ext]');
    if(ex) ex.addEventListener('click', ()=> openExtend(b, ()=>{ sh.close(); refresh(); }));
  }
  function openExtend(b, done){
    const min = D.add(b.to, 1);
    const sh = Kit.sheet({title:'Продлить аренду', sub:b.model + ' · сейчас до ' + D.label(b.to), body: html`
      <label class="field"><span class="field-label">Новая дата возврата</span><input class="input" type="date" id="newTo" min="${min}" value="${D.add(b.to, 2)}"></label>
      <p class="hint">Сумма пересчитается с учётом скидки за длинный срок. Доплата — при возврате.</p>`,
      actions: html`<button class="btn btn-primary" type="button" data-go>Продлить</button>`});
    sh.$('[data-go]').addEventListener('click', async ()=>{
      const v = sh.$('#newTo').value;
      if(!v || v < min){ Kit.toast('Выберите дату позже ' + D.label(b.to), 'error'); return; }
      Kit.busy(sh.$('[data-go]'), true);
      const r = await api('extendBooking', {id:b.id, newTo:v});
      Kit.busy(sh.$('[data-go]'), false);
      if(!r.ok){ Kit.toast(r.message || 'Продлить не получилось', 'error'); return; }
      Kit.toast('Продлено до ' + D.label(v) + ' · ' + money(r.booking.total), 'ok'); sh.close(); done();
    });
  }

  /* ============ СТАРТ ============ */
  async function loadModels(){
    const r = await api('getModels');
    S.cats = r.categories || []; S.models = r.models || []; S.config = r.config || null;
    if(!S.w) renderCatalog();
  }
  try{ const p = JSON.parse(localStorage.getItem('toolrent-prof') || 'null'); if(p) S.prof = p; }catch(e){}
  updateDot();
  renderCatalog();
  loadModels();
})();
</script>
</body>
</html>
