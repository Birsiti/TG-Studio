<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Прокат инструмента</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(){
  try{
    var tg = window.Telegram && window.Telegram.WebApp;
    var scheme = (tg && tg.colorScheme) ? tg.colorScheme
      : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = scheme;
  }catch(e){}
})();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

  :root{
    --bg:#111417; --surface:#1A1E22; --surface-2:#20252A; --surface-3:#262B31;
    --ink:#EDEFF0; --ink-soft:#8C949C; --ink-faint:#565D64;
    --accent:#F5A300; --accent-dark:#D88C00; --accent-soft:rgba(245,163,0,.13);
    --accent-2:#38A89D; --accent-2-soft:rgba(56,168,157,.14);
    --warn:#D98324; --warn-soft:rgba(217,131,36,.14);
    --danger:#E5484D; --danger-soft:rgba(229,72,77,.14);
    --line:#2A2F35; --line-strong:#3A414A; --rivet:#4A5158;
    --radius:14px; --radius-sm:10px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* Светлая тема — включается по цветовой схеме Telegram или системной, см. applyTheme() в скрипте */
  :root[data-theme="light"]{
    --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#F5F6F7; --surface-3:#EBEDEF;
    --ink:#181B1F; --ink-soft:#5C636B; --ink-faint:#8D949B;
    --accent:#B8720A; --accent-dark:#8F5900; --accent-soft:rgba(184,114,10,.12);
    --accent-2:#1F7A6E; --accent-2-soft:rgba(31,122,110,.12);
    --warn:#9C5A0E; --warn-soft:rgba(156,90,14,.12);
    --danger:#C4282E; --danger-soft:rgba(196,40,46,.12);
    --line:#E3E5E8; --line-strong:#CBCED2; --rivet:#B7BBC1;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme]),:root[data-theme="light"]{
      --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#F5F6F7; --surface-3:#EBEDEF;
      --ink:#181B1F; --ink-soft:#5C636B; --ink-faint:#8D949B;
      --accent:#B8720A; --accent-dark:#8F5900; --accent-soft:rgba(184,114,10,.12);
      --accent-2:#1F7A6E; --accent-2-soft:rgba(31,122,110,.12);
      --warn:#9C5A0E; --warn-soft:rgba(156,90,14,.12);
      --danger:#C4282E; --danger-soft:rgba(196,40,46,.12);
      --line:#E3E5E8; --line-strong:#CBCED2; --rivet:#B7BBC1;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;line-height:1.4;min-height:100vh;padding-bottom:max(80px, calc(40px + env(safe-area-inset-bottom, 34px)));}
  .mono{font-family:'JetBrains Mono',monospace;}
  h2,h3{font-family:'Chakra Petch',sans-serif;font-weight:600;}
  button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;}
  input,textarea{font-family:inherit;font-size:15px;}

  .power-rail{height:3px;background:linear-gradient(90deg,var(--accent-dark),var(--accent),var(--accent-2));}

  /* topbar */
  .topbar{position:sticky;top:0;z-index:30;padding:calc(14px + var(--safe-top)) 18px 14px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:11px;min-width:0;}
  .brand-mark{width:36px;height:36px;border-radius:8px;flex:0 0 auto;background:var(--surface-3);border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:var(--accent);}
  .brand-mark svg{width:19px;height:19px;}
  .brand-name{font-family:'Chakra Petch',sans-serif;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;font-family:'JetBrains Mono',monospace;}
  .topbar-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .icon-btn{width:44px;height:44px;border-radius:9px;background:var(--surface-3);border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .icon-btn svg{width:17px;height:17px;}
  .icon-btn.has-dot{position:relative;}
  .icon-btn.has-dot::after{content:'';position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface);}

  /* layout */
  .screen{padding:16px 16px 8px;}
  .section-label{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:600;margin:20px 2px 10px;}
  .section-label::after{content:'';flex:1;height:1px;background:var(--line);}
  .section-label:first-child{margin-top:2px;}

  /* ---- SEARCH ---- */
  .search-wrap{position:relative;margin-bottom:2px;}
  .search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-faint);pointer-events:none;}
  .search-input{width:100%;padding:11px 13px 11px 38px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);font-size:14px;}
  .search-input::placeholder{color:var(--ink-faint);}
  .search-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--surface-3);display:none;align-items:center;justify-content:center;color:var(--ink-faint);}
  .search-clear.visible{display:flex;}
  .search-clear svg{width:11px;height:11px;}

  /* segments */
  .seg-row{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;}
  .seg-row::-webkit-scrollbar{display:none;}
  .seg{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;font-family:'JetBrains Mono',monospace;letter-spacing:.01em;}
  .seg.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}

  /* model list */
  .model-list{display:flex;flex-direction:column;gap:8px;}
  .model-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 13px;text-align:left;}
  .model-row:active{border-color:var(--line-strong);}
  .model-row.unavailable{opacity:.45;pointer-events:none;}
  .model-icon{width:44px;height:44px;border-radius:9px;flex:0 0 auto;background:var(--surface-3);border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:var(--accent-2);}
  .model-icon svg{width:21px;height:21px;}
  .model-mid{flex:1;min-width:0;}
  .model-name{font-size:13.5px;font-weight:700;line-height:1.3;}
  .model-cat{font-size:12.5px;color:var(--ink-faint);margin-top:1px;font-family:'JetBrains Mono',monospace;}
  .model-specs{font-size:12.5px;color:var(--ink-soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .model-right{flex:0 0 auto;text-align:right;}
  .model-price{font-size:14.5px;font-weight:700;font-family:'JetBrains Mono',monospace;}
  .model-price span{font-size:12px;color:var(--ink-faint);font-weight:500;display:block;font-family:'Inter',sans-serif;}
  .stock-readout{margin-top:5px;display:inline-flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--accent-2-soft);color:var(--accent-2);}
  .stock-readout.low{background:var(--warn-soft);color:var(--warn);}
  .stock-readout.none{background:var(--danger-soft);color:var(--danger);}
  .stock-readout.unknown{background:var(--surface-3);color:var(--ink-faint);}
  .stock-readout i{width:5px;height:5px;border-radius:50%;background:currentColor;}

  .empty-search{text-align:center;padding:40px 20px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;font-size:12px;}

  /* buttons */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:var(--radius-sm);font-size:14.5px;font-weight:700;font-family:'Chakra Petch',sans-serif;text-transform:uppercase;letter-spacing:.03em;text-decoration:none;}
  .btn-primary{background:var(--accent);color:#15130A;}
  .btn-primary:active{background:var(--accent-dark);}
  .btn-primary:disabled{background:var(--surface-3);color:var(--ink-faint);}
  .btn-ghost{background:var(--surface-3);color:var(--ink);border:1px solid var(--line-strong);}
  .btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid rgba(229,72,77,.3);}

  /* wizard */
  .wizard{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;transform:translateY(110%);opacity:0;visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s ease, visibility 0s linear .28s;}
  .wizard.open{transform:translateY(0);opacity:1;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s ease, visibility 0s linear 0s;}
  .wizard-head{padding:calc(14px + var(--safe-top)) 16px 12px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
  .wizard-title{font-family:'Chakra Petch',sans-serif;font-size:14.5px;font-weight:700;flex:1;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .steps-leds{display:flex;gap:8px;padding:14px 16px 0;align-items:center;}
  .steps-leds .led{width:8px;height:8px;border-radius:2px;background:var(--line-strong);transition:background .2s;}
  .steps-leds .led.done{background:var(--accent-2);}
  .steps-leds .led.active{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .steps-leds .led-label{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink-faint);}
  .wizard-body{flex:1;overflow-y:auto;padding:18px 16px 12px;}
  .wizard-foot{padding:12px 16px max(48px, calc(14px + var(--safe-bottom)));background:var(--surface);border-top:1px solid var(--line);}
  .step-eyebrow{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  .step-title{font-size:21px;margin-bottom:18px;color:var(--ink);}

  /* form */
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:7px;text-transform:uppercase;letter-spacing:.03em;}
  .field-hint{font-size:13px;color:var(--ink-faint);margin-top:5px;}
  .field input,.field textarea{width:100%;padding:13px 14px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--surface-3);color:var(--ink);}
  .field input::placeholder,.field textarea::placeholder{color:var(--ink-faint);}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  input[type="date"]{color-scheme:dark;}
  :root[data-theme="light"] input[type="date"]{color-scheme:light;}

  /* option cards */
  .option-card{display:flex;align-items:center;gap:12px;padding:15px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);margin-bottom:10px;background:var(--surface-2);}
  .option-card.selected{border-color:var(--accent);background:var(--accent-soft);}
  .option-card .oc-icon{width:38px;height:38px;border-radius:8px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--ink-soft);}
  .option-card.selected .oc-icon{background:var(--accent);color:#15130A;}
  .option-card svg{width:18px;height:18px;}
  .oc-title{font-weight:700;font-size:14.5px;}
  .oc-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;font-family:'JetBrains Mono',monospace;}

  /* time slot grid */
  .slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .slot-opt{padding:11px 6px;text-align:center;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--surface-2);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .slot-opt.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .slot-opt .slot-name{font-size:12.5px;font-weight:700;margin-bottom:2px;}
  .slot-opt .slot-time{font-size:12px;color:inherit;opacity:.75;}

  /* avail note */
  .avail-note{display:flex;align-items:center;gap:9px;padding:12px 13px;border-radius:var(--radius-sm);background:var(--accent-2-soft);color:var(--accent-2);font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;margin-top:4px;border:1px solid rgba(56,168,157,.3);}
  .avail-note.warn{background:var(--warn-soft);color:var(--warn);border-color:rgba(217,131,36,.3);}
  .avail-note.bad{background:var(--danger-soft);color:var(--danger);border-color:rgba(229,72,77,.3);}

  /* summary */
  .summary-card{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--radius);padding:4px 15px;margin-bottom:12px;}
  .summary-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
  .summary-row:last-child{border-bottom:none;}
  .summary-row .k{font-size:12.5px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}
  .summary-row .v{font-size:13.5px;font-weight:600;text-align:right;}
  .summary-total{display:flex;justify-content:space-between;align-items:baseline;padding:15px;background:var(--surface-2);border:1px solid var(--accent);border-radius:var(--radius);margin-bottom:16px;}
  .summary-total .k{font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);}
  .summary-total .v{font-size:23px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--accent);}
  .fine-print{font-size:12px;color:var(--ink-faint);line-height:1.55;padding:0 2px;}

  /* ticket plate */
  .ticket-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 20px;}
  /* Табличка-тикет всегда тёмная (металлическая пластина) независимо от темы — поэтому цвета текста внутри неё фиксированные, а не через тема-переменные */
  .plate{position:relative;width:100%;max-width:340px;background:linear-gradient(155deg,#2A2F35,#1D2126);border:1px solid #3A414A;color:#EDEFF0;border-radius:12px;padding:24px 22px 22px;box-shadow:0 14px 30px rgba(0,0,0,.45);}
  .rivet{position:absolute;width:7px;height:7px;border-radius:50%;background:#4A5158;box-shadow:inset 0 1px 1px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.05);}
  .rivet.tl{top:12px;left:12px;} .rivet.tr{top:12px;right:12px;}
  .rivet.bl{bottom:12px;left:12px;} .rivet.br{bottom:12px;right:12px;}
  .plate-eyebrow{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#F5A300;}
  .plate-order{font-family:'JetBrains Mono',monospace;font-size:27px;font-weight:700;margin:4px 0 16px;letter-spacing:.02em;}
  .plate-divider{border-top:1px solid #3A414A;margin:0 0 14px;}
  .plate-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;}
  .plate-row .k{color:#8C949C;font-family:'JetBrains Mono',monospace;font-size:13px;text-transform:uppercase;letter-spacing:.02em;}
  .plate-row .v{font-weight:600;text-align:right;}
  .plate-note{margin-top:16px;padding-top:14px;border-top:1px solid #3A414A;font-size:13px;color:#8C949C;line-height:1.5;}
  .ticket-actions{width:100%;max-width:340px;margin-top:20px;}

  /* sheet */
  .sheet-scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;}
  .sheet-scrim.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:18px 18px 0 0;border-top:1px solid var(--line-strong);max-height:82vh;display:flex;flex-direction:column;transform:translateY(110%);opacity:0;visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s ease, visibility 0s linear .28s;}
  .sheet.open{transform:translateY(0);opacity:1;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s ease, visibility 0s linear 0s;}
  .sheet-handle{width:36px;height:4px;border-radius:3px;background:var(--line-strong);margin:10px auto 4px;}
  .sheet-head{padding:6px 18px 12px;display:flex;align-items:center;justify-content:space-between;}
  .sheet-head h3{font-family:'Chakra Petch',sans-serif;text-transform:uppercase;letter-spacing:.02em;font-size:15px;margin:0;}
  .sheet-body{overflow-y:auto;padding:0 16px max(54px, calc(20px + var(--safe-bottom)));}

  /* booking rows */
  .booking-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:10px;}
  .booking-row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .booking-model{font-weight:700;font-size:14px;}
  .booking-dates{font-size:13px;color:var(--ink-soft);margin-top:3px;font-family:'JetBrains Mono',monospace;}
  .booking-actions{margin-top:10px;display:flex;gap:8px;}
  .booking-actions .btn{padding:9px 12px;font-size:12px;}
  .status-chip{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;padding:3px 8px;border-radius:5px;white-space:nowrap;text-transform:uppercase;}
  .status-chip.pending{background:var(--accent-soft);color:var(--accent);}
  .status-chip.active{background:var(--accent-2-soft);color:var(--accent-2);}
  .status-chip.overdue{background:var(--danger-soft);color:var(--danger);}
  .status-chip.returned{background:var(--surface-3);color:var(--ink-faint);}
  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-faint);}
  .empty-state svg{width:38px;height:38px;margin-bottom:10px;opacity:.5;}

  /* detail sheet */
  .detail-photo{width:100%;aspect-ratio:16/9;background:var(--surface-3);display:flex;align-items:center;justify-content:center;border-radius:var(--radius) var(--radius) 0 0;overflow:hidden;position:relative;}
  .detail-photo img{width:100%;height:100%;object-fit:cover;}
  .detail-photo .photo-placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink-faint);}
  .detail-photo .photo-placeholder svg{width:36px;height:36px;}
  .detail-photo .photo-placeholder span{font-family:'JetBrains Mono',monospace;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;}
  .detail-body{padding:18px 18px 0;}
  .detail-cat{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
  .detail-name{font-family:'Chakra Petch',sans-serif;font-size:20px;font-weight:700;margin:0 0 8px;}
  .detail-specs{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);padding:8px 12px;background:var(--surface-3);border-radius:7px;margin-bottom:14px;}
  .detail-desc{font-size:14px;color:var(--ink-soft);line-height:1.6;margin-bottom:18px;}
  .detail-desc.empty{font-style:italic;color:var(--ink-faint);}
  .detail-price-row{display:flex;align-items:baseline;gap:6px;margin-bottom:18px;}
  .detail-price{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:var(--accent);}
  .detail-price-label{font-size:13px;color:var(--ink-soft);}
  .detail-foot{padding:12px 16px max(48px, calc(14px + var(--safe-bottom)));background:var(--surface);border-top:1px solid var(--line);position:sticky;bottom:0;}

  /* loading */
  .loading-screen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  .spinner{width:24px;height:24px;border-radius:4px;border:3px solid var(--line-strong);border-top-color:var(--accent);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-screen span{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}

/* ============================================================ API WRAPPER (реальный бэкенд — Apps Script) ============================================================ */
async function api(action, payload) {
  payload = payload || {};
  try {
    if (CONFIG.apiUrl.indexOf('PASTE_') === 0) throw new Error('demo mode');
    const res = await fetch(CONFIG.apiUrl, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action }, payload))
    });
    if (!res.ok) throw new Error('bad response');
    return await res.json();
  } catch (e) {
    return mockApi(action, payload);
  }
}

function mockApi(action, payload) {
  return new Promise((resolve) => {
    setTimeout(() => {
      switch (action) {
        case "getModels":
          resolve({ ok: true, categories: MOCK_CATEGORIES, models: MOCK_MODELS });
          break;
        case "checkAvailability": {
          const { modelId, from, to } = payload;
          const model = MOCK_MODELS.find(m => m.id === modelId);
          const busy = (MOCK_BUSY[modelId] || []).filter(b => rangesOverlap(from, to, b.from, b.to));
          const busyQty = busy.reduce((s, b) => s + b.qty, 0);
          const free = Math.max(0, model.totalQty - busyQty);
          resolve({ ok: true, free, total: model.totalQty });
          break;
        }
        case "createBooking": {
          const orderId = "ЗК-" + (1060 + Math.floor(Math.random() * 900));
          MOCK_MY_BOOKINGS.unshift({
            id: orderId, modelId: payload.modelId, model: payload.modelName,
            from: payload.from, to: payload.to, status: "pending",
            method: payload.method === "delivery" ? "Доставка" : "Самовывоз"
          });
          resolve({ ok: true, orderId });
          break;
        }
        case "getMyBookings":
          resolve({ ok: true, bookings: MOCK_MY_BOOKINGS });
          break;
        case "cancelBooking":
          MOCK_MY_BOOKINGS = MOCK_MY_BOOKINGS.filter(b => b.id !== payload.id);
          resolve({ ok: true });
          break;
        case "extendBooking": {
          const b = MOCK_MY_BOOKINGS.find(x => x.id === payload.id);
          if (b) b.to = payload.newTo;
          resolve({ ok: true });
          break;
        }
        default:
          resolve({ ok: false, error: "unknown action" });
      }
    }, 260);
  });
}

function rangesOverlap(aFrom, aTo, bFrom, bTo) { return aFrom <= bTo && bFrom <= aTo; }

/* ============================================================ TELEGRAM ============================================================ */
const tg = window.Telegram ? window.Telegram.WebApp : null;
function haptic(style) {
  if (tg && tg.HapticFeedback) {
    if (["success","error","warning"].includes(style)) tg.HapticFeedback.notificationOccurred(style);
    else tg.HapticFeedback.impactOccurred(style || "light");
  }
}
function getTgUser() {
  try { return tg?.initDataUnsafe?.user || null; } catch(e) { return null; }
}
function applyTheme() {
  const scheme = tg?.colorScheme || (window.matchMedia?.("(prefers-color-scheme: light)").matches ? "light" : "dark");
  document.documentElement.dataset.theme = scheme;
  if (tg) {
    const s = getComputedStyle(document.body);
    try { tg.setHeaderColor(s.getPropertyValue("--surface").trim()); tg.setBackgroundColor(s.getPropertyValue("--bg").trim()); } catch(e) {}
  }
}
function initTelegram() {
  if (!tg) { applyTheme(); return; }
  tg.ready(); tg.expand();
  applyTheme();
  tg.onEvent?.("themeChanged", applyTheme);
  // У приложения свой скролл — отключаем свайп-закрытие, иначе Telegram рисует поверх интерфейса свою полосу-индикатор
  if (tg.isVersionAtLeast?.("7.7")) { try { tg.disableVerticalSwipes(); } catch(e) {} }
}
function confirmDialog(message) {
  return new Promise((resolve) => {
    if (tg?.showConfirm && tg.isVersionAtLeast?.("6.2")) {
      try { tg.showConfirm(message, (ok) => resolve(ok)); return; } catch(e) {}
    }
    resolve(window.confirm(message));
  });
}

function renderSegs() {
  const row = document.getElementById("segRow");
  row.innerHTML = state.categories.map(c =>
    `<button class="seg ${c.id === state.activeCat ? "active" : ""}" data-cat="${c.id}">${c.name}</button>`
  ).join("");
  row.querySelectorAll(".seg").forEach(el => el.addEventListener("click", () => {
    state.activeCat = el.dataset.cat; haptic("light"); renderSegs(); renderModels();
  }));
}

function renderModels() {
  const list = document.getElementById("modelList");
  const q = state.searchQuery.toLowerCase().trim();
  let items = state.models.filter(m => state.activeCat === "all" || m.cat === state.activeCat);
  if (q) items = items.filter(m => m.name.toLowerCase().includes(q) || (m.specs||"").toLowerCase().includes(q));
  if (!items.length) {
    list.innerHTML = `<div class="empty-search">Ничего не найдено по «${state.searchQuery}»</div>`;
    return;
  }
  list.innerHTML = items.map(m => {
    // Показываем totalQty как «в парке N ед.» — точный остаток на даты уточнится в визарде
    let cls = "unknown", label = `В ПАРКЕ ${m.totalQty} ЕД.`;
    if (m.totalQty <= 1) { cls = "low"; label = "ОДНА ЕД. В ПАРКЕ"; }
    return `
    <button class="model-row" data-id="${m.id}">
      <div class="model-icon">${TOOL_ICONS[m.icon]||""}</div>
      <div class="model-mid">
        <div class="model-name">${m.name}</div>
        <div class="model-cat">${categoryName(m.cat)}</div>
        <div class="model-specs">${m.specs||""}</div>
      </div>
      <div class="model-right">
        <div class="model-price">${m.price} р.<span>/ сутки</span></div>
        <div class="stock-readout ${cls}"><i></i>${label}</div>
      </div>
    </button>`;
  }).join("");
  list.querySelectorAll(".model-row").forEach(el => el.addEventListener("click", () => openDetailSheet(el.dataset.id)));
}

function categoryName(id) { const c = state.categories.find(c => c.id === id); return c ? c.name : ""; }

  const model = state.models.find(m => m.id === modelId);
  const tgUser = getTgUser();
  const tgName = tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ") : "";
  state.wizard = {
    step: 1, model, from: "", to: "", freeQty: null,
    method: "pickup", deliverySlotId: "", returnMethod: "self", address: "",
    // Предзаполняем имя из Telegram если доступно
    name: tgName, phone: "", idDoc: ""
  };
  document.getElementById("wizardModelName").textContent = model.name;
  document.getElementById("wizard").classList.add("open");
  haptic("light");
  renderWizard();
  if (tg?.BackButton) { try { tg.BackButton.show(); tg.BackButton.onClick(() => document.getElementById("wizardBack").click()); } catch(e) {} }
}
function closeWizard() {
  document.getElementById("wizard").classList.remove("open");
  if (tg?.BackButton) { try { tg.BackButton.hide(); } catch(e) {} }
}

function renderLeds() {
  const wrap = document.getElementById("stepsLeds");
  const step = Math.min(state.wizard.step, TOTAL_STEPS);
  wrap.style.display = state.wizard.step > TOTAL_STEPS ? "none" : "flex";
  wrap.innerHTML = Array.from({ length: TOTAL_STEPS }).map((_, i) => {
    const n = i + 1;
    let cls = ""; if (n < step) cls = "done"; if (n === step) cls = "active";
    return `<span class="led ${cls}"></span>`;
  }).join("") + `<span class="led-label">${String(step).padStart(2,"0")}/${String(TOTAL_STEPS).padStart(2,"0")} · ${STEP_NAMES[step-1]}</span>`;
}

function renderWizard() {
  renderLeds();
  const body = document.getElementById("wizardBody");
  const foot = document.getElementById("wizardFoot");
  const w = state.wizard;

  /* ---- ШАГ 1: ДАТЫ ---- */
  if (w.step === 1) {
    const today = new Date().toISOString().slice(0, 10);
    body.innerHTML = `
      <div class="step-eyebrow">Шаг 1 из ${TOTAL_STEPS}</div>
      <h2 class="step-title">На какие даты?</h2>
      <div class="field-row">
        <div class="field"><label>Дата выдачи</label><input type="date" id="dateFrom" min="${today}" value="${w.from}"></div>
        <div class="field"><label>Дата возврата</label><input type="date" id="dateTo" min="${today}" value="${w.to}"></div>
      </div>
      <div id="availBlock"></div>
    `;
    const from = document.getElementById("dateFrom");
    const to   = document.getElementById("dateTo");
    // Когда выбрана дата выдачи — автоматически ставим min на дату возврата
    from.addEventListener("change", () => {
      w.from = from.value;
      to.min = w.from;
      if (w.to && w.to < w.from) { w.to = ""; to.value = ""; }
      checkAvail();
    });
    to.addEventListener("change", () => { w.to = to.value; checkAvail(); });
    setNextEnabled(!!(w.from && w.to));

    async function checkAvail() {
      const availBlock = document.getElementById("availBlock");
      if (!w.from || !w.to || w.to < w.from) { availBlock.innerHTML = ""; setNextEnabled(false); return; }
      availBlock.innerHTML = `<div class="avail-note">ПРОВЕРКА ОСТАТКА…</div>`;
      const res = await api("checkAvailability", { modelId: w.model.id, from: w.from, to: w.to });
      w.freeQty = res.free;
      if (res.free <= 0) {
        availBlock.innerHTML = `<div class="avail-note bad">НА ЭТИ ДАТЫ ВСЁ ЗАНЯТО — ВЫБЕРИТЕ ДРУГОЙ ПЕРИОД</div>`;
        setNextEnabled(false);
      } else if (res.free === 1) {
        availBlock.innerHTML = `<div class="avail-note warn">ОСТАЛСЯ ПОСЛЕДНИЙ ЭКЗЕМПЛЯР НА ЭТИ ДАТЫ</div>`;
        setNextEnabled(true);
      } else {
        availBlock.innerHTML = `<div class="avail-note">ДОСТУПНО ${res.free} ИЗ ${res.total} ЕДИНИЦ</div>`;
        setNextEnabled(true);
      }
    }
  }

  /* ---- ШАГ 2: ПОЛУЧЕНИЕ ---- */
  if (w.step === 2) {
    body.innerHTML = `
      <div class="step-eyebrow">Шаг 2 из ${TOTAL_STEPS}</div>
      <h2 class="step-title">Как получите инструмент?</h2>
      <button class="option-card ${w.method==="pickup"?"selected":""}" data-method="pickup">
        <div class="oc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></div>
        <div><div class="oc-title">Самовывоз</div><div class="oc-sub">${CONFIG.pickupPoints[0]?.name||""}</div></div>
      </button>
      <button class="option-card ${w.method==="delivery"?"selected":""}" data-method="delivery">
        <div class="oc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17.5" cy="18" r="1.6"/></svg></div>
        <div><div class="oc-title">Доставка</div><div class="oc-sub">По городу · +${CONFIG.deliveryZones[0]?.fee||0} р.</div></div>
      </button>
      <div id="methodExtra"></div>
    `;
    body.querySelectorAll(".option-card").forEach(el => el.addEventListener("click", () => {
      w.method = el.dataset.method; haptic("light"); renderWizard();
    }));
    renderMethodExtra();
    updateStep2Next();
  }

  /* ---- ШАГ 3: КОНТАКТЫ ---- */
  if (w.step === 3) {
    const tgUser = getTgUser();
    const phoneHint = tgUser?.phone_number ? `+${tgUser.phone_number}` : "+375 29 000 00 00";
    body.innerHTML = `
      <div class="step-eyebrow">Шаг 3 из ${TOTAL_STEPS}</div>
      <h2 class="step-title">Контакты для договора</h2>
      <div class="field">
        <label>Имя и фамилия</label>
        <input type="text" id="fName" placeholder="Иван Петров" value="${escHtml(w.name)}">
        ${w.name ? '<div class="field-hint">Заполнено из вашего Telegram-профиля — проверьте</div>' : ""}
      </div>
      <div class="field">
        <label>Телефон</label>
        <input type="tel" id="fPhone" placeholder="${phoneHint}" value="${escHtml(w.phone)}">
        <div class="field-hint" id="fPhoneHint" style="display:none;color:var(--danger);">Проверьте номер телефона — похоже, в нём не хватает цифр</div>
      </div>
      <div class="field">
        <label>Паспортные данные</label>
        <input type="text" id="fId" placeholder="МС 1234567" value="${escHtml(w.idDoc)}">
        <div class="field-hint">Нужны для составления договора</div>
      </div>
    `;
    const isValid = () => w.name.trim().length > 2 && isValidPhone(w.phone) && w.idDoc.trim().length > 3;
    const upd = () => {
      w.name  = document.getElementById("fName").value;
      w.phone = document.getElementById("fPhone").value;
      w.idDoc = document.getElementById("fId").value;
      setNextEnabled(isValid());
    };
    ["fName","fPhone","fId"].forEach(id => document.getElementById(id).addEventListener("input", upd));
    // Ошибку по телефону показываем только после того, как пользователь закончил ввод (на blur), а не на каждой цифре
    document.getElementById("fPhone").addEventListener("blur", () => {
      document.getElementById("fPhoneHint").style.display = (w.phone.trim() && !isValidPhone(w.phone)) ? "block" : "none";
    });
    setNextEnabled(isValid());
  }

  /* ---- ШАГ 4: ИТОГ ---- */
  if (w.step === 4) {
    const days        = dayCount(w.from, w.to);
    const rentSum     = days * w.model.price;
    const deliveryFee = w.method === "delivery" ? (CONFIG.deliveryZones[0]?.fee||0) : 0;
    const total       = rentSum + deliveryFee;
    const slotLabel   = w.method === "delivery"
      ? CONFIG.deliverySlots.find(s => s.id === w.deliverySlotId)?.name + " " + CONFIG.deliverySlots.find(s => s.id === w.deliverySlotId)?.time
      : null;
    const returnLabel = w.method === "delivery"
      ? (w.returnMethod === "courier" ? "Заберёт курьер" : "Везу сам")
      : null;

    body.innerHTML = `
      <div class="step-eyebrow">Шаг 4 из ${TOTAL_STEPS}</div>
      <h2 class="step-title">Проверьте и подтвердите</h2>
      <div class="summary-card">
        <div class="summary-row"><div class="k">ИНСТРУМЕНТ</div><div class="v">${w.model.name}</div></div>
        <div class="summary-row"><div class="k">ПЕРИОД</div><div class="v mono">${fmtDate(w.from)} — ${fmtDate(w.to)}</div></div>
        <div class="summary-row"><div class="k">СРОК</div><div class="v">${days} ${pluralDays(days)}</div></div>
        <div class="summary-row"><div class="k">ПОЛУЧЕНИЕ</div><div class="v">${w.method==="pickup"?"Самовывоз":"Доставка" + (slotLabel?" · "+slotLabel:"")}</div></div>
        ${returnLabel ? `<div class="summary-row"><div class="k">ВОЗВРАТ</div><div class="v">${returnLabel}</div></div>` : ""}
        <div class="summary-row"><div class="k">ПОЛУЧАТЕЛЬ</div><div class="v">${escHtml(w.name)}</div></div>
      </div>
      <div class="summary-card">
        <div class="summary-row"><div class="k">АРЕНДА ${days}×${w.model.price} Р.</div><div class="v">${rentSum} р.</div></div>
        ${deliveryFee ? `<div class="summary-row"><div class="k">ДОСТАВКА</div><div class="v">${deliveryFee} р.</div></div>` : ""}
      </div>
      <div class="summary-total"><div class="k">Итого</div><div class="v">${total} р.</div></div>
      <div class="fine-print">После оформления в чат придут договор и чек об оплате. Оплата — при получении инструмента.</div>
    `;
    foot.querySelector("#wizardNext").textContent = "Оформить бронь";
    setNextEnabled(true);
  }

  /* ---- ШАГ 5: ТИКЕТ ---- */
  if (w.step === 5) {
    foot.style.display = "none";
    // Бронь уже создана — прячем "назад", чтобы нельзя было вернуться и отправить дубль заявки
    document.getElementById("wizardBack").style.visibility = "hidden";
    body.innerHTML = renderTicket();
    body.querySelector("#ticketDone")?.addEventListener("click", closeWizard);
    return;
  }

  document.getElementById("wizardBack").style.visibility = "visible";
  foot.style.display = "block";
}

/* ---- Доп. поля шага 2 ---- */
function renderMethodExtra() {
  const w   = state.wizard;
  const el  = document.getElementById("methodExtra");
  if (!el) return;
  if (w.method === "pickup") { el.innerHTML = ""; updateStep2Next(); return; }

  // Доставка: адрес + окно времени + способ возврата
  el.innerHTML = `
    <div class="field" style="margin-top:6px;">
      <label>Адрес доставки</label>
      <textarea id="fAddress" rows="2" placeholder="Улица, дом, подъезд">${escHtml(w.address)}</textarea>
    </div>
    <div class="field">
      <label>Удобное время доставки</label>
      <div class="slot-grid" id="slotGrid">
        ${CONFIG.deliverySlots.map(s => `
          <button class="slot-opt ${w.deliverySlotId===s.id?"selected":""}" data-slot="${s.id}">
            <div class="slot-name">${s.name}</div>
            <div class="slot-time">${s.time}</div>
          </button>`).join("")}
      </div>
    </div>
    <div class="field">
      <label>Как вернёте инструмент?</label>
      <button class="option-card ${w.returnMethod==="self"?"selected":""}" data-ret="self" style="padding:12px 15px; margin-bottom:8px;">
        <div class="oc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg></div>
        <div><div class="oc-title" style="font-size:13.5px;">Привезу сам</div><div class="oc-sub">Без доплаты</div></div>
      </button>
      <button class="option-card ${w.returnMethod==="courier"?"selected":""}" data-ret="courier" style="padding:12px 15px;">
        <div class="oc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17.5" cy="18" r="1.6"/></svg></div>
        <div><div class="oc-title" style="font-size:13.5px;">Заберёт курьер</div><div class="oc-sub">+${CONFIG.deliveryZones[0]?.fee||0} р.</div></div>
      </button>
    </div>
  `;

  document.getElementById("fAddress").addEventListener("input", (e) => { w.address = e.target.value; updateStep2Next(); });
  document.querySelectorAll("#slotGrid .slot-opt").forEach(el => el.addEventListener("click", () => {
    w.deliverySlotId = el.dataset.slot; haptic("light");
    document.querySelectorAll("#slotGrid .slot-opt").forEach(x => x.classList.remove("selected"));
    el.classList.add("selected"); updateStep2Next();
  }));
  document.querySelectorAll("[data-ret]").forEach(el => el.addEventListener("click", () => {
    w.returnMethod = el.dataset.ret; haptic("light");
    document.querySelectorAll("[data-ret]").forEach(x => x.classList.remove("selected"));
    el.classList.add("selected");
  }));

  updateStep2Next();
}

function updateStep2Next() {
  const w = state.wizard;
  if (w.method === "pickup") { setNextEnabled(true); return; }
  setNextEnabled(w.address.trim().length > 4 && !!w.deliverySlotId);
}

function setNextEnabled(ok) { const b = document.getElementById("wizardNext"); if (b) b.disabled = !ok; }

/* ============================================================ WIZARD NAV ============================================================ */
document.getElementById("wizardNext").addEventListener("click", async () => {
  const w = state.wizard;
  if (w.step === 4) {
    const btn = document.getElementById("wizardNext");
    btn.disabled = true; btn.textContent = "Оформляем…";
    try {
      const tgUser = getTgUser();
      const payload = {
        modelId: w.model.id, modelName: w.model.name, from: w.from, to: w.to, method: w.method,
        userId: tgUser?.id || "", name: w.name, phone: w.phone, idDoc: w.idDoc
      };
      if (w.method === "delivery") {
        payload.address = w.address;
        payload.deliverySlotId = w.deliverySlotId;
        payload.returnMethod = w.returnMethod;
        payload.deliveryFee = CONFIG.deliveryZones[0]?.fee || 0;
      }
      const res = await api("createBooking", payload);
      if (!res.ok) throw new Error(res.error || "booking failed");
      lastOrderId = res.orderId; haptic("success"); w.step = 5; renderWizard();
    } catch (e) {
      haptic("error"); showToast("Не удалось оформить бронь, попробуйте ещё раз");
      btn.disabled = false; btn.textContent = "Оформить бронь";
    }
    return;
  }
  haptic("light"); w.step++; renderWizard();
});
document.getElementById("wizardBack").addEventListener("click", () => {
  const w = state.wizard;
  if (w.step <= 1) { closeWizard(); return; }
  haptic("light"); w.step--; document.getElementById("wizardFoot").style.display = "block"; renderWizard();
});
document.getElementById("wizardClose").addEventListener("click", async () => {
  const w = state.wizard;
  // Если пользователь уже что-то заполнил (но бронь ещё не оформлена) — подтверждаем закрытие
  if (w.step >= 2 && w.step < 5) {
    const ok = await confirmDialog("Закрыть? Введённые данные будут потеряны.");
    if (!ok) return;
  }
  closeWizard();
});

/* ============================================================ TICKET ============================================================ */
let lastOrderId = null;
function renderTicket() {
  const w = state.wizard;
  return `
    <div class="ticket-wrap">
      <div class="plate">
        <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
        <div class="plate-eyebrow">Заявка принята</div>
        <div class="plate-order mono">${lastOrderId||"…"}</div>
        <div class="plate-divider"></div>
        <div class="plate-row"><div class="k">Инструмент</div><div class="v">${w.model.name}</div></div>
        <div class="plate-row"><div class="k">Выдача</div><div class="v mono">${fmtDate(w.from)}</div></div>
        <div class="plate-row"><div class="k">Возврат</div><div class="v mono">${fmtDate(w.to)}</div></div>
        <div class="plate-row"><div class="k">Получение</div><div class="v">${w.method==="pickup"?"Самовывоз":"Доставка"}</div></div>
        <div class="plate-note">Договор и чек об оплате отправлены в этот чат отдельными сообщениями. Оплата — при получении.</div>
      </div>
      <div class="ticket-actions"><button class="btn btn-primary" id="ticketDone">Готово</button></div>
    </div>`;
}

/* ============================================================ МОИ БРОНИ ============================================================ */
const STATUS_LABEL = { pending: "Ожидает выдачи", active: "В аренде", overdue: "Просрочено", returned: "Возвращено" };

function openBookingsSheet() {
  document.getElementById("sheetScrim").classList.add("open");
  document.getElementById("bookingsSheet").classList.add("open");
  haptic("light"); loadBookings();
  if (tg?.BackButton) { try { tg.BackButton.show(); tg.BackButton.onClick(closeBookingsSheet); } catch(e) {} }
}
function closeBookingsSheet() {
  document.getElementById("sheetScrim").classList.remove("open");
  document.getElementById("bookingsSheet").classList.remove("open");
  if (tg?.BackButton) { try { tg.BackButton.hide(); } catch(e) {} }
}

async function loadBookings() {
  const list = document.getElementById("bookingsList");
  list.innerHTML = `<div class="empty-state"><div class="spinner" style="margin:0 auto 10px;"></div></div>`;
  const res = await api("getMyBookings", { userId: getTgUser()?.id || "" });
  if (!res.bookings.length) {
    list.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><div>Пока нет броней</div></div>`;
    return;
  }
  list.innerHTML = res.bookings.map(b => `
    <div class="booking-row">
      <div class="booking-row-top">
        <div>
          <div class="booking-model">${b.model}</div>
          <div class="booking-dates">${fmtDate(b.from)} — ${fmtDate(b.to)} · ${b.method}</div>
        </div>
        <span class="status-chip ${b.status}">${STATUS_LABEL[b.status]}</span>
      </div>
      ${b.status === "pending" ? `
        <div class="booking-actions">
          <button class="btn btn-danger" data-cancel="${b.id}">Отменить бронь</button>
        </div>` : ""}
      ${b.status === "active" ? `
        <div class="booking-actions">
          <button class="btn btn-ghost" data-extend="${b.id}">Продлить аренду</button>
        </div>` : ""}
    </div>`).join("");

  // Кнопки отмены — только для статуса pending (инструмент ещё не выдан)
  list.querySelectorAll("[data-cancel]").forEach(el => el.addEventListener("click", async () => {
    const ok = await confirmDialog("Отменить эту бронь? Действие нельзя будет вернуть.");
    if (!ok) return;
    el.disabled = true; el.textContent = "Отменяем…";
    try {
      const res = await api("cancelBooking", { id: el.dataset.cancel });
      if (!res.ok) throw new Error(res.error || "cancel failed");
      haptic("success"); showToast("Бронь отменена");
      loadBookings();
    } catch (e) {
      haptic("error"); showToast("Не удалось отменить бронь, попробуйте ещё раз");
      el.disabled = false; el.textContent = "Отменить бронь";
    }
  }));

  // Продление — только для броней в статусе "В аренде"
  list.querySelectorAll("[data-extend]").forEach(el => el.addEventListener("click", () => {
    const booking = res.bookings.find(b => b.id === el.dataset.extend);
    if (booking) openExtendSheet(booking);
  }));
}

/* ============================================================ ПРОДЛИТЬ АРЕНДУ ============================================================ */
function openExtendSheet(booking) {
  haptic("light");
  document.getElementById("extendScrim").classList.add("open");
  document.getElementById("extendSheet").classList.add("open");
  if (tg?.BackButton) { try { tg.BackButton.show(); tg.BackButton.onClick(closeExtendSheet); } catch(e) {} }
  const body = document.getElementById("extendBody");
  const minDate = addDays(booking.to, 1);
  body.innerHTML = `
    <div class="field">
      <label>Инструмент</label>
      <div style="font-weight:700;font-size:14.5px;">${escHtml(booking.model)}</div>
      <div class="field-hint">Текущий срок — до ${fmtDate(booking.to)}</div>
    </div>
    <div class="field">
      <label>Новая дата возврата</label>
      <input type="date" id="extendTo" min="${minDate}" value="${minDate}">
    </div>
    <div id="extendAvailBlock"></div>
    <button class="btn btn-primary" id="extendConfirm" disabled style="margin-top:6px;">Продлить</button>
    <div style="height:20px;"></div>
  `;
  const input = document.getElementById("extendTo");
  const availBlock = document.getElementById("extendAvailBlock");
  const confirmBtn = document.getElementById("extendConfirm");

  async function checkExtendAvail() {
    const newTo = input.value;
    if (!newTo || newTo < minDate) { availBlock.innerHTML = ""; confirmBtn.disabled = true; return; }
    availBlock.innerHTML = `<div class="avail-note">ПРОВЕРКА ОСТАТКА…</div>`;
    const res = await api("checkAvailability", { modelId: booking.modelId, from: minDate, to: newTo });
    if (res.free <= 0) {
      availBlock.innerHTML = `<div class="avail-note bad">НА ЭТОТ СРОК ИНСТРУМЕНТ УЖЕ ЗАБРОНИРОВАН — ВЫБЕРИТЕ ДРУГУЮ ДАТУ</div>`;
      confirmBtn.disabled = true;
    } else {
      availBlock.innerHTML = `<div class="avail-note">МОЖНО ПРОДЛИТЬ ДО ЭТОЙ ДАТЫ</div>`;
      confirmBtn.disabled = false;
    }
  }
  input.addEventListener("change", checkExtendAvail);
  checkExtendAvail();

  confirmBtn.addEventListener("click", async () => {
    confirmBtn.disabled = true; confirmBtn.textContent = "Продлеваем…";
    try {
      const r = await api("extendBooking", { id: booking.id, newTo: input.value });
      if (!r.ok) throw new Error(r.error || "extend failed");
      haptic("success"); showToast("Аренда продлена до " + fmtDate(input.value));
      closeExtendSheet(); loadBookings();
    } catch (e) {
      haptic("error"); showToast("Не удалось продлить аренду, попробуйте ещё раз");
      confirmBtn.disabled = false; confirmBtn.textContent = "Продлить";
    }
  });
}
function closeExtendSheet() {
  document.getElementById("extendScrim").classList.remove("open");
  document.getElementById("extendSheet").classList.remove("open");
  if (tg?.BackButton) { try { tg.BackButton.hide(); } catch(e) {} }
}
document.getElementById("extendClose").addEventListener("click", closeExtendSheet);
document.getElementById("extendScrim").addEventListener("click", closeExtendSheet);

document.getElementById("myBookingsBtn").addEventListener("click", openBookingsSheet);
document.getElementById("sheetClose").addEventListener("click", closeBookingsSheet);
document.getElementById("sheetScrim").addEventListener("click", closeBookingsSheet);
document.getElementById("callBtn").addEventListener("click", () => {
  if (tg?.openLink) tg.openLink("tel:" + CONFIG.phone); else window.location.href = "tel:" + CONFIG.phone;
});

/* ============================================================ UTILS ============================================================ */
function dayCount(from, to) { const a = new Date(from), b = new Date(to); return Math.max(1, Math.round((b - a) / 86400000) + 1); }
function addDays(iso, n) { const d = new Date(iso); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function fmtDate(iso) { if (!iso) return ""; const d = new Date(iso); return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" }); }
function pluralDays(n) {
  const mod10 = n%10, mod100 = n%100;
  if (mod10===1 && mod100!==11) return "сутки";
  if ([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return "суток";
  return "суток";
}
function escHtml(s) { return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function isValidPhone(s) { return (s||"").replace(/\D/g,"").length >= 9; }
function showToast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }

/* ============================================================ INIT ============================================================ */
async function init() {
  initTelegram();
  document.getElementById("brandName").textContent = CONFIG.businessName;
  document.getElementById("brandSub").textContent  = CONFIG.city;
  try {
    const res = await api("getModels", {});
    if (!res.ok) throw new Error(res.error || "load failed");
    state.categories = res.categories;
    state.models     = res.models;
    renderSegs(); renderModels();
    document.getElementById("loadingScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
  } catch (e) {
    document.getElementById("loadingScreen").innerHTML =
      `<span>Не удалось загрузить каталог. Проверьте соединение и перезапустите приложение.</span>`;
  }
}
init();
</script>
