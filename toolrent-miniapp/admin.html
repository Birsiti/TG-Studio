<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Прокат-Инструмент — склад</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../kit/core.js"></script>
<link rel="stylesheet" href="../kit/base.css">
<link rel="stylesheet" href="brand.css">
<script src="tools.js"></script>
<script src="mock.js"></script>
</head>
<body>
<div class="app has-tabbar">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" id="mark"></div>
      <div class="brand-text"><span class="brand-name" data-fit="13">Прокат-Инструмент</span><span class="brand-role">Склад · администратор</span></div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="newBtn" type="button" aria-label="Новая бронь"></button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button>
    </div>
  </header>

  <section data-panel="today" hidden>
    <div class="page-head"><h1 class="page-title">Сегодня</h1><p class="page-sub" id="todaySub"></p></div>
    <div class="stats" id="stats"></div>
    <div class="section"><div class="section-head"><h2 class="section-title">Выдать</h2><span class="hint" id="hCount"></span></div><div id="handout"></div></div>
    <div class="section"><div class="section-head"><h2 class="section-title">Принять</h2><span class="hint" id="rCount"></span></div><div id="returns"></div></div>
    <div class="section" id="delivWrap"><div class="section-head"><h2 class="section-title">Доставки</h2></div><div id="deliv"></div></div>
  </section>

  <section data-panel="park" hidden>
    <div class="page-head"><h1 class="page-title">Парк</h1><p class="page-sub">Каждая клетка — единица с инвентарным номером</p></div>
    <div class="legend"><span><i class="l-free"></i>свободна</span><span><i class="l-rented"></i>в аренде</span><span><i class="l-repair"></i>ремонт</span></div>
    <div id="park"></div>
  </section>

  <section data-panel="bookings" hidden>
    <div class="page-head"><h1 class="page-title">Брони</h1></div>
    <div class="search"><span id="sIc"></span><input class="input" id="q" type="search" placeholder="№, клиент или телефон" autocomplete="off"></div>
    <div class="chips scroll" id="bFilter" style="margin-top:12px"></div>
    <div class="section" id="bList"></div>
  </section>
</div>

<nav class="tabbar"><div class="tabbar-inner">
  <button type="button" data-tab="today"><span data-ic="clipboard"></span>Сегодня</button>
  <button type="button" data-tab="park"><span data-ic="grid"></span>Парк</button>
  <button type="button" data-tab="bookings"><span data-ic="list"></span>Брони</button>
</div></nav>

<script>
(function(){
  "use strict";
  const {html, icon, $, $$, date: D, money, haptic} = Kit;
  const api = Kit.createApi({bot:'toolrent', mock: window.ToolrentMock});
  $('#mark').innerHTML = icon('wrench');
  $('#newBtn').innerHTML = icon('plus');
  $('#sIc').outerHTML = String(icon('search'));
  $$('[data-ic]').forEach(el=> el.outerHTML = String(icon(el.dataset.ic)));
  let MODELS = [], ZONES = [{id:'z1', name:'МКАД', fee:15}, {id:'z2', name:'За МКАД', fee:30}], SLOTS = [{id:'morning', name:'Утро'}, {id:'day', name:'День'}, {id:'evening', name:'Вечер'}];

  function bRow(b, kind){
    const when = kind === 'ret' ? (b.status === 'overdue' ? 'просрочено на ' + b.daysLate + ' дн.' : 'вернуть ' + D.label(b.to).toLowerCase()) : 'выдать ' + D.label(b.from).toLowerCase();
    return html`<button class="row" type="button" data-b="${b.id}" data-kind="${kind || ''}">
      <span class="row-icon">${icon(b.method === 'delivery' ? 'truck' : kind === 'ret' ? 'restore' : 'box')}</span>
      <span class="row-main"><span class="row-title">${Kit.nobr(b.model)}${b.unitNum ? ' · №' + b.unitNum : ''}</span><span class="row-sub">${b.client} · ${when}</span></span>
      <span class="row-end">${Tools.status(b.status)}<span class="mono hint">№ ${b.num}</span></span></button>`;
  }
  const empty = (t)=> html`<div class="card card-flat"><div class="empty-mini">${t}</div></div>`;
  let TODAY = null;

  /* ============ СЕГОДНЯ ============ */
  async function renderToday(){
    $('#todaySub').textContent = D.dowLong(D.today()).replace(/^./, c=>c.toUpperCase()) + ', ' + D.long(D.today());
    const r = await api('getToday');
    TODAY = r;
    const s = r.stats || {};
    $('#stats').innerHTML = html`
      <div class="stat"><div class="stat-label">В аренде</div><div class="stat-value">${s.rented}</div></div>
      <div class="stat"><div class="stat-label">Свободно</div><div class="stat-value">${s.free}</div></div>
      <div class="stat"><div class="stat-label">В ремонте</div><div class="stat-value">${s.repair}</div></div>
      <div class="stat"><div class="stat-label">Просрочено</div><div class="stat-value" style="${s.overdue ? 'color:var(--danger)' : ''}">${s.overdue}</div></div>`;
    $('#hCount').textContent = r.handout.length || '';
    $('#rCount').textContent = r.ret.length || '';
    $('#handout').innerHTML = r.handout.length ? html`<div class="list">${r.handout.map(b=>bRow(b, 'out'))}</div>` : empty('На сегодня и завтра выдач нет');
    $('#returns').innerHTML = r.ret.length ? html`<div class="list">${r.ret.map(b=>bRow(b, 'ret'))}</div>` : empty('Возвратов не ожидается');
    $('#delivWrap').hidden = !r.deliveries.length;
    $('#deliv').innerHTML = html`<div class="list">${r.deliveries.map(b=>html`<div class="row" style="flex-wrap:wrap">
      <span class="row-main"><span class="row-title">${b.address}</span><span class="row-sub">${Kit.nobr(b.model)} · ${D.label(b.from)}, ${(SLOTS.find(x=>x.id === b.slot) || {name:''}).name.toLowerCase()} · ${b.client}</span></span>
      <div class="seg" style="width:100%" data-dl="${b.id}">${Object.entries(Tools.DELIVERY).map(([k, l])=>html`<button type="button" data-v="${k}" class="${(b.deliveryStatus || 'new') === k ? 'is-on' : ''}">${l}</button>`)}</div></div>`)}</div>`;
  }
  Kit.on($('#deliv'), 'click', '[data-dl] [data-v]', async (e, el)=>{
    const seg = el.closest('[data-dl]');
    const r = await api('setDeliveryStatus', {bookingId:seg.dataset.dl, status:el.dataset.v});
    if(!r.ok){ Kit.toast('Не удалось', 'error'); return; }
    seg.querySelectorAll('button').forEach(b=>b.classList.toggle('is-on', b === el)); haptic('select');
  });
  ['#handout', '#returns'].forEach(sel=> Kit.on($(sel), 'click', '[data-b]', (e, el)=>{
    const list = el.dataset.kind === 'ret' ? TODAY.ret : TODAY.handout;
    const b = list.find(x=>x.id === el.dataset.b); if(b) openOp(el.dataset.kind === 'ret' ? 'in' : 'out', b);
  }));

  /* ============ ВЫДАЧА / ВОЗВРАТ ============ */
  async function openOp(kind, b){
    const st = {unitId:null, cond:null, photos:[]};
    const sh = Kit.sheet({title:kind === 'out' ? 'Выдача № ' + b.num : 'Возврат № ' + b.num, sub:b.model, body: html`
      <div class="kv"><span class="k">Клиент</span><span class="v">${b.client}</span></div>
      <div class="kv"><span class="k">Телефон</span><span class="v"><a href="tel:${b.phone}" class="mono">${Kit.phone.pretty(b.phone)}</a></span></div>
      <div class="kv"><span class="k">Паспорт</span><span class="v mono">${b.idDoc || '—'}</span></div>
      <div class="kv"><span class="k">Период</span><span class="v">${Tools.period(b)}</span></div>
      <div class="kv"><span class="k">${kind === 'out' ? 'К оплате' : 'Оплачено'}</span><span class="v mono">${money(b.total)} + залог ${money(b.deposit)}</span></div>
      ${b.status === 'overdue' ? html`<div class="avail bad" style="margin-top:12px">${icon('alert')}Просрочка ${b.daysLate} дн. · доплата ${money(b.debt)}</div>` : ''}
      ${kind === 'out' ? html`<div class="section"><span class="field-label">Какую единицу выдаём</span><div class="units" id="pick"><div class="skel" style="height:46px;grid-column:1/-1"></div></div></div>` : ''}
      <div class="section"><span class="field-label">Состояние</span><div class="seg" id="cond"><button type="button" data-v="ok">${icon('check')} Исправен</button><button type="button" data-v="bad">${icon('alert')} Есть дефект</button></div></div>
      <div class="section"><label class="photo-btn">${icon('download')}<span>Сфотографировать состояние</span><input type="file" accept="image/*" capture="environment" multiple id="photo"></label><div class="photo-row" id="thumbs"></div></div>
      <label class="field section"><span class="field-label">Комментарий</span><textarea class="textarea" id="cmt" rows="2" maxlength="300" placeholder="Царапины, некомплект…"></textarea></label>`,
      actions: html`<button class="btn btn-primary" type="button" data-go disabled>${kind === 'out' ? 'Выдать' : 'Принять'}</button>`});
    const go = sh.$('[data-go]');
    const upd = ()=>{ go.disabled = !(st.cond && (kind === 'in' || st.unitId)); };
    if(kind === 'out'){
      const r = await api('getFreeUnits', {modelId:b.modelId});
      const units = r.units || [];
      sh.$('#pick').innerHTML = units.length ? html`${units.map(u=>html`<button type="button" class="unit free" data-u="${u.id}">${u.num}</button>`)}` : html`<span class="hint" style="grid-column:1/-1">Свободных единиц нет — примите возврат или выведите из ремонта</span>`;
      Kit.on(sh.$('#pick'), 'click', '[data-u]', (e, el)=>{ st.unitId = el.dataset.u; sh.el.querySelectorAll('#pick .unit').forEach(x=>x.classList.toggle('is-on', x === el)); haptic('select'); upd(); });
      if(units.length){ st.unitId = units[0].id; sh.$('#pick .unit').classList.add('is-on'); } // по умолчанию — первая свободная
    }
    Kit.on(sh.$('#cond'), 'click', '[data-v]', (e, el)=>{ st.cond = el.dataset.v; sh.el.querySelectorAll('#cond button').forEach(x=>x.classList.toggle('is-on', x === el)); haptic('select'); upd(); });
    sh.$('#photo').addEventListener('change', e=>{
      Array.from(e.target.files).slice(0, 6).forEach(f=>{
        const rd = new FileReader();
        rd.onload = ev=>{ const img = document.createElement('img'); img.src = ev.target.result; img.alt = ''; sh.$('#thumbs').appendChild(img); st.photos.push(f.name); };
        rd.readAsDataURL(f);
      });
    });
    go.addEventListener('click', async ()=>{
      Kit.busy(go, true);
      const cmt = sh.$('#cmt').value.trim() + (st.photos.length ? ' [фото: ' + st.photos.length + ']' : '');
      const r = kind === 'out'
        ? await api('checkOut', {bookingId:b.id, unitId:st.unitId, condition:st.cond, comment:cmt})
        : await api('checkIn', {bookingId:b.id, damaged:st.cond === 'bad', comment:cmt});
      Kit.busy(go, false);
      if(!r.ok){ Kit.toast(r.message || 'Не получилось', 'error'); return; }
      sh.close();
      Kit.toast(kind === 'out' ? 'Выдано' : (st.cond === 'bad' ? 'Принято, единица ушла в ремонт' : 'Принято на склад') + (r.lateFee ? ' · доплата ' + money(r.lateFee) : ''), 'ok');
      renderToday();
    });
  }

  /* ============ ПАРК ============ */
  let UNITS = [], CATS = [];
  async function renderPark(){
    const r = await api('getUnits');
    UNITS = r.units || []; MODELS = r.models || []; CATS = r.categories || [];
    $('#park').innerHTML = html`${MODELS.filter(m=>m.active !== false).map(m=>{
      const us = UNITS.filter(u=>u.modelId === m.id);
      const free = us.filter(u=>u.status === 'free').length;
      return html`<div class="card section">
        <div style="display:flex;gap:12px;align-items:flex-start">
          <span style="width:40px;flex:none">${Tools.art(m.icon)}</span>
          <div style="flex:1;min-width:0"><b style="display:block">${Kit.nobr(m.name)}</b><span class="hint">${free} из ${us.length} свободно · ${money(m.price)}/сут</span></div>
          <button class="icon-btn" type="button" data-edit="${m.id}" aria-label="Редактировать">${icon('edit')}</button>
        </div>
        <div class="units">${us.map(u=>html`<button type="button" class="unit ${u.status}" data-u="${u.id}">${u.num}</button>`)}<button type="button" class="unit add" data-add="${m.id}" aria-label="Добавить единицу">+</button></div>
      </div>`; })}`;
  }
  Kit.on($('#park'), 'click', '[data-u]', (e, el)=> openUnit(UNITS.find(u=>u.id === el.dataset.u)));
  Kit.on($('#park'), 'click', '[data-add]', async (e, el)=>{
    const m = MODELS.find(x=>x.id === el.dataset.add);
    if(!await Kit.confirm('Добавить ещё одну единицу «' + m.name + '» в парк?', 'Добавить')) return;
    const r = await api('addUnit', {modelId:m.id});
    if(!r.ok){ Kit.toast('Не удалось', 'error'); return; }
    Kit.toast('Добавлена единица №' + r.unit.num, 'ok'); renderPark();
  });
  Kit.on($('#park'), 'click', '[data-edit]', (e, el)=> openModel(MODELS.find(x=>x.id === el.dataset.edit)));

  async function openUnit(u){
    const m = MODELS.find(x=>x.id === u.modelId);
    const sh = Kit.sheet({title:m.name + ' · №' + u.num, sub:Tools.UNIT[u.status], body:html`<div class="skel" style="height:120px"></div>`});
    const r = await api('getUnitBooking', {unitId:u.id});
    const b = r.booking;
    sh.body.innerHTML = html`
      ${b ? html`<div class="eyebrow">Текущая аренда</div><div class="list" style="margin-top:8px">${bRow(b, 'ret')}</div>` : ''}
      ${r.repair ? html`<div class="avail warn">${icon('wrench')}В ремонте с ${D.label(r.repair.opened)}: ${r.repair.note}</div>` : ''}
      ${u.status !== 'rented' ? html`<div class="section"><span class="field-label">Статус единицы</span>
        <div class="seg" id="ust"><button type="button" data-v="free" class="${u.status === 'free' ? 'is-on' : ''}">Свободна</button><button type="button" data-v="repair" class="${u.status === 'repair' ? 'is-on' : ''}">Ремонт</button><button type="button" data-v="retired">Списать</button></div>
        <label class="field" style="margin-top:12px"><span class="field-label">Заметка для ремонта</span><input class="input" id="unote" maxlength="200" placeholder="Что сломалось"></label></div>` : ''}
      <div class="section"><div class="eyebrow">Последние аренды</div>${r.history && r.history.length ? html`<div class="list" style="margin-top:8px">${r.history.map(h=>html`<div class="row"><span class="row-main"><span class="row-title">${h.client}</span><span class="row-sub">${Tools.period(h)}${h.conditionIn === 'bad' ? ' · вернули с дефектом' : ''}</span></span><span class="mono">${money(h.total)}</span></div>`)}</div>` : html`<div class="empty-mini">Пока не выдавалась</div>`}</div>`;
    const seg = sh.$('#ust');
    if(seg) Kit.on(seg, 'click', '[data-v]', async (e, el)=>{
      if(el.dataset.v === 'retired' && !await Kit.confirm('Списать единицу №' + u.num + '? Она пропадёт из парка.', 'Списать', true)) return;
      const rr = await api('setUnitStatus', {unitId:u.id, status:el.dataset.v, note:sh.$('#unote').value.trim()});
      if(!rr.ok){ Kit.toast(rr.message || 'Не удалось', 'error'); return; }
      Kit.toast('Статус обновлён', 'ok'); sh.close(); renderPark();
    });
    if(b) Kit.on(sh.body, 'click', '[data-b]', ()=>{ sh.close(); openOp('in', b); });
  }

  function openModel(m){
    const sh = Kit.sheet({title:'Карточка инструмента', sub:m.name, body: html`
      <div class="field-row"><label class="field"><span class="field-label">Цена/сутки, BYN</span><input class="input mono" id="mPrice" inputmode="decimal" value="${m.price}"></label>
      <label class="field"><span class="field-label">Залог, BYN</span><input class="input mono" id="mDep" inputmode="decimal" value="${m.deposit}"></label></div>
      <label class="field"><span class="field-label">Характеристики</span><input class="input" id="mSpecs" maxlength="120" value="${m.specs}"></label>
      <label class="field"><span class="field-label">Описание</span><textarea class="textarea" id="mDesc" rows="4" maxlength="600">${m.description}</textarea></label>
      <label class="field"><span class="field-label">Ссылка на фото (https)</span><input class="input" id="mPhoto" maxlength="300" placeholder="https://…" value="${m.photoUrl}"></label>`,
      actions: html`<button class="btn btn-primary" type="button" data-save>Сохранить</button>`});
    sh.$('[data-save]').addEventListener('click', async ()=>{
      const price = Number(sh.$('#mPrice').value.replace(',', '.')), deposit = Number(sh.$('#mDep').value.replace(',', '.'));
      if(!(price > 0) || !(deposit >= 0)){ Kit.toast('Проверьте цену и залог', 'error'); return; }
      const photo = sh.$('#mPhoto').value.trim();
      if(photo && !/^https:\/\//.test(photo)){ Kit.toast('Фото — только https-ссылка', 'error'); return; }
      const r = await api('updateModel', {modelId:m.id, price, deposit, specs:sh.$('#mSpecs').value.trim(), description:sh.$('#mDesc').value.trim(), photoUrl:photo});
      if(!r.ok){ Kit.toast(r.message || 'Не удалось сохранить', 'error'); return; }
      sh.close(); Kit.toast('Карточка обновлена', 'ok'); renderPark();
    });
  }

  /* ============ БРОНИ ============ */
  const F = [['all','Все'],['pending','Ждут'],['active','В аренде'],['overdue','Просрочены'],['returned','Закрыты'],['cancelled','Отменены']];
  let fil = 'all', ALL = [];
  async function renderBookings(){
    $('#bFilter').innerHTML = html`${F.map(([k, l])=>html`<button type="button" class="chip${fil === k ? ' is-on' : ''}" data-f="${k}">${l}</button>`)}`;
    const r = await api('getAllBookings'); ALL = r.bookings || [];
    drawBookings();
  }
  function drawBookings(){
    const q = $('#q').value.trim().toLowerCase(), qd = q.replace(/\D/g, '');
    const list = ALL.filter(b=> (fil === 'all' || b.status === fil) && (!q || String(b.num).includes(q) || b.client.toLowerCase().includes(q) || b.model.toLowerCase().includes(q) || (qd.length >= 3 && b.phone.includes(qd))));
    $('#bList').innerHTML = list.length ? html`<p class="hint" style="margin-bottom:8px">Найдено: ${list.length}</p><div class="list">${list.slice(0, 100).map(b=>bRow(b, b.status === 'active' || b.status === 'overdue' ? 'ret' : b.status === 'pending' ? 'out' : ''))}</div>`
      : html`<div class="empty">${icon('search')}<div class="empty-title">Ничего не найдено</div></div>`;
  }
  Kit.on($('#bFilter'), 'click', '[data-f]', (e, el)=>{ fil = el.dataset.f; haptic('select'); $$('#bFilter .chip').forEach(c=>c.classList.toggle('is-on', c === el)); drawBookings(); });
  $('#q').addEventListener('input', Kit.debounce(drawBookings, 150));
  Kit.on($('#bList'), 'click', '[data-b]', (e, el)=>{
    const b = ALL.find(x=>x.id === el.dataset.b); if(!b) return;
    if(el.dataset.kind) return openOp(el.dataset.kind === 'ret' ? 'in' : 'out', b);
    Kit.sheet({title:'Бронь № ' + b.num, sub:b.model, body: html`
      <div class="kv"><span class="k">Статус</span><span class="v">${Tools.status(b.status)}</span></div>
      <div class="kv"><span class="k">Клиент</span><span class="v">${b.client}</span></div>
      <div class="kv"><span class="k">Телефон</span><span class="v mono">${Kit.phone.pretty(b.phone)}</span></div>
      <div class="kv"><span class="k">Период</span><span class="v">${Tools.period(b)}</span></div>
      <div class="kv"><span class="k">Сумма</span><span class="v mono">${money(b.total + (b.lateFee || 0))}</span></div>
      ${b.comment ? html`<div class="kv"><span class="k">Заметки</span><span class="v">${b.comment}</span></div>` : ''}`});
  });

  /* ============ НОВАЯ БРОНЬ (по телефону) ============ */
  $('#newBtn').addEventListener('click', async ()=>{
    if(!MODELS.length){ const r = await api('getUnits'); MODELS = r.models || []; }
    const st = {modelId:MODELS[0] && MODELS[0].id, method:'pickup', slot:'day', zone:'z1'};
    const sh = Kit.sheet({title:'Новая бронь', sub:'Для клиента по телефону', body: html`
      <label class="field"><span class="field-label">Инструмент</span><select class="select" id="nModel">${MODELS.filter(m=>m.active !== false).map(m=>html`<option value="${m.id}">${m.name} · ${m.price} BYN</option>`)}</select></label>
      <div class="field-row"><label class="field"><span class="field-label">С</span><input class="input" type="date" id="nFrom" min="${D.today()}" value="${D.today()}"></label>
      <label class="field"><span class="field-label">По</span><input class="input" type="date" id="nTo" min="${D.today()}" value="${D.add(D.today(), 1)}"></label></div>
      <label class="field"><span class="field-label">Клиент</span><input class="input" id="nName" maxlength="80" placeholder="Имя и фамилия"></label>
      <div class="field"><span class="field-label">Телефон</span>${Kit.phone.field('nPhone')}</div>
      <div class="field"><span class="field-label">Получение</span><div class="seg" id="nMethod"><button type="button" data-v="pickup" class="is-on">Самовывоз</button><button type="button" data-v="delivery">Доставка</button></div></div>
      <div id="nDel" hidden>
        <label class="field"><span class="field-label">Адрес</span><input class="input" id="nAddr" maxlength="160"></label>
        <div class="field"><span class="field-label">Время</span><div class="seg" id="nSlot">${SLOTS.map(s=>html`<button type="button" data-v="${s.id}" class="${s.id === 'day' ? 'is-on' : ''}">${s.name}</button>`)}</div></div>
      </div>`,
      actions: html`<button class="btn btn-primary" type="button" data-go>Создать бронь</button>`});
    Kit.phone.bind(sh.$('#nPhone'));
    sh.$('#nFrom').addEventListener('change', e=>{ sh.$('#nTo').min = e.target.value; if(sh.$('#nTo').value < e.target.value) sh.$('#nTo').value = e.target.value; });
    Kit.on(sh.$('#nMethod'), 'click', '[data-v]', (e, el)=>{ st.method = el.dataset.v; sh.el.querySelectorAll('#nMethod button').forEach(b=>b.classList.toggle('is-on', b === el)); sh.$('#nDel').hidden = st.method !== 'delivery'; });
    Kit.on(sh.$('#nSlot'), 'click', '[data-v]', (e, el)=>{ st.slot = el.dataset.v; sh.el.querySelectorAll('#nSlot button').forEach(b=>b.classList.toggle('is-on', b === el)); });
    sh.$('[data-go]').addEventListener('click', async ()=>{
      const ph = sh.$('#nPhone');
      if(sh.$('#nName').value.trim().length < 2){ Kit.toast('Укажите клиента', 'error'); return; }
      if(!Kit.phone.valid(ph)){ Kit.toast('Проверьте телефон', 'error'); return; }
      Kit.busy(sh.$('[data-go]'), true);
      const r = await api('createBookingManual', {modelId:sh.$('#nModel').value, from:sh.$('#nFrom').value, to:sh.$('#nTo').value, client:sh.$('#nName').value.trim(),
        phone:Kit.phone.value(ph), method:st.method, address:sh.$('#nAddr').value.trim(), slot:st.slot, zone:st.zone});
      Kit.busy(sh.$('[data-go]'), false);
      if(!r.ok){ Kit.toast(r.message || 'Не удалось создать', 'error'); return; }
      sh.close(); Kit.toast('Бронь № ' + r.booking.num + ' создана · ' + money(r.booking.total), 'ok');
      if(current === 'today') renderToday(); else if(current === 'bookings') renderBookings();
    });
  });

  let current = 'today';
  const RENDER = {today:renderToday, park:renderPark, bookings:renderBookings};
  Kit.tabs({onChange:(t)=>{ current = t; RENDER[t](); }});
  api('getUnits').then(r=>{ if(!MODELS.length) MODELS = r.models || []; });
})();
</script>
</body>
</html>
