<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Прокат — админ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(){
  try{
    var saved = localStorage.getItem('theme_override');
    var scheme = saved;
    if(!scheme){
      var tg = window.Telegram && window.Telegram.WebApp;
      scheme = (tg && tg.colorScheme) ? tg.colorScheme
        : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    }
    document.documentElement.dataset.theme = scheme;
    var brand = localStorage.getItem('color_scheme_override');
    if (brand) document.documentElement.dataset.brand = brand;
  }catch(e){}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="palettes.css">
<style>
  :root{
    --bg:#111417; --surface:#1A1E22; --surface-2:#20252A; --surface-3:#262B31;
    --ink:#EDEFF0; --ink-soft:#8C949C; --ink-faint:#565D64;
    --accent:#F5A300; --accent-dark:#D88C00; --accent-soft:rgba(245,163,0,.13);
    --accent-2:#38A89D; --accent-2-soft:rgba(56,168,157,.14);
    --warn:#D98324; --warn-soft:rgba(217,131,36,.14);
    --danger:#E5484D; --danger-soft:rgba(229,72,77,.14);
    --line:#2A2F35; --line-strong:#3A414A;
    --radius:14px; --radius-sm:10px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* Светлая тема — включается по цветовой схеме Telegram или системной, см. applyTheme() в скрипте */
  :root[data-theme="light"]{
    --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#F5F6F7; --surface-3:#EBEDEF;
    --ink:#181B1F; --ink-soft:#5C636B; --ink-faint:#8D949B;
    --accent:#B8720A; --accent-dark:#8F5900; --accent-soft:rgba(184,114,10,.12);
    --accent-2:#1F7A6E; --accent-2-soft:rgba(31,122,110,.12);
    --warn:#9C5A0E; --warn-soft:rgba(156,90,14,.12);
    --danger:#C4282E; --danger-soft:rgba(196,40,46,.12);
    --line:#E3E5E8; --line-strong:#CBCED2;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme]),:root[data-theme="light"]{
      --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#F5F6F7; --surface-3:#EBEDEF;
      --ink:#181B1F; --ink-soft:#5C636B; --ink-faint:#8D949B;
      --accent:#B8720A; --accent-dark:#8F5900; --accent-soft:rgba(184,114,10,.12);
      --accent-2:#1F7A6E; --accent-2-soft:rgba(31,122,110,.12);
      --warn:#9C5A0E; --warn-soft:rgba(156,90,14,.12);
      --danger:#C4282E; --danger-soft:rgba(196,40,46,.12);
      --line:#E3E5E8; --line-strong:#CBCED2;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;line-height:1.4;min-height:100vh;padding-bottom:max(100px, calc(74px + env(safe-area-inset-bottom, 34px)));}
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Chakra Petch',sans-serif;font-weight:600;}
  button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;font-size:15px;}

  .power-rail{height:3px;background:linear-gradient(90deg,var(--accent-dark),var(--accent),var(--accent-2));}

  /* topbar */
  .topbar{position:sticky;top:0;z-index:30;padding:calc(14px + var(--safe-top)) 18px 14px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand-mark{width:36px;height:36px;border-radius:8px;background:var(--surface-3);border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:var(--accent);}
  .brand-mark svg{width:18px;height:18px;}
  .brand-name{font-family:'Chakra Petch',sans-serif;font-size:14.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
  .brand-sub{font-size:12.5px;color:var(--ink-faint);margin-top:2px;font-family:'JetBrains Mono',monospace;}
  .topbar-right{display:flex;align-items:center;gap:8px;}
  .role-badge{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.04em;}
  .icon-btn{width:44px;height:44px;border-radius:9px;background:var(--surface-3);border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .icon-btn svg{width:16px;height:16px;}
  .icon-btn.accent{background:var(--accent);color:#15130A;border-color:var(--accent);}
  #themeToggleBtn .icon-moon{display:none;}
  :root[data-theme="light"] #themeToggleBtn .icon-moon{display:block;}
  :root[data-theme="light"] #themeToggleBtn .icon-sun{display:none;}
  .scheme-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;min-height:44px;}
  .scheme-row:last-child{border-bottom:none;}
  .scheme-swatch{width:38px;height:38px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 1px var(--line-strong);}
  .scheme-row.active .scheme-swatch{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent);}
  .scheme-name{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:14.5px;}
  .scheme-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .scheme-check{margin-left:auto;color:var(--accent);flex:0 0 auto;visibility:hidden;}
  .scheme-row.active .scheme-check{visibility:visible;}

  /* screens */
  .screen{padding:16px 16px 8px;display:none;}
  .screen.active{display:block;}
  .section-label{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:600;margin:20px 2px 10px;}
  .section-label:first-child{margin-top:2px;}
  .section-label::after{content:'';flex:1;height:1px;background:var(--line);}
  .section-label .count{color:var(--ink-soft);font-weight:700;}

  /* tabbar */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:8px 10px max(34px, calc(8px + var(--safe-bottom)));display:flex;gap:4px;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 4px;border-radius:10px;color:var(--ink-faint);}
  .tab svg{width:20px;height:20px;}
  .tab span{font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.03em;font-weight:600;}
  .tab.active{color:var(--accent);}

  /* stat cards */
  .stat-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 13px;}
  .stat-card .lbl{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
  .stat-card .val{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;margin-top:4px;color:var(--accent);}

  /* op rows */
  .op-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:8px;}
  .op-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .op-model{font-weight:700;font-size:14px;}
  .op-client{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .op-dates{font-size:12.5px;color:var(--ink-faint);margin-top:3px;font-family:'JetBrains Mono',monospace;}
  .op-addr{font-size:12.5px;color:var(--warn);margin-top:3px;}
  .method-tag{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;padding:3px 8px;border-radius:5px;text-transform:uppercase;white-space:nowrap;}
  .method-tag.pickup{background:var(--accent-2-soft);color:var(--accent-2);}
  .method-tag.delivery{background:var(--accent-soft);color:var(--accent);}
  .op-actions{margin-top:11px;display:flex;gap:8px;}
  .op-actions .btn{flex:1;}

  /* buttons */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 16px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;font-family:'Chakra Petch',sans-serif;text-transform:uppercase;letter-spacing:.03em;text-decoration:none;}
  .btn-primary{background:var(--accent);color:#15130A;}
  .btn-primary:disabled{background:var(--surface-3);color:var(--ink-faint);}
  .btn-ghost{background:var(--surface-3);color:var(--ink);border:1px solid var(--line-strong);}
  .btn-warn{background:var(--warn-soft);color:var(--warn);border:1px solid rgba(217,131,36,.3);}

  .empty-state{text-align:center;padding:44px 20px;color:var(--ink-faint);}
  .empty-state svg{width:34px;height:34px;margin-bottom:10px;opacity:.5;}

  /* inventory */
  .model-group{margin-bottom:16px;}
  .model-group-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 2px;}
  .model-group-head .name{font-weight:700;font-size:13.5px;}
  .model-group-head .right{display:flex;align-items:center;gap:6px;}
  .model-group-head .ratio{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-soft);}
  .unit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .unit-chip{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;border:1px solid var(--line-strong);}
  .unit-chip.free{background:var(--accent-2-soft);color:var(--accent-2);}
  .unit-chip.rented{background:var(--surface-3);color:var(--ink-soft);border-style:dashed;}
  .unit-chip.repair{background:var(--danger-soft);color:var(--danger);}
  .unit-chip.add{background:transparent;color:var(--ink-faint);border-style:dashed;font-size:18px;}

  /* bookings search */
  .search-wrap{position:relative;margin-bottom:8px;}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-faint);pointer-events:none;}
  .search-input{width:100%;padding:10px 12px 10px 34px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);font-size:14px;}
  .search-input::placeholder{color:var(--ink-faint);}
  .search-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

  /* filter chips */
  .filter-row{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;margin-bottom:6px;}
  .filter-row::-webkit-scrollbar{display:none;}
  .fchip{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 13px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}
  .fchip.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
  .status-chip{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;padding:3px 8px;border-radius:5px;white-space:nowrap;text-transform:uppercase;}
  .status-chip.pending_handout,.status-chip.pending_return{background:var(--surface-3);color:var(--ink-soft);}
  .status-chip.active{background:var(--accent-2-soft);color:var(--accent-2);}
  .status-chip.overdue{background:var(--danger-soft);color:var(--danger);}
  .status-chip.returned{background:var(--surface-3);color:var(--ink-faint);}
  .status-toggle{display:flex;align-items:center;gap:6px;width:100%;padding:10px 0 2px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700;min-height:32px;}
  .status-toggle .chevron{width:14px;height:14px;margin-left:auto;transition:transform .2s;flex:0 0 auto;}
  .status-toggle.open .chevron{transform:rotate(180deg);}
  .status-timeline{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .status-timeline.open{max-height:280px;}
  .status-timeline-inner{padding:8px 2px 4px;}
  .status-step{position:relative;display:flex;gap:10px;padding-bottom:14px;}
  .status-step:last-child{padding-bottom:0;}
  .status-step::before{content:'';position:absolute;left:5px;top:14px;bottom:-2px;width:1px;background:var(--line-strong);}
  .status-step:last-child::before{display:none;}
  .status-dot{width:11px;height:11px;border-radius:50%;background:var(--line-strong);flex:0 0 auto;margin-top:2px;position:relative;z-index:1;box-shadow:0 0 0 3px var(--surface);}
  .status-step.done .status-dot{background:var(--accent-2);}
  .status-step.done::before{background:var(--accent-2);}
  .status-step.current .status-dot{background:var(--accent);box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--accent-soft);}
  .status-step.warn .status-dot{background:var(--danger);box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--danger-soft);}
  .status-label{font-size:13px;font-weight:600;color:var(--ink-faint);}
  .status-step.done .status-label,.status-step.current .status-label{color:var(--ink);}
  .status-step.warn .status-label{color:var(--danger);}
  .status-time{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-faint);margin-top:1px;}

  /* sheets */
  .sheet-scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;}
  .sheet-scrim.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:18px 18px 0 0;border-top:1px solid var(--line-strong);max-height:92vh;display:flex;flex-direction:column;transform:translateY(110%);opacity:0;visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s ease, visibility 0s linear .28s;}
  .sheet.open{transform:translateY(0);opacity:1;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s ease, visibility 0s linear 0s;}
  .sheet-handle{width:36px;height:4px;border-radius:3px;background:var(--line-strong);margin:10px auto 4px;}
  .sheet-head{padding:6px 18px 12px;display:flex;align-items:center;justify-content:space-between;}
  .sheet-head h3{font-family:'Chakra Petch',sans-serif;text-transform:uppercase;letter-spacing:.02em;font-size:15px;margin:0;}
  .sheet-body{overflow-y:auto;padding:0 18px max(54px, calc(20px + var(--safe-bottom)));}

  /* forms */
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:7px;text-transform:uppercase;letter-spacing:.03em;}
  .field textarea,.field input,.field select{width:100%;padding:12px 13px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--surface-3);color:var(--ink);}
  .field select option{background:var(--surface-3);}
  .field textarea:focus,.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .field-hint{font-size:12.5px;color:var(--ink-faint);margin-top:5px;font-family:'JetBrains Mono',monospace;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  input[type="date"]{color-scheme:dark;}
  :root[data-theme="light"] input[type="date"]{color-scheme:light;}

  /* unit pick */
  .unit-pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
  .unit-pick{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line-strong);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;color:var(--ink-soft);}
  .unit-pick.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .unit-pick:disabled{opacity:.3;}

  /* condition toggle */
  .toggle-row{display:flex;gap:8px;margin-bottom:14px;}
  .toggle-opt{flex:1;min-height:44px;padding:14px 13px;border-radius:var(--radius-sm);border:1.5px solid var(--line-strong);background:var(--surface-2);text-align:center;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;}
  .toggle-opt svg{width:16px;height:16px;}
  .toggle-opt.ok.selected{border-color:var(--accent-2);background:var(--accent-2-soft);color:var(--accent-2);}
  .toggle-opt.bad.selected{border-color:var(--danger);background:var(--danger-soft);color:var(--danger);}

  /* photo upload in inspection */
  .photo-upload-area{border:1.5px dashed var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-3);display:flex;align-items:center;justify-content:center;min-height:80px;margin-bottom:14px;overflow:hidden;position:relative;cursor:pointer;}
  .photo-upload-area input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .photo-upload-hint{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-faint);pointer-events:none;}
  .photo-upload-hint svg{width:22px;height:22px;}
  .photo-upload-hint span{font-family:'JetBrains Mono',monospace;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;}
  .photo-thumbs{display:flex;gap:8px;flex-wrap:wrap;padding:10px;}
  .photo-thumb{width:70px;height:70px;border-radius:8px;object-fit:cover;border:1px solid var(--line-strong);}

  /* unit detail */
  .unit-detail-info{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:14px;margin-bottom:16px;}
  .unit-detail-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .unit-detail-row:last-child{border-bottom:none;}
  .unit-detail-row .k{color:var(--ink-soft);font-family:'JetBrains Mono',monospace;font-size:13px;}
  .unit-detail-row .v{font-weight:600;}

  /* edit model sheet */
  .edit-photo-preview{width:100%;aspect-ratio:16/9;background:var(--surface-3);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;border:1px solid var(--line-strong);}
  .edit-photo-preview img{width:100%;height:100%;object-fit:cover;}
  .edit-photo-preview .no-photo{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
  .char-count{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink-faint);text-align:right;margin-top:4px;}

  /* loading */
  .loading-screen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  .spinner{width:24px;height:24px;border-radius:4px;border:3px solid var(--line-strong);border-top-color:var(--accent);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-screen span{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}
  .toast{position:fixed;left:16px;right:16px;bottom:max(118px, calc(84px + var(--safe-bottom)));background:var(--surface-3);border:1px solid var(--line-strong);color:var(--ink);padding:13px 16px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:200;transform:translateY(120%);transition:transform .25s ease;display:flex;align-items:center;gap:8px;}
  .toast.show{transform:translateY(0);}
</style>
</head>
<body>
<div class="power-rail"></div>
<div class="loading-screen" id="loadingScreen"><div class="spinner"></div><span>Инициализация…</span></div>

<div id="app" style="display:none;">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
      <div><div class="brand-name" id="brandName">Прокат-Инструмент</div><div class="brand-sub">СМЕНА · <span id="todayDate"></span></div></div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="colorSchemeBtn" aria-label="Цветовая схема">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
      </button>
      <button class="icon-btn" id="themeToggleBtn" aria-label="Переключить тему">

<div class="toast" id="toast"></div>

<script>
/* ============================================================ CONFIG ============================================================ */
const CONFIG = { businessName: "Прокат-Инструмент", apiUrl: "PASTE_APPS_SCRIPT_URL_HERE" };

/* ============================================================ MOCK DATA ============================================================ */
let MOCK_MODELS = [
  { id: "m1", name: "Перфоратор Bosch GBH 2-26", totalQty: 5, specs: "800 Вт · SDS-plus · 2.7 кг", photoUrl: "", description: "Профессиональный перфоратор для сверления в бетоне." },
  { id: "m2", name: "Болгарка Makita 230мм",      totalQty: 4, specs: "2000 Вт · диск 230мм · 5.2 кг", photoUrl: "", description: "Угловая шлифмашина для резки металла и камня." },
  { id: "m3", name: "Бетономешалка 130л",          totalQty: 2, specs: "130 л · 550 Вт · на колёсах", photoUrl: "", description: "Электрическая бетономешалка на стальной раме." },
  { id: "m4", name: "Строительные леса 4×2м",      totalQty: 3, specs: "высота 4м · сталь · площадка 2м", photoUrl: "", description: "Рамные строительные леса из оцинкованной стали." },
  { id: "m5", name: "Триммер бензиновый",          totalQty: 6, specs: "25.4 см³ · катушка+нож · 6.4 кг", photoUrl: "", description: "Бензиновый триммер с катушкой и ножом." },
];

function genUnits() {
  const seeds = { m1:["rented","rented","free","free","repair"], m2:["rented","free","free","free"], m3:["rented","free"], m4:["free","free","free"], m5:["rented","rented","free","free","free","free"] };
  const units = [];
  MOCK_MODELS.forEach(m => {
    const statuses = seeds[m.id] || Array(m.totalQty).fill("free");
    statuses.forEach((st,i) => units.push({ id:`${m.id}-${i+1}`, modelId:m.id, num:i+1, status:st }));
  });
  return units;
}
let MOCK_UNITS = genUnits();

let MOCK_BOOKINGS = [
  { id:"ЗК-1058", modelId:"m1", model:"Перфоратор Bosch GBH 2-26", client:"Игорь Савчук",  phone:"+375 29 111 22 33", from:"2026-07-20", to:"2026-07-23", method:"pickup",   status:"pending_handout" },
  { id:"ЗК-1059", modelId:"m4", model:"Строительные леса 4×2м",     client:"Наталья Дрозд", phone:"+375 33 444 55 66", from:"2026-07-20", to:"2026-07-25", method:"delivery", address:"ул. Сурганова, 12, кв. 5", status:"pending_handout" },
  { id:"ЗК-1051", modelId:"m5", model:"Триммер бензиновый",         client:"Пётр Мельник",  phone:"+375 25 777 88 99", from:"2026-07-17", to:"2026-07-20", method:"delivery", address:"ул. Немига, 3", status:"pending_return" },
  { id:"ЗК-1046", modelId:"m2", model:"Болгарка Makita 230мм",      client:"Сергей Ким",    phone:"+375 29 000 11 22", from:"2026-07-16", to:"2026-07-20", method:"pickup",   status:"pending_return",  unitId:"m2-1" },
  { id:"ЗК-1042", modelId:"m2", model:"Болгарка Makita 230мм",      client:"Анна Реут",     phone:"+375 29 222 33 44", from:"2026-07-14", to:"2026-07-17", method:"pickup",   status:"returned" },
  { id:"ЗК-1039", modelId:"m1", model:"Перфоратор Bosch GBH 2-26", client:"Дмитрий Волк",  phone:"+375 33 555 66 77", from:"2026-07-10", to:"2026-07-14", method:"delivery", address:"ул. Козлова, 8", status:"overdue", unitId:"m1-1" },
  { id:"ЗК-1035", modelId:"m3", model:"Бетономешалка 130л",         client:"Олег Юрчик",    phone:"+375 25 333 22 11", from:"2026-07-08", to:"2026-07-12", method:"pickup",   status:"returned" },
];
// Связываем единицы m1-1 и m2-1 с активными бронями
MOCK_UNITS.find(u => u.id === "m1-1").bookingId = "ЗК-1039";
MOCK_UNITS.find(u => u.id === "m2-1").bookingId = "ЗК-1046";

/* ============================================================ api(action, payload) ============================================================ */
async function api(action, payload) {
  payload = payload || {};
  try {
    if (CONFIG.apiUrl.indexOf('PASTE_') === 0) throw new Error('demo mode');
    const res = await fetch(CONFIG.apiUrl, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action }, payload))
    });
    if (!res.ok) throw new Error('bad response');
    return await res.json();
  } catch (e) {
    return mockApi(action, payload);
  }
}

function mockApi(action, payload) {
  return new Promise((resolve) => {
    setTimeout(() => {
      switch (action) {

        case "getToday": {
          const handout = MOCK_BOOKINGS.filter(b => b.status === "pending_handout");
          const ret     = MOCK_BOOKINGS.filter(b => b.status === "pending_return");
          resolve({ ok:true, handout, ret });
          break;
        }
        case "getUnits":
          resolve({ ok:true, units:MOCK_UNITS, models:MOCK_MODELS });
          break;

        case "getFreeUnits": {
          const free = MOCK_UNITS.filter(u => u.modelId === payload.modelId && u.status === "free");
          resolve({ ok:true, units:free });
          break;
        }
        case "getUnitBooking": {
          const u = MOCK_UNITS.find(x => x.id === payload.unitId);
          const booking = u?.bookingId ? MOCK_BOOKINGS.find(b => b.id === u.bookingId) : null;
          resolve({ ok:true, booking });
          break;
        }

        case "checkOut": {
          const b = MOCK_BOOKINGS.find(x => x.id === payload.bookingId);
          if (b) { b.status = "active"; b.unitId = payload.unitId; }
          const u = MOCK_UNITS.find(x => x.id === payload.unitId);
          if (u) { u.status = "rented"; u.bookingId = payload.bookingId; }
          resolve({ ok:true });
          break;
        }
        case "checkIn": {
          const b = MOCK_BOOKINGS.find(x => x.id === payload.bookingId);
          if (b) { b.status = "returned"; }
          const u = MOCK_UNITS.find(x => x.id === b?.unitId);
          if (u) { u.status = payload.damaged ? "repair" : "free"; delete u.bookingId; }
          resolve({ ok:true });
          break;
        }
        case "setUnitStatus": {
          const u = MOCK_UNITS.find(x => x.id === payload.unitId);
          if (u) u.status = payload.status;
          resolve({ ok:true });
          break;
        }
        case "addUnit": {
          const m = MOCK_MODELS.find(x => x.id === payload.modelId);
          if (m) {
            const cnt = MOCK_UNITS.filter(u => u.modelId === payload.modelId).length;
            MOCK_UNITS.push({ id:`${payload.modelId}-${cnt+1}`, modelId:payload.modelId, num:cnt+1, status:"free" });
            m.totalQty = cnt + 1;
          }
          resolve({ ok:true });
          break;
        }

        case "updateModel": {
          const m = MOCK_MODELS.find(x => x.id === payload.modelId);
          if (m) { m.photoUrl=payload.photoUrl; m.description=payload.description; m.specs=payload.specs; }
          resolve({ ok:true });
          break;
        }

        case "getAllBookings":
          resolve({ ok:true, bookings:MOCK_BOOKINGS });
          break;

        case "createBookingManual": {
          const orderId = "ЗК-" + (2000 + Math.floor(Math.random() * 900));
          const model = MOCK_MODELS.find(m => m.id === payload.modelId);
          MOCK_BOOKINGS.unshift({
            id: orderId,
            modelId: payload.modelId,
            model:  model?.name || "",
            client: payload.client,
            phone:  payload.phone,
            from:   payload.from,
            to:     payload.to,
            method: payload.method,
            address:payload.address || "",
            status: "pending_handout"
          });
          resolve({ ok:true, orderId });
          break;
        }

        case "setDeliveryStatus": {
          const b = MOCK_BOOKINGS.find(x => x.id === payload.bookingId);
          if (b) b.deliveryStatus = payload.status;
          resolve({ ok:true });
          break;
        }

        default:
          resolve({ ok:false, error:"unknown action" });
      }
    }, 220);
  });
}

/* ============================================================ TELEGRAM ============================================================ */
const tg = window.Telegram ? window.Telegram.WebApp : null;
function haptic(style){ if(tg?.HapticFeedback){ if(["success","error","warning"].includes(style)) tg.HapticFeedback.notificationOccurred(style); else tg.HapticFeedback.impactOccurred(style||"light"); } }
function confirmDialog(message){
  return new Promise((resolve)=>{
    if(tg?.showConfirm && tg.isVersionAtLeast?.("6.2")){
      try { tg.showConfirm(message, (ok)=>resolve(ok)); return; } catch(e){}
    }
    resolve(window.confirm(message));
  });
}
function setChrome(){ if(!tg)return; const s=getComputedStyle(document.body); try{tg.setHeaderColor(s.getPropertyValue("--surface").trim());tg.setBackgroundColor(s.getPropertyValue("--bg").trim());}catch(e){} }
function getThemeOverride(){ try{ return localStorage.getItem("theme_override"); }catch(e){ return null; } }
function autoScheme(){ return tg?.colorScheme || (window.matchMedia?.("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
function applyTheme(){
  const scheme = getThemeOverride() || autoScheme();
  document.documentElement.dataset.theme = scheme;
  setChrome();
  updateThemeToggleLabel(scheme);
}
function toggleTheme(){
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  try{ localStorage.setItem("theme_override", next); }catch(e){}
  haptic("light");
  applyTheme();
}
function updateThemeToggleLabel(scheme){
  const btn = document.getElementById("themeToggleBtn");
  if(!btn) return;
  btn.setAttribute("aria-label", scheme === "light" ? "Включить тёмную тему" : "Включить светлую тему");
}
const SCHEME_META = {
  amber:      { label: "Янтарь",     sub: "По умолчанию",              swatch: "linear-gradient(135deg,#F5A300,#38A89D)" },
  industrial: { label: "Индастриал", sub: "Стальной синий + оранжевый", swatch: "linear-gradient(135deg,#3E8FD9,#E8792F)" },
  forest:     { label: "Лесник",     sub: "Зелёный + амбер",            swatch: "linear-gradient(135deg,#4FAE62,#D9A441)" },
  crimson:    { label: "Стройка",    sub: "Красный + графит",           swatch: "linear-gradient(135deg,#E15252,#8A93A6)" },
};
const BRAND_LIST = Object.keys(SCHEME_META);
function getBrand(){ return document.documentElement.dataset.brand || "amber"; }
function applyBrand(brand){
  if(!SCHEME_META[brand]) return;
  document.documentElement.dataset.brand = brand;
  try{ localStorage.setItem("color_scheme_override", brand); }catch(e){}
  setChrome();
}
function renderSchemeList(){
  const active = getBrand();
  document.getElementById("schemeList").innerHTML = BRAND_LIST.map(id => {
    const m = SCHEME_META[id];
    return `<button class="scheme-row${id === active ? " active" : ""}" data-scheme="${id}">
      <div class="scheme-swatch" style="background:${m.swatch};"></div>
      <div><div class="scheme-name">${m.label}</div><div class="scheme-sub">${m.sub}</div></div>
      <svg class="scheme-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M20 6L9 17l-5-5"/></svg>
    </button>`;
  }).join("");
  document.getElementById("schemeList").querySelectorAll(".scheme-row").forEach(row => {
    row.addEventListener("click", () => {
      applyBrand(row.dataset.scheme);
      haptic("light");
      renderSchemeList();
      toast(`Схема «${SCHEME_META[row.dataset.scheme].label}» применена`);
    });
  });
}
function openSchemeSheet(){
  renderSchemeList();
  openSheet("schemeScrim", "schemeSheet");
  haptic("light");
}
function initTelegram(){
  if(!tg){ applyTheme(); return; }
  tg.ready(); tg.expand(); applyTheme();
  tg.onEvent?.("themeChanged", applyTheme);
  // У приложения свой скролл — отключаем свайп-закрытие, иначе Telegram рисует поверх интерфейса свою полосу-индикатор
  if (tg.isVersionAtLeast?.("7.7")) { try { tg.disableVerticalSwipes(); } catch(e) {} }
}

function fmtDate(iso){ if(!iso)return""; const d=new Date(iso); return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function fmtShort(iso){ if(!iso)return""; const d=new Date(iso); return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"}); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2400); }
function escHtml(s){ return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ============================================================ SHEET HELPERS ============================================================ */
function openSheet(scrimId, sheetId){
  document.getElementById(scrimId).classList.add("open"); document.getElementById(sheetId).classList.add("open");
  if (tg?.BackButton) { try { tg.BackButton.show(); tg.BackButton.onClick(() => closeSheet(scrimId, sheetId)); } catch(e) {} }
}
function closeSheet(scrimId, sheetId){
  document.getElementById(scrimId).classList.remove("open"); document.getElementById(sheetId).classList.remove("open");
  if (tg?.BackButton) { try { tg.BackButton.hide(); } catch(e) {} }
}

/* ============================================================ TABS ============================================================ */
document.querySelectorAll(".tab").forEach(el => el.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("screen-" + el.dataset.screen).classList.add("active");
  haptic("light");
  if(el.dataset.screen==="inventory") loadInventory();
  if(el.dataset.screen==="bookings")  loadAllBookings();
}));

/* ============================================================ СЕГОДНЯ ============================================================ */
async function loadToday() {
  const res = await api("getToday", {});
  document.getElementById("statHandout").textContent = res.handout.length;
  document.getElementById("statReturn").textContent  = res.ret.length;
  document.getElementById("handoutCount").textContent = `(${res.handout.length})`;
  document.getElementById("returnCount").textContent  = `(${res.ret.length})`;

  const hList = document.getElementById("handoutList");
  hList.innerHTML = res.handout.length ? res.handout.map(b=>opRowHtml(b,"handout")).join("") :
    emptyState("Выдач на сегодня нет");

  const rList = document.getElementById("returnList");
  rList.innerHTML = res.ret.length ? res.ret.map(b=>opRowHtml(b,"return")).join("") :
    emptyState("Возвратов на сегодня нет");

  document.querySelectorAll("[data-op]").forEach(el=>el.addEventListener("click",()=>openOpSheet(el.dataset.op, el.dataset.id)));
  document.querySelectorAll("[data-courier]").forEach(el=>el.addEventListener("click", async()=>{
    el.disabled=true; el.textContent="Отмечено";
    await api("setDeliveryStatus",{bookingId:el.dataset.courier, status:"out"});
    haptic("success"); toast("Статус доставки обновлён");
  }));
}

function opRowHtml(b, kind) {
  const isDelivery = b.method === "delivery";
  const courierBtn = isDelivery && kind === "handout"
    ? `<button class="btn btn-warn" data-courier="${b.id}" style="padding:12px 10px;font-size:12px;">Курьер выехал</button>`
    : "";
  return `
  <div class="op-row">
    <div class="op-top">
      <div>
        <div class="op-model">${escHtml(b.model)}</div>
        <div class="op-client">${escHtml(b.client)} · ${escHtml(b.phone)}</div>
        <div class="op-dates">${fmtShort(b.from)} — ${fmtShort(b.to)} · ${b.id}</div>
        ${isDelivery && b.address ? `<div class="op-addr">📍 ${escHtml(b.address)}</div>` : ""}
      </div>
      <span class="method-tag ${b.method}">${isDelivery ? "Доставка" : "Самовывоз"}</span>
    </div>

        </button>
      </div>
    </div>
    <div class="field">

  // Выбор единицы

function updateOpConfirm(){
  const btn=document.getElementById("opConfirm"); if(!btn)return;
  const unitOk = opState.kind==="return" || !!opState.unitId;
  btn.disabled = !(unitOk && opState.condition);
}

async function confirmOp() {
  const btn=document.getElementById("opConfirm");
  btn.disabled=true; btn.textContent="Сохраняем…";
  try {
    // В реальном Apps Script здесь загружаем фото в Drive и передаём URL
    let res;
    if(opState.kind==="handout") {
      res = await api("checkOut",{bookingId:opState.booking.id, unitId:opState.unitId, condition:opState.condition, comment:opState.comment});
    } else {
      res = await api("checkIn",{bookingId:opState.booking.id, damaged:opState.condition==="bad", comment:opState.comment});
    }
    if(!res.ok) throw new Error(res.error||"op failed");
    toast(opState.kind==="handout"
      ? "Выдача оформлена, договор и чек отправлены клиенту"
      : (opState.condition==="bad" ? "Возврат принят, единица отправлена в ремонт" : "Возврат принят"));
    haptic("success"); closeOpSheet(); loadToday();
  } catch(e) {
    haptic("error"); toast("Не удалось сохранить, попробуйте ещё раз");
    btn.disabled=false; btn.textContent = opState.kind==="handout"?"Подтвердить выдачу":"Подтвердить возврат";
  }
}

const STATUS_LABEL = { pending_handout:"К выдаче", pending_return:"К возврату", active:"В аренде", overdue:"Просрочено", returned:"Возвращено" };
const STATUS_STEP_INDEX = { pending_handout:1, active:2, pending_return:3, overdue:3, returned:5 };
function renderStatusTimeline(b) {
  const steps = [
    { label: "Бронь оформлена" },
    { label: "Выдача", time: fmtDate(b.from) },
    { label: "В аренде", time: `до ${fmtDate(b.to)}` },
    { label: b.status === "overdue" ? "Просрочен возврат" : "Возврат", time: fmtDate(b.to), warnKey: true },
    { label: "Возвращено" },
  ];
  const curIdx = STATUS_STEP_INDEX[b.status];
  return steps.map((s, i) => {
    let cls = "pending";
    if (i < curIdx) cls = "done";
    else if (i === curIdx) cls = (b.status === "overdue" && s.warnKey) ? "warn" : "current";
    return `<div class="status-step ${cls}">
      <div class="status-dot"></div>
      <div><div class="status-label">${s.label}</div>${s.time ? `<div class="status-time">${s.time}</div>` : ""}</div>
    </div>`;
  }).join("");
}

  const res = await api("getAllBookings",{});
  allBookings = res.bookings;
  renderBookingsList();
}

function renderBookingsList() {
  let list = bookingsFilter==="all" ? allBookings : allBookings.filter(b=>b.status===bookingsFilter);
  if(bookingsSearch) {
    list = list.filter(b=>
      b.client.toLowerCase().includes(bookingsSearch) ||
      b.id.toLowerCase().includes(bookingsSearch) ||
      b.model.toLowerCase().includes(bookingsSearch)
    );
  }
  const wrap = document.getElementById("bookingsAllList");
  wrap.innerHTML = list.length ? list.map(b=>`
    <div class="op-row">
      <div class="op-top">
        <div>
          <div class="op-model">${escHtml(b.model)}</div>
          <div class="op-client">${escHtml(b.client)} · <span class="mono" style="font-size:13px;">${escHtml(b.phone)}</span></div>
          <div class="op-dates">${fmtDate(b.from)} — ${fmtDate(b.to)} · ${b.id}</div>
        </div>
        <span class="status-chip ${b.status}">${STATUS_LABEL[b.status]}</span>
      </div>
      <button class="status-toggle" data-status-toggle="${b.id}">
        <span>Статус аренды</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="status-timeline" id="status-timeline-${b.id}">
        <div class="status-timeline-inner">${renderStatusTimeline(b)}</div>
      </div>
    </div>`).join("") : `<div class="empty-state">Нет броней${bookingsSearch?" по запросу «"+bookingsSearch+"»":""}</div>`;
  wrap.querySelectorAll("[data-status-toggle]").forEach(el => el.addEventListener("click", () => {
    el.classList.toggle("open");
    document.getElementById(`status-timeline-${el.dataset.statusToggle}`).classList.toggle("open");
    haptic("light");
  }));
}

/* ============================================================ INIT ============================================================ */
async function init() {
  initTelegram();
  document.getElementById("brandName").textContent = CONFIG.businessName;
  document.getElementById("todayDate").textContent = new Date().toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric"});
  await loadToday();
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
}
init();
</script>
