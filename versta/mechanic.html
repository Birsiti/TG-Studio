<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ВЕРСТА — механик</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../kit/core.js"></script>
<link rel="stylesheet" href="../kit/base.css">
<link rel="stylesheet" href="brand.css">
<script src="versta.js"></script>
<script src="mock.js"></script>
</head>
<body>
<div class="app has-tabbar">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" id="mark"></div><div class="brand-text"><span class="brand-name">ВЕРСТА</span><span class="brand-role">Механик парка</span></div></div>
    <div class="topbar-actions"><button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button></div>
  </header>
  <section data-panel="release" hidden><div class="page-head"><h1 class="page-title">Выпуск на линию</h1><p class="page-sub" id="relSub"></p></div><div class="stats" id="relStats"></div><div id="relAlert"></div><div class="section" id="relList"></div></section>
  <section data-panel="fleet" hidden><div class="page-head"><h1 class="page-title">Парк</h1><p class="page-sub">Документы, ТО и состояние машин</p></div><div id="fleetList"></div></section>
  <section data-panel="defects" hidden><div class="page-head"><h1 class="page-title">Заявки</h1></div><div class="chips scroll" id="dFilter"></div><button class="add-tile section" type="button" id="dAdd"></button><div class="section" id="dList"></div></section>
  <section data-panel="reg" hidden><div class="page-head"><h1 class="page-title">Регламент ТО</h1><p class="page-sub">По пробегу (≈420 км в день) и по календарю</p></div><div id="regList"></div></section>
</div>
<nav class="tabbar"><div class="tabbar-inner">
  <button type="button" data-tab="release"><span data-ic="shield"></span>Выпуск</button>
  <button type="button" data-tab="fleet"><span data-ic="bus"></span>Парк</button>
  <button type="button" data-tab="defects"><span data-ic="wrench"></span>Заявки</button>
  <button type="button" data-tab="reg"><span data-ic="gauge"></span>Регламент</button>
</div></nav>
<script>
(function(){
  "use strict";
  const {html, icon, $, $$, date: D, num, haptic} = Kit;
  const api = Kit.createApi({bot:'versta', mock: window.VerstaMock});
  $('#mark').innerHTML = icon('wrench');
  $('#dAdd').innerHTML = html`${icon('plus')}Новая заявка`;
  $$('[data-ic]').forEach(el=> el.outerHTML = String(icon(el.dataset.ic)));
  let FLEET = [], DEFECTS = [], CHECK = [];
  const km = n=> num(Math.round(n)) + ' км';
  const plate = p=> html`<span class="plate-tag">${p}</span>`;
  const VST = {'в строю':'pill-ok', 'в ремонте':'pill-danger', 'ожидает з/ч':'pill-warn'};
  const DST = {'новая':'pill-info', 'в работе':'pill-warn', 'ожидает з/ч':'pill-warn', 'устранено':'pill-ok', 'отклонено':'pill-muted'};
  async function loadFleet(){ const r = await api('getFleet'); FLEET = r.fleet || []; return FLEET; }
  const veh = p=> FLEET.find(v=>v.plate === p);
  function docBad(v){ return v.docs.filter(d=>d.days < 0).length; }
  function docSoon(v){ return v.docs.filter(d=>d.days >= 0 && d.days <= 30).length; }

  /* ============ ВЫПУСК ============ */
  async function renderRelease(){
    $('#relSub').textContent = D.dowLong(D.today()).replace(/^./, c=>c.toUpperCase()) + ', ' + D.long(D.today());
    const [r] = await Promise.all([api('getRelease'), loadFleet()]);
    CHECK = r.checklist || [];
    const sh = r.shifts || [];
    const ok = sh.filter(s=>s.insp && s.insp.status === 'допущен').length, wait = sh.filter(s=>!s.insp).length, bad = sh.filter(s=>s.insp && s.insp.status !== 'допущен').length;
    $('#relStats').innerHTML = html`<div class="stat"><div class="stat-label">Допущено</div><div class="stat-value" style="color:var(--ok)">${ok}</div></div>
      <div class="stat"><div class="stat-label">Ждут осмотра</div><div class="stat-value" style="${wait ? 'color:var(--warn)' : ''}">${wait}</div></div>
      <div class="stat"><div class="stat-label">Не допущено</div><div class="stat-value" style="${bad ? 'color:var(--danger)' : ''}">${bad}</div></div>
      <div class="stat"><div class="stat-label">Вне строя</div><div class="stat-value">${FLEET.filter(v=>v.status !== 'в строю').length}</div></div>`;
    $('#relAlert').innerHTML = r.driverAlerts ? html`<button type="button" class="alert-strip break section" style="width:100%" id="toDef">${icon('alert')}<span style="flex:1;text-align:left">Сегодня водители сообщили о поломке: ${r.driverAlerts}</span>${icon('right')}</button>` : '';
    const t = $('#toDef'); if(t) t.addEventListener('click', ()=> tabs.show('defects'));
    $('#relList').innerHTML = html`<div class="list">${sh.map(s=>{ const st = !s.insp ? ['lb-warn', html`<span class="pill pill-warn">ждёт осмотра</span>`, 'Нажмите, чтобы провести осмотр'] : s.insp.status === 'допущен' ? ['lb-ok', html`<span class="pill pill-ok">допущен ${s.insp.time}</span>`, s.insp.waybill + ' · ' + km(s.insp.odo) + (s.insp.note ? ' · ' + s.insp.note : '')] : ['lb-bad', html`<span class="pill pill-danger">не допущен</span>`, s.insp.note];
      return html`<button class="row ${st[0]}" type="button" data-insp="${s.plate}"><span class="row-main"><span class="row-title" style="display:flex;gap:8px;align-items:center">${plate(s.plate)} ${s.driver || 'водитель не назначен'}</span><span class="row-sub">${s.model} · первый рейс ${s.first}</span><span class="row-sub"><b>${st[2]}</b></span></span><span class="row-end">${st[1]}</span></button>`; })}</div>
      ${r.idle && r.idle.length ? html`<div class="section"><div class="eyebrow" style="margin-bottom:8px">Не в наряде</div><div class="list">${r.idle.map(p=>{ const v = veh(p); return html`<button class="row" type="button" data-veh="${p}"><span class="row-main"><span class="row-title" style="display:flex;gap:8px;align-items:center">${plate(p)} ${v ? v.model : ''}</span><span class="row-sub">${v && v.repairNote ? v.repairNote : 'Резерв'}</span></span><span class="row-end"><span class="pill ${VST[v && v.status] || ''}">${v ? v.status : ''}</span></span></button>`; })}</div></div>` : ''}`;
    RELEASE = sh;
  }
  let RELEASE = [];
  Kit.on($('#relList'), 'click', '[data-insp]', (e, el)=> openInspect(RELEASE.find(s=>s.plate === el.dataset.insp)));
  Kit.on($('#relList'), 'click', '[data-veh]', (e, el)=> openVehicle(el.dataset.veh));
  function openInspect(s){
    const v = veh(s.plate) || {docs:[], reg:[], openDefects:0};
    const warn = [];
    v.docs.filter(d=>d.days < 0).forEach(d=>warn.push(d.name + ' — просрочен на ' + (-d.days) + ' дн'));
    v.reg.filter(r=>r.overdue).forEach(r=>warn.push(r.kind + ' — просрочено'));
    if(v.openDefects) warn.push('Открытых заявок: ' + v.openDefects);
    const sh = Kit.sheet({title:'Осмотр ' + s.plate, sub:(s.driver || 'без водителя') + ' · ' + s.first, body: html`
      ${s.insp ? html`<div class="alert-strip ${s.insp.status === 'допущен' ? 'late' : 'break'}" style="${s.insp.status === 'допущен' ? 'background:var(--ok-soft);color:var(--ok)' : ''}">${icon(s.insp.status === 'допущен' ? 'check' : 'x')}<span>Уже ${s.insp.status} в ${s.insp.time}${s.insp.waybill ? ', путевой ' + s.insp.waybill : ''}. Можно провести повторно.</span></div>` : ''}
      ${warn.length ? html`<div class="card card-flat section" style="background:var(--warn-soft);border:0"><b style="color:var(--warn)">Обратите внимание</b>${warn.map(w=>html`<p class="hint" style="margin-top:4px">${w}</p>`)}</div>` : ''}
      <div class="section"><div class="eyebrow" style="margin-bottom:6px">Чек-лист — снимите галочку с неисправного</div><div class="checks" id="chk">${CHECK.map((c, i)=>html`<label><input type="checkbox" data-i="${i}" checked>${c}</label>`)}</div></div>
      <label class="field section"><span class="field-label">Одометр, км</span><input class="input mono" id="odo" inputmode="numeric" value="${v.odo || s.odo}"></label>
      <label class="field"><span class="field-label">Замечание</span><textarea class="textarea" id="note" rows="2" maxlength="300" placeholder="Например: долит омыватель"></textarea></label>`,
      actions: html`<button class="btn btn-danger-soft" type="button" data-pass="0">Не выпускать</button><button class="btn btn-primary" type="button" data-pass="1">Допустить</button>`});
    sh.el.querySelectorAll('[data-pass]').forEach(b=> b.addEventListener('click', async ()=>{
      const passed = b.dataset.pass === '1';
      const failed = Array.from(sh.el.querySelectorAll('#chk input')).filter(i=>!i.checked).map(i=>CHECK[+i.dataset.i]);
      const note = sh.$('#note').value.trim();
      if(passed && failed.length && !await Kit.confirm('Есть неисправные пункты (' + failed.length + '). Всё равно допустить?', 'Допустить')) return;
      if(!passed && !failed.length && !note){ Kit.toast('Отметьте неисправность или напишите замечание', 'error'); return; }
      const odo = parseInt(sh.$('#odo').value.replace(/\D/g, ''), 10);
      Kit.busy(b, true);
      const r = await api('inspect', {plate:s.plate, passed, odo, failed, note});
      Kit.busy(b, false);
      if(!r.ok){ Kit.toast(r.message || 'Проверьте одометр', 'error'); return; }
      sh.close(); haptic(passed ? 'success' : 'warning');
      Kit.toast(passed ? 'Допущен · путевой лист ' + r.insp.waybill : 'Не допущен · заявка ' + r.insp.defectId, passed ? 'ok' : 'error');
      renderRelease();
    }));
  }

  /* ============ ПАРК ============ */
  async function renderFleet(){
    await loadFleet();
    $('#fleetList').innerHTML = html`<div class="list">${FLEET.map(v=>{ const bad = docBad(v), soon = docSoon(v), regOver = v.reg.filter(r=>r.overdue).length;
      const lb = v.status !== 'в строю' || bad || regOver ? 'lb-bad' : soon || v.reg.some(r=>r.soon) ? 'lb-warn' : 'lb-ok';
      return html`<button class="row ${lb}" type="button" data-veh="${v.plate}"><span class="row-main"><span class="row-title" style="display:flex;gap:8px;align-items:center">${plate(v.plate)} ${v.model}</span>
        <span class="row-sub">${v.year} · ${v.seats} мест · ${km(v.odo)}</span>
        <span class="row-sub">${[bad ? 'просрочено документов: ' + bad : '', soon ? 'истекает скоро: ' + soon : '', regOver ? 'ТО просрочено' : '', v.openDefects ? 'заявок: ' + v.openDefects : ''].filter(Boolean).join(' · ') || 'Документы и ТО в порядке'}</span></span>
        <span class="row-end"><span class="pill ${VST[v.status]}">${v.status}</span></span></button>`; })}</div>`;
  }
  Kit.on($('#fleetList'), 'click', '[data-veh]', (e, el)=> openVehicle(el.dataset.veh));
  async function openVehicle(p){
    if(!FLEET.length) await loadFleet();
    const v = veh(p); if(!v) return;
    if(!DEFECTS.length){ const r = await api('getDefects'); DEFECTS = r.defects || []; }
    const open = DEFECTS.filter(d=>d.plate === p && d.status !== 'устранено' && d.status !== 'отклонено');
    const sh = Kit.sheet({title:p, sub:v.model + ', ' + v.year + ' · ' + km(v.odo), body: html`
      ${v.repairNote ? html`<div class="alert-strip break">${icon('wrench')}${v.repairNote}</div>` : ''}
      <div class="field section"><span class="field-label">Состояние</span><div class="seg" id="vst">${['в строю','в ремонте','ожидает з/ч'].map(s=>html`<button type="button" data-v="${s}" class="${v.status === s ? 'is-on' : ''}">${s}</button>`)}</div></div>
      <div class="card section"><div class="eyebrow" style="margin-bottom:6px">Документы</div>${v.docs.map(d=>html`<div class="doc-row"><span>${d.name}</span><span class="${d.days < 0 ? 'pill pill-danger' : d.days <= 30 ? 'pill pill-warn' : 'pill pill-ok'}">${d.days < 0 ? 'просрочен ' + (-d.days) + ' дн' : d.days <= 30 ? 'ещё ' + d.days + ' дн' : 'до ' + D.long(d.until)}</span></div>`)}
        <button class="link-btn" type="button" data-doc>${icon('edit')}Обновить срок документа</button></div>
      <div class="card section"><div class="eyebrow" style="margin-bottom:6px">Последнее ТО</div><p><b>${v.lastService.text || '—'}</b></p><p class="hint">${v.lastService.date ? D.long(v.lastService.date) : ''} · ${v.lastService.km ? km(v.lastService.km) : ''}</p></div>
      <div class="section"><div class="eyebrow" style="margin-bottom:8px">Открытые заявки</div>${open.length ? html`<div class="list">${open.map(d=>html`<button class="row" type="button" data-def="${d.id}"><span class="row-main"><span class="row-title">${d.title}</span><span class="row-sub">${d.id} · ${D.label(d.opened)}</span></span><span class="row-end"><span class="pill ${d.priority === 'критично' ? 'pill-danger' : 'pill-muted'}">${d.priority}</span></span></button>`)}</div>` : html`<div class="empty-mini">Нет</div>`}</div>`});
    Kit.on(sh.$('#vst'), 'click', '[data-v]', async (e, el)=>{
      const r = await api('updateVehicle', {plate:p, status:el.dataset.v});
      if(!r.ok){ Kit.toast('Не удалось', 'error'); return; }
      sh.el.querySelectorAll('#vst button').forEach(b=>b.classList.toggle('is-on', b === el)); haptic('select'); Kit.toast('Статус: ' + el.dataset.v, 'ok'); renderFleet();
    });
    Kit.on(sh.body, 'click', '[data-def]', (e, el)=>{ sh.close(); openDefect(el.dataset.def); });
    sh.$('[data-doc]').addEventListener('click', ()=>{
      const s2 = Kit.sheet({title:'Срок документа', sub:p, body: html`<label class="field"><span class="field-label">Документ</span><select class="select" id="dn">${v.docs.map(d=>html`<option>${d.name}</option>`)}</select></label><label class="field"><span class="field-label">Действует до</span><input class="input" type="date" id="du" value="${D.add(D.today(), 365)}"></label>`,
        actions: html`<button class="btn btn-primary" type="button" data-s>Сохранить</button>`});
      s2.$('[data-s]').addEventListener('click', async ()=>{
        const r = await api('updateVehicle', {plate:p, doc:{name:s2.$('#dn').value, until:s2.$('#du').value}});
        if(!r.ok){ Kit.toast('Не удалось', 'error'); return; }
        s2.close(); sh.close(); Kit.toast('Срок обновлён', 'ok'); await renderFleet(); openVehicle(p);
      });
    });
  }

  /* ============ ЗАЯВКИ ============ */
  let df = 'open';
  const DF = [['open','Открытые'],['critical','Критичные'],['driver','От водителей'],['closed','Закрытые']];
  async function renderDefects(){
    $('#dFilter').innerHTML = html`${DF.map(([k, l])=>html`<button type="button" class="chip${df === k ? ' is-on' : ''}" data-f="${k}">${l}</button>`)}`;
    const r = await api('getDefects'); DEFECTS = r.defects || [];
    const closed = d=> d.status === 'устранено' || d.status === 'отклонено';
    const list = DEFECTS.filter(d=> df === 'open' ? !closed(d) : df === 'critical' ? !closed(d) && d.priority === 'критично' : df === 'driver' ? d.source === 'водитель' : closed(d));
    $('#dList').innerHTML = list.length ? html`<div class="list">${list.map(d=>html`<button class="row ${d.priority === 'критично' && !closed(d) ? 'lb-bad' : ''}" type="button" data-def="${d.id}">
      <span class="row-main"><span class="row-title">${d.title}</span><span class="row-sub" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${plate(d.plate)} ${d.id} · ${D.label(d.opened)} · ${d.source}</span></span>
      <span class="row-end"><span class="pill ${DST[d.status] || ''}">${d.status}</span></span></button>`)}</div>` : html`<div class="empty">${icon('check')}<div class="empty-title">Пусто</div></div>`;
  }
  Kit.on($('#dFilter'), 'click', '[data-f]', (e, el)=>{ df = el.dataset.f; haptic('select'); renderDefects(); });
  Kit.on($('#dList'), 'click', '[data-def]', (e, el)=> openDefect(el.dataset.def));
  function openDefect(id){
    const d = DEFECTS.find(x=>x.id === id); if(!d) return;
    const sh = Kit.sheet({title:d.title, sub:d.id + ' · ' + d.plate + ' · ' + d.ctx, body: html`
      <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill ${d.priority === 'критично' ? 'pill-danger' : 'pill-muted'}">${d.priority}</span><span class="pill ${DST[d.status]}">${d.status}</span><span class="pill pill-muted no-dot">${d.source}: ${d.reporter}</span></div>
      ${d.detail ? html`<p style="margin-top:12px">${d.detail}</p>` : ''}
      <div class="field section"><span class="field-label">Статус</span><div class="seg seg-grid" id="dst">${['новая','в работе','ожидает з/ч','устранено'].map(s=>html`<button type="button" data-v="${s}" class="${d.status === s ? 'is-on' : ''}">${s}</button>`)}</div></div>
      <label class="field"><span class="field-label">Запчасти</span><input class="input" id="parts" maxlength="200" value="${d.parts}"></label>
      <label class="field"><span class="field-label">Запись в журнал</span><textarea class="textarea" id="dnote" rows="2" maxlength="300" placeholder="Что сделано"></textarea></label>
      <div class="section"><div class="eyebrow">Журнал</div>${d.log.length ? html`<ul class="log">${d.log.slice().reverse().map(l=>html`<li>${l.text}<small>${D.label(l.t)} · ${l.who}</small></li>`)}</ul>` : html`<div class="empty-mini">Записей нет</div>`}</div>`,
      actions: html`<button class="btn btn-primary" type="button" data-save>Сохранить</button>`});
    let st = d.status;
    Kit.on(sh.$('#dst'), 'click', '[data-v]', (e, el)=>{ st = el.dataset.v; sh.el.querySelectorAll('#dst button').forEach(b=>b.classList.toggle('is-on', b === el)); haptic('select'); });
    sh.$('[data-save]').addEventListener('click', async ()=>{
      const r = await api('updateDefect', {id:d.id, status:st, parts:sh.$('#parts').value.trim(), note:sh.$('#dnote').value.trim()});
      if(!r.ok){ Kit.toast('Не удалось', 'error'); return; }
      sh.close(); Kit.toast(st === 'устранено' ? 'Заявка закрыта' : 'Сохранено', 'ok'); renderDefects(); loadFleet();
    });
  }
  $('#dAdd').addEventListener('click', async ()=>{
    if(!FLEET.length) await loadFleet();
    let pr = 'плановая';
    const sh = Kit.sheet({title:'Новая заявка', body: html`
      <label class="field"><span class="field-label">Машина</span><select class="select" id="np">${FLEET.map(v=>html`<option value="${v.plate}">${v.plate} · ${v.model}</option>`)}</select></label>
      <label class="field"><span class="field-label">Что не так</span><input class="input" id="nt" maxlength="120" placeholder="Коротко"></label>
      <label class="field"><span class="field-label">Подробнее</span><textarea class="textarea" id="nd" rows="3" maxlength="600"></textarea></label>
      <div class="field"><span class="field-label">Срочность</span><div class="seg" id="npr"><button type="button" data-v="плановая" class="is-on">Плановая</button><button type="button" data-v="критично">Критично</button></div></div>`,
      actions: html`<button class="btn btn-primary" type="button" data-go>Создать</button>`});
    Kit.on(sh.$('#npr'), 'click', '[data-v]', (e, el)=>{ pr = el.dataset.v; sh.el.querySelectorAll('#npr button').forEach(b=>b.classList.toggle('is-on', b === el)); });
    sh.$('[data-go]').addEventListener('click', async ()=>{
      if(sh.$('#nt').value.trim().length < 4){ Kit.toast('Опишите проблему', 'error'); return; }
      const r = await api('createDefect', {plate:sh.$('#np').value, title:sh.$('#nt').value.trim(), detail:sh.$('#nd').value.trim(), priority:pr});
      if(!r.ok){ Kit.toast('Не удалось', 'error'); return; }
      sh.close(); Kit.toast('Заявка ' + r.defect.id + ' создана', 'ok'); df = 'open'; renderDefects();
    });
  });

  /* ============ РЕГЛАМЕНТ ============ */
  async function renderReg(){
    await loadFleet();
    const items = [];
    FLEET.forEach(v=> v.reg.forEach(r=> items.push(Object.assign({plate:v.plate, odo:v.odo}, r))));
    items.sort((a, b)=> a.estDays - b.estDays);
    $('#regList').innerHTML = html`<div class="list">${items.map(r=>html`<button class="row ${r.overdue ? 'lb-bad' : r.soon ? 'lb-warn' : ''}" type="button" data-reg="${r.id}">
      <span class="row-main"><span class="row-title">${r.kind}</span><span class="row-sub" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${plate(r.plate)} ${r.everyKm ? 'каждые ' + km(r.everyKm) + ' · на ' + km(r.dueKm) : 'каждые ' + r.everyDays + ' дн · до ' + D.long(r.dueDate)}</span></span>
      <span class="row-end"><span class="pill ${r.overdue ? 'pill-danger' : r.soon ? 'pill-warn' : 'pill-ok'}">${r.overdue ? 'просрочено' : r.everyKm ? 'через ' + km(r.remainKm) : 'через ' + r.remainDays + ' дн'}</span><span class="hint">≈ ${Math.max(0, r.estDays)} дн</span></span></button>`)}</div>`;
    REG = items;
  }
  let REG = [];
  Kit.on($('#regList'), 'click', '[data-reg]', async (e, el)=>{
    const r = REG.find(x=>x.id === el.dataset.reg);
    const sh = Kit.sheet({title:r.kind, sub:r.plate, body: html`<p>Отметить работу выполненной сегодня?</p>${r.everyKm ? html`<label class="field section"><span class="field-label">Пробег при выполнении, км</span><input class="input mono" id="rkm" inputmode="numeric" value="${r.odo}"></label>` : ''}<label class="field"><span class="field-label">Комментарий</span><input class="input" id="rn" maxlength="200" placeholder="${r.kind}"></label>`,
      actions: html`<button class="btn btn-primary" type="button" data-go>${icon('check')}Выполнено</button>`});
    sh.$('[data-go]').addEventListener('click', async ()=>{
      const kmv = sh.$('#rkm') ? parseInt(sh.$('#rkm').value.replace(/\D/g, ''), 10) : undefined;
      const res = await api('regDone', {id:r.id, km:kmv, note:sh.$('#rn').value.trim()});
      if(!res.ok){ Kit.toast('Не удалось', 'error'); return; }
      sh.close(); Kit.toast('Записано в историю ТО', 'ok'); renderReg();
    });
  });

  const RENDER = {release:renderRelease, fleet:renderFleet, defects:renderDefects, reg:renderReg};
  const tabs = Kit.tabs({onChange:(t)=> RENDER[t]()});
})();
</script>
</body>
</html>
