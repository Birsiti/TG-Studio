<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ВЕРСТА — владелец</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../kit/core.js"></script>
<link rel="stylesheet" href="../kit/base.css">
<link rel="stylesheet" href="brand.css">
<script src="versta.js"></script>
<script src="mock.js"></script>
</head>
<body>
<div class="app has-tabbar">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" id="mark"></div><div class="brand-text"><span class="brand-name">ВЕРСТА</span><span class="brand-role">Владелец</span></div></div>
    <div class="topbar-actions"><button class="icon-btn" id="csv" type="button" aria-label="Выгрузить CSV"></button><button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button></div>
  </header>
  <div class="seg" id="period" style="margin-top:8px"><button type="button" data-d="7" class="is-on">7 дней</button><button type="button" data-d="30">30 дней</button></div>
  <section data-panel="overview" hidden>
    <div class="section route-card" id="hero" style="padding:18px 16px 26px"></div>
    <div class="stats section" id="kpi"></div>
    <div class="card section"><div class="section-head"><h2 class="section-title">Выручка по дням</h2></div><div id="chart"></div></div>
  </section>
  <section data-panel="routes" hidden><div class="page-head"><h1 class="page-title">Направления</h1><p class="page-sub">Выручка — оплаченные посадки</p></div><div id="routes"></div></section>
  <section data-panel="drivers" hidden><div class="page-head"><h1 class="page-title">Водители</h1></div><div id="drivers"></div></section>
</div>
<nav class="tabbar"><div class="tabbar-inner">
  <button type="button" data-tab="overview"><span data-ic="chart"></span>Обзор</button>
  <button type="button" data-tab="routes"><span data-ic="route"></span>Направления</button>
  <button type="button" data-tab="drivers"><span data-ic="users"></span>Водители</button>
</div></nav>
<script>
(function(){
  "use strict";
  const {html, icon, $, $$, money, haptic} = Kit;
  const api = Kit.createApi({bot:'versta', mock: window.VerstaMock});
  $('#mark').innerHTML = icon('bus'); $('#csv').innerHTML = icon('download');
  $$('[data-ic]').forEach(el=> el.outerHTML = String(icon(el.dataset.ic)));
  let days = 7, S = null, tab = 'overview';
  async function load(){ S = await api('getOwnerStats', {days}); }
  function draw(){
    if(!S || !S.ok) return;
    if(tab === 'overview'){
      $('#hero').innerHTML = html`<div class="eyebrow" style="color:rgba(238,241,245,.7)">Выручка за ${days} дней</div>
        <div style="font-family:var(--font-mono);font-weight:700;font-size:40px;color:#fff;margin-top:6px" data-fit="22">${money(S.totalRevenue)}</div>
        <p style="color:rgba(238,241,245,.7);margin-top:4px">в среднем ${money(Math.round(S.totalRevenue / days))} в день</p>`;
      $('#kpi').innerHTML = html`<div class="stat"><div class="stat-label">Сегодня</div><div class="stat-value" data-fit="16">${money(S.todayRevenue)}</div></div>
        <div class="stat"><div class="stat-label">Броней сегодня</div><div class="stat-value">${S.todayBookings}</div></div>
        <div class="stat"><div class="stat-label">Заполняемость</div><div class="stat-value">${S.avgOccupancy}%</div></div>
        <div class="stat"><div class="stat-label">Направлений</div><div class="stat-value">${S.routes.length}</div></div>`;
      $('#chart').innerHTML = Kit.chart.bars(S.chart.map(c=>({label:days <= 7 ? c.dow : String(+c.date.slice(8)), value:c.revenue})), {highlightLast:true, short:v=> v >= 1000 ? (v / 1000).toFixed(1).replace('.0', '') + 'к' : v});
    }
    if(tab === 'routes'){
      $('#routes').innerHTML = html`<div class="list">${S.routes.map((r, i)=>html`<div class="row" style="display:block">
        <div style="display:flex;align-items:center;gap:8px"><span class="mono faint" style="width:18px">${i + 1}</span>${V.code(r.code, true)}<b style="flex:1">${r.from} → ${r.to}</b><span class="mono" style="font-weight:700">${money(r.revenue)}</span></div>
        <div style="margin:8px 0 4px 26px">${V.fill(r.occ, 100)}</div><div class="hint" style="margin-left:26px">${r.trips} рейсов · заполняемость ${r.occ}%</div></div>`)}</div>`;
    }
    if(tab === 'drivers'){
      $('#drivers').innerHTML = html`<div class="list">${S.drivers.map(d=>html`<div class="row"><span class="avatar">${Kit.initials(d.name)}</span>
        <span class="row-main"><span class="row-title">${d.name}</span><span class="row-sub">${d.trips} рейсов · ${d.passengers} пассажиров · заполн. ${d.occ}%</span><span class="row-sub"${d.noShows > 5 ? Kit.raw(' style="color:var(--danger)"') : ''}>Не пришли: ${d.noShows}</span></span>
        <span class="mono" style="font-weight:700">${money(d.revenue)}</span></div>`)}</div>`;
    }
  }
  Kit.on($('#period'), 'click', '[data-d]', async (e, el)=>{ days = +el.dataset.d; haptic('select'); $$('#period button').forEach(b=>b.classList.toggle('is-on', b === el)); await load(); draw(); });
  $('#csv').addEventListener('click', ()=>{
    if(!S) return;
    Kit.csv('versta-' + days + 'd.csv', [['Код','Откуда','Куда','Рейсов','Заполняемость %','Выручка BYN']].concat(S.routes.map(r=>[r.code, r.from, r.to, r.trips, r.occ, r.revenue])));
  });
  Kit.tabs({onChange:async (t)=>{ tab = t; if(!S) await load(); draw(); }});
})();
</script>
</body>
</html>
