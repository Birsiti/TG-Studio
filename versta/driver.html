<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ВЕРСТА — водитель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../kit/core.js"></script>
<link rel="stylesheet" href="../kit/base.css">
<link rel="stylesheet" href="brand.css">
<script src="versta.js"></script>
<script src="mock.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" id="mark"></div><div class="brand-text"><span class="brand-name">ВЕРСТА</span><span class="brand-role" id="role">Водитель</span></div></div>
    <div class="topbar-actions"><button class="icon-btn" id="who" type="button" aria-label="Сменить водителя" hidden></button><button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button></div>
  </header>
  <main id="view"></main>
</div>
<script>
(function(){
  "use strict";
  const {html, icon, $, date: D, money, haptic} = Kit;
  const api = Kit.createApi({bot:'versta', mock: window.VerstaMock});
  $('#mark').innerHTML = icon('bus');
  $('#who').innerHTML = icon('users');
  const view = $('#view');
  let me = null, trips = [], openId = null;
  try{ me = JSON.parse(localStorage.getItem('versta-driver') || 'null'); }catch(e){}

  /* ============ ВЫБОР ВОДИТЕЛЯ (демо: в бою — по Telegram id) ============ */
  async function renderPick(){
    $('#who').hidden = true; $('#role').textContent = 'Водитель';
    view.innerHTML = '<div class="skel" style="height:260px;margin-top:12px"></div>';
    const r = await api('getDrivers');
    view.innerHTML = html`<div class="screen"><div class="page-head"><h1 class="page-title">Кто за рулём?</h1><p class="page-sub">В демо выберите водителя. В рабочем боте кабинет откроется сразу по Telegram-аккаунту.</p></div>
      <div class="list">${(r.drivers || []).map(d=>html`<button class="row" type="button" data-d="${d.id}"><span class="avatar">${Kit.initials(d.name)}</span><span class="row-main"><span class="row-title">${d.name}</span><span class="row-sub">${d.tripsToday ? 'Сегодня ' + d.tripsToday + ' ' + Kit.plural(d.tripsToday, 'рейс', 'рейса', 'рейсов') : 'Сегодня выходной'}</span></span>${icon('right', 'row-chev')}</button>`)}</div></div>`;
    Kit.on(view, 'click', '[data-d]', (e, el)=>{
      const d = (r.drivers || []).find(x=>x.id === el.dataset.d);
      me = {id:d.id, name:d.name}; try{ localStorage.setItem('versta-driver', JSON.stringify(me)); }catch(e){}
      haptic('select'); renderList();
    });
  }
  $('#who').addEventListener('click', ()=>{ me = null; try{ localStorage.removeItem('versta-driver'); }catch(e){} renderPick(); });

  /* ============ МОИ РЕЙСЫ ============ */
  async function load(){ const r = await api('getDriverTrips', {driverId:me.id}); trips = r.trips || []; }
  async function renderList(){
    $('#who').hidden = false; $('#role').textContent = me.name;
    view.innerHTML = '<div class="skel" style="height:260px;margin-top:12px"></div>';
    await load();
    const today = trips.filter(t=>t.date === D.today()), tomorrow = trips.filter(t=>t.date !== D.today());
    const block = (title, list)=> list.length ? html`<div class="section"><div class="section-head"><h2 class="section-title">${title}</h2></div><div class="list">${list.map(t=>html`<button class="row" type="button" data-t="${t.id}"${t.cancelled ? Kit.raw(' style="opacity:.5"') : ''}>
      <span class="mono" style="font-weight:700;font-size:20px;width:60px">${t.time}</span>
      <span class="row-main"><span class="row-title">${V.code(t.code, true)} ${t.from} → ${t.to}</span><span class="row-sub">${t.filled}/${t.seatsTotal} мест · ${t.vehicle ? t.vehicle.plate : 'машина не назначена'}</span></span>
      <span class="row-end">${t.cancelled ? html`<span class="pill pill-muted">отменён</span>` : V.drv(t.driverStatus)}</span></button>`)}</div></div>` : '';
    view.innerHTML = html`<div class="screen"><div class="page-head"><h1 class="page-title">Мои рейсы</h1><p class="page-sub">${D.dowLong(D.today()).replace(/^./, c=>c.toUpperCase())}, ${D.long(D.today())}</p></div>
      ${trips.length ? '' : html`<div class="empty">${icon('calendar')}<div class="empty-title">Рейсов нет</div>На сегодня и завтра вы не назначены</div>`}
      ${block('Сегодня', today)}${block('Завтра', tomorrow)}</div>`;
    Kit.on(view, 'click', '[data-t]', (e, el)=>{ openId = el.dataset.t; Kit.back.push(closeTrip); renderTrip(); });
  }
  function closeTrip(){ Kit.back.pop(closeTrip); openId = null; renderList(); }

  /* ============ РЕЙС ============ */
  function renderTrip(){
    const t = trips.find(x=>x.id === openId); if(!t) return closeTrip();
    const pts = t.points;
    const byStop = pts.map((p, i)=>({p, i, on:t.bookings.filter(b=>b.pickupIdx === i), off:t.bookings.filter(b=>b.dropoffIdx === i)}));
    const boarded = t.bookings.filter(b=>b.status === 'посажен').reduce((a, b)=>a + b.seats, 0);
    const cash = t.bookings.filter(b=>b.status !== 'не пришёл').reduce((a, b)=>a + b.price, 0);
    window.scrollTo(0, 0);
    view.innerHTML = html`<div class="screen">
      <div class="wiz-head" style="display:flex;align-items:center;gap:8px;padding-top:8px"><button class="icon-btn" type="button" id="back" aria-label="Назад">${icon('left')}</button><span class="eyebrow">${D.label(t.date)} · ${t.vehicle ? t.vehicle.plate + ' ' + t.vehicle.model : 'машина не назначена'}</span></div>
      <h1 class="page-title" style="display:flex;gap:10px;align-items:center;margin-top:4px">${V.code(t.code)} ${t.from} → ${t.to}</h1>
      <p class="page-sub">Отправление ${t.time} · прибытие ${t.arrival} · ${V.dur(t.duration)}</p>
      <div class="stats three section">
        <div class="stat"><div class="stat-label">Мест</div><div class="stat-value">${t.filled}/${t.seatsTotal}</div></div>
        <div class="stat"><div class="stat-label">В салоне</div><div class="stat-value">${boarded}</div></div>
        <div class="stat"><div class="stat-label">Наличные</div><div class="stat-value" data-fit="14">${money(cash)}</div></div>
      </div>
      <div class="section">${t.cancelled ? html`<div class="alert-strip break">${icon('x')}Рейс отменён диспетчером</div>`
        : t.driverStatus === 'ожидание' ? html`<button class="big-action go" type="button" data-st="в пути">${icon('play')}Начать рейс</button>`
        : t.driverStatus === 'в пути' ? html`<button class="big-action finish" type="button" data-st="завершён">${icon('flag')}Завершить рейс</button>`
        : html`<div class="big-action done">${icon('check')}Рейс завершён</div>`}</div>
      ${t.cancelled || t.driverStatus === 'завершён' ? '' : html`<div class="card section"><div class="eyebrow" style="margin-bottom:10px">Связь с диспетчером</div>
        ${t.alert ? html`<div class="alert-strip ${t.alert.type === 'опаздываю' ? 'late' : 'break'}">${icon(t.alert.type === 'опаздываю' ? 'clock' : 'wrench')}<span style="flex:1">Диспетчер уведомлён: ${t.alert.type}${t.alert.defectId ? ' · заявка механику ' + t.alert.defectId : ''}</span></div><button class="link-btn" type="button" data-alert="">Отменить сообщение</button>`
          : html`<div class="btn-row"><button class="btn btn-ghost" type="button" data-alert="опаздываю">${icon('clock')}Опаздываю</button><button class="btn btn-ghost" type="button" data-alert="поломка">${icon('wrench')}Поломка</button></div>`}</div>`}
      <div class="section"><div class="section-head"><h2 class="section-title">Посадка по остановкам</h2></div>
        <div class="card">${byStop.map(s=>html`<div style="padding:10px 0;border-bottom:1px dashed var(--line)">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline"><b>${s.p.name}</b><span class="mono hint">${V.addMin(t.time, s.p.offset)}</span></div>
          ${s.off.length ? html`<p class="hint" style="margin-top:4px">Выходят: ${s.off.map(b=>b.name.split(' ')[0] + (b.seats > 1 ? ' ×' + b.seats : '')).join(', ')}</p>` : ''}
          ${s.on.map(b=>html`<div class="pax" style="margin-top:10px"><span class="row-main"><span class="row-title">${b.name}${b.seats > 1 ? ' · ' + b.seats + ' места' : ''}</span><span class="row-sub">до ${b.dropoff.split(',')[0]} · ${money(b.price)} · <a class="mono" href="tel:${b.phone}">позвонить</a></span></span>
            <span class="pax-acts"><button class="icon-btn${b.status === 'посажен' ? ' is-on' : ''}" type="button" data-b="${b.id}" data-v="${b.status === 'посажен' ? 'ожидание' : 'посажен'}" aria-label="Посадил">${icon('check')}</button><button class="icon-btn${b.status === 'не пришёл' ? ' is-no' : ''}" type="button" data-b="${b.id}" data-v="${b.status === 'не пришёл' ? 'ожидание' : 'не пришёл'}" aria-label="Не пришёл">${icon('x')}</button></span></div>`)}
          ${!s.on.length && !s.off.length ? html`<p class="hint" style="margin-top:4px">Без посадки и высадки</p>` : ''}
        </div>`)}</div></div>
    </div>`;
    $('#back').addEventListener('click', closeTrip);
    const st = view.querySelector('[data-st]');
    if(st) st.addEventListener('click', async ()=>{
      const v = st.dataset.st;
      if(v === 'завершён'){
        const waiting = t.bookings.filter(b=>b.status === 'ожидание').length;
        if(!await Kit.confirm('Завершить рейс?' + (waiting ? ' ' + waiting + ' без отметки — будут «не пришёл».' : ''), 'Завершить')) return;
      }
      const r = await api('setDriverStatus', {id:t.id, status:v});
      if(!r.ok){ Kit.toast('Не удалось', 'error'); return; }
      haptic('success'); Kit.toast(v === 'в пути' ? 'Рейс начат — пассажиры видят, что вы выехали' : 'Рейс завершён', 'ok');
      await load(); renderTrip();
    });
    view.querySelectorAll('[data-alert]').forEach(b=> b.addEventListener('click', async ()=>{
      const type = b.dataset.alert;
      if(type === 'поломка' && !await Kit.confirm('Сообщить о поломке? Диспетчер и механик получат заявку.', 'Сообщить')) return;
      const r = await api('driverAlert', {tripId:t.id, type:type || null});
      if(!r.ok){ Kit.toast('Не удалось отправить', 'error'); return; }
      haptic(type ? 'warning' : 'light'); Kit.toast(type ? 'Диспетчер уведомлён' : 'Сообщение отменено', 'ok');
      await load(); renderTrip();
    }));
    view.querySelectorAll('[data-b]').forEach(b=> b.addEventListener('click', async ()=>{
      const r = await api('setBookingStatus', {id:b.dataset.b, status:b.dataset.v});
      if(!r.ok){ Kit.toast('Не удалось', 'error'); return; }
      haptic('select'); await load(); renderTrip();
    }));
  }

  if(me) renderList(); else renderPick();
})();
</script>
</body>
</html>
