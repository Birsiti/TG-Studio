<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ВЕРСТА — диспетчер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../kit/core.js"></script>
<link rel="stylesheet" href="../kit/base.css">
<link rel="stylesheet" href="brand.css">
<script src="versta.js"></script>
<script src="mock.js"></script>
</head>
<body>
<div class="app has-tabbar">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" id="mark"></div><div class="brand-text"><span class="brand-name">ВЕРСТА</span><span class="brand-role">Диспетчерская</span></div></div>
    <div class="topbar-actions"><button class="icon-btn" id="refresh" type="button" aria-label="Обновить"></button><button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button></div>
  </header>

  <section data-panel="today" hidden>
    <div class="page-head"><h1 class="page-title">Сегодня</h1><p class="page-sub" id="tSub"></p></div>
    <div class="stats" id="tStats"></div>
    <div id="tAlerts"></div>
    <div class="section"><div class="section-head"><h2 class="section-title">Ближайшие рейсы</h2></div><div id="tList"></div></div>
  </section>

  <section data-panel="trips" hidden>
    <div class="page-head"><h1 class="page-title">Рейсы</h1></div>
    <div class="days" id="rDays"></div>
    <div class="section" id="rList"></div>
  </section>

  <section data-panel="schedule" hidden>
    <div class="page-head"><h1 class="page-title">Расписание</h1><p class="page-sub">Шаблоны создают рейсы на неделю вперёд</p></div>
    <button class="add-tile" type="button" id="tplAdd"></button>
    <div id="tplList"></div>
  </section>

  <section data-panel="bookings" hidden>
    <div class="page-head"><h1 class="page-title">Брони</h1></div>
    <div class="search"><span id="sIc"></span><input class="input" id="q" type="search" placeholder="Имя, телефон или код" autocomplete="off"></div>
    <div class="chips scroll" id="bFilter" style="margin-top:12px"></div>
    <div class="section" id="bList"></div>
  </section>
</div>

<nav class="tabbar"><div class="tabbar-inner">
  <button type="button" data-tab="today"><span data-ic="home"></span>Сегодня</button>
  <button type="button" data-tab="trips"><span data-ic="bus"></span>Рейсы</button>
  <button type="button" data-tab="schedule"><span data-ic="calendar"></span>Расписание</button>
  <button type="button" data-tab="bookings"><span data-ic="ticket"></span>Брони</button>
</div></nav>

<script>
(function(){
  "use strict";
  const {html, icon, $, $$, date: D, money, haptic} = Kit;
  const api = Kit.createApi({bot:'versta', mock: window.VerstaMock});
  $('#mark').innerHTML = icon('bus');
  $('#refresh').innerHTML = icon('refresh');
  $('#tplAdd').innerHTML = html`${icon('plus')}Новый регулярный рейс`;
  $('#sIc').outerHTML = String(icon('search'));
  $$('[data-ic]').forEach(el=> el.outerHTML = String(icon(el.dataset.ic)));
  let REFS = {routes:[], drivers:[], vehicles:[]};
  const DAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  function tripRow(t){
    return html`<button class="row trip-row${t.alert ? ' lb-bad' : ''}" type="button" data-t="${t.id}"${t.cancelled ? Kit.raw(' style="opacity:.5"') : ''}>
      <span class="mono" style="font-weight:700;font-size:18px;width:54px;flex:none">${t.time}</span>
      <span class="row-main"><span class="row-title">${V.code(t.code, true)} ${t.from} → ${t.to}</span>
        <span class="row-sub">${t.cancelled ? 'Рейс отменён' : (t.driver ? t.driver.name.split(' ')[0] : 'нет водителя') + ' · ' + t.filled + '/' + t.seatsTotal + ' мест'}${t.alert ? ' · ' + t.alert.type : ''}</span>
        ${t.cancelled ? '' : html`<span style="display:block;margin-top:6px">${V.fill(t.filled, t.seatsTotal)}</span>`}</span>
      <span class="row-end">${t.cancelled ? html`<span class="pill pill-muted">отменён</span>` : !t.driver ? html`<span class="pill pill-warn">без водителя</span>` : V.drv(t.driverStatus)}</span></button>`;
  }

  /* ============ СЕГОДНЯ ============ */
  async function renderToday(){
    $('#tSub').textContent = D.dowLong(D.today()).replace(/^./, c=>c.toUpperCase()) + ', ' + D.long(D.today());
    const r = await api('getDay', {date:D.today()});
    const s = r.stats;
    $('#tStats').innerHTML = html`
      <div class="stat"><div class="stat-label">Рейсов</div><div class="stat-value">${s.trips}</div></div>
      <div class="stat"><div class="stat-label">Заполнено</div><div class="stat-value">${s.capacity ? Math.round(s.seats / s.capacity * 100) : 0}%</div><div class="stat-delta hint">${s.seats} из ${s.capacity} мест</div></div>
      <div class="stat"><div class="stat-label">Без водителя</div><div class="stat-value" style="${s.noDriver ? 'color:var(--warn)' : ''}">${s.noDriver}</div></div>
      <div class="stat"><div class="stat-label">Сигналы</div><div class="stat-value" style="${s.alerts ? 'color:var(--danger)' : ''}">${s.alerts}</div></div>`;
    const alerts = r.trips.filter(t=>t.alert && !t.cancelled);
    $('#tAlerts').innerHTML = alerts.length ? html`<div class="section">${alerts.map(t=>html`<button type="button" class="alert-strip ${t.alert.type === 'опаздываю' ? 'late' : 'break'}" data-t="${t.id}" style="width:100%;margin-bottom:8px">${icon(t.alert.type === 'опаздываю' ? 'clock' : 'wrench')}<span style="flex:1;text-align:left">${t.driver ? t.driver.name : 'Водитель'}: ${t.alert.type} · ${t.code} ${t.time}</span><span class="mono">${t.alert.time}</span></button>`)}</div>` : '';
    const nowM = D.nowMinutes();
    const next = r.trips.filter(t=>D.toMinutes(t.time) + t.duration >= nowM).slice(0, 12);
    $('#tList').innerHTML = next.length ? html`<div class="list">${next.map(tripRow)}</div>` : html`<div class="card card-flat"><div class="empty-mini">На сегодня рейсы закончились — проверьте завтра на вкладке «Рейсы»</div></div>`;
  }

  /* ============ РЕЙСЫ ============ */
  let rDay = D.today();
  async function renderTrips(){
    $('#rDays').innerHTML = html`${Array.from({length:8}, (_, i)=>D.add(D.today(), i - 1)).map(k=>html`<button type="button" class="day${k === rDay ? ' is-on' : ''}" data-day="${k}"><span class="day-dow">${k === D.today() ? 'сег' : D.dow(k)}</span><span class="day-num">${D.day(k)}</span></button>`)}`;
    $('#rList').innerHTML = '<div class="skel" style="height:300px"></div>';
    const r = await api('getDay', {date:rDay});
    const groups = {};
    r.trips.forEach(t=>{ (groups[t.code + ' ' + t.from + ' → ' + t.to] = groups[t.code + ' ' + t.from + ' → ' + t.to] || []).push(t); });
    $('#rList').innerHTML = r.trips.length ? html`<p class="hint" style="margin-bottom:8px">${r.stats.trips} рейсов · занято ${r.stats.seats} из ${r.stats.capacity} мест</p><div class="list">${r.trips.map(tripRow)}</div>` : html`<div class="empty">${icon('bus')}<div class="empty-title">Рейсов нет</div></div>`;
  }
  Kit.on($('#rDays'), 'click', '[data-day]', (e, el)=>{ rDay = el.dataset.day; haptic('select'); renderTrips(); });
  ['#tList', '#rList', '#tAlerts'].forEach(s=> Kit.on($(s), 'click', '[data-t]', (e, el)=> openTrip(el.dataset.t)));

  /* ============ КАРТОЧКА РЕЙСА ============ */
  async function openTrip(id){
    const sh = Kit.sheet({title:'Рейс', body:html`<div class="skel" style="height:240px"></div>`});
    const draw = (t)=>{
      sh.el.querySelector('.sheet-title').innerHTML = html`${V.code(t.code, true)} ${t.from} → ${t.to}`;
      sh.el.querySelector('.sheet-sub') && (sh.el.querySelector('.sheet-sub').textContent = '');
      sh.body.innerHTML = html`
        <div class="eyebrow">${D.label(t.date)}, ${t.time} → ${t.arrival} · ${V.dur(t.duration)}</div>
        ${t.alert ? html`<div class="alert-strip ${t.alert.type === 'опаздываю' ? 'late' : 'break'}" style="margin-top:12px">${icon(t.alert.type === 'опаздываю' ? 'clock' : 'wrench')}<span style="flex:1">Водитель: ${t.alert.type} (${t.alert.time})${t.alert.defectId ? ' · заявка ' + t.alert.defectId : ''}</span><button class="btn btn-sm btn-ghost" type="button" data-dismiss>Прочитано</button></div>` : ''}
        ${t.cancelled ? html`<div class="alert-strip break" style="margin-top:12px">${icon('x')}Рейс отменён${t.bookings.length ? ' — пассажиры получат уведомление' : ''}</div>` : ''}
        <div class="field-row section">
          <label class="field"><span class="field-label">Водитель</span><select class="select" id="drv"><option value="">Не назначен</option>${REFS.drivers.map(d=>html`<option value="${d.id}" ${t.driver && t.driver.id === d.id ? Kit.raw('selected') : ''}>${d.name}</option>`)}</select></label>
        </div>
        <label class="field"><span class="field-label">Машина</span><select class="select" id="veh"><option value="">Не назначена</option>${REFS.vehicles.map(v=>html`<option value="${v.plate}" ${t.vehicle && t.vehicle.plate === v.plate ? Kit.raw('selected') : ''}>${v.plate} · ${v.model}${v.status !== 'в строю' ? ' (' + v.status + ')' : ''}</option>`)}</select></label>
        <div style="margin:4px 0 6px">${V.fill(t.filled, t.seatsTotal)}</div><p class="hint">Занято ${t.filled} из ${t.seatsTotal} мест · ${V.drv(t.driverStatus)}</p>
        <div class="section"><div class="section-head"><h3 class="section-title">Пассажиры · ${t.bookings.length}</h3></div>
        ${t.bookings.length ? html`<div class="list">${t.bookings.map(b=>html`<div class="row" style="flex-wrap:wrap">
          <span class="row-main"><span class="row-title">${b.name} · ${b.seats} ${Kit.plural(b.seats, 'место', 'места', 'мест')}</span><span class="row-sub">${b.pickup.split(',')[0]} → ${b.dropoff.split(',')[0]} · ${money(b.price)} · <span class="mono">${b.code}</span></span><span class="row-sub">${V.phoneLink(b.phone)}</span></span>
          <span class="row-end">${V.pax(b.status)}</span>
          <div class="seg" style="width:100%;margin-top:6px" data-b="${b.id}">${['ожидание', 'посажен', 'не пришёл'].map(s=>html`<button type="button" data-v="${s}" class="${b.status === s ? 'is-on' : ''}">${s === 'ожидание' ? 'Ждёт' : s === 'посажен' ? 'Посажен' : 'Не пришёл'}</button>`)}</div></div>`)}</div>`
          : html`<div class="empty-mini">Пока никто не забронировал</div>`}</div>
        <button class="btn ${t.cancelled ? 'btn-soft' : 'btn-danger-soft'} btn-block section" type="button" data-cancel>${t.cancelled ? 'Восстановить рейс' : 'Отменить рейс'}</button>`;
      const upd = async (patch, msg)=>{
        const r = await api('updateTrip', Object.assign({id:t.id}, patch));
        if(!r.ok){ Kit.toast('Не удалось сохранить', 'error'); return; }
        draw(r.trip); msg && Kit.toast(msg, 'ok'); refreshVisible();
      };
      sh.$('#drv').addEventListener('change', e=> upd({driverId:e.target.value || null}, e.target.value ? 'Водитель назначен — пассажиры получат его контакт' : 'Водитель снят'));
      sh.$('#veh').addEventListener('change', e=> upd({vehicle:e.target.value || null}, 'Машина назначена'));
      const dis = sh.$('[data-dismiss]'); if(dis) dis.addEventListener('click', ()=> upd({dismissAlert:true}));
      sh.$('[data-cancel]').addEventListener('click', async ()=>{
        if(!t.cancelled && !await Kit.confirm('Отменить рейс ' + t.time + '? ' + (t.bookings.length ? t.bookings.length + ' ' + Kit.plural(t.bookings.length, 'пассажир получит', 'пассажира получат', 'пассажиров получат') + ' уведомление.' : ''), 'Отменить рейс', true)) return;
        upd({cancelled:!t.cancelled}, t.cancelled ? 'Рейс восстановлен' : 'Рейс отменён');
      });
      sh.body.querySelectorAll('[data-b]').forEach(seg=> Kit.on(seg, 'click', '[data-v]', async (e, el)=>{
        const r = await api('setBookingStatus', {id:seg.dataset.b, status:el.dataset.v});
        if(!r.ok){ Kit.toast('Не удалось', 'error'); return; }
        seg.querySelectorAll('button').forEach(b=>b.classList.toggle('is-on', b === el)); haptic('select');
      }));
    };
    const r = await api('getTrip', {id});
    if(!r.ok){ sh.close(); Kit.toast('Рейс не найден', 'error'); return; }
    draw(r.trip);
  }

  /* ============ РАСПИСАНИЕ ============ */
  let TPL = [];
  async function renderSchedule(){
    const r = await api('getTemplates'); TPL = r.templates || [];
    const groups = {};
    TPL.forEach(t=>{ const k = t.code + '|' + t.from + ' → ' + t.to; (groups[k] = groups[k] || []).push(t); });
    $('#tplList').innerHTML = html`${Object.keys(groups).map(k=>{ const [c, name] = k.split('|'); return html`<div class="section"><div class="section-head"><h2 class="section-title" style="display:flex;gap:8px;align-items:center">${V.code(c, true)} ${name}</h2></div>
      <div class="list">${groups[k].sort((a, b)=>a.time.localeCompare(b.time)).map(t=>html`<button class="row" type="button" data-tp="${t.id}"${t.active ? '' : Kit.raw(' style="opacity:.5"')}><span class="mono" style="font-weight:700;font-size:18px;width:54px">${t.time}</span>
        <span class="row-main"><span class="row-title">${t.days.length === 7 ? 'Ежедневно' : t.days.map(d=>DAYS[d]).join(', ')}</span><span class="row-sub">${t.seatsTotal} мест${t.active ? '' : ' · на паузе'}</span></span>${icon('right', 'row-chev')}</button>`)}</div></div>`; })}`;
  }
  Kit.on($('#tplList'), 'click', '[data-tp]', (e, el)=> openTpl(TPL.find(t=>t.id === el.dataset.tp)));
  $('#tplAdd').addEventListener('click', ()=> openTpl(null));
  function openTpl(t){
    const isNew = !t;
    t = t || {routeId:REFS.routes[0] && REFS.routes[0].id, time:'12:00', seatsTotal:16, days:[0,1,2,3,4,5,6], active:true};
    let days = t.days.slice();
    const sh = Kit.sheet({title:isNew ? 'Новый рейс в расписании' : 'Рейс ' + t.time, body: html`
      <label class="field"><span class="field-label">Направление</span><select class="select" id="tRoute">${REFS.routes.map(r=>html`<option value="${r.id}" ${r.id === t.routeId ? Kit.raw('selected') : ''}>${r.code} · ${r.from} → ${r.to}</option>`)}</select></label>
      <div class="field-row"><label class="field"><span class="field-label">Отправление</span><input class="input" type="time" id="tTime" value="${t.time}"></label><label class="field"><span class="field-label">Мест</span><input class="input mono" id="tSeats" inputmode="numeric" value="${t.seatsTotal}"></label></div>
      <div class="field"><span class="field-label">Дни недели</span><div class="chips" id="tDays">${DAYS.map((d, i)=>html`<button type="button" class="chip${days.includes(i) ? ' is-on' : ''}" data-d="${i}" style="min-width:52px;justify-content:center">${d}</button>`)}</div></div>
      <label class="row" style="padding:0;border:0"><span class="row-main"><span class="row-title">Рейс активен</span><span class="row-sub">На паузе — новые рейсы не создаются</span></span><span class="switch"><input type="checkbox" id="tAct" ${t.active ? Kit.raw('checked') : ''}><span></span></span></label>
      ${isNew ? '' : html`<button class="btn btn-danger-soft btn-block section" type="button" data-del>${icon('trash')}Удалить из расписания</button>`}`,
      actions: html`<button class="btn btn-primary" type="button" data-save>Сохранить</button>`});
    Kit.on(sh.$('#tDays'), 'click', '[data-d]', (e, el)=>{ const d = +el.dataset.d; days = days.includes(d) ? days.filter(x=>x !== d) : days.concat(d); el.classList.toggle('is-on'); haptic('select'); });
    sh.$('[data-save]').addEventListener('click', async ()=>{
      const seats = parseInt(sh.$('#tSeats').value, 10);
      if(!days.length){ Kit.toast('Выберите хотя бы один день', 'error'); return; }
      if(!(seats >= 4 && seats <= 30)){ Kit.toast('Мест — от 4 до 30', 'error'); return; }
      Kit.busy(sh.$('[data-save]'), true);
      const r = await api('saveTemplate', {id:t.id, routeId:sh.$('#tRoute').value, time:sh.$('#tTime').value, seatsTotal:seats, days:days.sort(), active:sh.$('#tAct').checked});
      if(!r.ok){ Kit.busy(sh.$('[data-save]'), false); Kit.toast(r.message || 'Не удалось сохранить', 'error'); return; }
      sh.close(); renderSchedule(); Kit.toast(r.tripsCreated ? 'Создано рейсов: ' + r.tripsCreated : 'Сохранено', 'ok');
    });
    const del = sh.$('[data-del]');
    if(del) del.addEventListener('click', async ()=>{
      if(!await Kit.confirm('Удалить рейс ' + t.time + ' из расписания? Будущие рейсы без пассажиров тоже удалятся.', 'Удалить', true)) return;
      const r = await api('deleteTemplate', {id:t.id});
      if(!r.ok){ Kit.toast('Не удалось', 'error'); return; }
      sh.close(); renderSchedule(); Kit.toast('Удалено', 'ok');
    });
  }

  /* ============ БРОНИ ============ */
  let B = [], bf = 'all';
  const BF = [['all','Все'],['ожидание','Ждут'],['посажен','В салоне'],['не пришёл','Не пришли'],['cancelled','Отменены']];
  async function renderBookings(){
    $('#bFilter').innerHTML = html`${BF.map(([k, l])=>html`<button type="button" class="chip${bf === k ? ' is-on' : ''}" data-f="${k}">${l}</button>`)}`;
    const r = await api('getBookings'); B = r.bookings || [];
    drawBookings();
  }
  function drawBookings(){
    const q = $('#q').value.trim().toLowerCase(), qd = q.replace(/\D/g, '');
    const list = B.filter(b=>(bf === 'all' || b.status === bf) && (!q || b.name.toLowerCase().includes(q) || b.code.toLowerCase().includes(q) || (qd.length >= 3 && b.phone.includes(qd))));
    $('#bList').innerHTML = list.length ? html`<p class="hint" style="margin-bottom:8px">${list.length} ${Kit.plural(list.length, 'бронь', 'брони', 'броней')} · со вчера на 3 дня вперёд</p><div class="list">${list.slice(0, 120).map(b=>html`<button class="row" type="button" data-t="${b.tripId}">
      <span class="row-main"><span class="row-title">${b.name} · <span class="mono">${b.code}</span></span><span class="row-sub">${b.route} ${D.label(b.date)}, ${b.time} · ${b.pickup.split(',')[0]} → ${b.dropoff.split(',')[0]} · ${b.seats} м.</span></span>
      <span class="row-end">${V.pax(b.status)}</span></button>`)}</div>` : html`<div class="empty">${icon('search')}<div class="empty-title">Ничего не найдено</div></div>`;
  }
  Kit.on($('#bFilter'), 'click', '[data-f]', (e, el)=>{ bf = el.dataset.f; haptic('select'); $$('#bFilter .chip').forEach(c=>c.classList.toggle('is-on', c === el)); drawBookings(); });
  $('#q').addEventListener('input', Kit.debounce(drawBookings, 150));
  Kit.on($('#bList'), 'click', '[data-t]', (e, el)=> openTrip(el.dataset.t));

  let current = 'today';
  const RENDER = {today:renderToday, trips:renderTrips, schedule:renderSchedule, bookings:renderBookings};
  function refreshVisible(){ RENDER[current](); }
  $('#refresh').addEventListener('click', ()=>{ haptic('light'); refreshVisible(); });
  api('getRefs').then(r=>{ REFS = r.ok ? r : REFS; });
  Kit.tabs({onChange:(t)=>{ current = t; RENDER[t](); }});
})();
</script>
</body>
</html>
