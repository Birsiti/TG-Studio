<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ВЕРСТА — билеты на маршрутку</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../kit/core.js"></script>
<link rel="stylesheet" href="../kit/base.css">
<link rel="stylesheet" href="brand.css">
<script src="versta.js"></script>
<script src="mock.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" id="mark"></div><div class="brand-text"><span class="brand-name">ВЕРСТА</span><span class="brand-role">Маршрутки по Беларуси</span></div></div>
    <div class="topbar-actions"><button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button></div>
  </header>
  <main id="view"></main>
</div>
<div class="actionbar" id="bar" hidden><div class="actionbar-inner">
  <div class="total"><div class="total-label" id="barLabel"></div><div class="total-value" id="barValue" data-fit="14"></div></div>
  <button class="btn btn-primary" id="barBtn" type="button"></button>
</div></div>

<script>
(function(){
  "use strict";
  const {html, icon, $, $$, date: D, money, haptic} = Kit;
  const api = Kit.createApi({bot:'versta', mock: window.VerstaMock});
  $('#mark').innerHTML = icon('bus');
  const view = $('#view'), bar = $('#bar'), barBtn = $('#barBtn'), app = $('#app');
  const HOLD = 360;
  const S = {dirs:null, from:'Минск', to:null, date:D.today(), route:null, trips:[], trip:null, a:0, b:null, seats:1,
    name:Kit.user.firstName || '', phone:'', mine:[], hold:0, holdTimer:null, ticket:null, screen:'home'};
  try{ const p = JSON.parse(localStorage.getItem('versta-prof') || 'null'); if(p){ S.name = p.name || S.name; S.phone = p.phone || ''; } }catch(e){}

  const STACK = [];
  function go(screen, push){
    if(push !== false && S.screen !== screen){ STACK.push(S.screen); Kit.back.push(back); }
    S.screen = screen;
    if(screen !== 'checkout') stopHold();
    window.scrollTo(0, 0);
    ({home:renderHome, trips:renderTrips, stops:renderStops, checkout:renderCheckout, ticket:renderTicket})[screen]();
  }
  function back(){ Kit.back.pop(back); const prev = STACK.pop() || 'home'; go(prev, false); }
  function home(){ while(STACK.length){ STACK.pop(); Kit.back.pop(back); } go('home', false); }
  function setBar(label, value, btn, enabled){
    bar.hidden = !btn; app.classList.toggle('has-actionbar', !!btn);
    if(!btn) return;
    $('#barLabel').textContent = label; $('#barValue').textContent = value; barBtn.textContent = btn; barBtn.disabled = !enabled;
  }
  let barAction = null;
  barBtn.addEventListener('click', ()=> barAction && barAction());

  /* ============ ГЛАВНАЯ ============ */
  function renderHome(){
    setBar(null, null, null);
    const days = Array.from({length:7}, (_, i)=>D.add(D.today(), i));
    view.innerHTML = html`<div class="screen">
      <section class="route-card">
        <h1>Куда едем?</h1>
        <div style="margin-top:14px;position:relative">
          <button class="pick" type="button" data-pick="from"><span class="pick-dot"></span><span><span class="pick-label">Откуда</span><span class="pick-value${S.from ? '' : ' is-empty'}">${S.from || 'Выбрать город'}</span></span></button>
          <button class="pick" type="button" data-pick="to"><span class="pick-dot to"></span><span><span class="pick-label">Куда</span><span class="pick-value${S.to ? '' : ' is-empty'}">${S.to || 'Выбрать город'}</span></span></button>
          <button class="swap" type="button" id="swap" aria-label="Поменять местами" style="top:44px">${icon('swap')}</button>
        </div>
        <div class="days" id="days" style="margin-top:14px">${days.map(k=>html`<button type="button" class="day${k === S.date ? ' is-on' : ''}" data-day="${k}" style="${k === S.date ? '' : 'background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#EEF1F5'}"><span class="day-dow" style="color:inherit;opacity:.75">${k === D.today() ? 'сег' : D.dow(k)}</span><span class="day-num">${D.day(k)}</span></button>`)}</div>
        <button class="btn btn-primary btn-block" type="button" id="find" style="margin:6px 0 14px" ${S.from && S.to ? '' : Kit.raw('disabled')}>${icon('search')}Найти рейсы</button>
      </section>
      ${S.dirs ? html`<div class="section"><div class="eyebrow" style="margin-bottom:8px">Популярные направления</div><div class="chips scroll">${S.dirs.popular.map(([a, b])=>html`<button type="button" class="chip" data-pop="${a}|${b}">${a} → ${b}</button>`)}</div></div>` : ''}
      <div class="section"><div class="section-head"><h2 class="section-title">Мои поездки</h2></div><div id="mine">${minesHtml()}</div></div>
    </div>`;
    $$('[data-pick]').forEach(b=> b.addEventListener('click', ()=> pickCity(b.dataset.pick)));
    $('#swap').addEventListener('click', ()=>{ if(!S.to) return; [S.from, S.to] = [S.to, S.from]; haptic('select'); renderHome(); });
    Kit.on($('#days'), 'click', '[data-day]', (e, el)=>{ S.date = el.dataset.day; haptic('select'); renderHome(); });
    $('#find').addEventListener('click', ()=>{ haptic('light'); go('trips'); });
    $$('[data-pop]').forEach(b=> b.addEventListener('click', ()=>{ [S.from, S.to] = b.dataset.pop.split('|'); haptic('select'); go('trips'); }));
    Kit.on($('#mine'), 'click', '[data-b]', (e, el)=>{ const b = S.mine.find(x=>x.id === el.dataset.b); if(b){ S.ticket = b; go('ticket'); } });
  }
  function bookingStatus(b){
    if(b.cancelled) return html`<span class="pill pill-muted">отменена</span>`;
    if(b.status === 'посажен' || b.driverStatus === 'завершён') return html`<span class="pill pill-ok">поездка была</span>`;
    if(b.driverStatus === 'в пути') return html`<span class="pill pill-accent">в пути</span>`;
    return html`<span class="pill pill-info">ожидается</span>`;
  }
  function minesHtml(){
    if(!S.mine.length) return html`<div class="card card-flat"><div class="empty-mini">Пока нет поездок — выберите направление выше</div></div>`;
    return html`<div class="list">${S.mine.slice(0, 8).map(b=>html`<button class="row" type="button" data-b="${b.id}">${V.code(b.route, true)}
      <span class="row-main"><span class="row-title">${b.from} → ${b.to}</span><span class="row-sub">${D.label(b.date)}, ${b.pickupTime} · ${b.seats} ${Kit.plural(b.seats, 'место', 'места', 'мест')} · ${money(b.price)}</span></span>
      <span class="row-end">${bookingStatus(b)}</span></button>`)}</div>`;
  }
  function pickCity(field){
    const cities = field === 'from' ? S.dirs.cities : (S.from ? S.dirs.connections[S.from] || [] : S.dirs.cities);
    const sh = Kit.sheet({title:field === 'from' ? 'Откуда' : 'Куда', body:html`<div class="list">${cities.map(c=>html`<button class="row" type="button" data-c="${c}"><span class="row-icon">${icon('pin')}</span><span class="row-main"><span class="row-title">${c}</span>${field === 'from' ? html`<span class="row-sub">${(S.dirs.connections[c] || []).length} ${Kit.plural((S.dirs.connections[c] || []).length, 'направление', 'направления', 'направлений')}</span>` : ''}</span>${(field === 'from' ? S.from : S.to) === c ? icon('check') : ''}</button>`)}</div>`});
    Kit.on(sh.body, 'click', '[data-c]', (e, el)=>{
      const c = el.dataset.c;
      if(field === 'from'){ S.from = c; if(S.to && !(S.dirs.connections[c] || []).includes(S.to)) S.to = null; }
      else S.to = c;
      haptic('select'); sh.close(); renderHome();
      if(field === 'from' && !S.to) setTimeout(()=>pickCity('to'), 280);
    });
  }

  /* ============ РЕЙСЫ ============ */
  async function renderTrips(){
    setBar(null, null, null);
    view.innerHTML = html`<div class="screen">
      <div class="page-head"><div class="eyebrow">${D.label(S.date)}, ${D.long(S.date)}</div><h1 class="page-title">${S.from} → ${S.to}</h1></div>
      <div class="days" id="tDays">${Array.from({length:7}, (_, i)=>D.add(D.today(), i)).map(k=>html`<button type="button" class="day${k === S.date ? ' is-on' : ''}" data-day="${k}"><span class="day-dow">${k === D.today() ? 'сег' : D.dow(k)}</span><span class="day-num">${D.day(k)}</span></button>`)}</div>
      <div class="section" id="board"><div class="skel" style="height:300px"></div></div>
    </div>`;
    Kit.on($('#tDays'), 'click', '[data-day]', (e, el)=>{ S.date = el.dataset.day; haptic('select'); renderTrips(); });
    const r = await api('getTrips', {from:S.from, to:S.to, date:S.date});
    if(S.screen !== 'trips') return;
    S.route = r.route; S.trips = r.trips || [];
    const minPrice = S.route ? Math.max(5, Math.round(S.route.fullPrice * (S.route.points[1].offset / S.route.points[S.route.points.length - 1].offset))) : 0;
    $('#board').innerHTML = !S.trips.length ? html`<div class="empty">${icon('bus')}<div class="empty-title">Рейсов нет</div>Попробуйте другую дату</div>`
      : html`<div class="board">${S.trips.map(t=>{ const off = t.departed || t.free <= 0; return html`<button type="button" class="dep${off ? ' is-off' : ''}" data-t="${t.id}" ${off ? Kit.raw('disabled') : ''}>
        <span><span class="dep-time">${t.time}</span><br><span class="dep-arr">→ ${t.arrival}</span></span>
        <span class="dep-mid"><span style="display:flex;gap:8px;align-items:center">${V.code(t.code, true)}<span class="dep-dur">${V.dur(t.duration)}</span></span>
          <span class="dep-seats${t.free <= 0 ? ' none' : t.free <= 3 ? ' low' : ''}">${t.departed ? 'уже ушла' : t.free <= 0 ? 'мест нет' : 'свободно ' + t.free + ' из ' + t.seatsTotal}</span></span>
        <span class="dep-price">${money(t.fullPrice)}<small>от ${minPrice} за часть</small></span></button>`; })}</div>
        <p class="hint" style="margin-top:12px">Оплата наличными или картой водителю при посадке. Можно сесть и выйти на промежуточной остановке — цена будет меньше.</p>`;
    Kit.on($('#board'), 'click', '[data-t]', (e, el)=>{ S.trip = S.trips.find(t=>t.id === el.dataset.t); S.a = 0; S.b = S.route.points.length - 1; haptic('light'); go('stops'); });
  }

  /* ============ ОСТАНОВКИ ============ */
  function segPrice(a, b){
    const pts = S.route.points;
    return Math.max(5, Math.round((pts[b].offset - pts[a].offset) * S.route.fullPrice / pts[pts.length - 1].offset));
  }
  let pickStage = 'a';
  function renderStops(){
    const pts = S.route.points, t = S.trip;
    const drawn = ()=> html`<ul class="stops">${pts.map((p, i)=>{ const isA = i === S.a, isB = i === S.b, inRide = i >= S.a && i < S.b;
      return html`<li><button type="button" class="stop${isA ? ' is-a' : ''}${isB ? ' is-b' : ''}${inRide ? ' in-ride' : ''}" data-i="${i}" ${(pickStage === 'a' && i === pts.length - 1) || (pickStage === 'b' && i <= S.a) ? Kit.raw('disabled') : ''}>
        <span class="stop-rail"><span class="stop-dot"></span></span>
        <span class="stop-main"><span class="stop-name">${p.name}</span><span class="stop-time">${V.addMin(t.time, p.offset)}</span></span>
        ${isA ? html`<span class="stop-tag">посадка</span>` : isB ? html`<span class="stop-tag">высадка</span>` : ''}</button></li>`; })}</ul>`;
    view.innerHTML = html`<div class="screen">
      <div class="page-head"><div class="eyebrow" style="display:flex;gap:8px;align-items:center">${V.code(t.code, true)} ${D.label(t.date)}, отправление ${t.time}</div><h1 class="page-title">Где сядете и выйдете?</h1></div>
      <div class="seg" id="stage"><button type="button" data-s="a" class="${pickStage === 'a' ? 'is-on' : ''}">Посадка</button><button type="button" data-s="b" class="${pickStage === 'b' ? 'is-on' : ''}">Высадка</button></div>
      <div class="card section" id="stops">${drawn()}</div>
    </div>`;
    Kit.on($('#stage'), 'click', '[data-s]', (e, el)=>{ pickStage = el.dataset.s; haptic('select'); renderStops(); });
    Kit.on($('#stops'), 'click', '[data-i]', (e, el)=>{
      const i = +el.dataset.i;
      if(pickStage === 'a'){ S.a = i; if(S.b <= i) S.b = pts.length - 1; pickStage = 'b'; }
      else S.b = i;
      haptic('select'); renderStops();
    });
    setBar(V.dur(pts[S.b].offset - pts[S.a].offset) + ' в пути', money(segPrice(S.a, S.b)) + ' / место', 'Далее', S.b > S.a);
    barAction = ()=>{ pickStage = 'a'; go('checkout'); };
  }

  /* ============ ОФОРМЛЕНИЕ ============ */
  function stopHold(){ if(S.holdTimer){ clearInterval(S.holdTimer); S.holdTimer = null; } }
  function renderCheckout(){
    const t = S.trip, pts = S.route.points, max = Math.min(6, t.free);
    S.seats = Math.min(S.seats, max) || 1;
    view.innerHTML = html`<div class="screen">
      <div class="page-head"><h1 class="page-title">Бронь места</h1></div>
      <div class="hold" id="hold">${icon('clock')}<span>Место держим за вами</span><b id="holdT">6:00</b></div>
      <div class="card section">
        <div class="kv"><span class="k">Рейс</span><span class="v">${t.code} · ${D.label(t.date)}</span></div>
        <div class="kv"><span class="k">Посадка</span><span class="v">${pts[S.a].name}, ${V.addMin(t.time, pts[S.a].offset)}</span></div>
        <div class="kv"><span class="k">Высадка</span><span class="v">${pts[S.b].name}, ${V.addMin(t.time, pts[S.b].offset)}</span></div>
      </div>
      <div class="section" style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <div><b>Количество мест</b><div class="hint">свободно ${t.free}</div></div>
        <div class="stepper-num"><button type="button" id="minus" aria-label="Меньше">${icon('minus')}</button><output id="seats">${S.seats}</output><button type="button" id="plus" aria-label="Больше">${icon('plus')}</button></div>
      </div>
      <label class="field section"><span class="field-label">Имя пассажира</span><input class="input" id="name" maxlength="60" autocomplete="given-name" value="${S.name}" placeholder="Как к вам обращаться"></label>
      <div class="field"><span class="field-label">Телефон — водитель позвонит перед посадкой</span>${Kit.phone.field('phone', S.phone)}</div>
    </div>`;
    const ph = $('#phone'); Kit.phone.bind(ph);
    const upd = ()=>{
      S.name = $('#name').value; S.phone = Kit.phone.value(ph);
      $('#seats').textContent = S.seats;
      $('#minus').disabled = S.seats <= 1; $('#plus').disabled = S.seats >= max;
      setBar(S.seats + ' ' + Kit.plural(S.seats, 'место', 'места', 'мест') + ' · оплата водителю', money(segPrice(S.a, S.b) * S.seats), 'Забронировать', S.name.trim().length >= 2 && Kit.phone.valid(ph) && S.hold > 0);
    };
    $('#minus').addEventListener('click', ()=>{ if(S.seats > 1){ S.seats--; haptic('select'); upd(); } });
    $('#plus').addEventListener('click', ()=>{ if(S.seats < max){ S.seats++; haptic('select'); upd(); } });
    $('#name').addEventListener('input', upd); ph.addEventListener('input', upd);
    stopHold(); S.hold = HOLD;
    const tick = ()=>{
      const el = $('#holdT'); if(!el){ stopHold(); return; }
      el.textContent = Math.floor(S.hold / 60) + ':' + String(S.hold % 60).padStart(2, '0');
      $('#hold').classList.toggle('is-warn', S.hold <= 60);
      if(S.hold <= 0){ stopHold(); $('#hold').innerHTML = html`${icon('alert')}<span>Время вышло — выберите рейс заново</span>`; upd(); return; }
      S.hold--;
    };
    tick(); S.holdTimer = setInterval(tick, 1000);
    upd();
    barAction = submit;
  }
  async function submit(){
    Kit.busy(barBtn, true);
    const r = await api('createBooking', {tripId:S.trip.id, pickupIdx:S.a, dropoffIdx:S.b, seats:S.seats, name:S.name.trim(), phone:S.phone});
    Kit.busy(barBtn, false);
    if(!r.ok){
      Kit.toast(r.error === 'no_seats' ? 'Места только что заняли — выберите меньше мест или другой рейс' : r.error === 'departed' ? 'Маршрутка уже ушла' : (r.message || 'Не получилось забронировать'), 'error');
      return;
    }
    haptic('success');
    try{ localStorage.setItem('versta-prof', JSON.stringify({name:S.name, phone:S.phone})); }catch(e){}
    S.ticket = r.booking;
    S.mine.unshift(r.booking);
    while(STACK.length){ STACK.pop(); Kit.back.pop(back); }
    STACK.push('home'); Kit.back.push(back);
    go('ticket', false);
  }

  /* ============ ТАЛОН ============ */
  function rideHtml(b){
    if(b.cancelled) return html`<ul class="ride"><li class="done">Бронь подтверждена</li><li class="bad">${b.tripCancelled ? 'Рейс отменён перевозчиком' : 'Вы отменили бронь'}</li></ul>`;
    const steps = [['Бронь подтверждена', 'код ' + b.code], ['Маршрутка выехала', 'отправление ' + b.time], ['Подъезжает к остановке', b.pickup + ', ' + b.pickupTime], ['Вы в салоне', 'высадка ' + b.dropoffTime]];
    const cur = b.status === 'посажен' || b.driverStatus === 'завершён' ? 4 : b.driverStatus === 'в пути' ? 2 : 1;
    return html`<ul class="ride">${steps.map((s, i)=>html`<li class="${i < cur ? 'done' : i === cur ? 'cur' : ''}">${s[0]}<small>${s[1]}</small></li>`)}</ul>`;
  }
  function renderTicket(){
    const b = S.ticket;
    setBar(null, null, null);
    view.innerHTML = html`<div class="screen">
      ${b.createdAt && Date.now() - new Date(b.createdAt).getTime() < 60000 ? html`<div class="success" style="padding-top:12px"><div class="success-icon">${icon('check')}</div><h1 class="success-title">Место ваше</h1><p class="success-sub">Покажите код водителю при посадке</p></div>` : ''}
      <div class="pass${b.cancelled ? ' is-off' : ''} section">
        <div class="pass-top">
          <div style="display:flex;justify-content:space-between;align-items:center">${V.code(b.route)}<span class="eyebrow" style="color:rgba(238,241,245,.7)">${D.label(b.date)}, ${D.long(b.date)}</span></div>
          <div class="pass-cities"><div class="pass-city">${b.pickup.split(',')[0]}<small>${b.pickupTime}</small></div><div class="pass-arrow"></div><div class="pass-city" style="text-align:right">${b.dropoff.split(',')[0]}<small>${b.dropoffTime}</small></div></div>
        </div>
        <div class="pass-cut"></div>
        <div class="pass-body">
          <div class="kv"><span class="k">Посадка</span><span class="v">${b.pickup}</span></div>
          <div class="kv"><span class="k">Пассажир</span><span class="v">${b.name} · ${b.seats} ${Kit.plural(b.seats, 'место', 'места', 'мест')}</span></div>
          <div class="kv"><span class="k">Водителю</span><span class="v mono">${money(b.price)}</span></div>
          ${b.driver ? html`<div class="kv"><span class="k">Водитель</span><span class="v">${b.driver.name}<br>${V.phoneLink(b.driver.phone)}</span></div>` : ''}
          ${b.vehicle ? html`<div class="kv"><span class="k">Машина</span><span class="v">${b.vehicle.model} · <span class="mono">${b.vehicle.plate}</span></span></div>` : ''}
          <div class="pass-code"><span class="muted">Код брони</span><b>${b.code}</b></div>
        </div>
      </div>
      <div class="card section"><div class="eyebrow" style="margin-bottom:12px">Статус поездки</div>${rideHtml(b)}</div>
      <div class="section" style="display:flex;flex-direction:column;gap:10px">
        <button class="btn btn-ghost btn-block" type="button" id="toHome">${icon('home')}На главную</button>
        ${!b.cancelled && b.status === 'ожидание' && b.driverStatus === 'ожидание' ? html`<button class="btn btn-danger-soft btn-block" type="button" id="cancel">Отменить бронь</button>` : ''}
      </div>
    </div>`;
    $('#toHome').addEventListener('click', home);
    const c = $('#cancel');
    if(c) c.addEventListener('click', async ()=>{
      if(!await Kit.confirm('Отменить бронь ' + b.code + '? Место освободится для других пассажиров.', 'Отменить', true)) return;
      const r = await api('cancelBooking', {id:b.id});
      if(!r.ok){ Kit.toast('Не удалось отменить', 'error'); return; }
      b.cancelled = true; Kit.toast('Бронь отменена', 'ok'); renderTicket(); loadMine();
    });
  }

  async function loadMine(){
    const r = await api('getMyBookings');
    S.mine = r.bookings || [];
    if(S.screen === 'home'){ const m = $('#mine'); if(m) m.innerHTML = minesHtml(); }
  }
  // статус поездки обновляем раз в 30 секунд, пока открыт талон
  setInterval(async ()=>{
    if(S.screen !== 'ticket' || !S.ticket || S.ticket.cancelled) return;
    const r = await api('getMyBookings');
    const fresh = (r.bookings || []).find(x=>x.id === S.ticket.id);
    if(fresh && (fresh.driverStatus !== S.ticket.driverStatus || fresh.status !== S.ticket.status || fresh.cancelled !== S.ticket.cancelled)){ S.ticket = fresh; renderTicket(); }
  }, 30000);

  async function boot(){
    view.innerHTML = '<div class="skel" style="height:320px;margin-top:8px"></div>';
    const [d] = await Promise.all([api('getDirections'), loadMine()]);
    S.dirs = d.ok ? d : {cities:['Минск'], connections:{}, popular:[]};
    renderHome();
  }
  boot();
})();
</script>
</body>
</html>
