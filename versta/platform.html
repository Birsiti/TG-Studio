<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ВЕРСТА — платформа</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../kit/core.js"></script>
<link rel="stylesheet" href="../kit/base.css">
<link rel="stylesheet" href="brand.css">
<script src="versta.js"></script>
<script src="mock.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" id="mark"></div><div class="brand-text"><span class="brand-name">ВЕРСТА</span><span class="brand-role">Платформа перевозчиков</span></div></div>
    <div class="topbar-actions"><button class="icon-btn" id="add" type="button" aria-label="Подключить перевозчика"></button><button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button></div>
  </header>
  <div class="page-head"><h1 class="page-title">Перевозчики</h1><p class="page-sub">Комиссия платформы за 30 дней</p></div>
  <div class="stats" id="kpi"></div>
  <div class="chips scroll section" id="filter"></div>
  <div class="section" id="list"></div>
</div>
<script>
(function(){
  "use strict";
  const {html, icon, $, $$, date: D, money, haptic} = Kit;
  const api = Kit.createApi({bot:'versta', mock: window.VerstaMock});
  $('#mark').innerHTML = icon('globe'); $('#add').innerHTML = icon('plus');
  const ST = {'активен':'pill-ok', 'приостановлен':'pill-danger', 'подключается':'pill-warn'};
  let T = [], f = 'all';
  async function render(){
    const r = await api('getTenants'); T = r.tenants || [];
    const act = T.filter(t=>t.status === 'активен');
    $('#kpi').innerHTML = html`<div class="stat is-accent"><div class="stat-label">Комиссия</div><div class="stat-value" data-fit="16">${money(T.reduce((a, t)=>a + t.stats.commission, 0))}</div></div>
      <div class="stat"><div class="stat-label">Оборот перевозчиков</div><div class="stat-value" data-fit="16">${money(T.reduce((a, t)=>a + t.stats.revenue, 0))}</div></div>
      <div class="stat"><div class="stat-label">Активных</div><div class="stat-value">${act.length} из ${T.length}</div></div>
      <div class="stat"><div class="stat-label">Рейсов</div><div class="stat-value">${T.reduce((a, t)=>a + t.stats.trips, 0)}</div></div>`;
    $('#filter').innerHTML = html`${[['all','Все'],['активен','Активные'],['подключается','Подключаются'],['приостановлен','На паузе']].map(([k, l])=>html`<button type="button" class="chip${f === k ? ' is-on' : ''}" data-f="${k}">${l}</button>`)}`;
    const list = T.filter(t=>f === 'all' || t.status === f);
    $('#list').innerHTML = html`<div class="list">${list.map(t=>html`<button class="row" type="button" data-t="${t.id}"><span class="avatar">${Kit.initials(t.name)}</span>
      <span class="row-main"><span class="row-title">${t.name}</span><span class="row-sub">${t.city} · ${t.routes.length} направл. · ${t.vehicles.length} машин · ${t.commission}%</span></span>
      <span class="row-end"><span class="pill ${ST[t.status]}">${t.status}</span><span class="mono hint">${money(t.stats.commission)}</span></span></button>`)}</div>`;
  }
  Kit.on($('#filter'), 'click', '[data-f]', (e, el)=>{ f = el.dataset.f; haptic('select'); render(); });
  Kit.on($('#list'), 'click', '[data-t]', (e, el)=> open(T.find(t=>t.id === el.dataset.t)));
  $('#add').addEventListener('click', ()=> open(null));

  function open(src){
    const isNew = !src;
    const t = JSON.parse(JSON.stringify(src || {name:'', city:'', status:'подключается', commission:12, routes:[], drivers:[], vehicles:[], stats:{revenue:0, trips:0, commission:0}}));
    const sh = Kit.sheet({title:isNew ? 'Новый перевозчик' : t.name, sub:isNew ? 'Подключение к платформе' : t.city + ' · с ' + D.long(t.joined), body:''});
    const draw = ()=>{
      sh.body.innerHTML = html`
        ${isNew ? '' : html`<div class="stats three"><div class="stat"><div class="stat-label">Оборот</div><div class="stat-value" data-fit="13">${Kit.num(t.stats.revenue)}</div></div><div class="stat"><div class="stat-label">Рейсов</div><div class="stat-value">${t.stats.trips}</div></div><div class="stat"><div class="stat-label">Комиссия</div><div class="stat-value" data-fit="13">${Kit.num(t.stats.commission)}</div></div></div>`}
        <div class="field-row section"><label class="field"><span class="field-label">Название</span><input class="input" id="nm" maxlength="60" value="${t.name}"></label><label class="field" style="flex:0 0 120px"><span class="field-label">Город</span><input class="input" id="ct" maxlength="40" value="${t.city}"></label></div>
        <div class="field-row"><label class="field" style="flex:0 0 120px"><span class="field-label">Комиссия, %</span><input class="input mono" id="cm" inputmode="numeric" value="${t.commission}"></label>
          <div class="field"><span class="field-label">Статус</span><select class="select" id="st">${['подключается','активен','приостановлен'].map(s=>html`<option ${t.status === s ? Kit.raw('selected') : ''}>${s}</option>`)}</select></div></div>
        ${listBlock('Направления', 'routes', t.routes.map(r=>[r.from + ' → ' + r.to, money(r.price)]), html`<div class="field-row"><input class="input" id="rf" placeholder="Откуда" maxlength="40"><input class="input" id="rt" placeholder="Куда" maxlength="40"><input class="input mono" id="rp" placeholder="BYN" inputmode="numeric" style="flex:0 0 72px"></div>`)}
        ${listBlock('Водители', 'drivers', t.drivers.map(d=>[d.name, Kit.phone.pretty(d.phone)]), html`<input class="input" id="dn" placeholder="Имя и фамилия" maxlength="60" style="margin-bottom:8px">${Kit.phone.field('dp')}`)}
        ${listBlock('Машины', 'vehicles', t.vehicles.map(v=>[v.plate + ' · ' + v.model, v.seats + ' мест']), html`<div class="field-row"><input class="input mono" id="vp" placeholder="AI 0000-7" maxlength="12"><input class="input" id="vm" placeholder="Модель" maxlength="40"><input class="input mono" id="vs" placeholder="мест" inputmode="numeric" style="flex:0 0 64px"></div>`)}`;
      Kit.phone.bind(sh.$('#dp'));
      sh.body.querySelectorAll('[data-rm]').forEach(b=> b.addEventListener('click', ()=>{ const [k, i] = b.dataset.rm.split(':'); collect(); t[k].splice(+i, 1); draw(); }));
      sh.body.querySelectorAll('[data-addto]').forEach(b=> b.addEventListener('click', ()=>{
        collect();
        const k = b.dataset.addto, id = Kit.uid('x');
        if(k === 'routes'){ const fr = sh.$('#rf').value.trim(), to = sh.$('#rt').value.trim(), p = parseInt(sh.$('#rp').value, 10); if(!fr || !to || !(p > 0)){ Kit.toast('Заполните направление и цену', 'error'); return; } t.routes.push({id, from:fr, to, price:p}); }
        if(k === 'drivers'){ const n = sh.$('#dn').value.trim(); if(n.length < 2 || !Kit.phone.valid(sh.$('#dp'))){ Kit.toast('Имя и телефон водителя', 'error'); return; } t.drivers.push({id, name:n, phone:Kit.phone.value(sh.$('#dp'))}); }
        if(k === 'vehicles'){ const pl = sh.$('#vp').value.trim().toUpperCase(), m = sh.$('#vm').value.trim(), s = parseInt(sh.$('#vs').value, 10); if(!pl || !m || !(s > 0)){ Kit.toast('Номер, модель и места', 'error'); return; } t.vehicles.push({id, plate:pl, model:m, seats:s}); }
        haptic('select'); draw();
      }));
    };
    function listBlock(title, key, rows, form){
      return html`<div class="section"><div class="section-head"><h3 class="section-title">${title} · ${rows.length}</h3></div>
        ${rows.length ? html`<div class="list" style="margin-bottom:10px">${rows.map((r, i)=>html`<div class="row"><span class="row-main"><span class="row-title">${r[0]}</span><span class="row-sub">${r[1]}</span></span><button class="icon-btn" type="button" data-rm="${key}:${i}" aria-label="Удалить">${icon('trash')}</button></div>`)}</div>` : ''}
        ${form}<button class="link-btn" type="button" data-addto="${key}">${icon('plus')}Добавить</button></div>`;
    }
    function collect(){ t.name = sh.$('#nm').value.trim(); t.city = sh.$('#ct').value.trim(); t.commission = parseInt(sh.$('#cm').value, 10) || 0; t.status = sh.$('#st').value; }
    draw();
    const actions = document.createElement('div'); actions.className = 'sheet-actions';
    actions.innerHTML = String(html`<button class="btn btn-primary" type="button" data-save>${isNew ? 'Подключить' : 'Сохранить'}</button>`);
    sh.el.appendChild(actions);
    actions.querySelector('[data-save]').addEventListener('click', async ()=>{
      collect();
      if(t.name.length < 2 || t.city.length < 2){ Kit.toast('Название и город обязательны', 'error'); return; }
      if(t.commission < 0 || t.commission > 50){ Kit.toast('Комиссия от 0 до 50%', 'error'); return; }
      const r = await api('saveTenant', {tenant:{id:t.id, name:t.name, city:t.city, status:t.status, commission:t.commission, routes:t.routes, drivers:t.drivers, vehicles:t.vehicles}});
      if(!r.ok){ Kit.toast(r.message || 'Не удалось сохранить', 'error'); return; }
      sh.close(); Kit.toast(isNew ? 'Перевозчик подключён' : 'Сохранено', 'ok'); render();
    });
  }
  render();
})();
</script>
</body>
</html>
