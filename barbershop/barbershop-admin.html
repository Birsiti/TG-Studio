<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>БРИТВА — администратор</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../kit/core.js"></script>
<link rel="stylesheet" href="../kit/base.css">
<link rel="stylesheet" href="brand.css">
<script src="mock.js"></script>
</head>
<body>
<div class="app has-tabbar">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" id="mark"></div><div class="brand-text"><span class="brand-name">БРИТВА</span><span class="brand-role">Администратор</span></div></div>
    <div class="topbar-actions"><button class="icon-btn" id="add" type="button" aria-label="Новая запись"></button><button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button></div>
  </header>
  <section data-panel="today" hidden>
    <div class="page-head"><h1 class="page-title" id="dTitle">Сегодня</h1><p class="page-sub" id="dSub"></p></div>
    <div class="days" id="days"></div>
    <div class="stats section" id="stats"></div>
    <div class="section" id="list"></div>
  </section>
  <section data-panel="barbers" hidden>
    <div class="page-head"><h1 class="page-title">Мастера</h1><p class="page-sub" id="bSub"></p></div>
    <div class="chairs" id="chairs"></div>
  </section>
  <section data-panel="bookings" hidden>
    <div class="page-head"><h1 class="page-title">Записи</h1></div>
    <div class="search"><span id="sIc"></span><input class="input" id="q" type="search" placeholder="Имя, телефон, услуга" autocomplete="off"></div>
    <div class="chips scroll" id="bf" style="margin-top:12px"></div>
    <div class="section" id="bl"></div>
  </section>
</div>
<nav class="tabbar"><div class="tabbar-inner">
  <button type="button" data-tab="today"><span data-ic="calendar"></span>День</button>
  <button type="button" data-tab="barbers"><span data-ic="users"></span>Мастера</button>
  <button type="button" data-tab="bookings"><span data-ic="list"></span>Записи</button>
</div></nav>
<script>
(function(){
  "use strict";
  const {html, icon, $, $$, date: D, money, haptic} = Kit;
  const api = Kit.createApi({bot:'barbershop', mock: window.BarberMock});
  $('#mark').innerHTML = icon('razor'); $('#add').innerHTML = icon('plus'); $('#sIc').outerHTML = String(icon('search'));
  $$('[data-ic]').forEach(el=> el.outerHTML = String(icon(el.dataset.ic)));
  const ST = {wait:['Ждём','pill-accent'], chair:['В кресле','pill-ok'], done:['Готово','pill-muted'], cancelled:['Отменена','pill-muted'], noshow:['Не пришёл','pill-danger']};
  const pill = s=> html`<span class="pill ${ST[s][1]}">${ST[s][0]}</span>`;
  const portrait = b=> html`<span class="portrait" style="background:${b.color}">${b.initials}</span>`;
  let day = D.today(), DAY = null, SERVICES = [], BARBERS = [];

  function row(b, withDate){
    return html`<button class="row" type="button" data-id="${b.id}"${b.status === 'cancelled' ? Kit.raw(' style="opacity:.5"') : ''}>
      <span style="width:56px;flex:none"><span class="mono" style="font-weight:700;font-size:17px;display:block">${b.time}</span><span class="hint mono">${b.end}</span></span>
      <span class="row-main"><span class="row-title">${b.client}</span><span class="row-sub">${withDate ? D.label(b.date) + ' · ' : ''}${b.service} · ${b.barber.split(' ')[0]}</span></span>
      <span class="row-end">${pill(b.status)}<span class="hint mono">${money(b.price)}</span></span></button>`;
  }

  /* ============ ДЕНЬ ============ */
  async function renderDay(){
    $('#dTitle').textContent = day === D.today() ? 'Сегодня' : D.label(day);
    $('#dSub').textContent = D.dowLong(day).replace(/^./, c=>c.toUpperCase()) + ', ' + D.long(day);
    $('#days').innerHTML = html`${Array.from({length:9}, (_, i)=>D.add(D.today(), i - 1)).map(k=>html`<button type="button" class="day${k === day ? ' is-on' : ''}" data-day="${k}"><span class="day-dow">${k === D.today() ? 'сег' : D.dow(k)}</span><span class="day-num">${D.day(k)}</span></button>`)}`;
    const r = await api('getDay', {date:day});
    DAY = r; BARBERS = r.barbers || BARBERS;
    const s = r.stats;
    $('#stats').innerHTML = html`<div class="stat"><div class="stat-label">Записей</div><div class="stat-value">${s.total}</div><div class="stat-delta hint">${s.chair ? s.chair + ' в кресле · ' : ''}${s.done} готово</div></div>
      <div class="stat"><div class="stat-label">Окон по 30 мин</div><div class="stat-value">${s.free}</div><div class="stat-delta hint">${money(s.revenue)} в кассу</div></div>`;
    $('#list').innerHTML = r.bookings.length ? html`<div class="list">${r.bookings.map(b=>row(b))}</div>` : html`<div class="empty">${icon('scissors')}<div class="empty-title">Записей нет</div>Добавьте клиента кнопкой «+»</div>`;
  }
  Kit.on($('#days'), 'click', '[data-day]', (e, el)=>{ day = el.dataset.day; haptic('select'); renderDay(); });
  Kit.on($('#list'), 'click', '[data-id]', (e, el)=> openBooking(DAY.bookings.find(b=>b.id === el.dataset.id)));

  function openBooking(b){
    const steps = [['Запись создана', b.source === 'admin' ? 'администратором' : 'клиентом в боте'], ['Ждём', b.time], ['В кресле', b.barber], ['Готово', money(b.price)]];
    const cur = {wait:1, chair:2, done:4}[b.status];
    const sh = Kit.sheet({title:b.client, sub:b.service + ' · ' + b.barber, body: html`
      <div class="kv"><span class="k">Когда</span><span class="v">${D.label(b.date)}, ${b.time}–${b.end}</span></div>
      ${b.phone ? html`<div class="kv"><span class="k">Телефон</span><span class="v"><a class="mono" href="tel:${b.phone}">${Kit.phone.pretty(b.phone)}</a></span></div>` : ''}
      <div class="kv"><span class="k">Стоимость</span><span class="v">${money(b.price)}</span></div>
      ${cur ? html`<ul class="timeline section">${steps.map((s, i)=>html`<li class="${i < cur ? 'done' : i === cur ? 'cur' : ''}">${s[0]}<small>${s[1]}</small></li>`)}</ul>` : html`<div class="section">${pill(b.status)}</div>`}`,
      actions: b.status === 'wait' ? html`<button class="btn btn-ghost" type="button" data-s="noshow">Не пришёл</button><button class="btn btn-primary" type="button" data-s="chair">В кресло</button>`
        : b.status === 'chair' ? html`<button class="btn btn-primary" type="button" data-s="done">Завершить</button>`
        : html`<button class="btn btn-ghost" type="button" data-s="wait">Вернуть в ожидание</button>`});
    sh.el.querySelectorAll('[data-s]').forEach(x=> x.addEventListener('click', async ()=>{
      const r = await api('setStatus', {id:b.id, status:x.dataset.s});
      if(!r.ok){ Kit.toast(r.error === 'slot_unavailable' ? 'Это время уже занято' : 'Не удалось', 'error'); return; }
      haptic('success'); sh.close(); renderDay();
    }));
  }

  /* ============ МАСТЕРА ============ */
  async function renderBarbers(){
    if(!DAY || DAY.date !== day) await renderDay();
    $('#bSub').textContent = 'Загрузка на ' + D.label(day).toLowerCase() + ', ' + D.long(day);
    $('#chairs').innerHTML = html`${DAY.barbers.map(b=>html`<button class="chair" type="button" data-b="${b.id}">${portrait(b)}
      <span style="flex:1;min-width:0"><b style="display:block;font-family:var(--font-display);font-size:20px">${b.name}</b><span class="hint">${b.dayOff ? 'выходной' : b.count + ' ' + Kit.plural(b.count, 'запись', 'записи', 'записей') + ' · свободно ' + b.free + ' окон'}</span>
      ${b.dayOff ? '' : html`<span class="load" style="display:block"><i style="width:${b.loadPct}%"></i></span>`}</span>
      <span class="mono" style="font-weight:600">${b.dayOff ? '—' : b.loadPct + '%'}</span></button>`)}`;
  }
  Kit.on($('#chairs'), 'click', '[data-b]', (e, el)=>{
    const b = DAY.barbers.find(x=>x.id === el.dataset.b);
    const list = DAY.bookings.filter(x=>x.barberId === b.id);
    const sh = Kit.sheet({title:b.name, sub:b.spec + ' · ' + D.label(day), body: html`
      <label class="row" style="padding:0 0 12px;border:0"><span class="row-main"><span class="row-title">Выходной ${D.label(day).toLowerCase()}</span><span class="row-sub">Клиенты не смогут записаться к мастеру</span></span><span class="switch"><input type="checkbox" id="off" ${b.dayOff ? Kit.raw('checked') : ''}><span></span></span></label>
      ${list.length ? html`<div class="list">${list.map(x=>row(x))}</div>` : html`<div class="empty-mini">Записей нет</div>`}`});
    sh.$('#off').addEventListener('change', async e=>{
      const r = await api('setDayOff', {barberId:b.id, date:day, off:e.target.checked});
      if(!r.ok){ e.target.checked = !e.target.checked; Kit.toast(r.message || 'Не удалось', 'error'); return; }
      Kit.toast(e.target.checked ? 'Отмечен выходной' : 'Мастер работает', 'ok'); sh.close(); await renderDay(); renderBarbers();
    });
  });

  /* ============ ЗАПИСИ ============ */
  let ALL = [], bf = 'upcoming';
  const BF = [['upcoming','Предстоящие'],['all','Все'],['noshow','Не пришли'],['cancelled','Отменены']];
  async function renderBookings(){
    $('#bf').innerHTML = html`${BF.map(([k, l])=>html`<button type="button" class="chip${bf === k ? ' is-on' : ''}" data-f="${k}">${l}</button>`)}`;
    const r = await api('getBookings'); ALL = r.bookings || [];
    drawB();
  }
  function drawB(){
    const q = $('#q').value.trim().toLowerCase(), qd = q.replace(/\D/g, ''), t = D.today();
    let list = ALL.filter(b=> bf === 'all' || (bf === 'upcoming' ? b.date >= t && (b.status === 'wait' || b.status === 'chair') : b.status === bf));
    if(q) list = list.filter(b=> b.client.toLowerCase().includes(q) || b.service.toLowerCase().includes(q) || (qd.length >= 3 && b.phone.includes(qd)));
    if(bf === 'upcoming') list = list.slice().reverse();
    $('#bl').innerHTML = list.length ? html`<div class="list">${list.slice(0, 100).map(b=>row(b, true))}</div>` : html`<div class="empty">${icon('search')}<div class="empty-title">Ничего не найдено</div></div>`;
  }
  Kit.on($('#bf'), 'click', '[data-f]', (e, el)=>{ bf = el.dataset.f; haptic('select'); $$('#bf .chip').forEach(c=>c.classList.toggle('is-on', c === el)); drawB(); });
  $('#q').addEventListener('input', Kit.debounce(drawB, 150));
  Kit.on($('#bl'), 'click', '[data-id]', (e, el)=>{ const b = ALL.find(x=>x.id === el.dataset.id); if(b) openBooking(b); });

  /* ============ НОВАЯ ЗАПИСЬ ============ */
  $('#add').addEventListener('click', async ()=>{
    if(!SERVICES.length){ const r = await api('getBarbers'); SERVICES = r.services || []; if(!BARBERS.length) BARBERS = r.barbers || []; }
    const st = {barber:BARBERS[0] && BARBERS[0].id, service:SERVICES[0] && SERVICES[0].id, date:day < D.today() ? D.today() : day, time:null};
    const sh = Kit.sheet({title:'Новая запись', sub:'Клиент по телефону или с улицы', body: html`
      <label class="field"><span class="field-label">Клиент</span><input class="input" id="nc" maxlength="60" placeholder="Имя"></label>
      <div class="field"><span class="field-label">Телефон (необязательно)</span>${Kit.phone.field('np')}</div>
      <div class="field"><span class="field-label">Мастер</span><div class="chips" id="nb">${BARBERS.filter(b=>!b.dayOff).map(b=>html`<button type="button" class="chip${b.id === st.barber ? ' is-on' : ''}" data-v="${b.id}">${b.name.split(' ')[0]}</button>`)}</div></div>
      <label class="field"><span class="field-label">Услуга</span><select class="select" id="ns">${SERVICES.map(s=>html`<option value="${s.id}">${s.name} · ${s.dur} мин · ${s.price} р.</option>`)}</select></label>
      <label class="field"><span class="field-label">День</span><input class="input" type="date" id="nd" min="${D.today()}" value="${st.date}"></label>
      <span class="field-label">Время</span><div class="slots" id="nt"></div>`,
      actions: html`<button class="btn btn-primary" type="button" data-go>Записать</button>`});
    Kit.phone.bind(sh.$('#np'));
    const load = async ()=>{
      st.time = null; sh.$('#nt').innerHTML = '<div class="skel" style="height:48px;grid-column:1/-1"></div>';
      const r = await api('getAdminSlots', {barberId:st.barber, serviceId:st.service, date:st.date});
      const ts = r.times || [];
      sh.$('#nt').innerHTML = ts.length ? html`${ts.map(t=>html`<button type="button" class="slot" data-t="${t}">${t}</button>`)}` : html`<span class="hint" style="grid-column:1/-1">Свободных окон нет</span>`;
    };
    Kit.on(sh.$('#nb'), 'click', '[data-v]', (e, el)=>{ st.barber = el.dataset.v; sh.el.querySelectorAll('#nb .chip').forEach(c=>c.classList.toggle('is-on', c === el)); load(); });
    sh.$('#ns').addEventListener('change', e=>{ st.service = e.target.value; load(); });
    sh.$('#nd').addEventListener('change', e=>{ st.date = e.target.value; load(); });
    Kit.on(sh.$('#nt'), 'click', '[data-t]', (e, el)=>{ st.time = el.dataset.t; sh.el.querySelectorAll('#nt .slot').forEach(c=>c.classList.toggle('is-on', c === el)); haptic('select'); });
    load();
    sh.$('[data-go]').addEventListener('click', async ()=>{
      const name = sh.$('#nc').value.trim(), ph = sh.$('#np');
      if(name.length < 2){ Kit.toast('Укажите клиента', 'error'); return; }
      if(ph.value && !Kit.phone.valid(ph)){ Kit.toast('Проверьте телефон', 'error'); return; }
      if(!st.time){ Kit.toast('Выберите время', 'error'); return; }
      const r = await api('createBookingAdmin', {barberId:st.barber, serviceId:st.service, date:st.date, time:st.time, client:name, phone:Kit.phone.value(ph)});
      if(!r.ok){ Kit.toast(r.message || 'Не удалось записать', 'error'); load(); return; }
      sh.close(); Kit.toast('Записали ' + name + ' на ' + st.time, 'ok'); day = st.date; renderDay();
    });
  });

  const RENDER = {today:renderDay, barbers:renderBarbers, bookings:renderBookings};
  Kit.tabs({onChange:(t)=> RENDER[t]()});
})();
</script>
</body>
</html>
