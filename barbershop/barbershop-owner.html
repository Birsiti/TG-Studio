<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>БРИТВА — владелец</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../kit/core.js"></script>
<link rel="stylesheet" href="../kit/base.css">
<link rel="stylesheet" href="brand.css">
<script src="mock.js"></script>
</head>
<body>
<div class="app has-tabbar">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" id="mark"></div><div class="brand-text"><span class="brand-name">БРИТВА</span><span class="brand-role">Владелец</span></div></div>
    <div class="topbar-actions"><button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button></div>
  </header>
  <section data-panel="overview" hidden>
    <div class="page-head"><h1 class="page-title">Касса</h1></div>
    <div class="seg" id="period"><button type="button" data-p="day">День</button><button type="button" data-p="week" class="is-on">Неделя</button><button type="button" data-p="month">30 дней</button></div>
    <div class="receipt section" id="hero"></div>
    <div class="stats section" id="kpi"></div>
    <div class="card section"><div class="section-head"><h2 class="section-title">По дням</h2></div><div id="chart"></div></div>
    <div class="card section"><div class="section-head"><h2 class="section-title">Услуги</h2></div><div id="svcTop"></div></div>
  </section>
  <section data-panel="rank" hidden>
    <div class="page-head"><h1 class="page-title">Мастера</h1><p class="page-sub">Выручка и выплаты за 30 дней</p></div>
    <div id="rank"></div>
  </section>
  <section data-panel="load" hidden>
    <div class="page-head"><h1 class="page-title">Загрузка</h1><p class="page-sub">Средняя занятость кресел за 4 недели</p></div>
    <div class="card"><div class="section-head"><h2 class="section-title">Дни недели</h2></div><div id="wd"></div></div>
    <div class="card section"><div class="section-head"><h2 class="section-title">Часы</h2></div><div id="hrs"></div></div>
  </section>
  <section data-panel="services" hidden>
    <div class="page-head"><h1 class="page-title">Прайс</h1><p class="page-sub">Цены и длительность, которые видят клиенты</p></div>
    <div class="price-list" id="svc"></div>
    <button class="add-tile section" type="button" id="svcAdd"></button>
  </section>
</div>
<nav class="tabbar"><div class="tabbar-inner">
  <button type="button" data-tab="overview"><span data-ic="wallet"></span>Касса</button>
  <button type="button" data-tab="rank"><span data-ic="users"></span>Мастера</button>
  <button type="button" data-tab="load"><span data-ic="bars"></span>Загрузка</button>
  <button type="button" data-tab="services"><span data-ic="tag"></span>Прайс</button>
</div></nav>
<script>
(function(){
  "use strict";
  const {html, icon, $, $$, money, haptic} = Kit;
  const api = Kit.createApi({bot:'barbershop', mock: window.BarberMock});
  $('#mark').innerHTML = icon('razor'); $('#svcAdd').innerHTML = html`${icon('plus')}Новая услуга`;
  $$('[data-ic]').forEach(el=> el.outerHTML = String(icon(el.dataset.ic)));
  let period = 'week';
  const PL = {day:'за сегодня', week:'за 7 дней', month:'за 30 дней'};
  async function renderOverview(){
    $('#hero').innerHTML = '<div class="skel" style="height:90px"></div>';
    const r = await api('getOverview', {period});
    const k = r.kpi;
    $('#hero').innerHTML = html`<div class="eyebrow">Выручка ${PL[period]}</div><h2 style="font-size:46px;margin-top:4px" data-fit="24">${money(k.revenue)}</h2><div class="when" style="font-size:20px">${k.count} ${Kit.plural(k.count, 'гость', 'гостя', 'гостей')} в кресле</div>`;
    $('#kpi').innerHTML = html`<div class="stat"><div class="stat-label">Средний чек</div><div class="stat-value" data-fit="18">${money(k.avg)}</div></div>
      <div class="stat"><div class="stat-label">Загрузка кресел</div><div class="stat-value">${k.fill}%</div></div>
      <div class="stat"><div class="stat-label">Не пришли</div><div class="stat-value" style="${k.noshow ? 'color:var(--danger)' : ''}">${k.noshow}</div></div>
      <div class="stat"><div class="stat-label">Лидер</div><div class="stat-value" style="font-size:22px" data-fit="14">${r.rank[0] ? r.rank[0].name.split(' ')[0] : '—'}</div></div>`;
    $('#chart').innerHTML = r.chart.length > 1 ? Kit.chart.bars(r.chart.map(c=>({label:c.label, value:c.revenue})), {highlightLast:true}) : html`<div class="empty-mini">Посмотрите неделю или 30 дней</div>`;
    $('#svcTop').innerHTML = Kit.chart.rank(r.services.slice(0, 6).map(s=>({name:s.name, value:s.revenue, note:s.count + ' раз'})), {format:money});
  }
  Kit.on($('#period'), 'click', '[data-p]', (e, el)=>{ period = el.dataset.p; haptic('select'); $$('#period button').forEach(b=>b.classList.toggle('is-on', b === el)); renderOverview(); });

  async function renderRank(){
    const r = await api('getOverview', {period:'month'});
    $('#rank').innerHTML = html`${r.rank.map((b, i)=>html`<button class="barber" type="button" data-b="${b.id}" data-pct="${b.pct}"><span class="portrait" style="background:${b.color}">${b.initials}</span>
      <span style="flex:1;min-width:0"><span class="barber-name">${i === 0 ? html`<span class="stars">${icon('star')}</span> ` : ''}${b.name}</span><span class="barber-spec">${b.bookings} ${Kit.plural(b.bookings, 'гость', 'гостя', 'гостей')} · ставка ${b.pct}%</span>
      <span class="barber-meta"><span>выручка <b>${money(b.revenue)}</b></span><span>к выплате <b>${money(b.payout)}</b></span></span></span>${icon('edit', 'row-chev')}</button>`)}`;
  }
  Kit.on($('#rank'), 'click', '[data-b]', (e, el)=>{
    const sh = Kit.sheet({title:'Ставка мастера', body: html`<label class="field"><span class="field-label">Процент от выручки</span><input class="input mono" id="pct" inputmode="numeric" value="${el.dataset.pct}"></label><p class="hint">Обычно 35–50%. Остаток — аренда кресла и расходники.</p>`,
      actions: html`<button class="btn btn-primary" type="button" data-s>Сохранить</button>`});
    sh.$('[data-s]').addEventListener('click', async ()=>{
      const pct = parseInt(sh.$('#pct').value, 10);
      if(!(pct >= 10 && pct <= 80)){ Kit.toast('От 10 до 80%', 'error'); return; }
      const r = await api('saveBarber', {barber:{id:el.dataset.b, pct}});
      if(!r.ok){ Kit.toast('Не удалось', 'error'); return; }
      sh.close(); Kit.toast('Ставка обновлена', 'ok'); renderRank();
    });
  });

  async function renderLoad(){
    const r = await api('getLoad');
    $('#wd').innerHTML = Kit.chart.rank(r.weekdays.map(w=>({name:w.day, value:w.pct})), {format:v=>v + '%'}).toString().replace(/<span class="rank-n">\d+<\/span>/g, '');
    $('#hrs').innerHTML = Kit.chart.bars(r.hours.map(h=>({label:h.hour.split(':')[0], value:h.count})), {}).toString();
  }

  let SV = [];
  async function renderServices(){
    const r = await api('getServicesAdmin'); SV = r.services || [];
    $('#svc').innerHTML = html`${SV.map(s=>html`<button type="button" class="price" data-s="${s.id}"${s.active ? '' : Kit.raw(' style="opacity:.5"')}><span><span class="price-name">${s.name}</span><span class="price-sub">${s.dur} мин${s.active ? '' : ' · скрыта'}</span></span><span class="price-dots"></span><span class="price-val">${Kit.num(s.price)} р.</span></button>`)}`;
  }
  Kit.on($('#svc'), 'click', '[data-s]', (e, el)=> editService(SV.find(s=>s.id === el.dataset.s)));
  $('#svcAdd').addEventListener('click', ()=> editService(null));
  function editService(s){
    const isNew = !s;
    s = s || {name:'', dur:40, price:30, desc:'', active:true};
    const sh = Kit.sheet({title:isNew ? 'Новая услуга' : s.name, body: html`
      <label class="field"><span class="field-label">Название</span><input class="input" id="sn" maxlength="60" value="${s.name}"></label>
      <div class="field-row"><label class="field"><span class="field-label">Цена, BYN</span><input class="input mono" id="sp" inputmode="numeric" value="${s.price}"></label>
      <div class="field"><span class="field-label">Длительность</span><select class="select" id="sd">${[20, 40, 60, 80, 100, 120].map(d=>html`<option value="${d}" ${d === s.dur ? Kit.raw('selected') : ''}>${d} мин</option>`)}</select></div></div>
      <label class="field"><span class="field-label">Описание</span><input class="input" id="sx" maxlength="200" value="${s.desc}"></label>
      <label class="row" style="padding:0;border:0"><span class="row-main"><span class="row-title">Показывать в прайсе</span></span><span class="switch"><input type="checkbox" id="sa" ${s.active ? Kit.raw('checked') : ''}><span></span></span></label>`,
      actions: html`<button class="btn btn-primary" type="button" data-save>Сохранить</button>`});
    sh.$('[data-save]').addEventListener('click', async ()=>{
      const price = parseInt(sh.$('#sp').value, 10), name = sh.$('#sn').value.trim();
      if(name.length < 3 || !(price > 0)){ Kit.toast('Название и цена', 'error'); return; }
      const r = await api('saveService', {service:{id:s.id, name, price, dur:+sh.$('#sd').value, desc:sh.$('#sx').value.trim(), active:sh.$('#sa').checked}});
      if(!r.ok){ Kit.toast(r.message || 'Не удалось', 'error'); return; }
      sh.close(); Kit.toast('Прайс обновлён', 'ok'); renderServices();
    });
  }

  const RENDER = {overview:renderOverview, rank:renderRank, load:renderLoad, services:renderServices};
  Kit.tabs({onChange:(t)=> RENDER[t]()});
})();
</script>
</body>
</html>
