<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>БРИТВА — запись в барбершоп</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../kit/core.js"></script>
<link rel="stylesheet" href="../kit/base.css">
<link rel="stylesheet" href="brand.css">
<script src="mock.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" id="mark"></div><div class="brand-text"><span class="brand-name">БРИТВА</span><span class="brand-role">Барбершоп · Минск</span></div></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="myBtn" type="button" aria-label="Мои записи"><span id="myIc"></span><span class="dot-badge" id="myDot" hidden></span></button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button>
    </div>
  </header>
  <main id="view"></main>
</div>
<div class="actionbar" id="bar" hidden><div class="actionbar-inner">
  <div class="total"><div class="total-label" id="barLabel"></div><div class="total-value" id="barValue" data-fit="14"></div></div>
  <button class="btn btn-primary" id="barBtn" type="button"></button>
</div></div>

<script>
(function(){
  "use strict";
  const {html, icon, $, $$, date: D, money, haptic} = Kit;
  const api = Kit.createApi({bot:'barbershop', mock: window.BarberMock});
  $('#mark').innerHTML = icon('razor');
  $('#myIc').innerHTML = icon('calendar');
  const view = $('#view'), bar = $('#bar'), barBtn = $('#barBtn'), app = $('#app');
  const S = {barbers:[], services:[], info:{}, w:null, contact:null};
  try{ S.contact = JSON.parse(localStorage.getItem('britva-contact') || 'null'); }catch(e){}
  let barAction = null;
  barBtn.addEventListener('click', ()=> barAction && barAction());
  function setBar(label, value, btn, enabled, fn){
    bar.hidden = !btn; app.classList.toggle('has-actionbar', !!btn);
    if(!btn) return;
    $('#barLabel').textContent = label; $('#barValue').textContent = value; barBtn.textContent = btn; barBtn.disabled = !enabled; barAction = fn;
  }
  const portrait = (b, lg)=> html`<span class="portrait${lg ? ' lg' : ''}" style="background:${b.color}">${b.initials}</span>`;
  const stars = r=> html`<span class="stars">${icon('star')}</span> <b>${String(r).replace('.', ',')}</b>`;
  const rule = html`<div class="rule"><i></i></div>`;

  /* ============ ГЛАВНАЯ ============ */
  function renderHome(){
    setBar();
    const next = S.barbers.map(b=>b.nextFree).filter(Boolean).sort((a, b)=>(a.date + a.time).localeCompare(b.date + b.time))[0];
    view.innerHTML = html`<div class="screen">
      <section class="marquee section" style="margin-top:8px"><div class="since">мужская парикмахерская</div><h1>Бритва</h1><p>${S.info.address || ''} · ежедневно ${S.info.hours ? S.info.hours.open + '–' + S.info.hours.close : ''}</p></section>
      <div class="pole"></div>
      <button class="quick section" type="button" id="quick">${icon('zap')}<span style="flex:1"><b>Ближайшее время</b><span>${next ? 'к любому мастеру · ' + D.label(next.date).toLowerCase() + ', ' + next.time : 'подберём свободного мастера'}</span></span>${icon('right')}</button>
      ${rule}
      <h2 class="section-title" style="text-align:center">Мастера</h2>
      <div style="margin-top:14px">${S.barbers.length ? S.barbers.map(b=>html`<button class="barber" type="button" data-b="${b.id}">${portrait(b)}
        <span style="flex:1;min-width:0"><span class="barber-name">${b.name}</span><span class="barber-spec">${b.spec}</span>
        <span class="barber-meta"><span>${stars(b.rating)} · ${b.reviews} отзывов</span><span>${b.nextFree ? 'свободен ' + D.label(b.nextFree.date).toLowerCase() + ', ' + b.nextFree.time : 'нет окон'}</span></span></span>${icon('right', 'row-chev')}</button>`)
        : html`<div class="skel" style="height:96px"></div><div class="skel" style="height:96px;margin-top:10px"></div>`}</div>
      ${rule}
      <h2 class="section-title" style="text-align:center">Прайс</h2>
      <div class="price-list" style="margin-top:14px">${S.services.map(s=>html`<div class="price"><span><span class="price-name">${s.name}</span><span class="price-sub">${s.dur} мин</span></span><span class="price-dots"></span><span class="price-val">${Kit.num(s.price)} р.</span></div>`)}</div>
      <p class="hint" style="text-align:center;margin-top:16px">Опоздание больше 15 минут — запись переносится. Оплата наличными или картой.</p>
    </div>`;
    $('#quick').addEventListener('click', ()=> startQuick());
  }
  Kit.on(view, 'click', '[data-b]', (e, el)=>{ if(!S.w) openBarber(S.barbers.find(b=>b.id === el.dataset.b)); });

  function openBarber(b){
    const sh = Kit.sheet({title:b.name, sub:b.spec, body: html`
      <div style="display:flex;gap:16px;align-items:center">${portrait(b, true)}<div><div>${stars(b.rating)} · ${b.reviews} отзывов</div><div class="hint" style="margin-top:4px">${b.exp}</div>${b.nextFree ? html`<div class="pill pill-accent" style="margin-top:8px">ближайшее: ${D.label(b.nextFree.date).toLowerCase()}, ${b.nextFree.time}</div>` : ''}</div></div>
      <p style="margin-top:16px;line-height:1.6">${b.bio}</p>`,
      actions: html`<button class="btn btn-primary" type="button" data-go>Записаться к мастеру</button>`});
    sh.$('[data-go]').addEventListener('click', ()=>{ sh.close(); startFlow({barber:b}); });
  }

  /* ============ ЗАПИСЬ ============ */
  const STEPS = ['service', 'time', 'contact', 'confirm'];
  function startFlow(init){
    S.w = Object.assign({barber:null, service:null, date:null, time:null, step:'service', name:S.contact ? S.contact.name : (Kit.user.firstName || ''), phone:S.contact ? S.contact.phone : '', editContact:!S.contact}, init);
    Kit.back.push(flowBack);
    drawStep();
  }
  function flowBack(){
    const w = S.w; if(!w) return;
    const i = STEPS.indexOf(w.step);
    if(w.quick && w.step === 'contact'){ w.step = 'service'; return drawStep(); }
    if(i > 0 && w.step !== 'done'){ w.step = STEPS[i - 1]; return drawStep(); }
    endFlow();
  }
  function endFlow(){ Kit.back.pop(flowBack); S.w = null; window.scrollTo(0, 0); renderHome(); }
  function head(title){
    const w = S.w;
    return html`<div style="display:flex;align-items:center;gap:6px;padding-top:6px"><button class="icon-btn" type="button" id="wBack" aria-label="Назад">${icon('left')}</button><span class="eyebrow">${w.barber ? w.barber.name : 'Любой мастер'}</span></div><h1 class="page-title">${Kit.raw(title)}</h1>`;
  }
  function drawStep(){
    window.scrollTo(0, 0);
    ({service:stepService, time:stepTime, contact:stepContact, confirm:stepConfirm, done:stepDone})[S.w.step]();
    const b = $('#wBack'); if(b) b.addEventListener('click', flowBack);
  }
  function stepService(){
    const w = S.w;
    view.innerHTML = html`<div class="screen">${head(w.quick ? 'Что <em>делаем?</em>' : 'Выберите <em>услугу</em>')}
      ${w.quick ? html`<p class="page-sub">Найдём ближайшее свободное время у любого мастера</p>` : ''}
      <div class="price-list section">${S.services.map(s=>html`<button type="button" class="price${w.service && w.service.id === s.id ? ' is-on' : ''}" data-s="${s.id}"><span><span class="price-name">${s.name}</span><span class="price-sub">${s.dur} мин · ${s.desc}</span></span><span class="price-dots"></span><span class="price-val">${Kit.num(s.price)} р.</span></button>`)}</div></div>`;
    setBar();
  }
  Kit.on(view, 'click', '[data-s]', async (e, el)=>{
      const w = S.w;
      if(!w || w.step !== 'service') return;
      w.service = S.services.find(s=>s.id === el.dataset.s); haptic('select');
      $$('.price').forEach(p=>p.classList.toggle('is-on', p === el));
      if(w.quick){
        const r = await api('getNearest', {serviceId:w.service.id});
        if(!r.ok || !r.match){ Kit.toast('На две недели вперёд всё занято — выберите мастера', 'error'); return; }
        w.barber = S.barbers.find(b=>b.id === r.match.barberId); w.date = r.match.date; w.time = r.match.time;
        w.step = 'contact'; drawStep(); return;
      }
      w.step = 'time'; drawStep();
  });
  function stepTime(){
    const w = S.w;
    const days = Array.from({length:14}, (_, i)=>D.add(D.today(), i));
    if(!w.date) w.date = days[0];
    view.innerHTML = html`<div class="screen">${head('Когда <em>удобно?</em>')}<p class="page-sub">${w.service.name} · ${w.service.dur} мин</p>
      <div class="days section" id="days">${days.map(k=>html`<button type="button" class="day${k === w.date ? ' is-on' : ''}" data-day="${k}"><span class="day-dow">${k === D.today() ? 'сег' : D.dow(k)}</span><span class="day-num">${D.day(k)}</span></button>`)}</div>
      <div class="section" id="slots"></div></div>`;
    Kit.on($('#days'), 'click', '[data-day]', (e, el)=>{ w.date = el.dataset.day; w.time = null; w.auto = false; haptic('select'); $$('#days .day').forEach(d=>d.classList.toggle('is-on', d === el)); loadSlots(); });
    w.auto = w.auto !== false;
    loadSlots();
  }
  async function loadSlots(){
    const w = S.w, day = w.date, box = $('#slots');
    box.innerHTML = '<div class="slots">' + '<div class="skel" style="height:48px"></div>'.repeat(8) + '</div>';
    const r = await api('getSlots', {barberId:w.barber.id, serviceId:w.service.id, date:day});
    if(!S.w || S.w.step !== 'time' || w.date !== day) return;
    const times = r.times || [];
    if(!times.length && w.auto){
      const next = D.add(day, 1);
      if(D.diff(D.today(), next) < 14){ w.date = next; $$('#days .day').forEach(d=>d.classList.toggle('is-on', d.dataset.day === next)); const on = $('#days .is-on'); if(on) on.scrollIntoView({inline:'center', block:'nearest'}); return loadSlots(); }
    }
    box.innerHTML = times.length ? html`<div class="slots">${times.map(t=>html`<button type="button" class="slot${w.time === t ? ' is-on' : ''}" data-t="${t}">${t}</button>`)}</div>`
      : html`<div class="empty">${icon('calendar')}<div class="empty-title">${r.dayOff ? 'У мастера выходной' : 'Всё расписано'}</div>Выберите другой день</div>`;
    Kit.on(box, 'click', '[data-t]', (e, el)=>{ w.time = el.dataset.t; haptic('select'); box.querySelectorAll('.slot').forEach(s=>s.classList.toggle('is-on', s === el)); upd(); });
    const upd = ()=> setBar(D.label(w.date) + (w.time ? ', ' + w.time : ''), money(w.service.price), 'Далее', !!w.time, ()=>{ w.step = 'contact'; drawStep(); });
    upd();
  }
  function stepContact(){
    const w = S.w;
    view.innerHTML = html`<div class="screen">${head('На кого <em>записать?</em>')}
      ${w.quick ? html`<div class="card section" style="display:flex;gap:12px;align-items:center">${portrait(w.barber)}<div><b>${w.barber.name}</b><div class="hint">${D.label(w.date)}, ${w.time} · ${w.service.name}</div></div></div>` : ''}
      ${!w.editContact ? html`<div class="card section" style="display:flex;align-items:center;gap:12px"><span class="avatar">${Kit.initials(w.name)}</span><div style="flex:1"><b>${w.name}</b><div class="hint mono">${Kit.phone.pretty(w.phone)}</div></div><button class="link-btn" type="button" id="edit">Изменить</button></div>`
        : html`<label class="field section"><span class="field-label">Имя</span><input class="input" id="name" maxlength="60" autocomplete="given-name" value="${w.name}" placeholder="Как к вам обращаться"></label>
          <div class="field"><span class="field-label">Телефон</span>${Kit.phone.field('phone', w.phone)}</div>`}
      <p class="hint" style="margin-top:12px">Напомним о записи за час. Если планы изменятся — отменить можно в «Моих записях».</p></div>`;
    const upd = ()=> setBar(w.service.name, money(w.service.price), 'Далее', w.name.trim().length >= 2 && /^\+375\d{9}$/.test(w.phone), ()=>{ w.step = 'confirm'; drawStep(); });
    const e = $('#edit'); if(e) e.addEventListener('click', ()=>{ w.editContact = true; stepContact(); });
    const ph = $('#phone');
    if(ph){ Kit.phone.bind(ph); ph.addEventListener('input', ()=>{ w.phone = Kit.phone.value(ph); upd(); }); $('#name').addEventListener('input', ev=>{ w.name = ev.target.value; upd(); }); }
    upd();
  }
  function stepConfirm(){
    const w = S.w;
    view.innerHTML = html`<div class="screen">${head('Всё <em>верно?</em>')}
      <div class="receipt section"><div class="eyebrow">Запись</div><h2>${w.service.name}</h2><div class="when">${D.label(w.date)}, ${D.long(w.date)} в ${w.time}</div>${Kit.raw('<div class="rule"><i></i></div>')}
        <div class="kv"><span class="k">Мастер</span><span class="v">${w.barber.name}</span></div>
        <div class="kv"><span class="k">Длительность</span><span class="v">${w.service.dur} мин</span></div>
        <div class="kv"><span class="k">Гость</span><span class="v">${w.name}</span></div>
        <div class="kv"><span class="k">Стоимость</span><span class="v">${money(w.service.price)}</span></div>
        <p class="hint" style="margin-top:10px">${S.info.address || ''}</p></div></div>`;
    setBar(w.barber.name, money(w.service.price), 'Записаться', true, submit);
  }
  async function submit(){
    const w = S.w;
    Kit.busy(barBtn, true);
    const r = await api('createBooking', {barberId:w.barber.id, serviceId:w.service.id, date:w.date, time:w.time, name:w.name.trim(), phone:w.phone});
    Kit.busy(barBtn, false);
    if(!r.ok){
      if(r.error === 'slot_unavailable'){ Kit.toast('Это время только что заняли — выберите другое', 'error'); w.time = null; w.step = 'time'; w.quick = false; drawStep(); }
      else Kit.toast(r.error === 'too_many' ? 'У вас уже несколько активных записей' : 'Не получилось записаться', 'error');
      return;
    }
    haptic('success');
    S.contact = {name:w.name.trim(), phone:w.phone};
    try{ localStorage.setItem('britva-contact', JSON.stringify(S.contact)); localStorage.setItem('britva-unseen', '1'); }catch(e){}
    updateDot(); w.booking = r.booking; w.step = 'done'; drawStep();
    api('getBarbers').then(x=>{ if(x.ok) S.barbers = x.barbers; });
  }
  function stepDone(){
    const b = S.w.booking;
    setBar();
    view.innerHTML = html`<div class="screen"><div class="success"><div class="success-icon">${icon('check')}</div><h1 class="success-title">Ждём вас</h1>
      <p class="success-sub">${b.barber} ждёт вас ${D.label(b.date).toLowerCase()}, ${D.long(b.date)} в ${b.time}. Напомним за час.</p></div>
      <div class="pole section"></div>
      <div class="section" style="display:flex;flex-direction:column;gap:10px"><button class="btn btn-primary btn-block" type="button" id="home">Готово</button><button class="btn btn-ghost btn-block" type="button" id="my">Мои записи</button></div></div>`;
    $('#home').addEventListener('click', endFlow);
    $('#my').addEventListener('click', ()=>{ endFlow(); openMy(); });
  }
  function startQuick(){ startFlow({quick:true}); }

  /* ============ МОИ ЗАПИСИ ============ */
  const ST = {wait:['Ждём вас','pill-accent'], chair:['В кресле','pill-ok'], done:['Завершено','pill-muted'], cancelled:['Отменена','pill-muted'], noshow:['Не пришли','pill-danger']};
  function updateDot(){ let on = false; try{ on = localStorage.getItem('britva-unseen') === '1'; }catch(e){} $('#myDot').hidden = !on; }
  $('#myBtn').addEventListener('click', openMy);
  async function openMy(){
    try{ localStorage.removeItem('britva-unseen'); }catch(e){}
    updateDot();
    const sh = Kit.sheet({title:'Мои записи', body:html`<div class="skel" style="height:72px"></div>`});
    const r = await api('getMyBookings');
    const list = r.bookings || [];
    sh.body.innerHTML = list.length ? html`<div class="list">${list.map(b=>html`<button class="row" type="button" data-id="${b.id}"><span class="row-main"><span class="row-title">${b.service}</span><span class="row-sub">${D.label(b.date)}, ${b.time} · ${b.barber}</span></span><span class="row-end"><span class="pill ${ST[b.status][1]}">${ST[b.status][0]}</span><span class="hint mono">${money(b.price)}</span></span></button>`)}</div>`
      : html`<div class="empty">${icon('scissors')}<div class="empty-title">Записей пока нет</div>Выберите мастера и время на главной</div>`;
    Kit.on(sh.body, 'click', '[data-id]', (e, el)=>{
      const b = list.find(x=>x.id === el.dataset.id);
      const cur = b.status === 'wait' ? 1 : b.status === 'chair' ? 2 : 3;
      const steps = [['Запись создана', D.label(b.createdAt.slice(0, 10))], ['Ждём вас', D.label(b.date) + ', ' + b.time], ['В кресле', b.barber], ['Готово', b.status === 'noshow' ? 'визит не состоялся' : 'спасибо, что выбрали нас']];
      const s2 = Kit.sheet({title:b.service, sub:b.barber + ' · ' + money(b.price), body: b.status === 'cancelled' ? html`<p class="muted">Запись отменена.</p>` :
        html`<ul class="timeline">${steps.map((s, i)=>html`<li class="${i < cur ? 'done' : i === cur ? 'cur' : ''}">${s[0]}<small>${s[1]}</small></li>`)}</ul>`,
        actions: html`${b.status === 'wait' ? html`<button class="btn btn-danger-soft" type="button" data-x>Отменить</button>` : ''}<button class="btn btn-primary" type="button" data-again>Повторить</button>`});
      const x = s2.$('[data-x]');
      if(x) x.addEventListener('click', async ()=>{
        if(!await Kit.confirm('Отменить запись к мастеру ' + b.barber + ' на ' + D.label(b.date).toLowerCase() + ', ' + b.time + '?', 'Отменить', true)) return;
        const rr = await api('cancelBooking', {id:b.id});
        if(!rr.ok){ Kit.toast('Не удалось отменить', 'error'); return; }
        Kit.toast('Запись отменена', 'ok'); s2.close(); sh.close(); api('getBarbers').then(x=>{ if(x.ok){ S.barbers = x.barbers; if(!S.w) renderHome(); } });
      });
      s2.$('[data-again]').addEventListener('click', ()=>{
        s2.close(); sh.close();
        startFlow({barber:S.barbers.find(x=>x.id === b.barberId) || S.barbers[0], service:S.services.find(x=>x.id === b.serviceId) || null, step:S.services.find(x=>x.id === b.serviceId) ? 'time' : 'service'});
      });
    });
  }

  async function boot(){
    renderHome(); updateDot();
    const r = await api('getBarbers');
    if(r.ok){ S.barbers = r.barbers; S.services = r.services; S.info = {address:r.address, hours:r.hours}; }
    if(!S.w) renderHome();
  }
  boot();
})();
</script>
</body>
</html>
