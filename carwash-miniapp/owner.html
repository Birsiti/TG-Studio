<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>БЛЕСК — владелец</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../kit/core.js"></script>
<link rel="stylesheet" href="../kit/base.css">
<link rel="stylesheet" href="brand.css">
<script src="mock.js"></script>
<script src="staff.js"></script>
</head>
<body>
<div class="app has-tabbar">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" id="mark"></div>
      <div class="brand-text"><span class="brand-name">БЛЕСК</span><span class="brand-role">Владелец</span></div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="csvBtn" type="button" aria-label="Выгрузить CSV"></button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button>
    </div>
  </header>

  <section data-panel="overview" hidden>
    <div class="page-head"><h1 class="page-title">Выручка</h1><p class="page-sub" id="ovSub"></p></div>
    <div class="seg" id="period">
      <button type="button" data-p="today">Сегодня</button><button type="button" data-p="week" class="is-on">Неделя</button><button type="button" data-p="month">Месяц</button><button type="button" data-p="custom">Период</button>
    </div>
    <div class="field-row section" id="custom" hidden style="margin-top:12px;align-items:flex-end">
      <label class="field" style="margin:0"><span class="field-label">С</span><input class="input" type="date" id="cFrom"></label>
      <label class="field" style="margin:0"><span class="field-label">По</span><input class="input" type="date" id="cTo"></label>
      <button class="btn btn-primary" type="button" id="cApply" style="flex:none">OK</button>
    </div>
    <div class="section" id="hero"></div>
    <div class="stats section" id="kpi"></div>
    <div class="card section"><div class="section-head"><h2 class="section-title">По дням</h2><span class="hint" id="chartHint"></span></div><div id="chart"></div></div>
    <div class="card section"><div class="section-head"><h2 class="section-title">Топ услуг</h2></div><div id="top"></div></div>
  </section>

  <section data-panel="bays" hidden>
    <div class="page-head"><h1 class="page-title">Боксы</h1><p class="page-sub">Статус постов и итоги дня</p></div>
    <div class="stats three" id="bayStats"></div>
    <div class="section" id="bayList"></div>
    <button class="add-tile section" type="button" id="bayAdd"></button>
  </section>

  <section data-panel="staff" hidden>
    <div class="page-head"><h1 class="page-title">Персонал</h1><p class="page-sub">Смены, начисления и выплаты за месяц</p></div>
    <div id="staffMount"></div>
  </section>

  <section data-panel="stock" hidden>
    <div class="page-head"><h1 class="page-title">Склад</h1><p class="page-sub">Химия и расходники</p></div>
    <div class="stats" id="invStats"></div>
    <div class="section" id="invList"></div>
    <button class="add-tile section" type="button" id="invAdd"></button>
  </section>

  <section data-panel="shop" hidden>
    <div class="page-head"><h1 class="page-title">Магазин</h1><p class="page-sub">Автохимия и сертификаты на продажу клиентам</p></div>
    <div id="shopList"></div>
    <button class="add-tile section" type="button" id="shopAdd"></button>
  </section>
</div>

<nav class="tabbar"><div class="tabbar-inner">
  <button type="button" data-tab="overview"><span data-ic="chart"></span>Обзор</button>
  <button type="button" data-tab="bays"><span data-ic="bays"></span>Боксы</button>
  <button type="button" data-tab="staff"><span data-ic="users"></span>Персонал</button>
  <button type="button" data-tab="stock"><span data-ic="box"></span>Склад</button>
  <button type="button" data-tab="shop"><span data-ic="bag"></span>Магазин</button>
</div></nav>

<script>
(function(){
  "use strict";
  const {html, icon, $, $$, date: D, money, num, haptic} = Kit;
  const api = Kit.createApi({bot:'carwash', mock: window.CarwashMock});
  $('#mark').innerHTML = icon('droplet');
  $('#csvBtn').innerHTML = icon('download');
  $('#bayAdd').innerHTML = html`${icon('plus')}Добавить бокс`;
  $('#invAdd').innerHTML = html`${icon('plus')}Добавить позицию`;
  $('#shopAdd').innerHTML = html`${icon('plus')}Добавить товар`;
  $$('[data-ic]').forEach(el=> el.outerHTML = String(icon(el.dataset.ic)));

  /* ============ ОБЗОР ============ */
  let period = 'week', range = null;
  function periodRange(){
    const t = D.today();
    if(period === 'today') return [t, t];
    if(period === 'week') return [D.add(t, -6), t];
    if(period === 'month') return [t.slice(0, 8) + '01', t];
    return range || [D.add(t, -29), t];
  }
  async function renderOverview(){
    const [from, to] = periodRange();
    $('#ovSub').textContent = from === to ? D.long(from) : D.long(from) + ' — ' + D.long(to);
    $('#hero').innerHTML = '<div class="skel" style="height:132px"></div>';
    const r = period === 'custom' ? await api('getOverviewRange', {from, to}) : await api('getOverview');
    if(!r.ok){ Kit.toast('Не удалось загрузить аналитику', 'error'); return; }
    let chart = r.chart, top = r.topServices, sum = r.overview[period] || r.overview.custom;
    if(period === 'month' || period === 'today'){
      const rr = await api('getOverviewRange', {from, to});
      chart = rr.chart; top = rr.topServices;
    }
    const prev = period === 'week' && r.overview.prevWeek;
    const delta = prev && prev.revenue ? Math.round((sum.revenue - prev.revenue) / prev.revenue * 100) : null;
    $('#hero').innerHTML = html`<div class="gloss">
      <div class="eyebrow">Выручка${period === 'week' ? ' за 7 дней' : ''}</div>
      <div class="gloss-title" style="font-size:36px" data-fit="22">${money(Math.round(sum.revenue))}</div>
      <div class="gloss-sub">${delta == null ? sum.bookings + ' ' + Kit.plural(sum.bookings, 'машина', 'машины', 'машин') : (delta >= 0 ? '▲ ' : '▼ ') + Math.abs(delta) + '% к прошлой неделе'}</div>
    </div>`;
    $('#kpi').innerHTML = html`
      <div class="stat"><div class="stat-label">Машин</div><div class="stat-value">${sum.bookings}</div></div>
      <div class="stat"><div class="stat-label">Средний чек</div><div class="stat-value" data-fit="16">${money(sum.avgCheck)}</div></div>
      <div class="stat"><div class="stat-label">Фонд оплаты</div><div class="stat-value" data-fit="16">${money(sum.payroll)}</div><div class="stat-delta hint">${sum.revenue ? Math.round(sum.payroll / sum.revenue * 100) : 0}% от выручки</div></div>
      <div class="stat"><div class="stat-label">Отмены</div><div class="stat-value">${sum.cancelled || 0}</div></div>`;
    $('#chartHint').textContent = chart.length > 1 ? 'макс. ' + money(Math.max(...chart.map(c=>c.v))) : '';
    $('#chart').innerHTML = chart.length > 1 ? Kit.chart.bars(chart.map(c=>({label:c.d, value:c.v})), {highlightLast:true, short:v=> v >= 1000 ? (v / 1000).toFixed(1).replace('.0', '') + 'к' : v})
      : html`<div class="empty-mini">График строится за период от двух дней</div>`;
    $('#top').innerHTML = Kit.chart.rank(top.map(t=>({name:t.name, value:t.revenue, note:t.count ? t.count + ' ' + Kit.plural(t.count, 'раз', 'раза', 'раз') : ''})), {format:v=>money(v)});
  }
  Kit.on($('#period'), 'click', '[data-p]', (e, el)=>{
    period = el.dataset.p; haptic('select');
    $$('#period button').forEach(b=>b.classList.toggle('is-on', b === el));
    $('#custom').hidden = period !== 'custom';
    if(period === 'custom'){
      const [f, t] = periodRange(); $('#cFrom').value = f; $('#cTo').value = t;
    }
    renderOverview();
  });
  $('#cApply').addEventListener('click', ()=>{
    const f = $('#cFrom').value, t = $('#cTo').value;
    if(!f || !t){ Kit.toast('Выберите обе даты', 'error'); return; }
    if(Math.abs(D.diff(f, t)) > 92){ Kit.toast('Период — не больше 3 месяцев', 'error'); return; }
    range = f <= t ? [f, t] : [t, f]; renderOverview();
  });
  $('#csvBtn').addEventListener('click', async ()=>{
    const [from, to] = periodRange();
    const r = await api('getBookings', {from, to});
    const rows = [['Дата','Время','Номер','Авто','Услуги','Сумма от','Сумма до','Клиент','Телефон','Статус']]
      .concat((r.bookings || []).map(b=>[b.date, b.time, b.car.number, (b.car.brand + ' ' + b.car.model).trim(), b.services.join(', '), b.priceMin, b.priceMax, b.contact.name, b.contact.phone, b.status]));
    Kit.csv('blesk-' + from + '_' + to + '.csv', rows);
  });

  /* ============ ОБЩИЙ РЕДАКТОР ============ */
  // fields: [{k, label, type:'text'|'num'|'seg'|'switch', opts?}]
  function editor(title, item, fields, save, del){
    const sh = Kit.sheet({title, body: html`${fields.map(f=>{
      const v = item[f.k];
      if(f.type === 'seg') return html`<div class="field"><span class="field-label">${f.label}</span><div class="seg" data-k="${f.k}">${f.opts.map(([ov, ol])=>html`<button type="button" data-v="${ov}" class="${v === ov ? 'is-on' : ''}">${ol}</button>`)}</div></div>`;
      if(f.type === 'switch') return html`<label class="row" style="padding:0 0 12px;border:0"><span class="row-main"><span class="row-title">${f.label}</span></span><span class="switch"><input type="checkbox" data-k="${f.k}" ${v ? Kit.raw('checked') : ''}><span></span></span></label>`;
      return html`<label class="field"><span class="field-label">${f.label}</span><input class="input${f.type === 'num' ? ' mono' : ''}" data-k="${f.k}" ${f.type === 'num' ? Kit.raw('inputmode="decimal"') : ''} value="${v == null ? '' : v}" maxlength="80"></label>`;
    })}${del ? html`<button class="btn btn-danger-soft btn-block" type="button" data-del>${icon('trash')}Удалить</button>` : ''}`,
      actions: html`<button class="btn btn-primary" type="button" data-save>Сохранить</button>`});
    const segVals = {};
    sh.el.querySelectorAll('.seg[data-k]').forEach(seg=>{
      segVals[seg.dataset.k] = item[seg.dataset.k];
      Kit.on(seg, 'click', '[data-v]', (e, el)=>{ segVals[seg.dataset.k] = el.dataset.v; seg.querySelectorAll('button').forEach(b=>b.classList.toggle('is-on', b === el)); haptic('select'); });
    });
    sh.$('[data-save]').addEventListener('click', async ()=>{
      const out = Object.assign({}, item);
      for(const f of fields){
        if(f.type === 'seg'){ out[f.k] = segVals[f.k]; continue; }
        const el = sh.$('[data-k="' + f.k + '"]');
        if(f.type === 'switch'){ out[f.k] = el.checked; continue; }
        if(f.type === 'num'){ const n = Number(String(el.value).replace(',', '.')); if(!(n >= 0)){ Kit.toast('Проверьте поле «' + f.label + '»', 'error'); return; } out[f.k] = n; continue; }
        out[f.k] = el.value.trim();
        if(f.req && out[f.k].length < 1){ Kit.toast('Заполните «' + f.label + '»', 'error'); return; }
      }
      Kit.busy(sh.$('[data-save]'), true);
      const ok = await save(out);
      if(!ok){ Kit.busy(sh.$('[data-save]'), false); Kit.toast('Не удалось сохранить', 'error'); return; }
      sh.close(); Kit.toast('Сохранено', 'ok');
    });
    const d = sh.$('[data-del]');
    if(d) d.addEventListener('click', async ()=>{
      if(!await Kit.confirm('Удалить «' + item.name + '»?', 'Удалить', true)) return;
      if(await del()){ sh.close(); Kit.toast('Удалено', 'ok'); } else Kit.toast('Не удалось удалить', 'error');
    });
  }

  /* ============ БОКСЫ ============ */
  const BAY = {free:['Свободен','pill-ok'], busy:['Моют','pill-accent'], repair:['Ремонт','pill-warn']};
  let BAYS = [];
  async function renderBays(){
    const r = await api('getBays'); BAYS = r.bays || [];
    const cnt = BAYS.reduce((a, b)=>a + b.todayCount, 0), rev = BAYS.reduce((a, b)=>a + b.todayRevenue, 0);
    $('#bayStats').innerHTML = html`<div class="stat"><div class="stat-label">Работают</div><div class="stat-value">${BAYS.filter(b=>b.status !== 'repair').length}/${BAYS.length}</div></div>
      <div class="stat"><div class="stat-label">Машин</div><div class="stat-value">${cnt}</div></div>
      <div class="stat"><div class="stat-label">Выручка</div><div class="stat-value" data-fit="14">${num(rev)}</div></div>`;
    $('#bayList').innerHTML = html`<div class="list">${BAYS.map(b=>html`<button class="row" type="button" data-id="${b.id}"><span class="bay-lamp ${b.status}"></span>
      <span class="row-main"><span class="row-title">${b.name}</span><span class="row-sub">${b.note || 'Без заметок'} · ${b.todayCount} ${Kit.plural(b.todayCount, 'машина', 'машины', 'машин')}</span></span>
      <span class="row-end"><span class="pill ${BAY[b.status][1]}">${BAY[b.status][0]}</span><span class="mono hint">${money(b.todayRevenue)}</span></span></button>`)}</div>`;
  }
  function openBay(b){
    const isNew = !b;
    b = b || {name:'', status:'free', note:'', todayCount:0, todayRevenue:0};
    editor(isNew ? 'Новый бокс' : b.name, b, [
      {k:'name', label:'Название', req:true}, {k:'status', label:'Статус', type:'seg', opts:[['free','Свободен'],['busy','Моют'],['repair','Ремонт']]},
      {k:'note', label:'Заметка'}, {k:'todayCount', label:'Машин сегодня', type:'num'}, {k:'todayRevenue', label:'Выручка сегодня, BYN', type:'num'}],
      async v=>{ const r = await api('saveBay', {bay:v}); if(r.ok) renderBays(); return r.ok; },
      isNew ? null : async ()=>{ const r = await api('deleteBay', {id:b.id}); if(r.ok) renderBays(); return r.ok; });
  }
  Kit.on($('#bayList'), 'click', '[data-id]', (e, el)=> openBay(BAYS.find(x=>x.id === el.dataset.id)));
  $('#bayAdd').addEventListener('click', ()=> openBay(null));

  /* ============ СКЛАД ============ */
  let INV = [];
  async function renderStock(){
    const r = await api('getInventory'); INV = r.items || [];
    const value = INV.reduce((a, i)=>a + i.qty * i.price, 0), low = INV.filter(i=>i.qty < i.min);
    $('#invStats').innerHTML = html`<div class="stat"><div class="stat-label">Стоимость склада</div><div class="stat-value" data-fit="16">${money(Math.round(value))}</div></div>
      <div class="stat${low.length ? '' : ''}"><div class="stat-label">Заканчивается</div><div class="stat-value" style="${low.length ? 'color:var(--danger)' : ''}">${low.length}</div></div>`;
    INV.sort((a, b)=> (a.qty / (a.min || 1)) - (b.qty / (b.min || 1)));
    $('#invList').innerHTML = html`<div class="list">${INV.map(i=>{ const pct = Math.min(100, Math.round(i.qty / Math.max(i.min * 2, 1) * 100)); return html`<button class="row" type="button" data-id="${i.id}">
      <span class="row-main"><span class="row-title">${i.name}</span><span class="row-sub">мин. ${num(i.min)} ${i.unit} · ${money(i.price)}/${i.unit}</span><span class="stock-bar"><i class="${i.qty < i.min ? 'low' : ''}" style="width:${pct}%"></i></span></span>
      <span class="row-end"><span class="mono" style="font-weight:700;font-size:17px${i.qty < i.min ? ';color:var(--danger)' : ''}">${num(i.qty)}</span><span class="hint">${i.unit}</span></span></button>`; })}</div>`;
  }
  function openInv(i){
    const isNew = !i;
    i = i || {name:'', unit:'л', qty:0, min:0, price:0};
    editor(isNew ? 'Новая позиция' : i.name, i, [
      {k:'name', label:'Название', req:true}, {k:'unit', label:'Единица (л, шт, кг)', req:true}, {k:'qty', label:'Остаток', type:'num'},
      {k:'min', label:'Минимум (порог заказа)', type:'num'}, {k:'price', label:'Цена за единицу, BYN', type:'num'}],
      async v=>{ const r = await api('saveInventoryItem', {item:v}); if(r.ok) renderStock(); return r.ok; },
      isNew ? null : async ()=>{ const r = await api('deleteInventoryItem', {id:i.id}); if(r.ok) renderStock(); return r.ok; });
  }
  Kit.on($('#invList'), 'click', '[data-id]', (e, el)=> openInv(INV.find(x=>x.id === el.dataset.id)));
  $('#invAdd').addEventListener('click', ()=> openInv(null));

  /* ============ МАГАЗИН ============ */
  let SHOP = [];
  async function renderShop(){
    const r = await api('getShop'); SHOP = r.items || [];
    $('#shopList').innerHTML = html`<div class="list">${SHOP.map(i=>html`<button class="row" type="button" data-id="${i.id}">
      <span class="row-icon">${icon(/сертификат/i.test(i.name) ? 'gift' : 'bag')}</span>
      <span class="row-main"><span class="row-title">${i.name}</span><span class="row-sub">${i.stock > 0 ? 'В наличии ' + i.stock + ' шт' : 'Нет в наличии'}</span></span>
      <span class="row-end"><span class="mono" style="font-weight:700">${money(i.price)}</span>${i.visible ? '' : html`<span class="pill pill-muted">скрыт</span>`}</span></button>`)}</div>`;
  }
  function openShop(i){
    const isNew = !i;
    i = i || {name:'', price:0, stock:0, visible:true};
    editor(isNew ? 'Новый товар' : i.name, i, [
      {k:'name', label:'Название', req:true}, {k:'price', label:'Цена, BYN', type:'num'}, {k:'stock', label:'Остаток, шт', type:'num'}, {k:'visible', label:'Показывать клиентам', type:'switch'}],
      async v=>{ v.stock = Math.round(v.stock); const r = await api('saveShopItem', {item:v}); if(r.ok) renderShop(); return r.ok; },
      isNew ? null : async ()=>{ const r = await api('deleteShopItem', {id:i.id}); if(r.ok) renderShop(); return r.ok; });
  }
  Kit.on($('#shopList'), 'click', '[data-id]', (e, el)=> openShop(SHOP.find(x=>x.id === el.dataset.id)));
  $('#shopAdd').addEventListener('click', ()=> openShop(null));

  /* ============ ВКЛАДКИ ============ */
  StaffModule.init({api, mount:$('#staffMount')});
  const RENDER = {overview:renderOverview, bays:renderBays, staff:()=>StaffModule.render(), stock:renderStock, shop:renderShop};
  Kit.tabs({onChange:(tab)=>{ $('#csvBtn').hidden = tab !== 'overview'; RENDER[tab](); }});
})();
</script>
</body>
</html>
