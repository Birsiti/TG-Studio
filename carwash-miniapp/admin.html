<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>БЛЕСК — администратор</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../kit/core.js"></script>
<link rel="stylesheet" href="../kit/base.css">
<link rel="stylesheet" href="brand.css">
<script src="mock.js"></script>
<script src="staff.js"></script>
</head>
<body>
<div class="app has-tabbar">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" id="mark"></div>
      <div class="brand-text"><span class="brand-name">БЛЕСК</span><span class="brand-role">Администратор</span></div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="Обновить"></button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button>
    </div>
  </header>

  <section data-panel="today" hidden>
    <div class="page-head"><h1 class="page-title" id="todayTitle">Сегодня</h1><p class="page-sub" id="todaySub"></p></div>
    <div class="stats" id="todayStats"></div>
    <div class="section">
      <div class="section-head"><h2 class="section-title">Записи</h2><span class="hint" id="todayCount"></span></div>
      <div id="todayList"></div>
    </div>
  </section>

  <section data-panel="shift" hidden>
    <div class="page-head"><h1 class="page-title">Смена</h1><p class="page-sub">Кто работает сегодня и сколько начислено</p></div>
    <div id="staffMount"></div>
  </section>

  <section data-panel="search" hidden>
    <div class="page-head"><h1 class="page-title">Поиск</h1></div>
    <div class="search"><span id="searchIc"></span><input class="input" id="q" type="search" placeholder="Номер авто, телефон или имя" autocomplete="off"></div>
    <div class="chips scroll section" id="qFilter" style="margin-top:12px"></div>
    <div class="section" id="qList"></div>
  </section>

  <section data-panel="schedule" hidden>
    <div class="page-head"><h1 class="page-title">Расписание</h1><p class="page-sub">Нажмите на свободный слот, чтобы закрыть его для записи</p></div>
    <div class="days" id="schDays"></div>
    <div class="section" id="schSlots"></div>
    <div class="section">
      <div class="section-head"><h2 class="section-title">Часы работы</h2></div>
      <div class="card" id="hours"></div>
    </div>
    <div class="section">
      <div class="section-head"><h2 class="section-title">Закрытые даты</h2></div>
      <div class="field-row"><input class="input" type="date" id="closedNew"><button class="btn btn-soft" type="button" id="closedAdd" style="flex:none">Закрыть день</button></div>
      <div class="chips" id="closedList" style="margin-top:12px"></div>
    </div>
  </section>

  <section data-panel="services" hidden>
    <div class="page-head"><h1 class="page-title">Услуги</h1><p class="page-sub">Скрытые услуги не видны клиентам, но остаются в истории</p></div>
    <button class="add-tile" type="button" id="svcAdd"></button>
    <div id="svcList"></div>
  </section>
</div>

<nav class="tabbar"><div class="tabbar-inner">
  <button type="button" data-tab="today"><span data-ic="calendar"></span>Сегодня</button>
  <button type="button" data-tab="shift"><span data-ic="users"></span>Смена</button>
  <button type="button" data-tab="search"><span data-ic="search"></span>Поиск</button>
  <button type="button" data-tab="schedule"><span data-ic="clock"></span>Расписание</button>
  <button type="button" data-tab="services"><span data-ic="list"></span>Услуги</button>
</div></nav>

<script>
(function(){
  "use strict";
  const {html, icon, $, $$, date: D, money, moneyRange, haptic} = Kit;
  const api = Kit.createApi({bot:'carwash', mock: window.CarwashMock});
  $('#mark').innerHTML = icon('droplet');
  $('#refreshBtn').innerHTML = icon('refresh');
  $('#searchIc').outerHTML = String(icon('search'));
  $('#svcAdd').innerHTML = html`${icon('plus')}Новая услуга`;
  $$('[data-ic]').forEach(el=> el.outerHTML = String(icon(el.dataset.ic)));

  const ST = {pending:['Ожидает','pill-warn'], confirmed:['Подтверждена','pill-accent'], done:['Выполнена','pill-ok'], cancelled:['Отменена','pill-muted']};
  const CLASS_RU = {legkovoy:'Седан', krossover:'Кроссовер', vnedorozhnik:'Внедорожник', minivan:'Минивэн'};
  const CLASSES = Object.keys(CLASS_RU);
  let BOOKINGS = [], CATS = [], SCHEDULE = null, CLOSED = [];

  async function loadBookings(){
    const r = await api('getBookings', {from:D.add(D.today(), -30), to:D.add(D.today(), 30)});
    BOOKINGS = r.bookings || [];
    return BOOKINGS;
  }

  function bookingRow(b, withDate){
    const s = ST[b.status] || ['', ''];
    const staff = b.assignedStaffId && StaffModule.byId(b.assignedStaffId);
    return html`<button class="row" type="button" data-b="${b.id}">
      <span class="mono" style="font-weight:700;font-size:17px;width:56px;flex:none">${b.time}</span>
      <span class="row-main"><span class="row-title"><span class="mono">${b.car.number}</span> · ${(b.car.brand + ' ' + b.car.model).trim()}</span>
        <span class="row-sub">${withDate ? D.label(b.date) + ' · ' : ''}${b.services.join(', ')}${staff ? ' · ' + staff.name.split(' ')[0] : ''}</span></span>
      <span class="row-end"><span class="pill ${s[1]}">${s[0]}</span><span class="mono hint">${moneyRange(b.priceMin, b.priceMax)}</span></span>
    </button>`;
  }
  function listHtml(list, withDate){
    return list.length ? html`<div class="list">${list.map(b=>bookingRow(b, withDate))}</div>` : html`<div class="empty">${icon('calendar')}<div class="empty-title">Записей нет</div>Свободный день — самое время для детейлинга</div>`;
  }
  function bindRows(root){
    Kit.on(root, 'click', '[data-b]', (e, el)=>{ const b = BOOKINGS.find(x=>x.id === el.dataset.b); if(b) openBooking(b); });
  }

  /* ============ КАРТОЧКА ЗАПИСИ ============ */
  function openBooking(b){
    const onShift = new Set(StaffModule.getShiftIds());
    if(b.assignedStaffId) onShift.add(b.assignedStaffId);
    const crew = StaffModule.getStaff().filter(s=>onShift.has(s.id) && s.active);
    const sh = Kit.sheet({title:b.car.number, sub:D.when(b.date, b.time) + ' · ' + (CLASS_RU[b.car.carClass] || ''), body: html`
      <div class="kv"><span class="k">Авто</span><span class="v">${(b.car.brand + ' ' + b.car.model).trim() || '—'}</span></div>
      <div class="kv"><span class="k">Услуги</span><span class="v">${b.services.join(', ')}</span></div>
      <div class="kv"><span class="k">Клиент</span><span class="v">${b.contact.name}</span></div>
      <div class="kv"><span class="k">Телефон</span><span class="v mono">${Kit.phone.pretty(b.contact.phone)}</span></div>
      <div class="kv"><span class="k">Сумма</span><span class="v mono">${moneyRange(b.priceMin, b.priceMax)}</span></div>
      <div class="section"><div class="eyebrow" style="margin-bottom:8px">Статус</div>
        <div class="seg seg-grid" id="bSt">${['pending','confirmed','done','cancelled'].map(k=>html`<button type="button" data-v="${k}" class="${b.status === k ? 'is-on' : ''}">${ST[k][0]}</button>`)}</div></div>
      <div class="section"><div class="eyebrow" style="margin-bottom:8px">Кто делает</div>
        ${crew.length ? html`<div class="chips" id="bCrew">${crew.map(s=>html`<button type="button" class="chip${b.assignedStaffId === s.id ? ' is-on' : ''}" data-s="${s.id}">${s.name.split(' ')[0]}</button>`)}${b.assignedStaffId ? html`<button type="button" class="chip" data-s="">Снять</button>` : ''}</div>`
          : html`<p class="hint">Никого нет на смене — отметьте сотрудников на вкладке «Смена».</p>`}
      </div>`,
      actions: html`<a class="btn btn-ghost" href="tel:${b.contact.phone}">${icon('phone')}Позвонить</a><button class="btn btn-primary" type="button" data-close>Готово</button>`});
    sh.$('[data-close]').addEventListener('click', sh.close);
    Kit.on(sh.$('#bSt'), 'click', '[data-v]', async (e, el)=>{
      const prev = b.status; b.status = el.dataset.v;
      sh.el.querySelectorAll('#bSt button').forEach(x=>x.classList.toggle('is-on', x === el)); haptic('select');
      const r = await api('updateBookingStatus', {id:b.id, status:b.status});
      if(!r.ok){ b.status = prev; Kit.toast(r.error === 'slot_unavailable' ? 'Это время уже занято' : 'Не удалось изменить статус', 'error'); sh.close(); }
      refreshVisible();
    });
    const crewBox = sh.$('#bCrew');
    if(crewBox) Kit.on(crewBox, 'click', '[data-s]', async (e, el)=>{
      const prev = b.assignedStaffId; b.assignedStaffId = el.dataset.s || null;
      const r = await api('assignBookingStaff', {id:b.id, staffId:b.assignedStaffId});
      if(!r.ok){ b.assignedStaffId = prev; Kit.toast('Не удалось назначить', 'error'); return; }
      haptic('success'); sh.close(); openBooking(b); refreshVisible();
    });
  }

  /* ============ СЕГОДНЯ ============ */
  async function renderToday(){
    $('#todaySub').textContent = D.dowLong(D.today()).replace(/^./, c=>c.toUpperCase()) + ', ' + D.long(D.today());
    if(!BOOKINGS.length) $('#todayList').innerHTML = '<div class="skel" style="height:260px"></div>';
    await Promise.all([loadBookings(), StaffModule.load()]);
    const list = BOOKINGS.filter(b=>b.date === D.today()).sort((a, b)=> a.time.localeCompare(b.time));
    const act = list.filter(b=>b.status !== 'cancelled');
    const nowM = D.nowMinutes();
    const next = act.find(b=>D.toMinutes(b.time) >= nowM - 15 && b.status !== 'done');
    $('#todayStats').innerHTML = html`
      <div class="stat is-accent"><div class="stat-label">Следующая</div><div class="stat-value" data-fit="16">${next ? next.time : '—'}</div><div class="stat-delta" style="color:inherit;opacity:.85" data-fit="12">${next ? next.car.number : 'на сегодня всё'}</div></div>
      <div class="stat"><div class="stat-label">Выручка плана</div><div class="stat-value" data-fit="16">${money(act.reduce((a, b)=>a + b.priceMin, 0))}</div><div class="stat-delta hint">${act.length} ${Kit.plural(act.length, 'запись', 'записи', 'записей')}</div></div>
      <div class="stat"><div class="stat-label">Ждут подтверждения</div><div class="stat-value">${act.filter(b=>b.status === 'pending').length}</div></div>
      <div class="stat"><div class="stat-label">Без исполнителя</div><div class="stat-value">${act.filter(b=>!b.assignedStaffId && b.status !== 'done').length}</div></div>`;
    $('#todayCount').textContent = list.length ? list.length + ' всего' : '';
    $('#todayList').innerHTML = listHtml(list);
  }

  /* ============ ПОИСК ============ */
  const FILTERS = [['today','Сегодня'],['tomorrow','Завтра'],['week','7 дней'],['past','Прошедшие'],['all','Все']];
  let qFilter = 'week';
  async function renderSearch(){
    $('#qFilter').innerHTML = html`${FILTERS.map(([k, l])=>html`<button type="button" class="chip${qFilter === k ? ' is-on' : ''}" data-f="${k}">${l}</button>`)}`;
    if(!BOOKINGS.length) await loadBookings();
    drawSearch();
  }
  function drawSearch(){
    const q = $('#q').value.trim().toLowerCase(), t = D.today();
    let list = BOOKINGS.filter(b=>{
      if(qFilter === 'today') return b.date === t;
      if(qFilter === 'tomorrow') return b.date === D.add(t, 1);
      if(qFilter === 'week') return b.date >= t && b.date <= D.add(t, 7);
      if(qFilter === 'past') return b.date < t;
      return true;
    });
    if(q){
      const qd = q.replace(/\D/g, '');
      list = list.filter(b=> b.car.number.toLowerCase().replace(/\s/g, '').includes(q.replace(/\s/g, '')) || b.contact.name.toLowerCase().includes(q) || (qd.length >= 3 && b.contact.phone.includes(qd)));
    }
    list.sort((a, b)=> qFilter === 'past' ? (b.date + b.time).localeCompare(a.date + a.time) : (a.date + a.time).localeCompare(b.date + b.time));
    $('#qList').innerHTML = html`<p class="hint" style="margin-bottom:8px">Найдено: ${list.length}</p>${listHtml(list.slice(0, 80), true)}`;
  }
  $('#q').addEventListener('input', Kit.debounce(drawSearch, 150));
  Kit.on($('#qFilter'), 'click', '[data-f]', (e, el)=>{ qFilter = el.dataset.f; haptic('select'); renderSearch(); });

  /* ============ РАСПИСАНИЕ ============ */
  let schDay = D.today();
  const WD = [['mon','Пн'],['tue','Вт'],['wed','Ср'],['thu','Чт'],['fri','Пт'],['sat','Сб'],['sun','Вс']];
  async function renderSchedule(){
    const days = Array.from({length:14}, (_, i)=>D.add(D.today(), i));
    $('#schDays').innerHTML = html`${days.map(k=>html`<button type="button" class="day${k === schDay ? ' is-on' : ''}" data-day="${k}"><span class="day-dow">${D.dow(k)}</span><span class="day-num">${D.day(k)}</span></button>`)}`;
    drawSlots();
    const r = await api('getSchedule');
    SCHEDULE = r.schedule || {}; CLOSED = r.closedDates || [];
    drawHours(); drawClosed();
  }
  async function drawSlots(){
    const box = $('#schSlots'), day = schDay;
    box.innerHTML = '<div class="slots">' + '<div class="skel" style="height:48px"></div>'.repeat(8) + '</div>';
    const r = await api('getDaySlots', {date:day});
    if(day !== schDay) return;
    const slots = r.slots || [];
    if(!slots.length){ box.innerHTML = html`<div class="empty-mini">В этот день мойка не работает</div>`; return; }
    const busy = slots.filter(s=>s.state === 'booked').length, blocked = slots.filter(s=>s.state === 'blocked').length;
    box.innerHTML = html`<p class="hint" style="margin-bottom:10px">Занято ${busy} из ${slots.length}${blocked ? ' · закрыто ' + blocked : ''}</p>
      <div class="slots">${slots.map(s=>html`<button type="button" class="slot-admin st-${s.state}" data-t="${s.time}" data-st="${s.state}" data-bid="${s.bookingId || ''}">${s.time}</button>`)}</div>`;
  }
  Kit.on($('#schDays'), 'click', '[data-day]', (e, el)=>{ schDay = el.dataset.day; haptic('select'); $$('#schDays .day').forEach(d=>d.classList.toggle('is-on', d === el)); drawSlots(); });
  Kit.on($('#schSlots'), 'click', '[data-t]', async (e, el)=>{
    if(el.dataset.st === 'booked'){
      if(!BOOKINGS.length) await loadBookings();
      const b = BOOKINGS.find(x=>x.id === el.dataset.bid); if(b) openBooking(b); return;
    }
    haptic('light');
    const r = await api(el.dataset.st === 'blocked' ? 'unblockSlot' : 'blockSlot', {date:schDay, time:el.dataset.t});
    if(!r.ok) Kit.toast('Не удалось изменить слот', 'error');
    drawSlots();
  });
  function drawHours(){
    $('#hours').innerHTML = html`${WD.map(([k, l])=>{ const d = SCHEDULE[k] || {open:false, from:'09:00', to:'19:00'}; return html`<div class="hours-row" data-wd="${k}">
      <span class="d">${l}</span>
      ${d.open ? html`<input class="input time-input" type="time" data-f="from" value="${d.from.padStart(5, '0')}"><span class="faint">—</span><input class="input time-input" type="time" data-f="to" value="${d.to.padStart(5, '0')}">` : html`<span class="muted" style="flex:1">Выходной</span>`}
      <span style="flex:1"></span><span class="switch"><input type="checkbox" data-open ${d.open ? Kit.raw('checked') : ''} aria-label="Рабочий день"><span></span></span></div>`; })}`;
  }
  async function saveHours(){
    const r = await api('saveSchedule', {schedule:SCHEDULE});
    if(!r.ok){ Kit.toast(r.message || 'Не удалось сохранить часы', 'error'); return renderSchedule(); }
    Kit.toast('Часы работы сохранены', 'ok'); drawSlots();
  }
  $('#hours').addEventListener('change', e=>{
    const row = e.target.closest('[data-wd]'); if(!row) return;
    const d = SCHEDULE[row.dataset.wd] = Object.assign({open:false, from:'09:00', to:'19:00'}, SCHEDULE[row.dataset.wd]);
    if(e.target.matches('[data-open]')){ d.open = e.target.checked; drawHours(); }
    else d[e.target.dataset.f] = e.target.value;
    saveHours();
  });
  function drawClosed(){
    $('#closedList').innerHTML = CLOSED.length ? html`${CLOSED.map(d=>html`<button type="button" class="chip" data-cd="${d}">${D.long(d)}${icon('x')}</button>`)}` : html`<span class="hint">Нет закрытых дат</span>`;
  }
  $('#closedNew').min = D.today();
  $('#closedAdd').addEventListener('click', async ()=>{
    const v = $('#closedNew').value; if(!v){ Kit.toast('Выберите дату', 'error'); return; }
    const r = await api('addClosedDate', {date:v});
    if(!r.ok){ Kit.toast('Не удалось закрыть день', 'error'); return; }
    if(!CLOSED.includes(v)) CLOSED.push(v); CLOSED.sort(); drawClosed(); drawSlots(); Kit.toast('День закрыт для записи', 'ok');
  });
  Kit.on($('#closedList'), 'click', '[data-cd]', async (e, el)=>{
    if(!await Kit.confirm('Открыть ' + D.long(el.dataset.cd) + ' для записи?', 'Открыть')) return;
    const r = await api('removeClosedDate', {date:el.dataset.cd});
    if(!r.ok){ Kit.toast('Не удалось', 'error'); return; }
    CLOSED = CLOSED.filter(x=>x !== el.dataset.cd); drawClosed(); drawSlots();
  });

  /* ============ УСЛУГИ ============ */
  async function renderServices(){
    const r = await api('getServices');
    CATS = r.categories || [];
    $('#svcList').innerHTML = html`${CATS.map(c=>html`<div class="section"><div class="section-head"><h2 class="section-title">${c.category}</h2><span class="hint">${c.items.length}</span></div>
      <div class="list">${c.items.map(it=>html`<button class="row" type="button" data-svc="${it.id}"><span class="row-main"><span class="row-title"${it.visible ? '' : Kit.raw(' style="opacity:.55"')}>${it.name}</span><span class="row-sub mono">${moneyRange(it.price.legkovoy[0], it.price.legkovoy[1])} · седан</span></span>${it.visible ? '' : html`<span class="pill pill-muted">скрыта</span>`}${icon('right', 'row-chev')}</button>`)}</div></div>`)}`;
  }
  Kit.on($('#svcList'), 'click', '[data-svc]', (e, el)=>{
    for(const c of CATS){ const it = c.items.find(x=>x.id === el.dataset.svc); if(it) return openService(it, c.category); }
  });
  $('#svcAdd').addEventListener('click', ()=> openService(null, CATS[0] ? CATS[0].category : 'Мойка'));
  function openService(it, cat){
    const isNew = !it;
    it = it || {name:'', desc:'', visible:true, price:{legkovoy:[0,0], krossover:[0,0], vnedorozhnik:[0,0], minivan:[0,0]}};
    const cats = CATS.map(c=>c.category);
    const sh = Kit.sheet({title:isNew ? 'Новая услуга' : 'Услуга', body: html`
      <label class="field"><span class="field-label">Название</span><input class="input" id="fName" maxlength="80" value="${it.name}"></label>
      <div class="field"><span class="field-label">Категория</span><div class="chips" id="fCat">${cats.map(c=>html`<button type="button" class="chip${c === cat ? ' is-on' : ''}" data-v="${c}">${c}</button>`)}</div></div>
      <label class="field"><span class="field-label">Описание</span><textarea class="textarea" id="fDesc" maxlength="400" rows="3">${it.desc || ''}</textarea></label>
      <span class="field-label">Цена, BYN (от — до)</span>
      <div class="card card-flat" style="padding:4px 14px">${CLASSES.map(k=>html`<div class="hours-row"><span data-fit="12">${CLASS_RU[k]}</span><input class="input time-input" inputmode="decimal" data-cls="${k}" data-i="0" value="${it.price[k][0]}"><span class="faint">—</span><input class="input time-input" inputmode="decimal" data-cls="${k}" data-i="1" value="${it.price[k][1]}"></div>`)}</div>
      <label class="row section" style="padding:0;border:0"><span class="row-main"><span class="row-title">Показывать клиентам</span></span><span class="switch"><input type="checkbox" id="fVis" ${it.visible ? Kit.raw('checked') : ''}><span></span></span></label>
      ${isNew ? '' : html`<button class="btn btn-danger-soft btn-block section" type="button" data-del>${icon('trash')}Удалить услугу</button>`}`,
      actions: html`<button class="btn btn-primary" type="button" data-save>Сохранить</button>`});
    Kit.on(sh.$('#fCat'), 'click', '[data-v]', (e, el)=>{ cat = el.dataset.v; sh.el.querySelectorAll('#fCat .chip').forEach(x=>x.classList.toggle('is-on', x === el)); });
    sh.$('[data-save]').addEventListener('click', async ()=>{
      const price = {};
      CLASSES.forEach(k=>{ price[k] = [0, 1].map(i=> Number(String(sh.$('[data-cls="' + k + '"][data-i="' + i + '"]').value).replace(',', '.')) || 0); });
      const name = sh.$('#fName').value.trim();
      if(name.length < 2){ Kit.toast('Укажите название', 'error'); return; }
      Kit.busy(sh.$('[data-save]'), true);
      const r = await api('saveService', {category:cat, item:{id:it.id, name, desc:sh.$('#fDesc').value.trim(), price, visible:sh.$('#fVis').checked}});
      if(!r.ok){ Kit.busy(sh.$('[data-save]'), false); Kit.toast('Не удалось сохранить', 'error'); return; }
      sh.close(); renderServices(); Kit.toast('Сохранено', 'ok');
    });
    const del = sh.$('[data-del]');
    if(del) del.addEventListener('click', async ()=>{
      if(!await Kit.confirm('Удалить «' + it.name + '»? Лучше скрыть, если услуга вернётся.', 'Удалить', true)) return;
      const r = await api('deleteService', {id:it.id});
      if(!r.ok){ Kit.toast('Не удалось удалить', 'error'); return; }
      sh.close(); renderServices(); Kit.toast('Услуга удалена', 'ok');
    });
  }

  /* ============ ВКЛАДКИ ============ */
  let current = 'today';
  const RENDER = {today:renderToday, shift:()=>StaffModule.render(), search:renderSearch, schedule:renderSchedule, services:renderServices};
  function refreshVisible(){ (RENDER[current] || renderToday)(); }
  StaffModule.init({api, mount:$('#staffMount')});
  bindRows($('#todayList')); bindRows($('#qList'));
  Kit.tabs({onChange:(tab)=>{ current = tab; RENDER[tab](); }});
  $('#refreshBtn').addEventListener('click', ()=>{ haptic('light'); BOOKINGS = []; refreshVisible(); });
})();
</script>
