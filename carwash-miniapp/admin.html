      return await res.json();

    }

      for(let h=9; h<=19; h++){ ['00','30'].forEach(m=>times.push(h+':'+m)); }
      const blocked = BLOCKED_SLOTS[payload.date] || [];
      const bookedTimes = MOCK_BOOKINGS.filter(b=>b.date===payload.date && b.status!=='cancelled').map(b=>b.time);
      const slots = times.map(t=>{
        if(bookedTimes.includes(t)) return {time:t, state:'booked', bookingId:(MOCK_BOOKINGS.find(b=>b.date===payload.date && b.time===t)||{}).id};
        if(blocked.includes(t)) return {time:t, state:'blocked'};
        return {time:t, state:'free'};
      });
      return {ok:true, slots};
    }
    if(action==='blockSlot'){
      if(!BLOCKED_SLOTS[payload.date]) BLOCKED_SLOTS[payload.date]=[];
      if(!BLOCKED_SLOTS[payload.date].includes(payload.time)) BLOCKED_SLOTS[payload.date].push(payload.time);
      return {ok:true};
    }
    if(action==='unblockSlot'){
      if(BLOCKED_SLOTS[payload.date]) BLOCKED_SLOTS[payload.date] = BLOCKED_SLOTS[payload.date].filter(t=>t!==payload.time);
      return {ok:true};
    }
    if(action==='getServices') return {ok:true, categories:MOCK_SERVICES};
    if(action==='saveService'){
      let placed=false;
      MOCK_SERVICES.forEach(cat=>{
        const idx = cat.items.findIndex(it=>it.id===payload.item.id);
        if(idx>-1){ cat.items[idx]=payload.item; placed=true; }
      });
      if(!placed){
        let cat = MOCK_SERVICES.find(c=>c.category===payload.category);
        if(!cat){ cat={category:payload.category, items:[]}; MOCK_SERVICES.push(cat); }
        cat.items.push(payload.item);
      }
      return {ok:true};
    }
    if(action==='deleteService'){
      MOCK_SERVICES.forEach(cat=>{ cat.items = cat.items.filter(it=>it.id!==payload.id); });
      return {ok:true};
    }
    if(action==='getSchedule') return {ok:true, schedule:SCHEDULE, closedDates:CLOSED_DATES};
    if(action==='saveSchedule'){ SCHEDULE = payload.schedule; return {ok:true}; }
    if(action==='addClosedDate'){ if(!CLOSED_DATES.includes(payload.date)) CLOSED_DATES.push(payload.date); return {ok:true}; }
    if(action==='removeClosedDate'){ CLOSED_DATES = CLOSED_DATES.filter(d=>d!==payload.date); return {ok:true}; }
    if(action==='getMyTheme') return {ok:true, theme: MOCK_THEME};
    if(action==='saveTheme'){ MOCK_THEME = payload.theme; return {ok:true}; }
    return {ok:false};
  }

  async function renderSearch(){
    renderDateFilterChips();
    let list = await fetchAllBookings();
    if(activeDateFilter==='today') list = list.filter(b=>b.date===TODAY);
    else if(activeDateFilter==='tomorrow') list = list.filter(b=>b.date===shiftDate(1));
    else if(activeDateFilter==='week'){

      list = list.filter(b=> b.date>=TODAY && b.date<=weekEnd);

      list = list.filter(b=>
        b.car.number.toLowerCase().includes(searchQuery) ||

      );

    if(!list.length){

      chip.innerHTML = `<div class="dow">${d.toLocaleDateString('ru-RU',{weekday:'short'})}</div><div class="num">${d.getDate()}</div>`;
      chip.addEventListener('click', ()=>{ scheduleSelectedDate=key; haptic(); renderScheduleDayScroller(); renderDaySlots(); });

  async function renderDaySlots(){
    const grid = $('scheduleSlotGrid');
    grid.innerHTML = '<div style="grid-column:1/-1; color:var(--ink-soft); font-size:13px;">Загрузка…</div>';
    const res = await api('getDaySlots', {date:scheduleSelectedDate});
    if(!res.ok){
      grid.innerHTML = '<div style="grid-column:1/-1; color:var(--ink-soft); font-size:13px;">Не удалось загрузить слоты.</div>';
      showToast('Не удалось загрузить слоты', true);
      return;
    }
    grid.innerHTML='';
    if(!res.slots.length){
      grid.innerHTML = '<div style="grid-column:1/-1; color:var(--ink-soft); font-size:13px;">В этот день мойка не работает.</div>';
      return;
    }
    res.slots.forEach(s=>{
      const el = document.createElement('div');
      el.className='slot'+(s.state==='blocked'?' blocked':'')+(s.state==='booked'?' booked-slot':'');
      el.textContent = s.time;
      el.addEventListener('click', async ()=>{
        if(s.state==='booked'){
          const b = ALL_BOOKINGS.find(x=>x.id===s.bookingId);
          if(b) openBookingSheet(b);
          return;
        }
        haptic();
        const action = s.state==='blocked' ? 'unblockSlot' : 'blockSlot';
        const res2 = await api(action, {date:scheduleSelectedDate, time:s.time});
        if(!res2.ok) showToast('Не удалось изменить слот', true);
        renderDaySlots();
      });
      grid.appendChild(el);
    });
  }

      </div>
      <div class="sheet-footer-row">
        ${isNew ? '' : `<button class="btn btn-danger btn-block" id="deleteSvcBtn">Удалить</button>`}
        <button class="btn btn-primary btn-block" id="saveSvcBtn">Сохранить</button>
      </div>
    `);
    let visibleState = it.visible!==false;
    $('svcVisibleSwitch').addEventListener('click', ()=>{ visibleState=!visibleState; $('svcVisibleSwitch').classList.toggle('on', visibleState); });

    if(!isNew){
      $('deleteSvcBtn').addEventListener('click', async ()=>{
        if(!await App.confirmAsync('Удалить услугу «'+it.name+'»?')) return;
        const res = await api('deleteService', {id: it.id});
        if(!res.ok){ showToast('Не удалось удалить услугу', true); return; }
        haptic('success');
        closeSheet();
        renderServices();
      });
    }
    $('saveSvcBtn').addEventListener('click', async ()=>{
      const classes = ['legkovoy','krossover','vnedorozhnik','minivan'];
      const price = {};
      classes.forEach(c=>{ price[c] = [Number($('pMin_'+c).value)||0, Number($('pMax_'+c).value)||0]; });
      const updated = {
        id: it.id, name: $('svcName').value.trim() || 'Без названия',
        price, desc: $('svcDesc').value.trim(), visible: visibleState
      };
      const res = await api('saveService', {category: $('svcCategory').value, item: updated});
      if(!res.ok){ showToast('Не удалось сохранить услугу', true); return; }
      haptic('success');
      closeSheet();
      renderServices();
    });
  }
  $('addServiceBtn').addEventListener('click', ()=> openServiceSheet(null, MOCK_SERVICES[0] && MOCK_SERVICES[0].category));

  /* ============ ПЕРЕКЛЮЧЕНИЕ СВЕТЛАЯ/ТЁМНАЯ ============ */
  const MODE_ICONS = {
    light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
    dark: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
  };
  function renderModeIcon(){ $('modeIcon').innerHTML = MODE_ICONS[App.getMode()] || MODE_ICONS.light; }
  $('modeToggleBtn').addEventListener('click', ()=>{ haptic(); App.toggleMode(); renderModeIcon(); });
  renderModeIcon();

  /* ============ ЦВЕТОВАЯ СХЕМА (личный выбор, привязан к tg_id на сервере) ============ */
  const BRAND_META = {
    avtohimiya: { label: 'Автохимия с полки', sub: 'Зелёный/оранжевый, дружелюбный', swatch: 'linear-gradient(135deg,#63B33A,#F2624A)' },
    voda:       { label: 'Вода и пена', sub: 'Бирюзовый/янтарный, свежий', swatch: 'linear-gradient(135deg,#0C8599,#E8A33D)' },
    chrome:     { label: 'Хром и перламутр', sub: 'Синий, технологичный', swatch: 'linear-gradient(135deg,#2E5EFF,#1E44CC)' },
    mercedes:   { label: 'Mercedes', sub: 'Премиальный, хром + красный', swatch: 'linear-gradient(135deg,#C6CBD1,#B3122E)' },
    telegram:   { label: 'Telegram', sub: 'Фирменный синий, как в самом Telegram', swatch: 'linear-gradient(135deg,#2AABEE,#229ED9)' },
  };
  function openBrandSheet(){
    const current = App.getBrand();
    openSheet(`
      <div class="sheet-title">Цветовая схема</div>
      <div style="font-size:12.5px; color:var(--ink-soft); margin:-6px 0 14px;">Меняет оформление только у вас — привязано к вашему аккаунту, у клиентов и владельца ничего не меняется.</div>
      <div id="brandOptions"></div>
    `);
    const wrap = $('brandOptions');
    App.BRAND_LIST.forEach(id=>{
      const meta = BRAND_META[id];
      const active = id === current;
      const row = document.createElement('div');
      row.className = 'staff-row';
      row.innerHTML = `
        <div style="width:40px;height:40px;border-radius:50%;flex-shrink:0;background:${meta.swatch};${active?'box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent);':''}"></div>
        <div class="staff-main">
          <div class="staff-name">${meta.label}</div>
          <div class="staff-role">${meta.sub}</div>
        </div>
        ${active ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;color:var(--accent);flex-shrink:0;"><path d="M20 6L9 17l-5-5"/></svg>' : ''}
      `;
      row.addEventListener('click', ()=>{
        closeSheet();
        if(active) return;
        App.applyBrand(id);
        api('saveTheme', {userId: tgUser.id, theme:id}).catch(()=>{});
        haptic('success');
        showToast('Схема «' + meta.label + '» применена');
      });
      wrap.appendChild(row);
    });
  }
  $('brandSettingsBtn').addEventListener('click', openBrandSheet);

  // Догоняем локальный выбор серверным при заходе — если с другого устройства
  // сохранена другая схема или Telegram WebView успел почистить localStorage.
  async function loadMyTheme(){
    const res = await api('getMyTheme', {userId: tgUser.id});
    if(res.ok && res.theme && res.theme !== App.getBrand()) App.applyBrand(res.theme);
  }

  /* ============ BOOTSTRAP ============ */
  async function bootstrapApp(){
    CONFIG = await App.loadConfig();

    document.body.dataset.theme = App.resolveBrand(CONFIG.theme);
    const cs = getComputedStyle(document.body);
    App.setChrome(cs.getPropertyValue('--bg').trim(), cs.getPropertyValue('--surface').trim());
    loadMyTheme().catch(()=>{});

    if(CONFIG.status === 'paused'){
      $('bootLoading').style.display='none';
      $('bootPaused').style.display='flex';
      return;
    }

    $('brandName').textContent = CONFIG.businessName;
    isAllowed = CONFIG.allowedAdminIds.length===0 || CONFIG.allowedAdminIds.includes(tgUser.id);
    if(CONFIG.allowedAdminIds.length===0){
      $('roleBadge').textContent='Демо';
      $('roleBadge').classList.add('badge-demo');
    }
    if(!isAllowed){ $('lockScreen').style.display='block'; }
    else { $('mainUi').style.display='block'; $('tabbar').style.display='flex'; }

    if(isAllowed){
      renderToday();
      schedulePrefetch = api('getSchedule').catch(()=>({ok:false}));
      servicesPrefetch = api('getServices').catch(()=>({ok:false}));
      requestAnimationFrame(()=>{ const active = document.querySelector('.tab-btn.active'); if(active) positionIndicator(active); });
    }

    $('bootLoading').style.display='none';
  }
  bootstrapApp();
})();
</script>
</body>
</html>
