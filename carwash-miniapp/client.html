<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>БЛЕСК — запись на мойку</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../kit/core.js"></script>
<link rel="stylesheet" href="../kit/base.css">
<link rel="stylesheet" href="brand.css">
<script src="mock.js"></script>
</head>
<body>
<div class="app has-actionbar" id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" id="mark"></div>
      <div class="brand-text"><span class="brand-name">БЛЕСК</span><span class="brand-role">Автомойка · Минск</span></div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="myBtn" type="button" aria-label="Мои записи"><span id="myIcon"></span><span class="dot-badge" id="myDot" hidden></span></button>
      <a class="icon-btn" id="callBtn" href="tel:+375291234567" aria-label="Позвонить"></a>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Оформление"></button>
    </div>
  </header>
  <div id="stepsWrap">
    <div class="steps" id="steps"><i></i><i></i><i></i><i></i></div>
    <div class="step-label" id="stepLabel"></div>
  </div>
  <main id="view"></main>
</div>

<div class="actionbar" id="bar">
  <div class="actionbar-inner">
    <div class="total"><div class="total-label" id="totalLabel">Итого</div><div class="total-value" id="totalValue" data-fit="14">—</div></div>
    <button class="btn btn-primary" id="nextBtn" type="button">Далее</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  const {html, icon, $, date: D, money, moneyRange, haptic} = Kit;
  const api = Kit.createApi({bot:'carwash', mock: window.CarwashMock});
  const PHONE = '+375291234567';

  $('#mark').innerHTML = icon('droplet');
  $('#myIcon').innerHTML = icon('ticket');
  $('#callBtn').innerHTML = icon('phone');

  /* ============ ДАННЫЕ ============ */
  const CLASSES = [
    {id:'legkovoy', label:'Седан', svg:'<path d="M3 16h42v-3.5l-5-1.5-6-5.5H17L11 11l-7 1.5z"/><circle cx="12" cy="17" r="3"/><circle cx="36" cy="17" r="3"/>'},
    {id:'krossover', label:'Кроссовер', svg:'<path d="M3 16h42v-5l-5-1-5-5H15l-5 5-7 1.5z"/><circle cx="12" cy="17" r="3.4"/><circle cx="36" cy="17" r="3.4"/>'},
    {id:'vnedorozhnik', label:'Внедорожник', svg:'<path d="M3 16h42V9.5l-4-.5-3-6H12L9 9l-6 .5z"/><circle cx="12" cy="17" r="3.8"/><circle cx="36" cy="17" r="3.8"/>'},
    {id:'minivan', label:'Минивэн', svg:'<path d="M3 16h42v-5l-3-2-4-6H8L4 9.5 3 11z"/><circle cx="12" cy="17" r="3.2"/><circle cx="37" cy="17" r="3.2"/>'}
  ];
  const CAT_ICON = {'Мойка':'droplet','Салон':'seatClean','Детейлинг':'sparkle','Доп. услуги':'wrench'};
  const MODELS = {
    'Toyota':['Camry','Corolla','RAV4','Land Cruiser','Land Cruiser Prado','Highlander','C-HR'],
    'Volkswagen':['Polo','Golf','Passat','Tiguan','Jetta','Touareg','Touran'],
    'BMW':['3 серии','5 серии','X1','X3','X5','X6'],
    'Mercedes-Benz':['C-Class','E-Class','S-Class','GLC','GLE','Vito'],
    'Audi':['A4','A6','Q3','Q5','Q7'],
    'Renault':['Logan','Sandero','Duster','Kaptur','Arkana'],
    'Hyundai':['Solaris','Elantra','Tucson','Santa Fe','Creta'],
    'Kia':['Rio','Ceed','K5','Sportage','Sorento','Seltos'],
    'Skoda':['Octavia','Rapid','Superb','Kodiaq','Karoq'],
    'Nissan':['Almera','Qashqai','X-Trail','Juke'],
    'Geely':['Coolray','Atlas','Emgrand','Tugella','Monjaro'],
    'Haval':['Jolion','F7','H6','Dargo'],
    'Chery':['Tiggo 4','Tiggo 7','Tiggo 8'],
    'Lada':['Granta','Vesta','Niva','Largus'],
    'Mazda':['3','6','CX-5','CX-30'],
    'Ford':['Focus','Mondeo','Kuga'],
    'Lexus':['ES','RX','NX','LX'],
    'Volvo':['S60','XC60','XC90'],
    'Mitsubishi':['Lancer','Outlander','ASX','Pajero'],
    'Peugeot':['308','408','3008','5008'],
    'Opel':['Astra','Insignia','Mokka'],
    'Honda':['Civic','Accord','CR-V'],
    'Subaru':['Forester','Outback','XV'],
    'Land Rover':['Discovery','Range Rover','Defender'],
    'Porsche':['Cayenne','Macan','Panamera'],
    'BYD':['Song Plus','Han','Atto 3'],
    'Citroen':['C4','C5','Berlingo']
  };
  const STATUS_PILL = {'Ожидает':'pill-warn','Подтверждена':'pill-accent','Выполнена':'pill-ok','Отменена':'pill-muted'};

  const S = {
    step:1, car:{number:'', brand:'', model:'', carClass:null, id:null},
    cars:[], cats:[], picked:[], schedule:null, closed:[], date:null, time:null, slots:[],
    name:'', phone:'', consent:false, ticket:null
  };

  /* ============ ОБЩЕЕ ============ */
  const view = $('#view'), bar = $('#bar'), nextBtn = $('#nextBtn');
  const LABELS = ['Автомобиль','Услуги','Дата и время','Контакты'];
  function allItems(){ return S.cats.flatMap(c=>c.items); }
  function priceOf(it){ const p = it.price[S.car.carClass || 'legkovoy'] || [0,0]; return p; }
  function total(){
    let lo=0, hi=0;
    allItems().filter(it=>S.picked.includes(it.id)).forEach(it=>{ const p = priceOf(it); lo+=p[0]; hi+=p[1]; });
    return [lo, hi];
  }
  function backStep(){ go(S.step - 1); }

  function go(n){
    if(S.step > 1) Kit.back.pop(backStep);
    S.step = n;
    if(n > 1 && n < 5) Kit.back.push(backStep);
    $('#stepsWrap').hidden = n > 4;
    document.querySelectorAll('#steps i').forEach((el, i)=> el.classList.toggle('is-done', i < n));
    $('#stepLabel').textContent = n <= 4 ? 'Шаг ' + n + ' из 4 · ' + LABELS[n-1] : '';
    bar.hidden = n > 4;
    [null, renderCar, renderServices, renderTime, renderContacts, renderTicket][n]();
    view.firstElementChild && view.firstElementChild.classList.add('screen');
    window.scrollTo(0, 0);
    updateBar();
  }

  function updateBar(){
    const [lo, hi] = total();
    let ok = false, label = 'Далее';
    if(S.step === 1) ok = S.car.number.replace(/\s/g,'').length >= 4 && !!S.car.carClass;
    if(S.step === 2) ok = S.picked.length > 0;
    if(S.step === 3) ok = !!(S.date && S.time);
    if(S.step === 4){ ok = S.name.trim().length >= 2 && Kit.phone.valid($('#phone') || {value:''}) && S.consent; label = 'Записаться'; }
    nextBtn.textContent = label;
    nextBtn.disabled = !ok;
    if(S.picked.length){
      $('#totalLabel').textContent = S.picked.length + ' ' + Kit.plural(S.picked.length, 'услуга', 'услуги', 'услуг');
      $('#totalValue').textContent = moneyRange(lo, hi);
    } else {
      $('#totalLabel').textContent = S.step === 1 ? 'Выберите класс авто' : 'Итого';
      $('#totalValue').textContent = '—';
    }
  }

  nextBtn.addEventListener('click', ()=>{
    if(S.step < 4){ haptic('light'); go(S.step + 1); }
    else submit();
  });

  /* ============ ШАГ 1 — АВТО ============ */
  function plateHtml(num){
    return html`<div class="plate"><div class="plate-flag"><i></i>BY</div><div class="plate-num${num ? '' : ' is-empty'}" data-fit="16" id="plateNum">${num || '1234 AB-7'}</div></div>`;
  }
  function renderCar(){
    view.innerHTML = html`<div>
      <section class="gloss">
        <div class="eyebrow">Запись за минуту</div>
        <div class="gloss-title">Какую машину моем?</div>
        ${plateHtml(S.car.number)}
      </section>
      ${S.cars.length ? html`<div class="section"><div class="section-head"><h2 class="section-title">Мои машины</h2></div>
        <div class="chips scroll" id="myCars">${S.cars.map(c=>html`<button type="button" class="car-chip${S.car.id === c.id ? ' is-on' : ''}" data-car="${c.id}"><b>${c.number}</b><span>${(c.brand + ' ' + c.model).trim() || 'Без марки'}</span></button>`)}
          <button type="button" class="car-chip" data-car="new"><b>+ Новая</b><span>другое авто</span></button></div></div>` : ''}
      <div class="section">
        <label class="field"><span class="field-label">Госномер</span><input class="input mono" id="num" autocomplete="off" autocapitalize="characters" maxlength="14" placeholder="1234 AB-7" value="${S.car.number}"></label>
        <div class="field-row">
          <label class="field suggest"><span class="field-label">Марка</span><input class="input" id="brand" autocomplete="off" placeholder="Kia" value="${S.car.brand}"></label>
          <label class="field suggest"><span class="field-label">Модель</span><input class="input" id="model" autocomplete="off" placeholder="Sportage" value="${S.car.model}"></label>
        </div>
        <span class="field-label">Класс — от него зависит цена</span>
        <div class="classes" id="classes">${CLASSES.map(c=>html`<button type="button" class="class-tile${S.car.carClass === c.id ? ' is-on' : ''}" data-cls="${c.id}"><svg viewBox="0 0 48 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">${Kit.raw(c.svg)}</svg><span data-fit="12">${c.label}</span></button>`)}</div>
      </div>
    </div>`;
    const num = $('#num');
    num.addEventListener('input', ()=>{
      num.value = num.value.toUpperCase().replace(/[^0-9A-ZА-ЯЁ\s-]/g, '');
      S.car.number = num.value.trim(); S.car.id = null;
      const p = $('#plateNum'); p.textContent = S.car.number || '1234 AB-7'; p.classList.toggle('is-empty', !S.car.number);
      updateBar();
    });
    suggest($('#brand'), q=> Object.keys(MODELS).filter(b=>b.toLowerCase().startsWith(q)), v=>{ S.car.brand = v; });
    suggest($('#model'), q=>{
      const b = Object.keys(MODELS).find(x=>x.toLowerCase() === S.car.brand.trim().toLowerCase());
      return (b ? MODELS[b] : []).filter(m=>m.toLowerCase().startsWith(q));
    }, v=>{ S.car.model = v; });
    Kit.on($('#classes'), 'click', '[data-cls]', (e, el)=>{
      S.car.carClass = el.dataset.cls; haptic('select');
      document.querySelectorAll('.class-tile').forEach(t=>t.classList.toggle('is-on', t === el));
      updateBar();
    });
    const my = $('#myCars');
    if(my) Kit.on(my, 'click', '[data-car]', (e, el)=>{
      haptic('select');
      if(el.dataset.car === 'new'){ S.car = {number:'', brand:'', model:'', carClass:null, id:null}; renderCar(); updateBar(); $('#num').focus(); return; }
      const c = S.cars.find(x=>x.id === el.dataset.car);
      if(c){ fillCar(c); renderCar(); updateBar(); }
    });
    if(my) attachLongPress(my);
  }
  function fillCar(c){ S.car = {number:c.number, brand:c.brand || '', model:c.model || '', carClass:c.carClass || null, id:c.id}; }

  // удерживание чипа машины — удалить из сохранённых
  function attachLongPress(wrap){
    let t = null;
    wrap.addEventListener('touchstart', e=>{
      const el = e.target.closest('[data-car]'); if(!el || el.dataset.car === 'new') return;
      t = setTimeout(()=>{ t = null; askDeleteCar(el.dataset.car); }, 600);
    }, {passive:true});
    ['touchend','touchmove','touchcancel'].forEach(ev=> wrap.addEventListener(ev, ()=>{ if(t){ clearTimeout(t); t = null; } }, {passive:true}));
    wrap.addEventListener('contextmenu', e=>{ const el = e.target.closest('[data-car]'); if(el && el.dataset.car !== 'new'){ e.preventDefault(); askDeleteCar(el.dataset.car); } });
  }
  async function askDeleteCar(id){
    const c = S.cars.find(x=>x.id === id); if(!c) return;
    if(!await Kit.confirm('Удалить «' + c.number + '» из сохранённых машин?', 'Удалить', true)) return;
    await api('deleteCar', {id});
    S.cars = S.cars.filter(x=>x.id !== id);
    if(S.car.id === id) S.car.id = null;
    renderCar(); Kit.toast('Машина удалена', 'ok');
  }

  function suggest(input, getItems, onSet){
    const wrap = input.parentElement;
    let list = null;
    function hide(){ if(list){ list.remove(); list = null; } }
    function show(){
      const q = input.value.trim().toLowerCase();
      const items = q ? getItems(q).slice(0, 5) : [];
      hide();
      if(!items.length || (items.length === 1 && items[0].toLowerCase() === q)) return;
      list = document.createElement('div'); list.className = 'suggest-list';
      list.innerHTML = html`${items.map(v=>html`<button type="button">${v}</button>`)}`;
      list.addEventListener('pointerdown', e=>{
        const b = e.target.closest('button'); if(!b) return;
        e.preventDefault(); input.value = b.textContent; onSet(b.textContent); hide(); haptic('select');
      });
      wrap.appendChild(list);
    }
    input.addEventListener('input', ()=>{ onSet(input.value.trim()); show(); });
    input.addEventListener('focus', show);
    input.addEventListener('blur', ()=> setTimeout(hide, 120));
  }

  /* ============ ШАГ 2 — УСЛУГИ ============ */
  function renderServices(){
    const cls = CLASSES.find(c=>c.id === S.car.carClass);
    view.innerHTML = html`<div>
      <div class="page-head"><h1 class="page-title">Что делаем?</h1><p class="page-sub">Цены для класса «${cls ? cls.label : ''}». Итог уточнит мастер на месте.</p></div>
      ${S.cats.length ? S.cats.map(cat=>html`
        <div class="cat-title"><span class="row-icon">${icon(CAT_ICON[cat.category] || 'sparkle')}</span><h3>${cat.category}</h3></div>
        ${cat.items.map(it=>{ const p = priceOf(it); return html`<button type="button" class="svc${S.picked.includes(it.id) ? ' is-on' : ''}" data-svc="${it.id}">
          <span class="svc-main"><span class="svc-name">${it.name}</span>${it.desc ? html`<span class="svc-desc">${it.desc}</span>` : ''}<span class="svc-price">${p[0] === p[1] ? money(p[0]) : 'от ' + Kit.num(p[0]) + ' до ' + money(p[1])}</span></span>
          <span class="svc-check">${icon('check')}</span></button>`; })}
      `) : html`<div class="skel" style="height:96px;margin-top:12px"></div><div class="skel" style="height:96px;margin-top:8px"></div><div class="skel" style="height:96px;margin-top:8px"></div>`}
    </div>`;
  }
  Kit.on(view, 'click', '[data-svc]', (e, el)=>{
    if(S.step !== 2) return;
    const id = el.dataset.svc;
    S.picked = S.picked.includes(id) ? S.picked.filter(x=>x !== id) : S.picked.concat(id);
    el.classList.toggle('is-on', S.picked.includes(id));
    haptic('select'); updateBar();
  });

  /* ============ ШАГ 3 — ДАТА И ВРЕМЯ ============ */
  function dayOpen(k){
    if(!S.schedule) return true;
    if(S.closed.includes(k)) return false;
    const wd = ['sun','mon','tue','wed','thu','fri','sat'][D.parse(k).getDay()];
    return !!(S.schedule[wd] && S.schedule[wd].open);
  }
  function renderTime(){
    const days = Array.from({length:14}, (_, i)=> D.add(D.today(), i));
    if(!S.date || !dayOpen(S.date)){ S.date = days.find(dayOpen) || days[0]; S.autoDate = true; }
    view.innerHTML = html`<div>
      <div class="page-head"><h1 class="page-title">Когда удобно?</h1><p class="page-sub">Слот — 30 минут. Длинные работы мастер согласует отдельно.</p></div>
      <div class="days" id="days">${days.map(k=>html`<button type="button" class="day${k === S.date ? ' is-on' : ''}" data-day="${k}" ${dayOpen(k) ? '' : Kit.raw('disabled')}><span class="day-dow">${k === D.today() ? 'сег' : D.dow(k)}</span><span class="day-num">${D.day(k)}</span></button>`)}</div>
      <div class="section" id="slotsBox"></div>
    </div>`;
    Kit.on($('#days'), 'click', '[data-day]', (e, el)=>{
      S.date = el.dataset.day; S.time = null; S.autoDate = false; haptic('select');
      document.querySelectorAll('.day').forEach(d=>d.classList.toggle('is-on', d === el));
      loadSlots(); updateBar();
    });
    const on = $('#days .is-on'); if(on) on.scrollIntoView({inline:'center', block:'nearest'});
    loadSlots();
  }
  async function loadSlots(){
    const box = $('#slotsBox'), day = S.date;
    box.innerHTML = '<div class="slots">' + '<div class="skel" style="height:48px"></div>'.repeat(12) + '</div>';
    const res = await api('getSlots', {date:day});
    if(day !== S.date || !$('#slotsBox')) return;
    S.slots = res.slots || [];
    const free = S.slots.filter(s=>!s.disabled);
    if(!free.length && S.autoDate){
      // день выбран автоматически, а свободного времени уже нет — сдвигаемся
      const next = Array.from({length:13}, (_, i)=> D.add(day, i + 1)).find(dayOpen);
      if(next && D.diff(D.today(), next) < 14){
        S.date = next;
        document.querySelectorAll('.day').forEach(d=>d.classList.toggle('is-on', d.dataset.day === next));
        const on = $('#days .is-on'); if(on) on.scrollIntoView({inline:'center', block:'nearest'});
        return loadSlots();
      }
    }
    if(!S.slots.length || !free.length){
      box.innerHTML = html`<div class="empty">${icon('calendar')}<div class="empty-title">${!S.slots.length ? 'Выходной' : day === D.today() ? 'На сегодня запись закрыта' : 'Всё занято'}</div>Выберите другой день</div>`;
      return;
    }
    const groups = [['Утро', s=>D.toMinutes(s.time) < 720], ['День', s=>D.toMinutes(s.time) >= 720 && D.toMinutes(s.time) < 1020], ['Вечер', s=>D.toMinutes(s.time) >= 1020]];
    box.innerHTML = html`${groups.map(([name, f])=>{ const list = S.slots.filter(f); if(!list.length) return ''; return html`<div class="slot-group"><div class="eyebrow">${name}</div><div class="slots">${list.map(s=>html`<button type="button" class="slot${S.time === s.time ? ' is-on' : ''}" data-time="${s.time}" ${s.disabled ? Kit.raw('disabled') : ''}>${s.time}</button>`)}</div></div>`; })}`;
    Kit.on(box, 'click', '[data-time]', (e, el)=>{
      S.time = el.dataset.time; haptic('select');
      box.querySelectorAll('.slot').forEach(s=>s.classList.toggle('is-on', s === el));
      updateBar();
    });
  }

  /* ============ ШАГ 4 — КОНТАКТЫ ============ */
  function renderContacts(){
    const [lo, hi] = total();
    const names = allItems().filter(it=>S.picked.includes(it.id)).map(it=>it.name);
    view.innerHTML = html`<div>
      <div class="page-head"><h1 class="page-title">Почти готово</h1><p class="page-sub">Подтвердим запись и напомним за час.</p></div>
      <label class="field"><span class="field-label">Как к вам обращаться</span><input class="input" id="name" autocomplete="given-name" maxlength="60" placeholder="Имя" value="${S.name}"></label>
      <div class="field"><span class="field-label">Телефон</span>${Kit.phone.field('phone', S.phone)}</div>
      <div class="card section">
        <div class="kv"><span class="k">Авто</span><span class="v mono">${S.car.number}</span></div>
        <div class="kv"><span class="k">Когда</span><span class="v">${D.when(S.date, S.time)}</span></div>
        <div class="kv"><span class="k">Услуги</span><span class="v">${names.join(', ')}</span></div>
        <div class="kv"><span class="k">Сумма</span><span class="v mono">${moneyRange(lo, hi)}</span></div>
      </div>
      <label class="check section"><input type="checkbox" id="consent" ${S.consent ? Kit.raw('checked') : ''}><span>Согласен на обработку персональных данных для записи и напоминаний</span></label>
    </div>`;
    const phone = $('#phone');
    Kit.phone.bind(phone);
    $('#name').addEventListener('input', e=>{ S.name = e.target.value; updateBar(); });
    phone.addEventListener('input', ()=>{ S.phone = Kit.phone.value(phone); phone.parentElement.classList.remove('is-bad'); updateBar(); });
    $('#consent').addEventListener('change', e=>{ S.consent = e.target.checked; updateBar(); });
  }

  async function submit(){
    const phoneEl = $('#phone');
    if(!Kit.phone.valid(phoneEl)){ phoneEl.parentElement.classList.add('is-bad'); Kit.toast('Проверьте номер телефона', 'error'); return; }
    Kit.busy(nextBtn, true);
    const res = await api('createBooking', {
      date:S.date, time:S.time,
      car:{number:S.car.number, brand:S.car.brand, model:S.car.model, carClass:S.car.carClass, id:S.car.id},
      serviceIds:S.picked, contact:{name:S.name.trim(), phone:Kit.phone.value(phoneEl)}
    });
    Kit.busy(nextBtn, false);
    if(!res.ok){
      if(res.error === 'slot_unavailable'){ Kit.toast('Это время только что заняли — выберите другое', 'error'); S.time = null; go(3); }
      else if(res.error === 'too_many') Kit.toast('У вас уже много активных записей', 'error');
      else Kit.toast('Не получилось записаться. Попробуйте ещё раз', 'error');
      return;
    }
    haptic('success');
    S.ticket = res.booking;
    try{ localStorage.setItem('blesk-unseen', '1'); }catch(e){}
    updateDot();
    api('getMyCars').then(r=>{ S.cars = r.cars || []; });
    go(5);
  }

  /* ============ ШАГ 5 — БИЛЕТ ============ */
  function ticketHtml(b){
    const cancelled = b.status === 'Отменена';
    return html`<div class="ticket">
      <div class="ticket-top">
        <div class="eyebrow" style="color:rgba(233,247,250,.7)">${cancelled ? 'Запись отменена' : 'Ждём вас'}</div>
        <div class="ticket-when">${D.when(b.date, b.time)}</div>
        ${plateHtml(b.car.number)}
      </div>
      <div class="ticket-cut"></div>
      <div class="ticket-body">
        ${(b.car.brand + b.car.model).trim() ? html`<div class="kv"><span class="k">Авто</span><span class="v">${(b.car.brand + ' ' + b.car.model).trim()}</span></div>` : ''}
        <div class="kv"><span class="k">Услуги</span><span class="v">${Kit.nobr(b.services.join(', '))}</span></div>
        <div class="kv"><span class="k">Клиент</span><span class="v">${b.contact.name}</span></div>
        <div class="kv"><span class="k">Статус</span><span class="v"><span class="pill ${STATUS_PILL[b.status] || ''}">${b.status}</span></span></div>
        <div class="ticket-total"><span class="muted">Итого</span><b>${moneyRange(b.priceMin, b.priceMax)}</b></div>
        <div class="ticket-id">№ ${b.id} · Минск, ул. Тимирязева, 65</div>
      </div>
    </div>`;
  }
  function renderTicket(){
    const b = S.ticket;
    view.innerHTML = html`<div>
      <div class="success"><div class="success-icon">${icon('check')}</div><h1 class="success-title">Записали!</h1><p class="success-sub">Запись появится в разделе «Мои записи». Отменить можно здесь же.</p></div>
      <div class="section">${ticketHtml(b)}</div>
      <div class="section" style="display:flex;flex-direction:column;gap:10px">
        <button class="btn btn-primary btn-block" id="againBtn" type="button">${icon('plus')}Новая запись</button>
        <button class="btn btn-danger-soft btn-block" id="cancelBtn" type="button">Отменить запись</button>
      </div>
    </div>`;
    $('#againBtn').addEventListener('click', resetWizard);
    $('#cancelBtn').addEventListener('click', ()=> cancelBooking(b, ()=>{ S.ticket.status = 'Отменена'; renderTicket(); }));
  }
  function resetWizard(){ S.picked = []; S.date = null; S.time = null; S.consent = false; go(1); }

  async function cancelBooking(b, done){
    if(!await Kit.confirm('Отменить запись на ' + D.when(b.date, b.time) + '?', 'Отменить запись', true)) return;
    const r = await api('cancelBooking', {id:b.id});
    if(!r.ok){ Kit.toast('Не удалось отменить', 'error'); return; }
    Kit.toast('Запись отменена', 'ok');
    done && done();
  }

  /* ============ МОИ ЗАПИСИ ============ */
  function updateDot(){ let on = false; try{ on = localStorage.getItem('blesk-unseen') === '1'; }catch(e){} $('#myDot').hidden = !on; }
  $('#myBtn').addEventListener('click', openMy);
  async function openMy(){
    try{ localStorage.removeItem('blesk-unseen'); }catch(e){}
    updateDot();
    const sh = Kit.sheet({title:'Мои записи', body:html`<div class="skel" style="height:64px"></div><div class="skel" style="height:64px;margin-top:8px"></div>`});
    const res = await api('getMyBookings');
    const list = res.bookings || [];
    const today = D.today();
    const active = list.filter(b=>b.date >= today && b.status !== 'Отменена' && b.status !== 'Выполнена').reverse();
    const past = list.filter(b=>!active.includes(b));
    const row = b=>html`<button type="button" class="row" data-id="${b.id}"><span class="row-icon">${icon('droplet')}</span><span class="row-main"><span class="row-title">${D.when(b.date, b.time)}</span><span class="row-sub">${b.car.number} · ${b.services.join(', ')}</span></span><span class="row-end"><span class="pill ${STATUS_PILL[b.status] || ''}">${b.status}</span></span></button>`;
    sh.body.innerHTML = list.length ? html`
      ${active.length ? html`<div class="eyebrow" style="margin:4px 0 8px">Предстоящие</div><div class="list">${active.map(row)}</div>` : ''}
      ${past.length ? html`<div class="eyebrow" style="margin:20px 0 8px">История</div><div class="list">${past.map(row)}</div>` : ''}`
      : html`<div class="empty">${icon('ticket')}<div class="empty-title">Записей пока нет</div>Оформите первую — это минута</div>`;
    Kit.on(sh.body, 'click', '[data-id]', (e, el)=>{
      const b = list.find(x=>x.id === el.dataset.id); if(!b) return;
      const canCancel = active.includes(b);
      const t = Kit.sheet({title:'Запись № ' + b.id, body:ticketHtml(b),
        actions: canCancel ? html`<button class="btn btn-danger-soft" type="button" data-x>Отменить запись</button>` : null});
      if(canCancel) t.$('[data-x]').addEventListener('click', ()=> cancelBooking(b, ()=>{ t.close(); sh.close(); }));
    });
  }

  /* ============ СТАРТ ============ */
  async function boot(){
    updateDot();
    go(1);
    // прогрев: услуги и расписание грузим сразу, не дожидаясь шага 2–3
    api('getServices', {audience:'client'}).then(r=>{ S.cats = r.categories || []; if(S.step === 2) renderServices(); updateBar(); });
    api('getSchedule').then(r=>{ S.schedule = r.schedule || null; S.closed = r.closedDates || []; if(S.step === 3) renderTime(); });
    const [cars, prof] = await Promise.all([api('getMyCars'), api('getMyProfile')]);
    S.cars = cars.cars || [];
    if(S.cars.length && !S.car.number) fillCar(S.cars[0]); // последняя машина — сразу в форму
    if(prof.profile){ S.name = prof.profile.name || ''; S.phone = prof.profile.phone || ''; }
    else if(Kit.user.firstName) S.name = Kit.user.firstName;
    if(S.step === 1){ renderCar(); updateBar(); }
  }
  boot();
})();
</script>
</body>
</html>
