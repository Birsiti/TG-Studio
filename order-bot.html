<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Заказать бота — Студия Ботов</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

  :root{
    --bg:#111417; --surface:#1A1E22; --surface-2:#20252A; --surface-3:#262B31;
    --ink:#EDEFF0; --ink-soft:#8C949C; --ink-faint:#565D64;
    --accent:#2AABEE; --accent-dark:#1B8FCB; --accent-soft:rgba(42,171,238,.14);
    --ok:#38A89D; --ok-soft:rgba(56,168,157,.14);
    --line:#2A2F35; --line-strong:#3A414A;
    --radius:14px; --radius-sm:10px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;line-height:1.45;
    height:100vh;overflow:hidden;display:flex;flex-direction:column;}
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Chakra Petch',sans-serif;font-weight:600;margin:0;}
  button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;}

  .power-rail{height:3px;background:linear-gradient(90deg,var(--accent-dark),var(--accent),var(--ok));flex-shrink:0;}

  /* header */
  header{flex-shrink:0;padding:calc(12px + var(--safe-top)) 16px 12px;background:var(--surface);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
  .back-btn{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:flex;
    align-items:center;justify-content:center;flex-shrink:0;color:var(--ink-soft);}
  .back-btn svg{width:18px;height:18px;}
  .hdr-title{font-size:16px;letter-spacing:.01em;}
  .hdr-sub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);margin-top:2px;font-family:'JetBrains Mono',monospace;}
  .dot-live{width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0;
    box-shadow:0 0 0 0 rgba(56,168,157,.6);animation:pulse 2s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(56,168,157,.5);}
    70%{box-shadow:0 0 0 6px rgba(56,168,157,0);}
    100%{box-shadow:0 0 0 0 rgba(56,168,157,0);}
  }

  /* progress */
  .progress-wrap{flex-shrink:0;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:5px;}
  .progress-seg{flex:1;height:3px;border-radius:2px;background:var(--line-strong);overflow:hidden;}
  .progress-seg i{display:block;height:100%;width:0%;background:var(--accent);transition:width .5s ease;}
  .progress-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;margin-left:4px;}

  /* messages */
  .chat{flex:1;overflow-y:auto;padding:16px 14px 10px;display:flex;flex-direction:column;gap:10px;
    -webkit-overflow-scrolling:touch;}
  .msg{max-width:82%;padding:10px 13px;border-radius:var(--radius);font-size:14.5px;line-height:1.45;
    animation:rise .28s ease both;word-wrap:break-word;}
  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .msg.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);
    border-bottom-left-radius:4px;color:var(--ink);}
  .msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;}

  .typing{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);
    border-radius:var(--radius);border-bottom-left-radius:4px;padding:12px 15px;display:flex;gap:4px;
    animation:rise .28s ease both;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);animation:bounce 1.1s infinite;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}

  /* lead card */
  .lead-card{align-self:stretch;background:var(--surface-2);border:1px solid var(--accent);
    border-radius:var(--radius);padding:16px;margin-top:2px;animation:rise .35s ease both;}
  .lead-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:12px;
    border-bottom:1px solid var(--line);}
  .lead-head svg{width:18px;height:18px;color:var(--ok);flex-shrink:0;}
  .lead-head b{font-family:'Chakra Petch',sans-serif;font-size:14px;letter-spacing:.01em;}
  .lead-row{display:flex;gap:10px;padding:7px 0;font-size:13.5px;opacity:0;animation:leadrow .35s ease forwards;}
  @keyframes leadrow{from{opacity:0;transform:translateX(-4px);}to{opacity:1;transform:translateX(0);}}
  .lead-row .lbl{flex:0 0 108px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;
    font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;padding-top:2px;}
  .lead-row .val{flex:1;color:var(--ink);}

  /* composer */
  .composer{flex-shrink:0;padding:10px 12px calc(10px + var(--safe-bottom));background:var(--surface);
    border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end;}
  .composer input{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;
    padding:11px 16px;color:var(--ink);font-family:'Inter',sans-serif;font-size:14.5px;outline:none;}
  .composer input:focus{border-color:var(--accent);}
  .composer input::placeholder{color:var(--ink-faint);}
  .send-btn{width:42px;height:42px;border-radius:50%;background:var(--accent);display:flex;
    align-items:center;justify-content:center;flex-shrink:0;transition:opacity .2s,transform .15s;}
  .send-btn svg{width:18px;height:18px;color:#fff;}
  .send-btn:active{transform:scale(.92);}
  .send-btn.disabled{opacity:.35;pointer-events:none;}

  .done-note{text-align:center;color:var(--ink-faint);font-size:12.5px;padding:6px 0 2px;
    font-family:'JetBrains Mono',monospace;}
  .restart-btn{display:block;margin:6px auto 0;color:var(--accent);font-size:12.5px;
    font-family:'JetBrains Mono',monospace;text-decoration:underline;}

  .toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);
    background:var(--ok);color:#fff;padding:11px 20px;border-radius:24px;font-size:13.5px;font-weight:600;
    opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.34,1.56,.64,1);z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.35);white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="power-rail"></div>

<header>
  <div class="back-btn" id="backBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </div>
  <div>
    <div class="hdr-title">Заказать бота</div>
    <div class="hdr-sub"><span class="dot-live"></span>AI-консультант · на связи</div>
  </div>
</header>

<div class="progress-wrap" id="progressWrap"></div>

<div class="chat" id="chat"></div>

<div class="composer" id="composer">
  <input type="text" id="input" placeholder="Напишите сообщение…" autocomplete="off">
  <button class="send-btn disabled" id="sendBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
  </button>
</div>

<div class="toast" id="toast">Заявка передана в студию ✓</div>

<script>
/* ============================================================ CONFIG ============================================================ */
// Продакшн: сюда — URL Cloudflare Worker, который проксирует запрос к Anthropic API
// с системным промтом консультанта (ключ хранится на Worker, не в этом файле).
// Если apiUrl не задан или недоступен — работает демо-сценарий ниже,
// чтобы файл можно было показывать как есть, без бэкенда.
const CONFIG = { apiUrl: "PASTE_WORKER_URL_HERE" };

/* ============================================================ TELEGRAM ============================================================ */
const tg = window.Telegram ? window.Telegram.WebApp : null;
function haptic(style) {
  if (tg && tg.HapticFeedback) {
    if (["success","error","warning"].includes(style)) tg.HapticFeedback.notificationOccurred(style);
    else tg.HapticFeedback.impactOccurred(style || "light");
  }
}
function initTelegram() {
  if (!tg) return;
  tg.ready(); tg.expand();
  const s = getComputedStyle(document.body);
  try { tg.setHeaderColor(s.getPropertyValue("--surface").trim()); tg.setBackgroundColor(s.getPropertyValue("--bg").trim()); } catch(e) {}
}
document.getElementById("backBtn").addEventListener("click", () => {
  haptic("light");
  if (tg && tg.close) tg.close(); else history.back();
});

/* ============================================================ DEMO SCRIPT ============================================================ */
// Каждый шаг — вопрос ИИ-консультанта. answerKey — под каким полем уйдёт
// сырой ответ пользователя в итоговую карточку лида.
const STEPS = [
  { q: "Расскажите в двух словах о вашем бизнесе — чем занимаетесь?", key: "Бизнес", label: "Бизнес" },
  { q: "Что хотите автоматизировать: запись, каталог, доставку — или что-то своё?", key: "Задача", label: "Задача" },
  { q: "Нужны отдельные роли — клиент, администратор, владелец — или хватит одного экрана для клиента?", key: "Роли", label: "Роли" },
  { q: "Сейчас как принимаете заявки — звонки, соцсети, другой сервис?", key: "Сейчас", label: "Сейчас используют" },
  { q: "Примерно сколько заявок или записей в день-неделю?", key: "Объём", label: "Объём" },
  { q: "Когда хотелось бы запустить?", key: "Сроки", label: "Сроки" },
  { q: "Разовая оплата за разработку или подписка с обслуживанием — как удобнее?", key: "Бюджет", label: "Бюджет" },
  { q: "И контакт, куда написать — телеграм или телефон", key: "Контакт", label: "Контакт" },
];
const OPENING = "Расскажите в двух словах о вашем бизнесе и что хотите автоматизировать — я задам пару уточняющих вопросов, чтобы собрать заявку. Отвечайте свободно, никакой строгой формы не нужно.";
const CLOSING = "Отлично, этого достаточно — передаю заявку в студию, с вами свяжутся в ближайшее время 🚀";

let stepIndex = -1; // -1 = ждём первого свободного ответа после OPENING
let lead = {};
let history = [];
let busy = false;

/* ============================================================ RENDER ============================================================ */
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const progressWrap = document.getElementById("progressWrap");

function buildProgress() {
  progressWrap.innerHTML = STEPS.map(() => `<div class="progress-seg"><i></i></div>`).join("")
    + `<span class="progress-label mono" id="progressLabel">0/${STEPS.length}</span>`;
}
function updateProgress(done) {
  const segs = progressWrap.querySelectorAll(".progress-seg i");
  segs.forEach((s, i) => { s.style.width = i < done ? "100%" : "0%"; });
  document.getElementById("progressLabel").textContent = `${done}/${STEPS.length}`;
}

function addMsg(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  chatEl.appendChild(el);
  scrollDown();
  return el;
}
function scrollDown() { chatEl.scrollTop = chatEl.scrollHeight; }

function showTyping() {
  const el = document.createElement("div");
  el.className = "typing";
  el.id = "typingIndicator";
  el.innerHTML = "<span></span><span></span><span></span>";
  chatEl.appendChild(el);
  scrollDown();
}
function hideTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

function renderLeadCard() {
  const card = document.createElement("div");
  card.className = "lead-card";
  card.innerHTML = `
    <div class="lead-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      <b>Заявка собрана</b>
    </div>
    ${STEPS.map((s, i) => `<div class="lead-row" style="animation-delay:${i * 70}ms"><div class="lbl mono">${s.label}</div><div class="val">${escHtml(lead[s.key] || "не указано")}</div></div>`).join("")}
  `;
  chatEl.appendChild(card);
  scrollDown();
}
function escHtml(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function showToast() {
  const t = document.getElementById("toast");
  t.classList.add("show");
  haptic("success");
  setTimeout(() => t.classList.remove("show"), 2600);
}

function finishComposer() {
  const composer = document.getElementById("composer");
  composer.style.display = "none";
  const note = document.createElement("div");
  note.className = "done-note";
  note.innerHTML = `Диалог завершён<span class="restart-btn" id="restartBtn">Начать заново</span>`;
  chatEl.appendChild(note);
  document.getElementById("restartBtn").addEventListener("click", resetDemo);
  scrollDown();
}

function resetDemo() {
  chatEl.innerHTML = "";
  document.getElementById("composer").style.display = "flex";
  stepIndex = -1; lead = {}; history = []; busy = false;
  buildProgress(); updateProgress(0);
  boot();
}

/* ============================================================ FLOW ============================================================ */
async function boot() {
  showTyping();
  await wait(600);
  hideTyping();
  addMsg(OPENING, "ai");
  history.push({ role: "assistant", content: OPENING });
}

function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

async function handleSend() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  busy = true;
  addMsg(text, "user");
  history.push({ role: "user", content: text });
  inputEl.value = "";
  sendBtn.classList.add("disabled");

  // сохраняем ответ под текущий вопрос (демо-режим: без реального NLP,
  // просто кладём сырой ответ в соответствующее поле лида)
  if (stepIndex >= 0) lead[STEPS[stepIndex].key] = text;

  showTyping();
  await wait(650 + Math.random() * 500);
  hideTyping();

  stepIndex++;
  if (stepIndex < STEPS.length) {
    const q = STEPS[stepIndex].q;
    addMsg(q, "ai");
    history.push({ role: "assistant", content: q });
    updateProgress(stepIndex);
  } else {
    addMsg(CLOSING, "ai");
    updateProgress(STEPS.length);
    await wait(400);
    renderLeadCard();
    await wait(300);
    showToast();
    finishComposer();
  }
  busy = false;
}

inputEl.addEventListener("input", () => {
  sendBtn.classList.toggle("disabled", inputEl.value.trim().length === 0);
});
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); handleSend(); }
});
sendBtn.addEventListener("click", handleSend);

/* ============================================================ INIT ============================================================ */
initTelegram();
buildProgress();
boot();
</script>
</body>
</html>
